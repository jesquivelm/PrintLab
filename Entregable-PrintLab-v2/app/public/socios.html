<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme.js"></script>
    <title>Socios</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="workspace workspace-quote quote-browser-main">
        <section class="quote-card quote-card-clean quote-browser-card">
            <div class="quote-browser-search-row">
                <div class="quote-browser-actions-left">
                    <button id="nuevoSocioButton" type="button" class="action-btn quote-browser-action-btn socios-browser-create-btn">Nuevo</button>
                    <button id="importarSociosSapButton" type="button" class="action-btn quote-browser-action-btn">Actualizar desde SAP</button>
                    <button id="refreshSociosButton" type="button" class="action-btn quote-browser-action-btn">Refrescar</button>
                    <p id="sociosImportStatus" class="socios-import-status" hidden></p>
                </div>
                <div class="quote-browser-search-wrap">
                    <input id="sociosSearchInput" class="copy-popover-search quote-browser-search" type="search" placeholder="Buscar por código, nombre, vendedor o correo">
                </div>
            </div>

            <div class="scroll-bottom-indicator-host">
                <div class="copy-popover-table-wrap quote-browser-table-wrap">
                    <table class="copy-popover-table quote-browser-table">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nombre del socio</th>
                                <th>Vendedor</th>
                                <th>Correo</th>
                                <th>Sector</th>
                                <th>Creación</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="sociosTableBody"></tbody>
                    </table>
                </div>
                <div id="sociosScrollBottomIndicator" class="scroll-bottom-indicator" aria-hidden="true"></div>
            </div>
        </section>
    </main>

    <div id="nuevoSocioPopover" class="socios-create-popover" hidden>
        <div class="socios-create-popover-backdrop" data-close-popover="true"></div>
        <section class="socios-create-popover-panel" role="dialog" aria-modal="true" aria-labelledby="nuevoSocioTitle">
            <div class="copy-popover-body socios-create-body">
                <div class="copy-popover-header socios-create-header">
                    <div>
                        <h2 id="nuevoSocioTitle">Nuevo socio</h2>
                        <p class="socios-create-subtitle">Se guardará con la nomenclatura configurada y su consecutivo.</p>
                    </div>
                    <button id="cerrarNuevoSocioButton" type="button" class="calc-popover-close" aria-label="Cerrar">×</button>
                </div>

                <form id="nuevoSocioForm" class="socios-create-form">
                    <div class="socios-create-grid">
                        <label class="socios-create-field socios-create-field-full">
                            <span>Nombre de socio</span>
                            <input name="partner_name" type="text" required>
                        </label>
                        <label class="socios-create-field">
                            <span>ID fiscal</span>
                            <input name="tax_id" type="text" required>
                        </label>
                        <label class="socios-create-field">
                            <span>Correo de facturación</span>
                            <input name="email_facturacion" type="email" required>
                        </label>
                        <label class="socios-create-field">
                            <span>Moneda</span>
                            <input name="currency_code" type="text" value="USD" readonly>
                        </label>
                        <label class="socios-create-field">
                            <span>Días crédito</span>
                            <input name="payment_terms" type="text" value="Contado" readonly>
                        </label>
                    </div>

                    <div class="socios-create-section-title">Contacto principal</div>
                    <div class="socios-create-grid">
                        <label class="socios-create-field socios-create-field-full">
                            <span>Nombre</span>
                            <input name="contact_name" type="text" required>
                        </label>
                        <label class="socios-create-field">
                            <span>Identificación</span>
                            <input name="contact_identification" type="text">
                        </label>
                        <label class="socios-create-field">
                            <span>Celular</span>
                            <input name="contact_mobile" type="text">
                        </label>
                        <label class="socios-create-field">
                            <span>Correo</span>
                            <input name="contact_email" type="email">
                        </label>
                        <label class="socios-create-field">
                            <span>Teléfono</span>
                            <input name="contact_phone" type="text">
                        </label>
                    </div>

                    <div class="socios-create-section-title">Dirección</div>
                    <div class="socios-create-grid">
                        <label class="socios-create-field">
                            <span>País</span>
                            <input name="address_country" type="text">
                        </label>
                        <label class="socios-create-field">
                            <span>Estado o provincia</span>
                            <input name="address_state_province" type="text">
                        </label>
                        <label class="socios-create-field">
                            <span>Cantón</span>
                            <input name="address_county" type="text">
                        </label>
                        <label class="socios-create-field socios-create-field-full">
                            <span>Detalle de la dirección</span>
                            <input name="address_line" type="text">
                        </label>
                    </div>

                    <p id="nuevoSocioStatus" class="socios-create-status" hidden></p>

                    <div class="socios-create-actions">
                        <button type="button" id="cancelarNuevoSocioButton" class="action-btn">Cancelar</button>
                        <button type="submit" id="guardarNuevoSocioButton" class="action-btn action-btn-primary">Guardar socio</button>
                    </div>
                </form>
            </div>
        </section>
    </div>

    <div id="sociosImportPopover" class="socios-create-popover" hidden>
        <div class="socios-create-popover-backdrop" data-close-import-popover="true"></div>
        <section class="socios-create-popover-panel quote-create-popover-panel" role="dialog" aria-modal="true" aria-labelledby="sociosImportTitle">
            <div class="copy-popover-body socios-import-popover-body">
                <div class="copy-popover-header socios-create-header">
                    <div>
                        <h2 id="sociosImportTitle">Importar socios desde SAP</h2>
                        <p class="socios-create-subtitle">Primero se diagnostica cuántos registros están disponibles y luego eliges cuántos traer.</p>
                    </div>
                    <button id="cerrarSociosImportPopoverButton" type="button" class="calc-popover-close" aria-label="Cerrar">×</button>
                </div>

                <div id="sociosImportPopoverSummary" class="socios-import-diagnosis"></div>

                <label class="socios-create-field">
                    <span>Cuántos socios importar</span>
                    <input id="sociosImportLimitInput" type="number" min="1" step="1" inputmode="numeric">
                </label>

                <p id="sociosImportPopoverStatus" class="socios-create-status" hidden></p>

                <div class="socios-create-actions">
                    <button type="button" id="cancelarSociosImportPopoverButton" class="action-btn">Cancelar</button>
                    <button type="button" id="ejecutarSociosImportButton" class="action-btn action-btn-primary">Importar</button>
                </div>
            </div>
        </section>
    </div>

    <script src="/access-control.js"></script>
    <script src="/socios.js"></script>
</body>
</html>
