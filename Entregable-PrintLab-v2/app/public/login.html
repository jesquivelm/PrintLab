<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme.js"></script>
    <title>Acceso | PrintLab</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        :root {
            --login-accent: #118fc6;
            --login-accent-strong: #0b81b8;
            --login-text: #223140;
            --login-muted: #6b7986;
            --login-panel-bg: rgba(255,255,255,0.96);
            --login-border: rgba(193, 214, 228, 0.9);
            --login-shadow: 0 28px 60px rgba(17, 41, 59, 0.14);
        }

        * { box-sizing: border-box; }

        body.login-body {
            margin: 0;
            min-height: 100vh;
            width: 100%;
            display: block;
            overflow: hidden;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--login-text);
            background:
                radial-gradient(circle at top left, rgba(36,168,223,0.14), transparent 34%),
                linear-gradient(135deg, #eef6fb 0%, #dbe8f2 48%, #eaf1f6 100%);
        }

        .login-shell {
            min-height: 100vh;
            width: 100%;
            display: grid;
            grid-template-columns: minmax(320px, 26vw) minmax(0, 1fr);
            position: relative;
        }

        .login-panel {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 26px;
            background: linear-gradient(180deg, rgba(241,248,252,0.38) 0%, rgba(232,243,249,0.24) 100%);
            border-right: 1px solid rgba(193, 214, 228, 0.38);
            backdrop-filter: blur(12px);
        }

        .login-card {
            width: 100%;
            max-width: 360px;
            padding: 28px 24px 24px;
            border: 1px solid rgba(193, 214, 228, 0.72);
            border-radius: 26px;
            background: rgba(255,255,255,0.72);
            box-shadow: var(--login-shadow);
            backdrop-filter: blur(10px);
        }

        .login-brand {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }

        .login-brand-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .login-brand-logo {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: transparent;
            border: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .login-brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .login-brand-copy {
            display: grid;
            gap: 4px;
        }

        .login-brand-copy strong {
            font-size: 21px;
            line-height: 1.1;
        }

        .login-brand-copy span {
            font-size: 12px;
            color: var(--login-muted);
        }

        .login-title {
            margin: 0;
            font-size: 24px;
            line-height: 1.08;
        }

        .login-subtitle {
            margin: 8px 0 0;
            font-size: 13px;
            color: var(--login-muted);
            line-height: 1.5;
        }

        .login-form {
            display: grid;
            gap: 16px;
        }

        .login-field {
            display: grid;
            gap: 7px;
        }

        .login-field span {
            font-size: 12px;
            font-weight: 700;
            color: #587183;
        }

        .login-field input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #cfdbe4;
            border-radius: 14px;
            background: #fff;
            font-size: 14px;
            color: var(--login-text);
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .login-field input:focus {
            border-color: #91c9e4;
            box-shadow: 0 0 0 4px rgba(17,143,198,0.12);
        }

        .login-password-wrap {
            position: relative;
            display: block;
        }

        .login-password-wrap input {
            padding-right: 46px;
        }

        .login-password-toggle {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #6d7d8b;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .login-password-toggle:hover {
            background: rgba(17, 143, 198, 0.08);
            color: #52748b;
        }

        .login-password-toggle .icon-svg-mask {
            width: 18px;
            height: 18px;
        }

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: -2px;
        }

        .login-remember {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #60707f;
            cursor: pointer;
        }

        .login-remember input {
            accent-color: var(--login-accent);
        }

        .login-submit {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(17,143,198,0.92) 0%, rgba(11,129,184,0.88) 100%);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 18px rgba(17,143,198,0.16);
        }

        .login-submit:hover {
            transform: translateY(-1px);
        }

        .login-status {
            min-height: 18px;
            font-size: 12px;
            color: #b94848;
            margin: 0;
        }

        .login-hero {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background:
                linear-gradient(135deg, rgba(17,143,198,0.30) 0%, rgba(10,31,52,0.24) 100%),
                linear-gradient(120deg, #1f4258 0%, #3d6f86 48%, #8db2c5 100%);
            z-index: 0;
        }

        .login-hero-stage {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background:
                linear-gradient(135deg, rgba(17,143,198,0.08), rgba(7,17,29,0.05)),
                linear-gradient(120deg, rgba(31,66,88,0.52) 0%, rgba(61,111,134,0.26) 48%, rgba(141,178,197,0.12) 100%);
            z-index: 0;
        }

        .login-hero-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            will-change: transform, opacity;
            z-index: 1;
        }

        .login-hero-slide.active {
            opacity: 1;
            animation: loginKenburns 16s ease-in-out forwards;
        }

        .login-hero-slide.leaving {
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
        }

        @keyframes loginKenburns {
            0% { transform: scale(1.0) translate(0%, 0%); }
            100% { transform: scale(1.12) translate(-3%, -2%); }
        }

        @keyframes loginKenburns2 {
            0% { transform: scale(1.08) translate(2%, 1%); }
            100% { transform: scale(1.0) translate(-2%, 2%); }
        }

        @keyframes loginKenburns3 {
            0% { transform: scale(1.05) translate(-1%, 2%); }
            100% { transform: scale(1.13) translate(3%, -1%); }
        }

        .login-hero-slide.anim-0 { animation-name: loginKenburns; }
        .login-hero-slide.anim-1 { animation-name: loginKenburns2; }
        .login-hero-slide.anim-2 { animation-name: loginKenburns3; }

        .login-hero-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
            color: rgba(255,255,255,0.55);
            z-index: 2;
        }

        .login-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(7,17,29,0.04) 0%, rgba(7,17,29,0.20) 100%),
                radial-gradient(circle at top right, rgba(255,255,255,0.10), transparent 26%);
            z-index: 2;
        }

        .login-hero-copy {
            position: absolute;
            left: max(calc(26vw + 48px), 400px);
            right: 48px;
            bottom: 48px;
            z-index: 3;
            display: grid;
            gap: 10px;
            max-width: 620px;
            color: #fff;
            padding-left: 40px;
        }

        .login-hero-copy strong {
            font-size: clamp(28px, 3.2vw, 44px);
            line-height: 1.02;
        }

        .login-hero-copy p {
            margin: 0;
            max-width: 540px;
            font-size: 15px;
            line-height: 1.6;
            color: rgba(255,255,255,0.88);
        }

        @media (max-width: 980px) {
            .login-shell {
                grid-template-columns: 1fr;
            }

            .login-panel {
                min-height: 100vh;
                background: transparent;
                border-right: 0;
                backdrop-filter: none;
            }

            .login-card {
                background: rgba(255,255,255,0.88);
            }

            .login-hero {
                position: fixed;
                inset: 0;
            }

            .login-hero-copy {
                display: none;
            }
        }
    </style>
</head>
<body class="login-body">
    <div class="login-shell">
        <section class="login-panel">
            <div class="login-card">
                <div class="login-brand">
                    <div class="login-brand-row">
                        <div id="loginBrandLogo" class="login-brand-logo"></div>
                        <div class="login-brand-copy">
                            <strong id="loginCompanyName">PrintLab</strong>
                            <span>Acceso Seguro al Sistema</span>
                        </div>
                    </div>
                    <div>
                        <h1 class="login-title">Iniciar Sesión</h1>
                        <p class="login-subtitle">Ingresa con tu usuario y contraseña para continuar al entorno de trabajo.</p>
                    </div>
                </div>

                <form id="loginForm" class="login-form">
                    <label class="login-field">
                        <span>Usuario</span>
                        <input id="loginUsername" type="text" autocomplete="username" placeholder="Usuario">
                    </label>

                    <label class="login-field">
                        <span>Contraseña</span>
                        <div class="login-password-wrap">
                            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Contraseña">
                            <button type="button" id="loginPasswordToggle" class="login-password-toggle" aria-label="Mostrar contraseña" title="Mostrar contraseña"></button>
                        </div>
                    </label>

                    <div class="login-options">
                        <label class="login-remember">
                            <input id="loginRemember" type="checkbox">
                            <span>Guardar contraseña</span>
                        </label>
                    </div>

                    <button type="submit" class="login-submit">Entrar al Sistema</button>
                    <p id="loginStatus" class="login-status"></p>
                </form>
            </div>
        </section>

        <section class="login-hero">
            <div id="loginHeroStage" class="login-hero-stage">
                <div id="loginHeroPlaceholder" class="login-hero-placeholder" hidden></div>
            </div>
            <div class="login-hero-copy">
                <strong id="loginHeroTitle">Una plataforma interna clara, rápida y profesional.</strong>
                <p id="loginHeroText">Controla cotizaciones, socios, costos, órdenes y procesos desde una sola experiencia de trabajo.</p>
            </div>
        </section>
    </div>

    <script src="/login.js"></script>
</body>
</html>
