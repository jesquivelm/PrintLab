<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador de Capacidad</title>
<style>
:root{--font-sans:"Segoe UI",system-ui,sans-serif;--color-text-primary:#1f2b3d;--color-text-secondary:#66758b;--color-background-primary:#f4f7fb;--color-background-secondary:#fff;--color-background-tertiary:#edf2f7;--color-border-secondary:#d8e4ef;--color-border-tertiary:#e4ebf3}
html[data-theme="dark"]{--color-text-primary:#e5eefb;--color-text-secondary:#9fb0c8;--color-background-primary:#0f172a;--color-background-secondary:#162033;--color-background-tertiary:#1e293b;--color-border-secondary:#334155;--color-border-tertiary:#26364f}
*{box-sizing:border-box}body{margin:0;font:13px var(--font-sans);color:var(--color-text-primary);background:var(--color-background-primary)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--color-border-tertiary)}h1{font-size:16px;margin:0}.sub{color:var(--color-text-secondary);font-size:12px;margin-top:3px}
.actions,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,input,select{border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);border-radius:6px;padding:7px 10px;font:inherit}.btn{cursor:pointer;text-decoration:none}.btn.primary{background:#1d9e75;color:white;border-color:#0f6e56}.btn:disabled{opacity:.6;cursor:wait}
.layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 61px)}.side{padding:16px;border-right:1px solid var(--color-border-tertiary)}.main{padding:16px}.section{margin-bottom:18px}.title{font-weight:600;margin-bottom:9px}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:11px;color:var(--color-text-secondary)}
.card{border:1px solid var(--color-border-secondary);border-radius:8px;padding:13px;background:var(--color-background-secondary);margin-bottom:10px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric b{font-size:22px;display:block;margin-top:5px}.muted{color:var(--color-text-secondary)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--color-border-tertiary)}th{font-size:11px;color:var(--color-text-secondary)}.good{color:#1d9e75}.bad{color:#d84d4d}.empty{padding:40px;text-align:center;color:var(--color-text-secondary)}
.theme-toggle{width:32px;height:30px;border:1px solid var(--color-border-secondary);border-radius:6px;background:var(--color-background-secondary);color:var(--color-text-primary);cursor:pointer}.theme-toggle-icon-sun::before{content:"☀"}.theme-toggle-icon-moon::before{content:"☾"}.theme-toggle-icon-moon{display:none}html[data-theme="dark"] .theme-toggle-icon-sun{display:none}html[data-theme="dark"] .theme-toggle-icon-moon{display:inline}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--color-border-tertiary)}.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="bar"><div><h1>Simulador de Capacidad</h1><div class="sub">Compara cambios sin modificar la programación vigente</div></div><div class="actions"><span data-theme-toggle-slot></span><a class="btn" href="/planificacion/recursos">Recursos</a><a class="btn" href="/planificacion/capacidad">Volver</a></div></header>
<div class="layout">
  <aside class="side">
    <div class="section">
      <div class="title">Escenario</div>
      <div class="field"><label>Nombre</label><input id="name" value="Escenario de capacidad"></div>
      <div class="field"><label>Horizonte</label><select id="days"><option value="7">7 días</option><option value="30" selected>30 días</option><option value="90">90 días</option></select></div>
    </div>
    <div class="section">
      <div class="title">Ajustar Recurso</div>
      <div class="field"><label>Recurso</label><select id="resource"></select></div>
      <div class="row">
        <div class="field" style="flex:1"><label>Unidades</label><input id="units" type="number" min=".1" step=".1" value="1"></div>
        <div class="field" style="flex:1"><label>Horas/día</label><input id="hours" type="number" min="1" max="24" value="8"></div>
      </div>
      <div class="field"><label>Horas extra por día</label><input id="extra" type="number" min="0" max="16" value="0"></div>
    </div>
    <div class="section">
      <div class="title">Agregar Recurso Simulado</div>
      <div class="field"><label>Nombre</label><input id="new-name" placeholder="Operario adicional"></div>
      <div class="field"><label>Proceso / competencia</label><select id="new-process"></select></div>
    </div>
    <button id="run" class="btn primary" style="width:100%" onclick="simulate()">Ejecutar Simulación</button>
  </aside>
  <main class="main"><div id="result" class="empty">Configura un escenario para estimar su impacto.</div></main>
</div>
<script>
const API='/api/planificacion';let resources=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const [r,p]=await Promise.all([fetch(`${API}/recursos`).then(x=>x.json()),fetch(`${API}/procesos`).then(x=>x.json())]);resources=r.data||[];resource.innerHTML=resources.map(x=>`<option value="${x.id}">${esc(x.resource_name)} · ${esc(x.process_key)}</option>`).join('');newProcess.innerHTML=(p.data||[]).map(x=>`<option value="${esc(x.process_key)}">${esc(x.nombre)}</option>`).join('');syncResource()}
const resource=document.getElementById('resource'),newProcess=document.getElementById('new-process');resource.onchange=syncResource;
function syncResource(){const r=resources.find(x=>x.id===resource.value);if(r)units.value=r.capacity_units||1}
async function simulate(){const btn=document.getElementById('run');btn.disabled=true;btn.textContent='Simulando...';result.innerHTML='<div class="empty">Calculando capacidad, colas y fechas proyectadas...</div>';try{const selected=resources.find(x=>x.id===resource.value);const added=document.getElementById('new-name').value.trim();const body={name:name.value,horizonDays:Number(days.value),resourceAdjustments:selected?[{resourceId:selected.id,capacityUnits:Number(units.value),hoursPerDay:Number(hours.value),extraHoursPerDay:Number(extra.value)}]:[],addedResources:added?[{resourceName:added,resourceType:'operator',processKey:newProcess.value,capacityUnits:1,skillProcessKeys:[newProcess.value]}]:[]};const res=await fetch(`${API}/capacidad-finita/simular`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json();if(!data.ok)throw Error(data.error);render(data.data)}catch(e){result.innerHTML=`<div class="empty bad">${esc(e.message)}</div>`}finally{btn.disabled=false;btn.textContent='Ejecutar Simulación'}}
function render(d){const i=d.impact,rows=d.comparison.filter(x=>Math.abs(x.utilizationDeltaPct)||Math.abs(x.queueReductionHours)).sort((a,b)=>b.queueReductionHours-a.queueReductionHours);const orders=(d.orderComparison||[]).filter(x=>Math.abs(x.deliveryDeltaHours)>.01||x.projectedLateBefore||x.projectedLateAfter);result.innerHTML=`<div class="metrics"><div class="card metric"><span class="muted">Cola Base</span><b>${i.queueHoursBefore} h</b></div><div class="card metric"><span class="muted">Cola Simulada</span><b>${i.queueHoursAfter} h</b></div><div class="card metric"><span class="muted">Reducción</span><b class="${i.queueReductionHours>0?'good':''}">${i.queueReductionHours} h</b></div><div class="card metric"><span class="muted">Órdenes Tardías</span><b class="${i.lateOrdersAfter<i.lateOrdersBefore?'good':'bad'}">${i.lateOrdersBefore} → ${i.lateOrdersAfter}</b></div></div><div class="title">Impacto por Recurso</div><div class="card"><table><thead><tr><th>Recurso</th><th>Utilización Base</th><th>Simulada</th><th>Cola Liberada</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${esc(x.resourceName)}</td><td>${x.baseUtilizationPct}%</td><td>${x.simulatedUtilizationPct}%</td><td class="${x.queueReductionHours>0?'good':''}">${x.queueReductionHours} h</td></tr>`).join(''):'<tr><td colspan="4">El escenario no cambia la capacidad.</td></tr>'}</tbody></table></div><div class="title">Impacto en Fechas de Entrega</div><div class="card"><table><thead><tr><th>Orden</th><th>Fecha Actual</th><th>Fecha Simulada</th><th>Variación</th></tr></thead><tbody>${orders.length?orders.map(x=>`<tr><td>${esc(x.orderCode)}</td><td>${fmt(x.baseDeliveryDate)}</td><td class="${x.deliveryDeltaHours<0?'good':x.deliveryDeltaHours>0?'bad':''}">${fmt(x.simulatedDeliveryDate)}</td><td>${x.deliveryDeltaHours>0?'+':''}${x.deliveryDeltaHours} h</td></tr>`).join(''):'<tr><td colspan="4" class="good">El escenario no altera las fechas proyectadas.</td></tr>'}</tbody></table></div>`}
function fmt(v){return v?new Date(v).toLocaleString('es-CR'):'—'}init().catch(e=>result.textContent=e.message);
</script>
</body>
</html>
