<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proforma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style id="proformaDynamicCompanyFont"></style>
    <style>
        :root {
            --ink: #1b2430;
            --navy: #1f314b;
            --navy-soft: #314765;
            --gold: #b59055;
            --gold-soft: #d6bb85;
            --paper: #fffdf8;
            --paper-soft: #f5f7fb;
            --line: #d7e2ea;
            --muted: #647384;
            --accent: #118fc6;
            --danger: #ba4343;
            --radius: 18px;
            --proforma-page-width: 816px;
            --proforma-page-height: 1056px;
            --proforma-scroll-track: #d6e2ec;
            --proforma-scroll-thumb: linear-gradient(180deg, #5a7694 0%, #45627f 100%);
            --proforma-scroll-thumb-hover: linear-gradient(180deg, #4f6f90 0%, #395674 100%);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            color: var(--ink);
            background: linear-gradient(180deg, #edf5fa 0%, #f6f9fc 100%);
            scrollbar-color: #6c88a5 #d6e2ec;
        }
        body::-webkit-scrollbar,
        .proforma-sidebar::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        body::-webkit-scrollbar-track,
        .proforma-sidebar::-webkit-scrollbar-track {
            background: var(--proforma-scroll-track);
            border-radius: 999px;
        }
        body::-webkit-scrollbar-thumb,
        .proforma-sidebar::-webkit-scrollbar-thumb {
            background: var(--proforma-scroll-thumb);
            border-radius: 999px;
            border: 1px solid color-mix(in srgb, #ffffff 36%, var(--proforma-scroll-track));
        }
        body::-webkit-scrollbar-thumb:hover,
        .proforma-sidebar::-webkit-scrollbar-thumb:hover {
            background: var(--proforma-scroll-thumb-hover);
        }
        .proforma-shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr);
        }
        .proforma-sidebar {
            border-right: 1px solid var(--line);
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(16px);
            padding: 24px 22px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: auto;
        }
        .proforma-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .proforma-topbar h1 {
            margin: 0;
            font-size: 24px;
            color: var(--navy);
        }
        .proforma-topbar p {
            margin: 4px 0 0;
            font-size: 12px;
            color: var(--muted);
        }
        .proforma-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .proforma-btn {
            min-height: 40px;
            border-radius: 12px;
            border: 1px solid rgba(17, 143, 198, 0.24);
            background: linear-gradient(180deg, #ffffff 0%, #edf6fb 100%);
            color: #23506e;
            padding: 0 14px;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .proforma-btn.is-primary {
            background: linear-gradient(135deg, #25618f 0%, #2f77aa 100%);
            color: #fff;
            border-color: transparent;
        }
        .proforma-btn.is-danger {
            color: #8a2a2a;
            border-color: rgba(186, 67, 67, 0.26);
            background: linear-gradient(180deg, #fff 0%, #fff2f2 100%);
        }
        .proforma-btn[disabled] {
            opacity: 0.55;
            cursor: default;
        }
        .proforma-status {
            display: inline-flex;
            align-items: center;
            min-height: 32px;
            padding: 0 12px;
            border-radius: 999px;
            background: #edf6fb;
            color: #1d6288;
            font-size: 12px;
            font-weight: 600;
        }
        .proforma-status.is-closed {
            background: #f4efea;
            color: #6f5a3f;
        }
        .proforma-status-line {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .proforma-panel {
            border: 1px solid var(--line);
            border-radius: 20px;
            background: rgba(255,255,255,0.96);
            box-shadow: 0 14px 26px rgba(12, 31, 56, 0.05);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .proforma-panel h2 {
            margin: 0;
            font-size: 15px;
            color: var(--navy);
        }
        .proforma-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }
        .proforma-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .proforma-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .proforma-field.is-full {
            grid-column: 1 / -1;
        }
        .proforma-field label {
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            text-transform: none;
            letter-spacing: 0;
        }
        .proforma-field label.proforma-check {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 42px;
            color: var(--ink);
            font-weight: 600;
        }
        .proforma-field label.proforma-check input {
            width: 16px;
            height: 16px;
            min-height: 0;
            margin: 0;
            accent-color: var(--accent);
        }
        .proforma-field input,
        .proforma-field select,
        .proforma-field textarea {
            width: 100%;
            border: 1px solid #cfdae4;
            border-radius: 14px;
            background: #fff;
            min-height: 42px;
            padding: 10px 12px;
            font: inherit;
            color: var(--ink);
        }
        .proforma-field textarea {
            min-height: 110px;
            resize: vertical;
            line-height: 1.6;
        }
        .proforma-preview-area {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #e8edf2;
        }
        html[data-theme="dark"] {
            --proforma-scroll-track: #152334;
            --proforma-scroll-thumb: linear-gradient(180deg, #355274 0%, #294563 100%);
            --proforma-scroll-thumb-hover: linear-gradient(180deg, #406286 0%, #315171 100%);
        }
        html[data-theme="dark"] body {
            scrollbar-color: #3a5b7d #152334;
        }
        #proformaPreviewFrame {
            flex: 1;
            width: 100%;
            border: none;
            display: block;
            color-scheme: dark;
            background: #0f1b2d;
        }
        .proforma-document {
            width: var(--proforma-page-width);
            min-width: var(--proforma-page-width);
            max-width: var(--proforma-page-width);
            height: var(--proforma-page-height);
            min-height: var(--proforma-page-height);
            max-height: var(--proforma-page-height);
            margin: 0 auto;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 26px 46px rgba(11, 29, 51, 0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 0 0 auto;
        }
        .proforma-document-header {
            padding: 28px 34px 22px;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 100%);
            color: #fff;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
        }
        .proforma-document-header.is-light {
            background: linear-gradient(135deg, #f8fbfe 0%, #eaf2f9 100%);
            color: var(--navy);
        }
        .proforma-brand {
            display: flex;
            align-items: center;
            gap: 18px;
            width: 470px;
            min-width: 470px;
            max-width: 470px;
            flex: 0 0 470px;
        }
        .proforma-brand-logo {
            width: 120px;
            min-height: 74px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex: 0 0 auto;
        }
        .proforma-brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .proforma-brand-copy {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .proforma-brand-copy[hidden] {
            display: none;
        }
        .proforma-brand-copy strong {
            font-family: 'Cormorant Garamond', serif;
            font-size: 34px;
            letter-spacing: 0.08em;
            line-height: 1;
        }
        .proforma-brand-copy span {
            font-size: 12px;
            opacity: 0.8;
        }
        .proforma-doc-meta {
            text-align: right;
            width: 210px;
            min-width: 210px;
            max-width: 210px;
            flex: 0 0 210px;
        }
        .proforma-doc-meta h2 {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            font-style: italic;
            font-weight: 400;
        }
        .proforma-doc-meta p {
            margin: 6px 0 0;
            font-size: 12px;
            opacity: 0.82;
        }
        .proforma-document-body {
            padding: 24px 32px 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1 1 auto;
        }
        .proforma-meta-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .proforma-meta-card {
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 12px 14px;
            background: #fcfeff;
        }
        .proforma-meta-card h3,
        .proforma-terms-card h3 {
            margin: 0 0 7px;
            color: var(--gold);
            font-size: 11px;
            text-transform: none;
            letter-spacing: 0.04em;
        }
        .proforma-meta-card p {
            margin: 0;
            color: #4d5a68;
            line-height: 1.75;
            font-size: 13px;
        }
        .proforma-client-name {
            display: block;
            margin-bottom: 4px;
            font-size: 16px;
            font-weight: 700;
            color: var(--navy);
        }
        .proforma-client-meta {
            display: block;
            font-size: 13px;
            color: #4d5a68;
        }
        .proforma-intro {
            border-left: 3px solid var(--gold);
            background: #fbf7f0;
            padding: 12px 16px;
            border-radius: 0 16px 16px 0;
            font-size: 15px;
            font-style: italic;
            color: #2f3c46;
            line-height: 1.5;
        }
        .proforma-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 0;
            overflow: visible;
            table-layout: fixed;
        }
        .proforma-table thead {
            background: var(--navy);
            color: #fff;
        }
        .proforma-table th {
            font-size: 11px;
            text-transform: none;
            letter-spacing: 0.03em;
            font-weight: 500;
            padding: 10px 12px;
            text-align: left;
            white-space: nowrap;
        }
        .proforma-table th:not(:first-child),
        .proforma-table td:not(:first-child) {
            text-align: right;
        }
        .proforma-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e3ebf0;
            color: #4a5967;
            font-size: 13px;
            vertical-align: top;
        }
        .proforma-table th.proforma-col-unitPrice,
        .proforma-table th.proforma-col-thousandPrice,
        .proforma-table td.proforma-col-unitPrice,
        .proforma-table td.proforma-col-thousandPrice {
            width: 110px;
        }
        .proforma-table th.proforma-col-subtotal,
        .proforma-table th.proforma-col-taxAmount,
        .proforma-table th.proforma-col-totalPrice,
        .proforma-table td.proforma-col-subtotal,
        .proforma-table td.proforma-col-taxAmount,
        .proforma-table td.proforma-col-totalPrice {
            width: 92px;
        }
        .proforma-table th:nth-child(2),
        .proforma-table td:nth-child(2) {
            width: 92px;
        }
        .proforma-table tr:nth-child(even) td {
            background: #fbfdff;
        }
        .proforma-table tbody tr:last-child td {
            border-bottom: 1px solid #e3ebf0;
        }
        .proforma-product-name {
            font-weight: 600;
            color: var(--navy);
        }
        .proforma-product-desc {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            color: var(--muted);
        }
        .proforma-product-route,
        .proforma-product-tech,
        .proforma-product-warning {
            display: block;
            margin-top: 4px;
            font-size: 10.5px;
            line-height: 1.45;
        }
        .proforma-product-route {
            color: #2a536f;
            font-weight: 600;
        }
        .proforma-product-tech {
            color: #5b6a79;
        }
        .proforma-product-warning {
            color: #7f4f14;
        }
        .proforma-total-box {
            margin-left: auto;
            min-width: 280px;
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden;
        }
        .proforma-total-box table {
            width: 100%;
            border-collapse: collapse;
        }
        .proforma-total-box td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
            color: #485766;
        }
        .proforma-total-box tr:last-child td {
            border-bottom: none;
            background: var(--navy);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
        }
        .proforma-total-box td:last-child {
            text-align: right;
        }
        .proforma-terms-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .proforma-terms-card {
            border: 1px solid var(--line);
            border-radius: 18px;
            background: #fbfdff;
            padding: 12px 14px;
        }
        .proforma-terms-card.is-summary {
            grid-column: 1 / -1;
            padding: 14px 16px;
        }
        .proforma-terms-summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 14px;
        }
        .proforma-terms-item[hidden] {
            display: none;
        }
        .proforma-terms-card p {
            margin: 0;
            line-height: 1.5;
            font-size: 13px;
            color: #536273;
        }
        .proforma-document-tail {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: auto;
        }
        .proforma-print-mirror {
            display: none;
        }
        .proforma-print-mirror-page {
            width: 8.5in;
            min-width: 8.5in;
            max-width: 8.5in;
            height: 11in;
            min-height: 11in;
            max-height: 11in;
            overflow: hidden;
            background: #fff;
        }
        .proforma-document-footer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            padding-top: 8px;
            padding-bottom: 0;
            border-top: none;
            border-bottom: 5px solid var(--header);
        }
        .proforma-signature {
            min-width: 220px;
            text-align: center;
        }
        .proforma-signature-asset {
            min-height: 54px;
            border-bottom: 1px solid var(--navy);
            margin-bottom: 6px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            padding-bottom: 6px;
        }
        .proforma-signature-asset img {
            max-width: 180px;
            max-height: 48px;
            object-fit: contain;
        }
        .proforma-signature strong {
            display: block;
            color: #111111 !important;
            font-weight: 500;
            opacity: 1;
            text-shadow: none;
        }
        .proforma-signature span {
            display: block;
            font-size: 12px;
            color: var(--muted);
        }
        .proforma-disclaimer { display: none; }
        .proforma-loading {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 15px;
        }
        @media (max-width: 1120px) {
            .proforma-shell {
                grid-template-columns: 1fr;
            }
            .proforma-sidebar {
                position: relative;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--line);
            }
        }
        @media (max-width: 760px) {
            .proforma-fields,
            .proforma-meta-grid,
            .proforma-terms-grid {
                grid-template-columns: 1fr;
            }
            .proforma-document-header,
            .proforma-document-footer {
                flex-direction: column;
                align-items: stretch;
            }
            .proforma-doc-meta {
                text-align: left;
            }
        }
    </style>
    <link rel="stylesheet" href="/theme-extensions.css?v=20260424b">

            .proforma-table th.proforma-col-thousandPrice,

</head>
<body>
    <div id="proformaShell" class="proforma-shell">
        <aside class="proforma-sidebar">
            <section class="proforma-panel">
                <div class="proforma-panel-head">
                    <h2>Comercial</h2>
                    <button id="proformaPrintButton" type="button" class="action-btn quote-browser-action-btn">Imprimir</button>
                </div>
                <div class="proforma-fields">
                    <div class="proforma-field is-full">
                        <label for="proformaCurrency">Moneda</label>
                        <select id="proformaCurrency"></select>
                    </div>
                    <div class="proforma-field is-full">
                        <label for="proformaValidity">Validez</label>
                        <input id="proformaValidity" type="text">
                    </div>
                    <div class="proforma-field is-full">
                        <label for="proformaPricePresentation">Tipo de Visualización</label>
