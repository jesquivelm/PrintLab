<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme.js"></script>
    <title>Control de Inventario - Tintas</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="workspace workspace-quote quote-browser-main tintas-shell">
        <section class="quote-card quote-card-clean quote-browser-card tintas-card">
            <div class="tintas-tabs">
                <button class="tintas-tab is-active" onclick="switchTab('existencias',this)">Existencias</button>
                <button class="tintas-tab" onclick="switchTab('vencer',this)">Próximos a Vencer</button>
            </div>
            <div class="tintas-toolbar">
                <div class="tintas-toolbar-actions">
                    <button class="tintas-btn" onclick="cargarExistencias()">Actualizar</button>
                </div>
                <div class="tintas-toolbar-search">
                    <input id="searchProd" class="tintas-search-input" type="search" placeholder="Buscar producto...">
                </div>
            </div>
            <div class="tintas-table-wrap">
                <table class="tintas-table">
                    <thead id="tablaHead">
                        <tr>
                            <th>Código</th>
                            <th>Producto</th>
                            <th>Tipo</th>
                            <th>Existencia Total</th>
                            <th>Unidad</th>
                            <th>Lotes Activos</th>
                        </tr>
                    </thead>
                    <tbody id="tablaBody">
                        <tr><td colspan="6" class="tintas-loading">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script>
    var tab = 'existencias';

    function switchTab(t, btn) {
        tab = t;
        document.querySelectorAll('.tintas-tab').forEach(function(b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        if (t === 'existencias') cargarExistencias();
        else cargarVencer();
    }

    function hm(v) {
        return String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    async function cargarExistencias() {
        var tb = document.getElementById('tablaBody');
        tb.innerHTML = '<tr><td colspan="6" class="tintas-loading">Cargando...</td></tr>';
        try {
            var r = await fetch('/api/tintas/dashboard/existencias');
            if (!r.ok) throw new Error(await r.text());
            var data = await r.json();
            if (!data.length) {
                tb.innerHTML = '<tr><td colspan="6" class="tintas-loading">Sin datos.</td></tr>';
                return;
            }
            tb.innerHTML = data.map(function(p) {
                return '<tr><td>' + hm(p.codigo_interno) + '</td><td><strong>' + hm(p.nombre) + '</strong></td><td>' + hm(p.tipo) + '</td><td>' + Number(p.existencia_total || 0).toFixed(4) + '</td><td>' + hm(p.unidad_medida_base) + '</td><td>' + Number(p.lotes_activos || 0) + '</td></tr>';
            }).join('');
        } catch (e) {
            tb.innerHTML = '<tr><td colspan="6" class="tintas-loading">Error: ' + hm(e.message) + '</td></tr>';
        }
    }

    async function cargarVencer() {
        var tb = document.getElementById('tablaBody');
        document.getElementById('tablaHead').innerHTML =
            '<tr><th>Producto</th><th>Lote</th><th>Disponible</th><th>Vencimiento</th><th>Ubicación</th><th>Estado</th></tr>';
        tb.innerHTML = '<tr><td colspan="6" class="tintas-loading">Cargando...</td></tr>';
        try {
            var r = await fetch('/api/tintas/dashboard/lotes-por-vencer');
            if (!r.ok) throw new Error(await r.text());
            var data = await r.json();
            if (!data.length) {
                tb.innerHTML = '<tr><td colspan="6" class="tintas-loading">Sin lotes próximos a vencer.</td></tr>';
                return;
            }
            tb.innerHTML = data.map(function(l) {
                return '<tr><td>' + hm(l.producto_nombre) + '</td><td>' + hm(l.lote) + '</td><td>' + Number(l.peso_disponible || 0).toFixed(4) + '</td><td>' + (l.fecha_vencimiento || '-') + '</td><td>' + hm(l.ubicacion_id || '-') + '</td><td><span class="tintas-badge tintas-badge-' + hm(l.estado) + '">' + hm(l.estado) + '</span></td></tr>';
            }).join('');
        } catch (e) {
            tb.innerHTML = '<tr><td colspan="6" class="tintas-loading">Error: ' + hm(e.message) + '</td></tr>';
        }
    }

    cargarExistencias();
    </script>
</body>
</html>
