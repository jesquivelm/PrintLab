<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Recetas / Fórmulas - PrintLab</title><link rel="stylesheet" href="/styles.css"><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#1a1a1a}html[data-theme="dark"] body{background:#111;color:#e5e5e5}.header{padding:12px 20px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;gap:12px}html[data-theme="dark"] .header{background:#1a1a1a;border-color:#333}.header h1{margin:0;font-size:18px;font-weight:600}.header a{text-decoration:none;color:inherit;font-size:20px}.table-wrap{padding:16px 20px;overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #e0e0e0;white-space:nowrap}html[data-theme="dark"] th,html[data-theme="dark"] td{border-color:#333}th{background:#f9f9f9;font-weight:600}html[data-theme="dark"] th{background:#1a1a1a}.loading{text-align:center;padding:40px;color:#999}.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}.badge-VIGENTE{background:#dcfce7;color:#166534}.badge-BORRADOR{background:#fef9c3;color:#854d0e}.badge-ARCHIVADO{background:#f3f4f6;color:#6b7280}.badge-OBSOLETO{background:#fee2e2;color:#991b1b}.detail-panel{display:none;padding:16px 20px;background:#fff;border-bottom:1px solid #e0e0e0}html[data-theme="dark"] .detail-panel{background:#1a1a1a;border-color:#333}.detail-panel.open{display:block}.detail-panel h3{margin:0 0 8px}.detail-panel .comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:8px}.detail-panel .comp-item{background:#f9f9f9;border-radius:6px;padding:8px 12px}html[data-theme="dark"] .detail-panel .comp-item{background:#222}</style></head><body><div class="header"><a href="/tintas" onclick="event.preventDefault();parent.postMessage({type:'erp-open-tab',route:'/tintas?shell=1',label:'Tintas'},window.location.origin)">&larr;</a><h1>Recetas / Fórmulas</h1></div><div id="detailPanel" class="detail-panel"></div><div class="table-wrap"><table><thead><tr><th>Código</th><th>Nombre</th><th>Versión</th><th>Estado</th><th>Vigente</th><th>Fecha</th><th></th></tr></thead><tbody id="tablaBody"><tr><td colspan="7" class="loading">Cargando...</td></tr></tbody></table></div><script>async function cargar(){const tb=document.getElementById('tablaBody');tb.innerHTML='<tr><td colspan="7" class="loading">Cargando...</td></tr>';try{const r=await fetch('/api/tintas/pantones/recetas');if(!r.ok)throw new Error(await r.text());const data=await r.json();if(!data.length){tb.innerHTML='<tr><td colspan="7" class="loading">Sin recetas.</td></tr>';return}tb.innerHTML=data.map(r=>'<tr><td>'+hm(r.codigo_interno)+'</td><td><strong>'+hm(r.nombre)+'</strong></td><td>v'+Number(r.version||1)+'</td><td><span class="badge badge-'+hm(r.estado)+'">'+hm(r.estado)+'</span></td><td>'+(r.es_vigente?'Sí':'No')+'</td><td>'+(r.fecha||'-')+'</td><td><button onclick="verDetalle(\''+r.id+'\')" style="padding:4px 10px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;font-size:12px">Ver</button></td></tr>').join('')}catch(e){tb.innerHTML='<tr><td colspan="7" class="loading">Error: '+hm(e.message)+'</td></tr>'}}async function verDetalle(id){const dp=document.getElementById('detailPanel');try{const r=await fetch('/api/tintas/pantones/recetas/'+id);if(!r.ok)throw new Error(await r.text());const data=await r.json();dp.classList.add('open');dp.innerHTML='<h3>'+hm(data.nombre)+' ('+hm(data.codigo_interno)+') v'+Number(data.version||1)+'</h3><p>Estado: '+hm(data.estado)+' | Vigente: '+(data.es_vigente?'Sí':'No')+'</p><div class="comp-grid">'+(data.componentes||[]).map(c=>'<div class="comp-item"><strong>'+hm(c.nombre||c.codigo_interno)+'</strong><br>'+Number(c.porcentaje).toFixed(2)+'%<br><small>'+hm(c.unidad_medida_base)+'</small></div>').join('')+'</div>'}catch(e){dp.classList.add('open');dp.innerHTML='<h3>Error</h3><p>'+hm(e.message)+'</p>'}}function hm(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}cargar()</script></body></html>
