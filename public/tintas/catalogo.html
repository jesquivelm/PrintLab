<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme.js"></script>
    <title>Catálogo de Tintas - PrintLab</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="workspace workspace-quote quote-browser-main tintas-shell">
        <section class="quote-card quote-card-clean quote-browser-card tintas-card">
            <div class="tintas-toolbar">
                <div class="tintas-toolbar-actions">
                    <select id="filterTipo" class="tintas-select">
                        <option value="">Todos los tipos</option>
                        <option value="TINTA_UV">Tinta UV</option>
                        <option value="BARNIZ">Barniz</option>
                        <option value="PRIMER">Primer</option>
                        <option value="ADHESIVO">Adhesivo</option>
                        <option value="BASE">Base</option>
                        <option value="SOLVENTE">Solvente</option>
                        <option value="ADITIVO">Aditivo</option>
                        <option value="OTRO">Otro</option>
                    </select>
                    <select id="filterEstado" class="tintas-select">
                        <option value="">Todos los estados</option>
                        <option value="ACTIVO">Activo</option>
                        <option value="INACTIVO">Inactivo</option>
                    </select>
                    <button class="tintas-btn" onclick="cargar()">Buscar</button>
                </div>
                <div class="tintas-toolbar-search">
                    <input id="searchText" class="tintas-search-input" type="search" placeholder="Buscar...">
                </div>
            </div>
            <div class="tintas-table-wrap">
                <table class="tintas-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Familia</th>
                            <th>Marca</th>
                            <th>Unidad</th>
                            <th>Costo Prom.</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tablaBody">
                        <tr><td colspan="8" class="tintas-loading">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script>
    async function cargar() {
        var tb = document.getElementById('tablaBody');
        var params = new URLSearchParams();
        var texto = document.getElementById('searchText').value.trim();
        var tipo = document.getElementById('filterTipo').value;
        var estado = document.getElementById('filterEstado').value;
        if (texto) params.set('texto', texto);
        if (tipo) params.set('tipo', tipo);
        if (estado) params.set('estado', estado);
        tb.innerHTML = '<tr><td colspan="8" class="tintas-loading">Cargando...</td></tr>';
        try {
            var r = await fetch('/api/tintas/productos?' + params.toString());
            if (!r.ok) throw new Error(await r.text());
            var data = await r.json();
            if (!data.length) {
                tb.innerHTML = '<tr><td colspan="8" class="tintas-loading">Sin resultados.</td></tr>';
                return;
            }
            tb.innerHTML = data.map(function(p) {
                return '<tr><td>' + hm(p.codigo_interno) + '</td><td><strong>' + hm(p.nombre) + '</strong></td><td>' + hm(p.tipo) + '</td><td>' + hm(p.familia_nombre) + '</td><td>' + hm(p.marca_nombre) + '</td><td>' + hm(p.unidad_medida_base) + '</td><td>$' + Number(p.costo_promedio || 0).toFixed(4) + '</td><td><span class="tintas-badge tintas-badge-' + hm(p.estado) + '">' + hm(p.estado) + '</span></td></tr>';
            }).join('');
        } catch (e) {
            tb.innerHTML = '<tr><td colspan="8" class="tintas-loading">Error: ' + hm(e.message) + '</td></tr>';
        }
    }
    function hm(v) {
        return String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    cargar();
    </script>
</body>
</html>
