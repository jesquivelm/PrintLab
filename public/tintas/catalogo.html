<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Catálogo de Tintas - PrintLab</title><link rel="stylesheet" href="/styles.css"><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#1a1a1a}html[data-theme="dark"] body{background:#111;color:#e5e5e5}.header{padding:12px 20px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;gap:12px}html[data-theme="dark"] .header{background:#1a1a1a;border-color:#333}.header h1{margin:0;font-size:18px;font-weight:600}.header a{text-decoration:none;color:inherit;font-size:20px}.toolbar{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #e0e0e0}html[data-theme="dark"] .toolbar{background:#1a1a1a;border-color:#333}.toolbar input,.toolbar select{padding:6px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px}html[data-theme="dark"] .toolbar input,html[data-theme="dark"] .toolbar select{background:#222;color:#e5e5e5;border-color:#444}.toolbar button{padding:6px 14px;border:none;border-radius:6px;background:#d97706;color:#fff;cursor:pointer;font-size:13px}.table-wrap{padding:16px 20px;overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #e0e0e0;white-space:nowrap}html[data-theme="dark"] th,html[data-theme="dark"] td{border-color:#333}th{background:#f9f9f9;font-weight:600}html[data-theme="dark"] th{background:#1a1a1a}.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}.badge-ACTIVO{background:#dcfce7;color:#166534}.badge-INACTIVO{background:#f3f4f6;color:#6b7280}.loading{text-align:center;padding:40px;color:#999}</style></head><body><div class="header"><a href="/tintas" onclick="event.preventDefault();parent.postMessage({type:'erp-open-tab',route:'/tintas?shell=1',label:'Tintas'},window.location.origin)">&larr;</a><h1>Catálogo de Tintas</h1></div><div class="toolbar"><input id="searchText" placeholder="Buscar..." style="width:200px"><select id="filterTipo"><option value="">Todos los tipos</option><option value="TINTA_UV">Tinta UV</option><option value="BARNIZ">Barniz</option><option value="PRIMER">Primer</option><option value="ADHESIVO">Adhesivo</option><option value="BASE">Base</option><option value="SOLVENTE">Solvente</option><option value="ADITIVO">Aditivo</option><option value="OTRO">Otro</option></select><select id="filterEstado"><option value="">Todos los estados</option><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option></select><button onclick="cargar()">Buscar</button></div><div class="table-wrap"><table><thead><tr><th>Código</th><th>Nombre</th><th>Tipo</th><th>Familia</th><th>Marca</th><th>Unidad</th><th>Costo Prom.</th><th>Estado</th></tr></thead><tbody id="tablaBody"><tr><td colspan="8" class="loading">Cargando...</td></tr></tbody></table></div><script>async function cargar(){const tb=document.getElementById('tablaBody');const params=new URLSearchParams();const texto=document.getElementById('searchText').value.trim();const tipo=document.getElementById('filterTipo').value;const estado=document.getElementById('filterEstado').value;if(texto)params.set('texto',texto);if(tipo)params.set('tipo',tipo);if(estado)params.set('estado',estado);tb.innerHTML='<tr><td colspan="8" class="loading">Cargando...</td></tr>';try{const r=await fetch('/api/tintas/productos?'+params.toString());if(!r.ok)throw new Error(await r.text());const data=await r.json();if(!data.length){tb.innerHTML='<tr><td colspan="8" class="loading">Sin resultados.</td></tr>';return}tb.innerHTML=data.map(p=>'<tr><td>'+hm(p.codigo_interno)+'</td><td><strong>'+hm(p.nombre)+'</strong></td><td>'+hm(p.tipo)+'</td><td>'+hm(p.familia_nombre)+'</td><td>'+hm(p.marca_nombre)+'</td><td>'+hm(p.unidad_medida_base)+'</td><td>$'+Number(p.costo_promedio||0).toFixed(4)+'</td><td><span class="badge badge-'+hm(p.estado)+'">'+hm(p.estado)+'</span></td></tr>').join('')}catch(e){tb.innerHTML='<tr><td colspan="8" class="loading">Error: '+hm(e.message)+'</td></tr>'}}function hm(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}cargar()</script></body></html>
