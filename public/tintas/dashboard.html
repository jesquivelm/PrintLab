<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tintas - PrintLab</title>
<link rel="stylesheet" href="/styles.css">
<script src="/theme.js"></script>
<style>
body { margin:0; background:transparent; }
.tintas-dashboard-grid { display:grid; grid-template-columns:repeat(4,minmax(180px,220px)); justify-content:center; gap:18px; padding:32px 24px; max-width:1200px; margin:0 auto; }
.tintas-dashboard-card { display:grid; justify-items:center; align-content:center; gap:12px; aspect-ratio:1/1; padding:18px; border:1px solid var(--app-border); border-radius:24px; background:var(--app-surface); text-align:center; box-shadow:var(--app-shadow-sm); transition:transform 0.18s ease,box-shadow 0.18s ease,border-color 0.18s ease; cursor:pointer; }
.tintas-dashboard-card:hover, .tintas-dashboard-card:focus-visible { transform:translateY(-2px); box-shadow:var(--app-shadow-md); }
.tintas-dashboard-card-icon { display:inline-flex; align-items:center; justify-content:center; width:54px; height:54px; flex:0 0 54px; color:var(--icon-base-color,var(--app-primary)); border-radius:14px; transition:color 0.18s ease,transform 0.18s ease; }
.tintas-dashboard-card:hover .tintas-dashboard-card-icon, .tintas-dashboard-card:focus-visible .tintas-dashboard-card-icon { color:var(--icon-hover-color,var(--app-primary-strong)); transform:translateY(-1px); }
.tintas-dashboard-card-icon .icon-glyph { color:currentColor; font-size:var(--config-icon-size,38px); }
.tintas-dashboard-card-icon .icon-svg-mask, .tintas-dashboard-card-icon .icon-image { width:var(--config-icon-size,38px); height:var(--config-icon-size,38px); display:block; max-width:100%; max-height:100%; object-fit:contain; }
.tintas-dashboard-card-title { font-size:13px; font-weight:500; color:var(--app-text-muted); }
.tintas-dashboard-card:hover .tintas-dashboard-card-title { color:var(--app-text); }
</style>
</head>
<body>
<section class="tintas-dashboard-grid" id="tintasGrid"></section>
<script>
const CONFIG_ENDPOINT = '/api/config/shell';
const TINTAS_MODULES = [
  { route:'/tintas/catalogo', label:'Catálogo de Tintas', iconKey:'tintasCatalogo' },
  { route:'/tintas/lotes', label:'Control de Inventario', iconKey:'tintasInventario' },
  { route:'/tintas/pantones', label:'Biblioteca Pantone', iconKey:'tintasPantones' },
  { route:'/tintas/recetas', label:'Recetas y Fórmulas', iconKey:'tintasRecetas' }
];

let loadedConfig = {};

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function iconMarkup(value, altText, extraClass) {
  const normalized = String(value || '').trim().toLowerCase();
  if (normalized.startsWith('data:image/svg+xml') || /\.svg(\?|#|$)/i.test(normalized)) {
    return '<span class="icon-svg-mask ' + (extraClass || '') + '" role="img" aria-label="' + escapeHtml(altText) + '" style="-webkit-mask-image:url(\'' + escapeHtml(value) + '\');mask-image:url(\'' + escapeHtml(value) + '\');"></span>';
  }
  if (normalized.startsWith('data:image') || /\.(png|jpe?g|webp|gif)(\?|#|$)/i.test(normalized)) {
    return '<img src="' + escapeHtml(value) + '" alt="' + escapeHtml(altText) + '" class="icon-image ' + (extraClass || '') + '">';
  }
  return '<span class="icon-glyph ' + (extraClass || '') + '">' + escapeHtml(value || '') + '</span>';
}

function renderTintasCards() {
  const grid = document.getElementById('tintasGrid');
  if (!grid) return;
  grid.innerHTML = '';
  TINTAS_MODULES.forEach(function(mod) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'tintas-dashboard-card';
    card.dataset.route = mod.route;
    card.dataset.label = mod.label;
    card.dataset.iconKey = mod.iconKey;

    const iconValue = (loadedConfig.icons && loadedConfig.icons[mod.iconKey]) || '\u25C9';
    const suffix = mod.iconKey.charAt(0).toUpperCase() + mod.iconKey.slice(1);
    let color = (loadedConfig.general && loadedConfig.general['iconColor' + suffix]) || '#d97706';
    const hover = (loadedConfig.general && loadedConfig.general['iconColorHover' + suffix]) || color || '#f59e0b';
    const configuredSize = Number((loadedConfig.general && loadedConfig.general['iconSize' + suffix])) || 38;

    const iconSpan = document.createElement('span');
    iconSpan.className = 'tintas-dashboard-card-icon';
    iconSpan.innerHTML = iconMarkup(iconValue, mod.label, 'table-icon-media');
    iconSpan.style.setProperty('--icon-base-color', color);
    iconSpan.style.setProperty('--icon-hover-color', hover);

    const titleSpan = document.createElement('span');
    titleSpan.className = 'tintas-dashboard-card-title';
    titleSpan.textContent = mod.label;

    card.appendChild(iconSpan);
    card.appendChild(titleSpan);

    card.addEventListener('click', function() {
      var parent = window.parent;
      if (parent && parent !== window) {
        parent.postMessage({ type:'erp-open-tab', route:mod.route, label:mod.label }, window.location.origin);
      } else {
        window.open(mod.route, '_blank', 'noopener');
      }
    });

    grid.appendChild(card);

    requestAnimationFrame(function() {
      var cardWidth = card.clientWidth || 190;
      var size = Math.max(24, Math.min(configuredSize, Math.max(42, Math.min(84, Math.floor(cardWidth * 0.42)))));
      var tileSize = Math.max(56, Math.min(cardWidth - 28, size + 18));
      iconSpan.style.setProperty('--config-icon-size', size + 'px');
      iconSpan.style.width = tileSize + 'px';
      iconSpan.style.height = tileSize + 'px';
      iconSpan.style.flexBasis = tileSize + 'px';
    });
  });
}

async function loadConfig() {
  try {
    const response = await fetch(CONFIG_ENDPOINT, { cache:'no-cache' });
    if (response.ok) {
      loadedConfig = await response.json();
    }
  } catch(e) {}
  renderTintasCards();
}

function handleMessage(event) {
  if (event.origin !== window.location.origin) return;
  var data = event.data || {};
  if (data.type === 'erp-general-config-updated') {
    if (data.config && typeof data.config === 'object') {
      loadedConfig = data.config;
    } else {
      loadConfig();
      return;
    }
    renderTintasCards();
  }
}

window.addEventListener('message', handleMessage);
document.addEventListener('DOMContentLoaded', loadConfig);
if (document.readyState !== 'loading') loadConfig();
</script>
</body>
</html>
