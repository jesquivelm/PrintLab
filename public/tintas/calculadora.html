<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme.js"></script>
    <title>Calculadora de Producción - Tintas</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="workspace workspace-quote quote-browser-main tintas-shell">
        <section class="quote-card quote-card-clean quote-browser-card tintas-card">
            <div class="tintas-form" style="text-align:center;max-width:480px;margin:40px auto;">
                <h3 style="margin-top:0">Esta calculadora se movió</h3>
                <p style="color:var(--app-text-soft);font-size:13px;">
                    La calculadora de fórmula ahora vive dentro de <strong>Recetas y Fórmulas</strong>,
                    integrada al modal de "Nueva Fórmula" (pestaña "Compatibilidad y cálculo") y también
                    disponible al presionar "Ver" sobre cualquier fórmula existente.
                </p>
                <button class="tintas-btn" style="margin-top:12px" onclick="irARecetas()">Ir a Recetas y Fórmulas</button>
            </div>
        </section>
    </main>
    <script>
    function irARecetas() {
        var parent = window.parent;
        if (parent && parent !== window) {
            parent.postMessage({ type: 'erp-open-tab', route: '/tintas/recetas', label: 'Recetas y Fórmulas' }, window.location.origin);
        } else {
            window.location.href = '/tintas/recetas';
        }
    }
    </script>
</body>
</html>
