<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Calculadora de Producción - Tintas</title><link rel="stylesheet" href="/styles.css"><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#1a1a1a}html[data-theme="dark"] body{background:#111;color:#e5e5e5}.header{padding:12px 20px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;gap:12px}html[data-theme="dark"] .header{background:#1a1a1a;border-color:#333}.header h1{margin:0;font-size:18px;font-weight:600}.header a{text-decoration:none;color:inherit;font-size:20px}.form-wrap{padding:20px;max-width:600px}.form-wrap label{display:block;margin-bottom:6px;font-size:13px;font-weight:500}.form-wrap select,.form-wrap input{padding:8px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px;width:100%;box-sizing:border-box}html[data-theme="dark"] .form-wrap select,html[data-theme="dark"] .form-wrap input{background:#222;color:#e5e5e5;border-color:#444}.form-wrap button{padding:10px 20px;border:none;border-radius:6px;background:#d97706;color:#fff;cursor:pointer;font-size:14px;font-weight:500}.form-row{display:flex;gap:12px}.form-row>*{flex:1}.results{margin-top:20px;padding:20px;background:#fff;border-radius:8px;border:1px solid #e0e0e0}html[data-theme="dark"] .results{background:#1a1a1a;border-color:#333}.results h3{margin:0 0 12px}.comp-table{width:100%;border-collapse:collapse;font-size:13px}.comp-table th,.comp-table td{padding:8px 12px;text-align:left;border-bottom:1px solid #e0e0e0}html[data-theme="dark"] .comp-table th,html[data-theme="dark"] .comp-table td{border-color:#333}.comp-table th{background:#f9f9f9;font-weight:600}html[data-theme="dark"] .comp-table th{background:#1a1a1a}.suficiente{color:#166534;font-weight:600}.insuficiente{color:#991b1b;font-weight:600}.loading{text-align:center;padding:40px;color:#999}</style></head><body><div class="header"><a href="/tintas" onclick="event.preventDefault();parent.postMessage({type:'erp-open-tab',route:'/tintas?shell=1',label:'Tintas'},window.location.origin)">&larr;</a><h1>Calculadora de Producción</h1></div><div class="form-wrap"><label>Receta</label><select id="recetaSelect"><option>Cargando recetas...</option></select><div class="form-row"><div><label>Cantidad a producir</label><input id="cantidad" type="number" value="1" min="0.001" step="0.1"></div><div><label>Unidad</label><select id="unidad"><option value="KG">Kilogramos (KG)</option><option value="G">Gramos (G)</option><option value="LB">Libras (LB)</option><option value="OZ">Onzas (OZ)</option><option value="L">Litros (L)</option></select></div></div><button onclick="calcular()">Calcular Componentes</button><div id="results" class="results" style="display:none"></div></div><script>let recetas=[];async function init(){try{const r=await fetch('/api/tintas/pantones/recetas');if(!r.ok)throw new Error();recetas=await r.json();const sel=document.getElementById('recetaSelect');sel.innerHTML=recetas.map(r=>'<option value="'+r.id+'">'+hm(r.codigo_interno)+' - '+hm(r.nombre)+'</option>').join('')}catch(e){document.getElementById('recetaSelect').innerHTML='<option>Error al cargar recetas</option>'}}async function calcular(){const id=document.getElementById('recetaSelect').value;const cant=Number(document.getElementById('cantidad').value);const unidad=document.getElementById('unidad').value;if(!id||!cant){alert('Selecciona una receta e ingresa una cantidad.');return}const res=document.getElementById('results');res.style.display='block';res.innerHTML='<div class="loading">Calculando...</div>';try{const r=await fetch('/api/tintas/pantones/recetas/'+id+'/calcular?cantidad='+cant+'&unidad='+unidad);if(!r.ok)throw new Error(await r.text());const data=await r.json();let html='<h3>Resultado</h3>';html+='<p>Cantidad total: '+Number(data.cantidad_total_solicitada).toFixed(4)+' '+hm(data.unidad_total)+'</p>';if(data.advertencia)html+='<p style="color:#991b1b">⚠ '+hm(data.advertencia)+'</p>';html+='<table class="comp-table"><thead><tr><th>Componente</th><th>%</th><th>Cantidad</th><th>Unidad</th></tr></thead><tbody>';html+=data.componentes.map(c=>'<tr><td>'+hm(c.nombre)+'</td><td>'+Number(c.porcentaje).toFixed(2)+'%</td><td>'+Number(c.cantidad).toFixed(4)+'</td><td>'+hm(c.unidad_medida)+'</td></tr>').join('');html+='</tbody></table>';res.innerHTML=html}catch(e){res.innerHTML='<p style="color:#991b1b">Error: '+hm(e.message)+'</p>'}}function hm(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}init()</script></body></html>
