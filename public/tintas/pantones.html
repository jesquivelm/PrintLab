<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Biblioteca Pantone - PrintLab</title><link rel="stylesheet" href="/styles.css"><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#1a1a1a}html[data-theme="dark"] body{background:#111;color:#e5e5e5}.header{padding:12px 20px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;gap:12px}html[data-theme="dark"] .header{background:#1a1a1a;border-color:#333}.header h1{margin:0;font-size:18px;font-weight:600}.header a{text-decoration:none;color:inherit;font-size:20px}.toolbar{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #e0e0e0}html[data-theme="dark"] .toolbar{background:#1a1a1a;border-color:#333}.toolbar input{padding:6px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;width:200px}html[data-theme="dark"] .toolbar input{background:#222;color:#e5e5e5;border-color:#444}.toolbar button{padding:6px 14px;border:none;border-radius:6px;background:#d97706;color:#fff;cursor:pointer;font-size:13px}.table-wrap{padding:16px 20px;overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #e0e0e0;white-space:nowrap}html[data-theme="dark"] th,html[data-theme="dark"] td{border-color:#333}th{background:#f9f9f9;font-weight:600}html[data-theme="dark"] th{background:#1a1a1a}.loading{text-align:center;padding:40px;color:#999}.color-swatch{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid #ccc;vertical-align:middle;margin-right:6px}</style></head><body><div class="header"><a href="/tintas" onclick="event.preventDefault();parent.postMessage({type:'erp-open-tab',route:'/tintas?shell=1',label:'Tintas'},window.location.origin)">&larr;</a><h1>Biblioteca Pantone</h1></div><div class="toolbar"><input id="searchText" placeholder="Buscar por código o nombre..."><button onclick="cargar()">Buscar</button></div><div class="table-wrap"><table><thead><tr><th>Código Pantone</th><th>Nombre</th><th>Color</th><th>Descripción</th><th>Frecuencia</th></tr></thead><tbody id="tablaBody"><tr><td colspan="5" class="loading">Cargando...</td></tr></tbody></table></div><script>async function cargar(){const tb=document.getElementById('tablaBody');const texto=document.getElementById('searchText').value.trim();const params=texto?'?texto='+encodeURIComponent(texto):'';tb.innerHTML='<tr><td colspan="5" class="loading">Cargando...</td></tr>';try{const r=await fetch('/api/tintas/pantones/biblioteca'+params);if(!r.ok)throw new Error(await r.text());const data=await r.json();if(!data.length){tb.innerHTML='<tr><td colspan="5" class="loading">Sin resultados.</td></tr>';return}tb.innerHTML=data.map(p=>{const h=p.color_hex?'<span class="color-swatch" style="background:'+hm(p.color_hex)+'"></span>':'';return'<tr><td><strong>'+hm(p.codigo_pantone)+'</strong></td><td>'+hm(p.nombre)+'</td><td>'+h+hm(p.color_hex||'-')+'</td><td>'+hm(p.descripcion)+'</td><td>'+Number(p.frecuencia_uso||0)+'</td></tr>'}).join('')}catch(e){tb.innerHTML='<tr><td colspan="5" class="loading">Error: '+hm(e.message)+'</td></tr>'}}function hm(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}cargar()</script></body></html>
