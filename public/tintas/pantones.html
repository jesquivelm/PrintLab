<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme.js"></script>
    <title>Biblioteca Pantone - PrintLab</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="workspace workspace-quote quote-browser-main tintas-shell">
        <section class="quote-card quote-card-clean quote-browser-card tintas-card">
            <div class="tintas-toolbar">
                <div class="tintas-toolbar-actions">
                    <button class="tintas-btn" onclick="cargar()">Buscar</button>
                </div>
                <div class="tintas-toolbar-search">
                    <input id="searchText" class="tintas-search-input" type="search" placeholder="Buscar por código o nombre...">
                </div>
            </div>
            <div class="tintas-table-wrap">
                <table class="tintas-table">
                    <thead>
                        <tr>
                            <th>Código Pantone</th>
                            <th>Nombre</th>
                            <th>Color</th>
                            <th>Descripción</th>
                            <th>Frecuencia</th>
                        </tr>
                    </thead>
                    <tbody id="tablaBody">
                        <tr><td colspan="5" class="tintas-loading">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script>
    async function cargar() {
        var tb = document.getElementById('tablaBody');
        var texto = document.getElementById('searchText').value.trim();
        var params = texto ? '?texto=' + encodeURIComponent(texto) : '';
        tb.innerHTML = '<tr><td colspan="5" class="tintas-loading">Cargando...</td></tr>';
        try {
            var r = await fetch('/api/tintas/pantones/biblioteca' + params);
            if (!r.ok) throw new Error(await r.text());
            var data = await r.json();
            if (!data.length) {
                tb.innerHTML = '<tr><td colspan="5" class="tintas-loading">Sin resultados.</td></tr>';
                return;
            }
            tb.innerHTML = data.map(function(p) {
                var h = p.color_hex ? '<span class="tintas-color-swatch" style="background:' + hm(p.color_hex) + '"></span>' : '';
                return '<tr><td><strong>' + hm(p.codigo_pantone) + '</strong></td><td>' + hm(p.nombre) + '</td><td>' + h + hm(p.color_hex || '-') + '</td><td>' + hm(p.descripcion) + '</td><td>' + Number(p.frecuencia_uso || 0) + '</td></tr>';
            }).join('');
        } catch (e) {
            tb.innerHTML = '<tr><td colspan="5" class="tintas-loading">Error: ' + hm(e.message) + '</td></tr>';
        }
    }
    function hm(v) {
        return String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    cargar();
    </script>
</body>
</html>
