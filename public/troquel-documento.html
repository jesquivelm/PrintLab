<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme.js"></script>
    <title>Troquel</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="workspace workspace-quote troquel-document-workspace">
        <section class="quote-card quote-card-clean troquel-document-card">
            <section class="troquel-document-summary">
                <div class="troquel-document-header">
                    <div class="troquel-document-title-block">
                        <span>Id Troquel</span>
                        <strong id="troquelHeroCode">Nuevo</strong>
                    </div>
                    <div class="troquel-document-title-block troquel-document-title-wide">
                        <span>Descripción</span>
                        <strong id="troquelHeroName">Nuevo troquel</strong>
                    </div>
                </div>

                <div class="troquel-document-main">
                    <div class="troquel-document-left">

                        <!-- 1. Detalles Generales -->
                        <section class="socios-section troquel-section-compact">
                            <div class="section-caption">Detalles Generales</div>
                            <div class="socios-grid troquel-grid-3 troquel-grid-tight">
                                <div class="field field-full"><label>Descripción Cotización</label><input id="troquelDescripcionCotizacion" name="descripcion_cotizaciones" type="text"></div>
                                <div class="field"><label>Forma Troquel</label><select id="troquelFormato" name="formato"></select></div>
                                <div class="field"><label>Estado</label><input id="troquelEstado" name="estado" type="text"></div>
                                <div class="field"><label>Clasificación</label><input id="troquelClasificacion" name="clasificacion" type="text"></div>
                                <div class="field"><label>Código Cliente</label><input id="troquelCodigoCliente" name="codigo_cliente" type="text"></div>
                                <div class="field"><label>Código Preprensa</label><input id="troquelCodigoPreprensa" name="codigo_preprensa" type="text"></div>
                                <div></div>
                                <div class="troquel-check-group">
                                    <label class="inventory-checkbox-field"><span>Activo</span><input id="troquelActivo" name="activo" type="checkbox"></label>
                                    <label class="inventory-checkbox-field"><span>Convencional</span><input id="troquelUsoConvencional" name="uso_convencional" type="checkbox"></label>
                                    <label class="inventory-checkbox-field"><span>Digital</span><input id="troquelUsoDigital" name="uso_digital" type="checkbox"></label>
                                </div>
                            </div>
                        </section>

                        <!-- 2. Dimensionamiento -->
                        <section class="socios-section troquel-section-compact">
                            <div class="section-caption">Dimensionamiento</div>
                            <div class="socios-grid troquel-grid-3 troquel-grid-tight">
                                <div class="field"><label>Ancho Etiqueta in</label><input id="troquelAnchoEtiqueta" name="ancho_etiqueta_in" type="text"></div>
                                <div class="field"><label>Largo Etiqueta in</label><input id="troquelLargoEtiqueta" name="largo_etiqueta_in" type="text"></div>
                                <div class="field"><label>Ancho Material in</label><input id="troquelAnchoMaterial" name="ancho_material_in" type="text"></div>
                                <div class="field"><label>Desarrollo in</label><input id="troquelDesarrolloIn" name="desarrollo_in" type="text"></div>
                                <div class="field"><label>Dientes</label><input id="troquelDientes" name="dientes" type="text"></div>
                                <div class="field"><label>Elongación %</label><input id="troquelElongacion" name="elongacion_pct" type="text"></div>
                                <div class="field"><label>Filas</label><input id="troquelFilas" name="cantidad_filas" type="text"></div>
                                <div class="field"><label>Repeticiones</label><input id="troquelRepeticiones" name="repeticiones" type="text"></div>
                                <div class="field"><label>Montaje Troquel</label><input id="troquelMontaje" name="montaje_troquel" type="text"></div>
                                <div class="field"><label>Dimensiones Troquel in</label><input id="troquelDimensiones" name="dimensiones_troquel_in" type="text" placeholder="13 x 7,8"></div>
                                <div class="field"><label>Tensión</label><input id="troquelTension" name="tension" type="text"></div>
                                <div class="field"><label>Elongado</label><input id="troquelElongado" name="elongado" type="text"></div>
                            </div>
                        </section>

                        <!-- 3. Áreas -->
                        <section class="socios-section troquel-section-compact">
                            <div class="section-caption">Áreas</div>
                            <div class="socios-grid troquel-grid-3 troquel-grid-tight">
                                <div class="field"><label>Área Etiqueta in²</label><input id="troquelAreaEtiqueta" name="area_etiqueta_in" type="text"></div>
                                <div class="field"><label>Área Etiqueta c/Excesos in²</label><input id="troquelAreaEtiquetaExcesos" name="area_etiqueta_excesos_in" type="text"></div>
                                <div class="field"><label>Área Troquel in²</label><input id="troquelAreaTroquel" name="area_troquel_in2" type="text"></div>
                            </div>
                        </section>

                        <!-- 4. Vida Útil / Trazabilidad -->
                        <section class="socios-section troquel-section-compact">
                            <div class="section-caption">Vida Útil / Trazabilidad</div>
                            <div class="socios-grid troquel-grid-3 troquel-grid-tight">
                                <div class="field"><label>Vida Útil Total</label><input id="troquelVidaTotal" name="vida_util_golpes_total" type="text"></div>
                                <div class="field"><label>Vida Útil Usada</label><input id="troquelVidaUsada" name="vida_util_golpes_usados" type="text"></div>
                                <div class="field"><label>Vida Útil Restante</label><input id="troquelVidaRestante" name="vida_util_golpes_restantes" type="text"></div>
                                <div class="field"><label>Reemplaza a</label><input id="troquelReemplazaA" name="reemplaza_a" type="text"></div>
                                <div class="field"><label>Reemplazado por</label><input id="troquelReemplazadoPor" name="reemplazado_por" type="text"></div>
                                <div></div>
                            </div>
                        </section>

                        <!-- 5. Observaciones -->
                        <section class="socios-section troquel-section-compact">
                            <div class="section-caption">Observaciones</div>
                            <div class="socios-grid">
                                <div class="field field-full">
                                    <textarea id="troquelObservaciones" name="observaciones" rows="3"></textarea>
                                </div>
                            </div>
                        </section>

                        <!-- 6. Proveedor -->
                        <section class="socios-section troquel-section-compact">
                            <div class="section-caption">Proveedor</div>
                            <div class="socios-grid troquel-grid-3 troquel-grid-tight">
                                <div class="field"><label>Proveedor Troquel</label><input id="troquelProveedor" name="proveedor_troquel" type="text"></div>
                                <div class="field"><label>Código Proveedor</label><input id="troquelCodigoProveedor" name="codigo_proveedor" type="text"></div>
                                <div></div>
                            </div>
                        </section>

                    </div>

                    <aside class="troquel-document-right">
                        <section class="socios-section troquel-section-compact troquel-image-panel">
                            <div class="section-caption">Muestra del Troquel</div>
                            <div id="troquelImagePreview" class="troquel-image-preview">Sin imagen</div>
                        </section>
                    </aside>
                </div>
            </section>

            <form id="troquelForm" hidden>
                <input type="hidden" id="troquelId" name="id">
            </form>
        </section>
    </main>
    <script src="/access-control.js"></script>
    <script src="/troquel-documento.js"></script>
</body>
</html>
