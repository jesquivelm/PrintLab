<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proforma — Impresión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style id="pDynamicFont"></style>
    <style>
        :root {
            --ink: #1b2430;
            --navy: #1f314b;
            --navy-soft: #314765;
            --gold: #b59055;
            --paper: #fffdf8;
            --line: #d7e2ea;
            --muted: #647384;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            color: var(--ink);
            background: #e8edf2;
            scrollbar-width: thin;
            scrollbar-color: rgba(11, 129, 184, 0.42) transparent;
        }
        body::-webkit-scrollbar,
        #pPageWrap::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        body::-webkit-scrollbar-track,
        #pPageWrap::-webkit-scrollbar-track {
            background: transparent;
        }
        body::-webkit-scrollbar-thumb,
        #pPageWrap::-webkit-scrollbar-thumb {
            background: rgba(11, 129, 184, 0.38);
            border-radius: 999px;
        }
        html[data-theme="dark"] body {
            background: #0f1b2d;
            color: #e6eef8;
        }

        /* ── Toolbar (screen only) ─────────────────── */
        #pToolbar {
            display: none !important;
        }
        #pToolbar h1 { font-size: 15px; font-weight: 600; flex: 1; }
        #pToolbar button {
            height: 34px;
            padding: 0 18px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,.25);
            background: rgba(255,255,255,.15);
            color: #fff;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }
        #pToolbar button:hover { background: rgba(255,255,255,.28); }
        #pToolbar button.primary {
            background: #1a8fc8;
            border-color: transparent;
        }
        #pToolbar button.primary:hover { background: #1580b5; }
        #pToolbar .sep {
            width: 1px; height: 24px;
            background: rgba(255,255,255,.2);
        }

        /* ── Page wrapper (screen) ─────────────────── */
        #pPageWrap {
            padding: 24px 24px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }
        html[data-theme="dark"] #pPageWrap {
            background: #0f1b2d;
        }

        /* ── The actual document ───────────────────── */
        .p-page {
            width: 215.9mm;   /* Letter width */
            min-height: 279.4mm; /* Letter height */
            background: #fff;
            box-shadow: 0 8px 32px rgba(0,0,0,.18);
            display: flex;
            flex-direction: column;
            /* NO overflow:hidden — content must flow */
        }

        /* ── Header ────────────────────────────────── */
        .p-header {
            padding: 14px 22px 12px;
            background: var(--navy);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .p-header.is-light {
            background: linear-gradient(135deg, #f8fbfe 0%, #eaf2f9 100%);
            color: var(--navy);
        }
        .p-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }
        .p-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .p-logo img { object-fit: contain; display: block; }
        .p-brand-copy { display: flex; flex-direction: column; gap: 3px; }
        .p-brand-copy[hidden] { display: none; }
        .p-company-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            letter-spacing: .06em;
            line-height: 1;
        }
        .p-slogan { font-size: 10px; opacity: .78; }
        .p-doc-title {
            text-align: right;
            flex-shrink: 0;
        }
        .p-doc-title h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 34px;
            font-style: italic;
            font-weight: 400;
            line-height: 1;
        }
        .p-doc-title p {
            font-size: 14px;
            font-weight: 600;
            opacity: 1;
            margin-top: 5px;
            letter-spacing: 0.02em;
        }

        /* ── Meta row: client + doc-info side by side ── */
        .p-meta-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }
        .p-doc-info-card {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            background: #fcfeff;
            min-width: 148px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .p-doc-info-card h3 {
            font-size: 10px;
            color: var(--gold);
            letter-spacing: .04em;
            margin-bottom: 5px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .p-doc-info-item {
            display: block;
            font-size: 11.5px;
            color: #4d5a68;
            line-height: 1.6;
        }
        .p-doc-info-item strong {
            font-weight: 600;
            color: var(--navy);
        }

        /* ── Body ───────────────────────────────────── */
        .p-body {
            padding: 16px 22px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        /* Client card */
        .p-client-card {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            background: #fcfeff;
        }
        .p-client-card h3 {
            font-size: 10px;
            color: var(--gold);
            letter-spacing: .04em;
            margin-bottom: 5px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .p-client-name {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--navy);
        }
        .p-client-meta {
            display: block;
            font-size: 12px;
            color: #4d5a68;
        }

        /* Intro */
        .p-intro {
            border-left: 3px solid var(--gold);
            background: #fbf7f0;
            padding: 10px 14px;
            border-radius: 0 10px 10px 0;
            font-size: 13px;
            font-style: italic;
            color: #2f3c46;
            line-height: 1.5;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .p-intro[hidden] { display: none; }
        .p-tech-summary {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
        .p-tech-card {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            background: #fbfdff;
        }
        .p-tech-card h3 {
            margin: 0 0 5px;
            font-size: 10px;
            color: var(--gold);
            letter-spacing: .04em;
            text-transform: uppercase;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .p-tech-card p {
            margin: 0;
            font-size: 11.5px;
            color: #536273;
            line-height: 1.45;
        }

        /* Products table */
        .p-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 12px;
        }
        .p-table thead {
            background: var(--navy);
            color: #fff;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .p-table th {
            padding: 8px 10px;
            font-size: 10px;
            font-weight: 500;
            text-align: left;
            white-space: nowrap;
        }
        .p-table th:not(:first-child),
        .p-table td:not(:first-child) { text-align: right; }
        .p-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #e3ebf0;
            color: #4a5967;
            vertical-align: top;
        }
        .p-table tr:nth-child(even) td { background: #fbfdff; }
        .p-product-name { font-weight: 600; color: var(--navy); }
        .p-product-desc {
            display: block;
            margin-top: 2px;
            font-size: 10px;
            color: var(--muted);
        }

        /* Totals */
        .p-totals {
            margin-left: auto;
            width: 280px;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
        }
        .p-totals table { width: 100%; border-collapse: collapse; }
        .p-totals td {
            padding: 9px 12px;
            border-bottom: 1px solid var(--line);
            font-size: 12px;
            color: #485766;
        }
        .p-totals tr:last-child td {
            border-bottom: none;
            background: var(--navy);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .p-totals td:last-child { text-align: right; }
        .p-totals[hidden] { display: none; }

        /* ── Document footer section (terms + signature) ── */
        .p-doc-footer {
            padding-top: 14px;
            padding-bottom: 24px;
            /* margin-top: auto — empuja el contenido (terms + sig) hacia el fondo */
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .p-terms-grid {
            /* margin-top: auto — se adhiere al fondo junto con la firma */
            margin-top: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .p-terms-grid[hidden] { display: none; }
        .p-term {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 9px 11px;
            background: #fbfdff;
        }
        .p-term h3 {
            font-size: 10px;
            color: var(--gold);
            letter-spacing: .04em;
            margin-bottom: 4px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .p-term p { font-size: 11.5px; color: #536273; line-height: 1.45; }

        /* Signature */
        .p-sig-row {
            margin-top: auto;
            display: flex;
            justify-content: center;
            gap: 24px;
            padding-top: 6px;
        }
        .p-signature { min-width: 200px; text-align: center; }
        .p-sig-line {
            min-height: 44px;
            border-bottom: 1px solid var(--navy);
            margin-bottom: 5px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 4px;
        }
        .p-sig-line img {
            object-fit: contain;
        }
        .p-signature strong {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #111;
        }
        .p-signature span {
            display: block;
            font-size: 11px;
            color: var(--muted);
        }

        /* Loading / error */
        #pLoading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e8edf2;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            color: #647384;
            flex-direction: column;
            gap: 12px;
        }
        html[data-theme="dark"] #pLoading {
            background: #0f1b2d;
            color: #93a4b8;
        }
        #pLoading .spinner {
            width: 36px; height: 36px;
            border: 3px solid #d7e2ea;
            border-top-color: #1f314b;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        html[data-theme="dark"] #pLoading .spinner {
            border-color: #27405d;
            border-top-color: #7dd3fc;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── FORMATO 2 (independiente del Clásico, prefijo .p2-*) ── */
        .p2-page {
            width: 215.9mm;
            min-height: 279.4mm;
            background: #fff;
            box-shadow: 0 8px 32px rgba(0,0,0,.18);
            display: flex;
            flex-direction: column;
            font-family: 'Outfit', sans-serif;
            color: #1b1f24;
        }
        .p2-body {
            padding: 26px 34px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }
        .p2-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }
        .p2-logo img {
            object-fit: contain;
            display: block;
        }
        .p2-doc-meta {
            text-align: right;
            font-size: 12px;
        }
        .p2-doc-meta .p2-doc-label {
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #647384;
        }
        .p2-doc-meta .p2-doc-code {
            font-size: 27px;
            font-weight: 800;
            color: #1b1f24;
            line-height: 1.1;
            margin: 3px 0 5px;
        }
        .p2-doc-meta .p2-doc-date {
            font-size: 12px;
            color: #647384;
        }
        .p2-hr {
            border: none;
            border-top: 2px solid #1b1f24;
            margin-top: 6px;
        }
        .p2-section h3 {
            font-size: 12.5px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .p2-section p, .p2-section div.p2-value {
            font-size: 12.5px;
            margin: 0 0 6px;
        }
        .p2-intro p { font-size: 12.5px; line-height: 1.5; margin-bottom: 8px; }
        .p2-producto-detalle {
            background: #f3f6f9;
            border: 1px solid #e2e8ee;
            border-radius: 10px;
            padding: 12px 14px;
            margin-top: 8px;
            font-size: 12.5px;
            line-height: 1.5;
        }
        .p2-producto-detalle strong {
            color: #1b1f24;
            font-weight: 700;
        }
        .p2-field-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            font-size: 12.5px;
            row-gap: 3px;
        }
        .p2-field-row strong { font-weight: 700; }
        .p2-product-desc {
            font-size: 13px;
            color: #1b1f24;
            background: #f3f6f9;
            border: 1px solid #e2e8ee;
            border-radius: 10px;
            padding: 12px 14px;
            line-height: 1.55;
        }
        .p2-product-desc p { margin: 0; }
        .p2-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .p2-table th {
            border-bottom: 1px solid #1b1f24;
            padding: 6px 8px;
            text-align: center;
            font-weight: 700;
        }
        .p2-table td {
            padding: 6px 8px;
            text-align: center;
            border-bottom: 1px dotted #c7ccd1;
        }
        .p2-footer {
            padding-top: 20px;
            padding-bottom: 24px;
            margin-top: auto;
        }
        .p2-terms {
            margin-top: auto;
            margin-bottom: 20px;
        }
        .p2-terms h3 {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .p2-terms p {
            font-size: 11.5px;
            line-height: 1.55;
            white-space: pre-wrap;
            margin: 0;
        }
        .p2-sig-row {
            margin-top: auto;
            display: flex;
            justify-content: center;
        }
        .p2-signature { min-width: 220px; text-align: center; }
        .p2-sig-line {
            min-height: 50px;
            border-bottom: 1px solid #1b1f24;
            margin-bottom: 5px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 4px;
        }
        .p2-sig-line img {
            object-fit: contain;
        }
        .p2-signature strong { display: block; font-size: 12px; font-weight: 600; }
        .p2-signature span { display: block; font-size: 11px; color: #647384; }

        /* ── PRINT ──────────────────────────────────── */
        @page {
            size: Letter portrait;
            margin: 0;
        }
        @media print {
            html, body {
                background: #fff !important;
                margin: 0 !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            #pToolbar { display: none !important; }
            #pPageWrap {
                padding: 0 !important;
                background: #fff !important;
                display: block !important;
            }
            .p-page, .p2-page {
                width: 100% !important;
                /* Mantener altura carta para que margin-top:auto funcione */
                height: 279.4mm !important;
                min-height: 279.4mm !important;
                box-shadow: none !important;
                page-break-after: always;
                overflow: hidden;
            }
            .p-page:last-child, .p2-page:last-child { page-break-after: auto; }
            .p-tech-summary, .p-intro { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <!-- Loading overlay -->
    <div id="pLoading">
        <div class="spinner"></div>
        <span>Cargando proforma…</span>
    </div>

    <!-- Toolbar (screen only) -->
    <div id="pToolbar" hidden>
        <h1 id="pToolbarTitle">Proforma</h1>
        <div class="sep"></div>
        <button onclick="window.close()">&#x2715; Cerrar</button>
        <button class="primary" onclick="window.print()">&#x1F5A8; Imprimir / Guardar PDF</button>
    </div>

    <!-- Pages container -->
    <div id="pPageWrap"></div>

    <script>
    (function () {
        'use strict';

        function qs(sel) { return document.querySelector(sel); }
        function repairTextEncoding(value) {
            const text = String(value ?? '');
            if (!/[ÃÂâ�]/.test(text)) return text;
            try {
                const bytes = Uint8Array.from([...text].map((char) => char.charCodeAt(0) & 255));
                const decoded = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
                const badBefore = (text.match(/[ÃÂâ�]/g) || []).length;
                const badAfter = (decoded.match(/[ÃÂâ�]/g) || []).length;
                if (decoded && badAfter < badBefore) return decoded;
            } catch (error) {
                // Keep the original text when it is not a latin1/utf8 mojibake case.
            }
            return text
                .replace(/Ã¡/g, 'á').replace(/Ã©/g, 'é').replace(/Ã­/g, 'í').replace(/Ã³/g, 'ó').replace(/Ãº/g, 'ú')
                .replace(/Ã/g, 'Á').replace(/Ã‰/g, 'É').replace(/Ã/g, 'Í').replace(/Ã“/g, 'Ó').replace(/Ãš/g, 'Ú')
                .replace(/Ã±/g, 'ñ').replace(/Ã‘/g, 'Ñ').replace(/Â¿/g, '¿').replace(/Â¡/g, '¡').replace(/Âº/g, 'º')
                .replace(/Â/g, '');
        }

        function escHtml(v) {
            return repairTextEncoding(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function fmtDate(v) {
            const d = v ? new Date(v) : new Date();
            if (isNaN(d)) return '';
            return d.toLocaleDateString('es-CR', { year:'numeric', month:'2-digit', day:'2-digit' });
        }
        function fmtNum(v) {
            const n = Number(v);
            if (!isFinite(n)) return '';
            return n.toLocaleString('es-CR', { maximumFractionDigits: 0 });
        }
        function fmtCur(amount, currency) {
            const code = currency?.code || 'CRC';
            try {
                return new Intl.NumberFormat('es-CR', {
                    style: 'currency', currency: code, maximumFractionDigits: 2
                }).format(Number(amount || 0));
            } catch (_) {
                return `${currency?.symbol || code} ${Number(amount || 0).toFixed(2)}`;
            }
        }

        function getPriceCols(mode) {
            switch (mode) {
                case 'regular_simple':
                    return [{key:'subtotal',label:'Subtotal'},{key:'taxAmount',label:'Impuestos'},{key:'totalPrice',label:'Total'}];
                case 'regular_unit':
                    return [{key:'unitPrice',label:'Precio unitario'},{key:'subtotal',label:'Subtotal'},{key:'taxAmount',label:'Impuestos'},{key:'totalPrice',label:'Total'}];
                case 'regular_thousand':
                    return [{key:'subtotal',label:'Subtotal'},{key:'taxAmount',label:'Impuestos'},{key:'totalPrice',label:'Total'},{key:'thousandPrice',label:'Precio millar'}];
                case 'totalized_simple':
                    return [{key:'subtotal',label:'Subtotal'}];
                default:
                    return [{key:'unitPrice',label:'Precio unitario'},{key:'subtotal',label:'Subtotal'},{key:'taxAmount',label:'Impuestos'},{key:'totalPrice',label:'Total'}];
            }
        }

        function getLuma(hex) {
            const h = String(hex||'').replace('#','');
            if (h.length !== 6) return 0;
            const r = parseInt(h.slice(0,2),16);
            const g = parseInt(h.slice(2,4),16);
            const b = parseInt(h.slice(4,6),16);
            return r*0.299 + g*0.587 + b*0.114;
        }

        function normalizePreviewCurrencies(value) {
            const fallback = [
                { code: 'USD', label: 'Dólares', symbol: '$', exchangeRate: 1 },
                { code: 'CRC', label: 'Colones', symbol: '₡', exchangeRate: 1 }
            ];
            try {
                const source = typeof value === 'string' ? JSON.parse(value || '[]') : value;
                const rows = Array.isArray(source) ? source : [];
                const cleaned = rows.map((row) => ({
                    code: String(row?.code || '').trim().toUpperCase().slice(0, 10),
                    label: String(row?.label || '').trim().slice(0, 80),
                    symbol: String(row?.symbol || '').trim().slice(0, 10),
                    exchangeRate: Number(row?.exchangeRate || 0)
                })).filter((row) => row.code && row.label && Number.isFinite(row.exchangeRate) && row.exchangeRate > 0);
                return cleaned.length ? cleaned : fallback;
            } catch (error) {
                return fallback;
            }
        }

        function normalizePreviewPriceDisplayMode(value) {
            const normalized = String(value || '').trim();
            const aliases = {
                both: 'totalized_unit',
                unit: 'regular_unit',
                thousand: 'regular_thousand',
                product_totals: 'totalized_simple',
                global_totals: 'totalized_simple',
                totalized_unit: 'totalized_simple',
                totalized_thousand: 'totalized_simple'
            };
            const resolved = aliases[normalized] || normalized;
            return ['regular_simple', 'regular_unit', 'regular_thousand', 'totalized_simple'].includes(resolved) ? resolved : 'regular_unit';
        }

        function getPreviewFontConfig(general) {
            const selected = String(general.proformaCompanyFontFamily || 'Cormorant Garamond').trim();
            const customLabel = String(general.proformaCompanyFontLabel || 'ProformaCompanyCustom').trim() || 'ProformaCompanyCustom';
            const customUrl = String(general.proformaCompanyFontUrl || '').trim();
            if (selected === '__custom__' && customUrl) {
                return { family: customLabel, url: customUrl, source: '__custom__' };
            }
            return { family: selected === '__custom__' ? 'Cormorant Garamond' : selected, url: '', source: '' };
        }

        function buildPreviewPayload(general, formato) {
            const currencies = normalizePreviewCurrencies(general.proformaCurrenciesJson);
            const defaultCode = String(general.proformaDefaultCurrency || 'USD').trim().toUpperCase();
            const currency = currencies.find((row) => row.code === defaultCode) || currencies[0];
            const font = getPreviewFontConfig(general);
            return {
                format: formato === 'clasico' ? 'clasico' : 'formato2',
                quoteCode: 'PRO-0001',
                issueDate: new Date().toISOString(),
                validity: String(general.proformaDefaultValidity || '30 días').trim(),
                intro: String(general.proformaIntro || '').trim(),
                productoDetalle: String(general.proformaProductoDetalle || '').trim(),
                paymentTerms: String(general.proformaPaymentTerms || '').trim(),
                deliveryTime: String(general.proformaDeliveryTime || '').trim(),
                technicalSpecs: String(general.proformaTechnicalSpecs || '').trim(),
                qualityPolicies: String(general.proformaQualityPolicies || '').trim(),
                termsConditions: String(general.proformaTermsConditions || '').trim(),
                priceDisplayMode: normalizePreviewPriceDisplayMode(general.proformaPriceDisplayMode),
                sellerSignatureEnabled: String(general.proformaSellerSignatureEnabled ?? 'true') !== 'false',
                firmaAncho: Number(general.proformaFirmaAncho) || 160,
                firmaAlto: Number(general.proformaFirmaAlto) || 100,
                firmaOffsetX: general.proformaFirmaOffsetX == null ? 0 : Number(general.proformaFirmaOffsetX),
                firmaOffsetY: general.proformaFirmaOffsetY == null ? 35 : Number(general.proformaFirmaOffsetY),
                company: {
                    name: String(general.proformaCompanyName || 'Empresa').trim(),
                    slogan: String(general.proformaSlogan || '').trim(),
                    logoUrl: String(general.proformaLogoUrl || '').trim(),
                    logoWidth: Number(general.proformaLogoWidth) || 120,
                    logoHeight: Number(general.proformaLogoHeight) || 64,
                    showCompanyName: String(general.proformaShowCompanyName ?? 'true').toLowerCase() !== 'false',
                    headerColor: String(general.proformaHeaderColor || '#1f314b').trim(),
                    nameColor: String(general.proformaCompanyNameColor || '').trim(),
                    fontFamily: font.family,
                    fontUrl: font.url,
                    fontFamilySource: font.source
                },
                client: {
                    company: 'Cliente de ejemplo',
                    contactName: 'Departamento de Compras',
                    email: 'compras@cliente.com',
                    phone: '2222-2222'
                },
                seller: { name: 'Asesor Comercial', signatureUrl: String(general.proformaFirmaVendedorUrl || '').trim() },
                currency,
                totals: { subtotal: 5520, taxAmount: 717.6, grandTotal: 6237.6 },
                products: [
                    { name: 'Etiqueta Premium', dimensionsText: '10" x 15"', material: 'Papel couché', acabadosProforma: 'Barniz UV Brillante · Laminado Brillante · Estampado Foil Dorado', descriptionText: 'Papel couché · 10" x 15" · Laminado brillante · Barniz UV brillo · Numerado', quantity: 2500, unitPrice: 0.84, subtotal: 2100, taxAmount: 273, totalPrice: 2373, thousandPrice: 840 },
                    { name: 'Funda Termoencogible', dimensionsText: '8" x 22"', material: 'BOPP', acabadosProforma: 'Laminado Mate', descriptionText: 'BOPP · 8" x 22" · Laminado mate · Código QR', quantity: 18000, unitPrice: 0.19, subtotal: 3420, taxAmount: 444.6, totalPrice: 3864.6, thousandPrice: 190 }
                ]
            };
        }

        function renderProforma(data) {
            const wrap = document.getElementById('pPageWrap');
            wrap.innerHTML = data.format === 'formato2' ? buildPageFormat2(data) : buildPage(data);
            document.title = `Proforma ${data.quoteCode || ''}`;
            const loading = document.getElementById('pLoading');
            if (loading) loading.style.display = 'none';
        }

        function buildPage(data) {
            const company   = data.company   || {};
            const client    = data.client    || {};
            const seller    = data.seller    || {};
            const currency  = data.currency  || {};
            const totals    = data.totals    || {};
            const products  = data.products  || [];
            const mode      = data.priceDisplayMode || 'regular_unit';
            const cols      = getPriceCols(mode);
            const isTotalized = String(mode).startsWith('totalized_');
            const headerColor = String(company.headerColor || '#1f314b').trim();
            const isLight = getLuma(headerColor) > 160;
            const showSig = data.sellerSignatureEnabled !== false;
            const sigW = Math.max(40, Math.min(400, Number(data.firmaAncho || 160) || 160));
            const sigH = Math.max(20, Math.min(200, Number(data.firmaAlto || 100) || 100));
            const offX = Math.max(-100, Math.min(100, data.firmaOffsetX == null ? 0 : Number(data.firmaOffsetX)));
            const offY = Math.max(-60, Math.min(60, data.firmaOffsetY == null ? 35 : Number(data.firmaOffsetY)));

            // Logo sizing
            const logoW = Math.max(40, Number(company.logoWidth)  || 120);
            const logoH = Math.max(24, Number(company.logoHeight) || 64);
            const showCompanyName = String(company.showCompanyName ?? 'true').toLowerCase() !== 'false';

            // Company font
            const fontFamily = String(company.fontFamily || 'Cormorant Garamond').trim() || 'Cormorant Garamond';
            const fontUrl    = String(company.fontUrl || '').trim();
            const isCustom   = fontUrl && String(company.fontFamilySource||'').trim() === '__custom__';
            const dynFont = document.getElementById('pDynamicFont');
            if (dynFont) {
                dynFont.textContent = isCustom
                    ? `@font-face { font-family:"${fontFamily}"; src:url("${fontUrl}") format("woff2"); font-display:swap; }`
                    : '';
            }
            const nameColor = isLight
                ? (company.nameColor || '#1f314b')
                : (company.nameColor || '#ffffff');

            // Build product rows
            const rows = products.map(p => `
                <tr>
                    <td>
                        <span class="p-product-name">${escHtml(p.name || 'Producto')}</span>
                        <span class="p-product-desc">${escHtml(p.descriptionText || [p.material, p.machineSummary, p.processType, p.dimensionsText, p.finishesSummary].filter(Boolean).join(' · '))}</span>
                    </td>
                    <td>${escHtml(p.quantity == null ? '' : fmtNum(p.quantity))}</td>
                    ${cols.map(c => `<td>${escHtml(fmtCur(p[c.key], currency))}</td>`).join('')}
                </tr>`).join('');

            // Terms visibility
            const paymentTerms  = String(data.paymentTerms  || '').trim();
            const deliveryTime  = String(data.deliveryTime  || '').trim();
            const techSpecs     = String(data.technicalSpecs || '').trim();
            const qualityPol    = String(data.qualityPolicies || '').trim();
            const hasTerms = paymentTerms || deliveryTime || techSpecs || qualityPol;

            const intro = String(data.intro || '').trim();

            // Totals rows
            const totalsHtml = isTotalized ? `
                <table>
                    <tbody>
                        <tr><td>Subtotal</td><td>${escHtml(fmtCur(totals.subtotal||0, currency))}</td></tr>
                        <tr><td>Impuestos de Venta</td><td>${escHtml(fmtCur(totals.taxAmount||0, currency))}</td></tr>
                        <tr><td>Total General</td><td>${escHtml(fmtCur(totals.grandTotal||0, currency))}</td></tr>
                    </tbody>
                </table>` : '';

            return `
<div class="p-page">
    <!-- HEADER (slim) -->
    <header class="p-header${isLight ? ' is-light' : ''}" style="background:${escHtml(isLight ? 'linear-gradient(135deg,#f8fbfe 0%,#eaf2f9 100%)' : headerColor)}">
        <div class="p-brand">
            <div class="p-logo" style="width:${logoW}px;height:${logoH}px;${!showCompanyName?'width:auto;flex:1 1 auto;':''}">
                ${company.logoUrl
                    ? `<img src="${escHtml(company.logoUrl)}" alt="${escHtml(company.name||'Logo')}" style="width:${logoW}px;height:${logoH}px;">`
                    : `<span style="font-size:11px;opacity:.6">Logo</span>`}
            </div>
            ${showCompanyName ? `
            <div class="p-brand-copy">
                <span class="p-company-name" style="font-family:'${escHtml(fontFamily)}',serif;color:${escHtml(nameColor)}">${escHtml(company.name||'Empresa')}</span>
                ${company.slogan ? `<span class="p-slogan">${escHtml(company.slogan)}</span>` : ''}
            </div>` : ''}
        </div>
        <div class="p-doc-title">
            <h2>Proforma</h2>
            <p>${escHtml('Cotización ' + (data.quoteCode||''))}</p>
        </div>
    </header>

    <!-- BODY -->
    <div class="p-body">

        <!-- Meta row: client card + doc-info card -->
        <div class="p-meta-row">
            <div class="p-client-card">
                <h3>Cliente</h3>
                <span class="p-client-name">${escHtml(client.company||'Cliente')}</span>
                ${client.contactName ? `<span class="p-client-meta">Contacto: ${escHtml(client.contactName)}</span>` : ''}
                ${client.email       ? `<span class="p-client-meta">Correo: ${escHtml(client.email)}</span>`       : ''}
                ${client.phone       ? `<span class="p-client-meta">Teléfono: ${escHtml(client.phone)}</span>`     : ''}
            </div>
            <div class="p-doc-info-card">
                <h3>Datos del documento</h3>
                <span class="p-doc-info-item"><strong>Emisión:</strong> ${escHtml(fmtDate(data.issueDate))}</span>
                ${data.validity ? `<span class="p-doc-info-item"><strong>Validez:</strong> ${escHtml(data.validity)}</span>` : ''}
            </div>
        </div>

        <!-- Intro -->
        ${intro ? `<div class="p-intro">${escHtml(intro)}</div>` : ''}

        <!-- Products table -->
        <table class="p-table">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th style="width:80px">Cantidad</th>
                    ${cols.map(c => `<th style="width:${['subtotal','taxAmount','totalPrice'].includes(c.key)?'88px':'100px'}">${escHtml(c.label)}</th>`).join('')}
                </tr>
            </thead>
            <tbody>${rows || `<tr><td colspan="${2+cols.length}" style="text-align:center;color:#999;padding:16px">Sin productos</td></tr>`}</tbody>
        </table>

        <!-- Totals (totalized mode only) -->
        ${isTotalized ? `<div class="p-totals">${totalsHtml}</div>` : ''}

        <!-- Document footer: terms + signature — pinned to bottom -->
        <div class="p-doc-footer">
            ${hasTerms ? `
            <div class="p-terms-grid">
                ${paymentTerms ? `<div class="p-term"><h3>Términos de pago</h3><p>${escHtml(paymentTerms)}</p></div>` : ''}
                ${deliveryTime ? `<div class="p-term"><h3>Tiempos estimados de entrega</h3><p>${escHtml(deliveryTime)}</p></div>` : ''}
                ${techSpecs   ? `<div class="p-term"><h3>Especificaciones técnicas</h3><p>${escHtml(techSpecs)}</p></div>`   : ''}
                ${qualityPol  ? `<div class="p-term"><h3>Políticas de calidad</h3><p>${escHtml(qualityPol)}</p></div>`       : ''}
            </div>` : ''}
            ${showSig ? `
            <div class="p-sig-row">
                <div class="p-signature">
                    <div class="p-sig-line" style="min-height:${sigH + 2}px">
                        ${seller.signatureUrl ? `<img src="${escHtml(seller.signatureUrl)}" alt="Firma" style="width:${sigW}px;height:${sigH}px;object-fit:contain;transform:translate(${offX}px,${offY}px)">` : ''}
                    </div>
                    <strong>${escHtml(seller.name||'')}</strong>
                    <span>Ejecutivo de Ventas</span>
                </div>
            </div>` : ''}
        </div>

    </div><!-- /p-body -->
</div><!-- /p-page -->`;
        }

        function buildPageFormat2(data) {
            const company  = data.company  || {};
            const client   = data.client   || {};
            const seller   = data.seller   || {};
            const currency = data.currency || {};
            const products = data.products || [];
            const showSig  = data.sellerSignatureEnabled !== false;
            const sigW = Math.max(40, Math.min(400, Number(data.firmaAncho || 160) || 160));
            const sigH = Math.max(20, Math.min(200, Number(data.firmaAlto || 100) || 100));
            const offX = Math.max(-100, Math.min(100, data.firmaOffsetX == null ? 0 : Number(data.firmaOffsetX)));
            const offY = Math.max(-60, Math.min(60, data.firmaOffsetY == null ? 35 : Number(data.firmaOffsetY)));
            const intro    = String(data.intro || '').trim();
            const terminos = String(data.termsConditions || '').trim();
            const logoW    = Math.max(40, Number(company.logoWidth)  || 120);
            const logoH    = Math.max(24, Number(company.logoHeight) || 64);

            const rows = products.map(p => {
                const quantity = Number(p.quantity || 0);
                const thousands = quantity / 1000;
                const priceNoTax = Number(p.thousandPrice ?? (thousands ? (p.subtotal || 0) / thousands : 0));
                const priceWithTax = thousands ? Number(p.totalPrice || 0) / thousands : 0;
                return `
                <tr>
                    <td>${escHtml(fmtNum(quantity))}</td>
                    <td>${escHtml(fmtNum(thousands))}</td>
                    <td>${escHtml(fmtCur(priceNoTax, currency))}</td>
                    <td>${escHtml(fmtCur(priceWithTax, currency))}</td>
                    <td>${escHtml(fmtCur(p.totalPrice, currency))}</td>
                </tr>`;
            }).join('');

            const detalleManual = String(data.productoDetalle || '').trim();
            const productDesc = detalleManual
                ? escHtml(detalleManual).replace(/\n/g, '<br>')
                : products.map(p =>
                    escHtml([p.name, p.dimensionsText, p.material, p.acabadosProforma].filter(Boolean).join(' · '))
                ).filter(Boolean).join('<br>');

            return `
<div class="p2-page">
    <div class="p2-body">
        <div class="p2-header">
            <div class="p2-logo">
                ${company.logoUrl
                    ? `<img src="${escHtml(company.logoUrl)}" alt="${escHtml(company.name||'Logo')}" style="width:${logoW}px;height:${logoH}px">`
                    : `<span style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600">${escHtml(company.name||'Empresa')}</span>`}
            </div>
            <div class="p2-doc-meta">
                <div class="p2-doc-label">Cotización</div>
                <div class="p2-doc-code">${escHtml(data.quoteCode||'')}</div>
                <div class="p2-doc-date">Fecha: ${escHtml(fmtDate(data.issueDate))}</div>
            </div>
        </div>
        <hr class="p2-hr">

        <div class="p2-section">
            <div class="p2-field-row">
                <strong>Cliente:</strong><span>${escHtml(client.company||'')}</span>
                <strong>Atención:</strong><span>${escHtml(client.contactName||'')}</span>
            </div>
        </div>

        ${intro ? `<div class="p2-intro"><p>${escHtml(intro)}</p></div>` : ''}

        ${productDesc ? `<div class="p2-section p2-product-desc">
            <h3>Detalle del Producto</h3>
            <p>${productDesc}</p>
        </div>` : ''}

        <table class="p2-table">
            <thead>
                <tr>
                    <th>Cantidad</th>
                    <th>Millares</th>
                    <th>Precio por millar sin IVA</th>
                    <th>Precio por millar con IVA</th>
                    <th>Precio total con IVA</th>
                </tr>
            </thead>
            <tbody>${rows || `<tr><td colspan="5" style="text-align:center;color:#999;padding:16px">Sin productos</td></tr>`}</tbody>
        </table>

        <div class="p2-footer">
            ${terminos ? `
            <div class="p2-terms">
                <h3>Términos y condiciones:</h3>
                <p>${escHtml(terminos)}</p>
            </div>` : ''}

            ${showSig ? `
            <div class="p2-sig-row">
                <div class="p2-signature">
                    <div class="p2-sig-line" style="min-height:${sigH + 8}px">
                        ${seller.signatureUrl ? `<img src="${escHtml(seller.signatureUrl)}" alt="Firma" style="width:${sigW}px;height:${sigH}px;object-fit:contain;transform:translate(${offX}px,${offY}px)">` : ''}
                    </div>
                    <strong>${escHtml(seller.name||'')}</strong>
                    <span>Ejecutivo de Ventas</span>
                </div>
            </div>` : ''}
        </div><!-- /p2-footer -->
    </div><!-- /p2-body -->
</div><!-- /p2-page -->`;
        }

        let previewRenderedViaMessage = false;

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const code   = params.get('codigo') || '';
            const previewMode = params.get('preview') === '1';
            if (!code && !previewMode) {
                document.getElementById('pLoading').innerHTML = '<p style="color:#c0392b">No se indicó ninguna cotización.</p>';
                return;
            }
            // Toolbar: hide when embedded in iframe
            const isEmbed = params.get('embed') === '1';
            // Adjust page wrap padding when embedded
            if (isEmbed) {
                document.getElementById('pPageWrap').style.padding = '20px 16px 24px';
            }
            try {
                let data;
                if (previewMode) {
                    if (previewRenderedViaMessage) return;
                    const configRes = await fetch('/api/config/general');
                    const config = await configRes.json().catch(() => ({}));
                    if (previewRenderedViaMessage) return;
                    data = buildPreviewPayload(config.general || {}, params.get('formato') || '');
                } else {
                    const res  = await fetch(`/api/proformas/${encodeURIComponent(code)}`);
                    data = await res.json().catch(() => ({}));
                    if (!res.ok) throw new Error(data?.error || 'Error al cargar la proforma.');
                }

                renderProforma(data);

                // Auto-print if ?print=1
                if (params.get('print') === '1') {
                    setTimeout(() => window.print(), 600);
                }
            } catch (err) {
                const loading = document.getElementById('pLoading');
                if (loading) loading.innerHTML = `<p style="color:#c0392b;font-family:sans-serif;padding:24px">Error: ${escHtml(err.message)}</p>`;
            }
        }

        window.addEventListener('message', function (event) {
            if (event.origin !== window.location.origin) return;
            const message = event.data;
            if (!message || message.type !== 'proforma-preview-config') return;
            previewRenderedViaMessage = true;
            try {
                renderProforma(message.data
                    ? message.data
                    : buildPreviewPayload((message.config || {}).general || {}, message.formato || ''));
            } catch (error) {
                // Ignorar mensajes de vista previa malformados.
            }
        });

        init();
    })();
    </script>
</body>
</html>
