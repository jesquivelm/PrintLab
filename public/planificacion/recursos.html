<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><script src="/theme.js"></script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recursos y Competencias</title>
<style>
:root{--font-sans:"Segoe UI",system-ui,sans-serif;--color-text-primary:#1f2b3d;--color-text-secondary:#66758b;--color-background-primary:#f4f7fb;--color-background-secondary:#fff;--color-background-tertiary:#edf2f7;--color-border-secondary:#d8e4ef;--color-border-tertiary:#e4ebf3}
html[data-theme="dark"]{--color-text-primary:#e5eefb;--color-text-secondary:#9fb0c8;--color-background-primary:#0f172a;--color-background-secondary:#162033;--color-background-tertiary:#1e293b;--color-border-secondary:#334155;--color-border-tertiary:#26364f}
*{box-sizing:border-box}body{margin:0;font:13px var(--font-sans);color:var(--color-text-primary);background:var(--color-background-primary)}.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--color-border-tertiary)}h1{font-size:16px;margin:0}.sub,.muted{color:var(--color-text-secondary)}.sub{font-size:12px;margin-top:3px}.actions,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,input,select{border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);border-radius:6px;padding:7px 10px;font:inherit}.btn{cursor:pointer;text-decoration:none}.btn.primary{background:#1d9e75;color:#fff;border-color:#0f6e56}.page{padding:16px}.toolbar{display:flex;justify-content:space-between;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:10px}.card{border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);border-radius:8px;padding:13px}.head{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}.name{font-weight:600}.type{font-size:10px;text-transform:uppercase;color:var(--color-text-secondary)}.skill{display:inline-block;background:var(--color-background-tertiary);padding:4px 7px;border-radius:5px;margin:3px 3px 0 0}.dialog{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}.dialog.open{display:flex}.modal{width:min(560px,calc(100% - 28px));background:var(--color-background-primary);border:1px solid var(--color-border-secondary);border-radius:8px;padding:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field label{font-size:11px;color:var(--color-text-secondary)}.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:10px 0}.skill-check{display:flex;gap:7px;align-items:center;padding:7px;border:1px solid var(--color-border-tertiary);border-radius:6px}@media(max-width:900px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}
.theme-toggle{width:32px;height:30px;border:1px solid var(--color-border-secondary);border-radius:6px;background:var(--color-background-secondary);color:var(--color-text-primary);cursor:pointer}.theme-toggle-icon-sun::before{content:"☀"}.theme-toggle-icon-moon::before{content:"☾"}.theme-toggle-icon-moon{display:none}html[data-theme="dark"] .theme-toggle-icon-sun{display:none}html[data-theme="dark"] .theme-toggle-icon-moon{display:inline}
</style></head>
<body>
<header class="bar"><div><h1>Recursos y Competencias</h1><div class="sub">Máquinas, personas, equipos y procesos bajo una sola lógica de capacidad</div></div><div class="actions"><span data-theme-toggle-slot></span><a class="btn" href="/planificacion/configuracion">Calendarios</a><a class="btn" href="/planificacion/capacidad">Capacidad</a></div></header>
<main class="page"><div class="toolbar"><input id="search" placeholder="Buscar recurso" oninput="render()"><button class="btn primary" onclick="openEditor()">Nuevo Recurso</button></div><div id="grid" class="grid"></div></main>
<div id="dialog" class="dialog"><div class="modal"><div class="head"><div class="name" id="modal-title">Nuevo Recurso</div><button class="btn" onclick="closeEditor()">Cerrar</button></div><input id="id" type="hidden"><div class="fields"><div class="field"><label>Nombre</label><input id="resource-name"></div><div class="field"><label>Tipo</label><select id="resource-type"><option value="machine">Máquina</option><option value="operator">Persona</option><option value="team">Equipo</option><option value="process">Proceso</option></select></div><div class="field"><label>Proceso Principal</label><select id="process"></select></div><div class="field"><label>Calendario</label><select id="calendar"><option value="">Calendario por defecto</option></select></div><div class="field"><label>Unidades de Capacidad</label><input id="capacity" type="number" min=".1" step=".1" value="1"></div><div class="field"><label>Eficiencia</label><input id="efficiency" type="number" min=".1" max="1.5" step=".05" value="1"></div></div><div class="muted" style="margin-top:12px">Competencias Compartidas</div><div id="skills" class="skills"></div><div class="actions" style="justify-content:flex-end"><button class="btn" onclick="closeEditor()">Cancelar</button><button id="save" class="btn primary" onclick="save()">Guardar Recurso</button></div></div></div>
<script>
const API='/api/planificacion';let resources=[],processes=[],calendars=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const [r,p,c]=await Promise.all(['recursos','procesos','calendarios'].map(x=>fetch(`${API}/${x}`).then(y=>y.json())));resources=r.data||[];processes=p.data||[];calendars=c.data||[];$('process').innerHTML=processes.map(x=>`<option value="${esc(x.process_key)}">${esc(x.nombre)}</option>`).join('');$('calendar').innerHTML='<option value="">Calendario por defecto</option>'+calendars.map(x=>`<option value="${x.id}">${esc(x.calendar_name)}</option>`).join('');$('skills').innerHTML=processes.map(x=>`<label class="skill-check"><input type="checkbox" value="${esc(x.process_key)}">${esc(x.nombre)}</label>`).join('');render()}
function render(){const q=$('search').value.toLowerCase();const rows=resources.filter(x=>`${x.resource_name} ${x.process_key}`.toLowerCase().includes(q));$('grid').innerHTML=rows.map(x=>`<article class="card"><div class="head"><div><div class="name">${esc(x.resource_name)}</div><div class="type">${esc(x.resource_type)} · ${esc(x.process_key)}</div></div><button class="btn" onclick="openEditor('${x.id}')">Editar</button></div><div class="muted">Calendario: ${esc(x.calendar_name||'Por defecto')} · ${x.capacity_units} unidad(es) · ${Math.round(Number(x.efficiency_factor||1)*100)}%</div><div>${(x.skills||[]).map(s=>`<span class="skill">${esc(s.processKey)}</span>`).join('')||'<span class="muted">Sin competencias adicionales</span>'}</div></article>`).join('')||'<div class="muted">No hay recursos.</div>'}
function openEditor(id=''){const r=resources.find(x=>x.id===id);$('id').value=id;$('modal-title').textContent=r?'Editar Recurso':'Nuevo Recurso';$('resource-name').value=r?.resource_name||'';$('resource-type').value=r?.resource_type||'operator';$('process').value=r?.process_key||processes[0]?.process_key||'';$('calendar').value=r?.calendar_id||'';$('capacity').value=r?.capacity_units||1;$('efficiency').value=r?.efficiency_factor||1;const keys=new Set((r?.skills||[]).map(s=>s.processKey));document.querySelectorAll('#skills input').forEach(x=>x.checked=keys.has(x.value));$('dialog').classList.add('open')}
function closeEditor(){$('dialog').classList.remove('open')}
async function save(){const id=$('id').value,body={resourceName:$('resource-name').value.trim(),resourceType:$('resource-type').value,processKey:$('process').value,calendarId:$('calendar').value||null,capacityUnits:Number($('capacity').value),efficiencyFactor:Number($('efficiency').value)};if(!body.resourceName)return alert('El nombre es requerido.');$('save').disabled=true;$('save').textContent='Guardando...';try{const res=await fetch(id?`${API}/recursos/${id}`:`${API}/recursos`,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json();if(!data.ok)throw Error(data.error);const rid=id||data.data.id;const skills=[...document.querySelectorAll('#skills input:checked')].map(x=>({processKey:x.value,proficiency:1,maxParallelJobs:1}));const sr=await fetch(`${API}/recursos/${rid}/competencias`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({skills})});const sd=await sr.json();if(!sd.ok)throw Error(sd.error);closeEditor();await load()}catch(e){alert(e.message)}finally{$('save').disabled=false;$('save').textContent='Guardar Recurso'}}load().catch(e=>$('grid').textContent=e.message);
</script></body></html>
