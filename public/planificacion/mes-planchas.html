<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Planchas</title>
<style>
:root{
  --bg:#f3f7fb;
  --surface:#ffffff;
  --border:#d8e4ef;
  --text:#1f2b3d;
  --muted:#66758b;
  --success:#1d9e75;
  --warning:#ba7517;
  --danger:#e24b4a;
  --violet:#534ab7;
  --shadow:0 22px 44px rgba(31,55,88,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",Tahoma,sans-serif;
  font-size:14px;color:var(--text);
  background:linear-gradient(180deg,#edf5fb 0%,#f7f9fc 220px,#f3f7fb 220px);
}
.device{
  max-width:520px;margin:18px auto;background:var(--surface);border-radius:28px;
  border:1px solid var(--border);overflow:hidden;min-height:640px;box-shadow:var(--shadow)
}
.top-bar{
  background:linear-gradient(135deg,#0b81b8,#17abdf);padding:16px 18px;display:flex;
  align-items:center;justify-content:space-between
}
.top-bar-title{font-size:15px;font-weight:700;color:#fff}
.top-bar-op{font-size:12px;color:rgba(255,255,255,.86)}
.state-bar{display:flex;padding:12px 14px;gap:6px;border-bottom:1px solid var(--border);overflow-x:auto;background:#f9fbfe}
.state-step{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:52px}
.state-dot{
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;border:2px solid transparent
}
.state-dot.done{background:#1D9E75;color:#fff;border-color:#0F6E56}
.state-dot.active{background:var(--violet);color:#fff;border-color:#3C3489}
.state-dot.locked{background:#edf3f9;color:#7a8aa4;border-color:#d6e1ec}
.state-dot.warn{background:#BA7517;color:#fff;border-color:#854F0B}
.state-dot.critical{background:#E24B4A;color:#fff;border-color:#A32D2D}
.state-name{font-size:10px;color:#70809a;text-align:center;line-height:1.2}
.state-name.active{color:var(--text);font-weight:600}
.screen{padding:18px}
.section-title{
  font-size:12px;font-weight:700;color:#66758b;letter-spacing:.06em;margin-bottom:10px
}
.op-card,.timer-box,.paro-modal,.plancha-card{
  background:linear-gradient(180deg,#ffffff 0%,#f8fbfe 100%);
  border:1px solid var(--border);border-radius:20px;padding:14px;margin-bottom:14px
}
.op-row{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:13px}
.op-key{color:var(--muted)}
.op-val{font-weight:600;text-align:right}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:700}
.badge.run{background:#E1F5EE;color:#0F6E56}
.badge.setup{background:#FAEEDA;color:#854F0B}
.badge.paro{background:#FCEBEB;color:#A32D2D}
.badge.pend{background:#E6F1FB;color:#185FA5}
.badge.comp{background:#EAF3DE;color:#3B6D11}
.badge.pre{background:#EEEDFE;color:#3C3489}
.kit-item{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);
  border-radius:16px;margin-bottom:8px;background:var(--surface)
}
.kit-check{
  width:22px;height:22px;border-radius:6px;border:1.5px solid #bfd0e1;display:flex;
  align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:13px;transition:all .15s
}
.kit-check.checked{background:#1D9E75;border-color:#0F6E56;color:#fff}
.kit-label{flex:1;font-size:13px;font-weight:600}
.kit-sub{font-size:11px;color:var(--muted)}
.kit-id{font-size:11px;color:#0b81b8;font-weight:600}
.btn-main{
  width:100%;padding:13px;border-radius:16px;font-size:14px;font-weight:700;border:none;
  cursor:pointer;margin-top:8px;transition:all .15s
}
.btn-main:active{transform:scale(0.98)}
.btn-main.go{background:#1D9E75;color:#fff}
.btn-main.go:disabled{background:#e9eef4;color:#8291a8;cursor:not-allowed}
.btn-main.paro{background:#E24B4A;color:#fff}
.btn-main.completar{background:#378ADD;color:#fff}
.btn-main.outline{background:transparent;border:1px solid #cbd8e6;color:var(--text)}
.btn-main.purple{background:var(--violet);color:#fff}
.timer-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.timer-val{font-size:32px;font-weight:700;letter-spacing:.05em;font-variant-numeric:tabular-nums}
.timer-val.running{color:#1D9E75}
.timer-val.setup{color:#BA7517}
.timer-val.paro{color:#E24B4A}
.timer-val.pre{color:var(--violet)}
.field-group{margin-bottom:12px}
.field-label{font-size:12px;color:var(--muted);margin-bottom:4px}
input[type=number],input[type=text],select,textarea{
  width:100%;padding:10px 12px;border:1px solid #cbd8e6;border-radius:14px;
  font-size:13px;background:var(--surface);color:var(--text);font-family:inherit
}
textarea{min-height:84px;resize:vertical}
.paro-title{font-size:13px;font-weight:700;color:#b02e2e;margin-bottom:10px}
.merma-total{
  background:#f6fbf8;border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;
  font-size:13px;margin-bottom:8px;border:1px solid #d7eee4
}
.alert-box{
  border-radius:14px;padding:10px 12px;font-size:12px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start
}
.alert-box.danger{background:#fdeeee;color:#a32d2d;border:1px solid #f2d0d0}
.alert-box.warning{background:#fbf5e7;color:#8b5c15;border:1px solid #f0e1bc}
.alert-box.info{background:#eff2ff;color:#3c3489;border:1px solid #ddd8fb}
.success-box{background:#edf9f2;border-radius:14px;padding:10px 12px;font-size:12px;color:#12704f;margin-bottom:12px;border:1px solid #d4ebde}
.plancha-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.plancha-id{font-weight:700;font-size:14px}
.radio-row{display:flex;gap:10px;margin-bottom:10px}
.radio-opt{flex:1;padding:10px;border:1px solid #cbd8e6;border-radius:14px;text-align:center;font-size:12px;cursor:pointer;transition:all .15s}
.radio-opt.selected{border-color:var(--violet);background:#eeedfe;color:#3c3489;font-weight:700}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.loading{padding:36px 16px;text-align:center;color:var(--muted)}
</style>
<link rel="stylesheet" href="/theme-extensions.css">
</head>
<body>
<div class="device">
  <div class="top-bar">
    <div>
      <div class="top-bar-title">Control de Planchas</div>
      <div class="top-bar-op" id="top-op-info">Cargando orden...</div>
    </div>
    <div id="top-badge"><span class="badge pend">PENDIENTE</span></div>
  </div>
  <div class="state-bar" id="state-bar"></div>
  <div class="screen" id="screen"><div class="loading">Cargando control de planchas...</div></div>
</div>

<script>
const API = '/api/mes';
const STATES = ['PENDIENTE','KITTING','PREPRENSA','SETUP','RUN','PARO','COMPLETADO'];
const STATE_LABELS = ['Pendiente','Revision','Preprensa','Setup','Produccion','Paro','Completado'];
const STATE_ICONS = ['O','R','PRE','S','P','!','OK'];
let contextData = null;
let stopReasons = [];
let state = 0;
let kit = [false, false, false];
let timerSecs = 0;
let timerInterval = null;
let planchaNueva = false;

function queryValue(name) { return new URLSearchParams(window.location.search).get(name) || ''; }
function fmtTime(s){ const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60; return (h>0?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function startTimer(startSeconds = 0){ timerSecs = startSeconds; if(timerInterval)clearInterval(timerInterval); timerInterval=setInterval(()=>{timerSecs++;const el=document.getElementById('timer-display');if(el)el.textContent=fmtTime(timerSecs);},1000); }
function stopTimer(){ if(timerInterval){clearInterval(timerInterval);timerInterval=null;} }

function statusToStep(status) {
  switch(String(status || '').toUpperCase()) {
    case 'SETUP': return 3;
    case 'RUN': return 4;
    case 'PARO': return 5;
    case 'COMPLETADO': return 6;
    default: return 0;
  }
}

function renderStateBar(){
  document.getElementById('state-bar').innerHTML = STATES.map((s,i)=>{
    let cls = i<state?'done':i===state?'active':'locked';
    if (i === 2 && state === 2) cls = 'warn';
    if (i === 5 && state === 5) cls = 'critical';
    return `<div class="state-step"><div class="state-dot ${cls}">${STATE_ICONS[i]}</div><div class="state-name ${i===state?'active':''}">${STATE_LABELS[i]}</div></div>`;
  }).join('');
}

function renderBadge(){
  const map={
    0:'<span class="badge pend">PENDIENTE</span>',
    1:'<span class="badge pend">REVISION</span>',
    2:'<span class="badge pre">PREPRENSA</span>',
    3:'<span class="badge setup">SETUP</span>',
    4:'<span class="badge run">RUN</span>',
    5:'<span class="badge paro">PARO</span>',
    6:'<span class="badge comp">COMPLETADO</span>'
  };
  document.getElementById('top-badge').innerHTML = map[state] || map[0];
}

function renderContextHead() { document.getElementById('top-op-info').textContent = `${contextData.orderCode} | ${contextData.customerName || 'Sin cliente'}`; }
function plateId() { return contextData.dieCode || contextData.lineCode || contextData.orderCode; }

function opInfo(){
  return `<div class="op-card">
    <div class="op-row"><span class="op-key">Orden</span><span class="op-val">${contextData.orderCode}</span></div>
    <div class="op-row"><span class="op-key">Producto</span><span class="op-val">${contextData.productName || 'Sin nombre'}</span></div>
    <div class="op-row"><span class="op-key">Cliente</span><span class="op-val">${contextData.customerName || 'Sin cliente'}</span></div>
    <div class="op-row"><span class="op-key">Proceso</span><span class="op-val">${contextData.processName || 'Preprensa'}</span></div>
    <div class="op-row"><span class="op-key">Pies planificados</span><span class="op-val">${Number(contextData.plannedFeet || 0).toLocaleString('es-CR')} pies</span></div>
    <div class="op-row"><span class="op-key">Maquina</span><span class="op-val">${contextData.machineName || 'Sin maquina'}</span></div>
  </div>`;
}

function inferTimerFromContext() {
  if (!contextData) return 0;
  const startAt = state === 3 ? contextData.timestamps?.setupAt : state === 4 ? contextData.timestamps?.runAt : null;
  if (!startAt) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(startAt).getTime()) / 1000));
}

async function postEvent(eventType, extra = {}) {
  const res = await fetch(`${API}/evento`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify({ routeId: contextData.routeId, operatorName: 'Preprensa', eventType, ...extra })
  });
  const payload = await res.json();
  if (!res.ok || !payload.ok) throw new Error(payload.error || 'No se pudo guardar el evento del control.');
}

async function postWaste(body) {
  const res = await fetch(`${API}/mermas`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify({ routeId: contextData.routeId, ...body })
  });
  const payload = await res.json();
  if (!res.ok || !payload.ok) throw new Error(payload.error || 'No se pudo guardar la merma.');
}

function renderScreen(){
  const scr = document.getElementById('screen');
  if(state===0){
    scr.innerHTML = `
      ${opInfo()}
      <div class="plancha-card">
        <div class="plancha-header"><span class="plancha-id">Recurso: ${plateId()}</span><span class="badge pre">Preprensa</span></div>
        <div class="op-row"><span class="op-key">Codigo troquel o plancha</span><span class="op-val">${contextData.dieCode || 'Pendiente'}</span></div>
        <div class="op-row"><span class="op-key">Material</span><span class="op-val">${contextData.materialCode || 'Pendiente'}</span></div>
      </div>
      <div class="alert-box danger">Verifica disponibilidad del recurso, sustrato y configuracion de tintas antes de arrancar.</div>
      <button class="btn-main go" onclick="goState(1)">Iniciar revision</button>
    `;
  } else if(state===1){
    const items = [
      {label:'Plancha o troquel', sub:'Confirmar recurso fisico del trabajo', id:plateId(), idx:0},
      {label:'Lote de sustrato', sub:'Confirmar lote liberado para produccion', id:contextData.materialCode || 'Pendiente', idx:1},
      {label:'Configuracion de tintas', sub:'Confirmar colores y secuencia del trabajo', id:`${contextData.tintCount || 0} colores`, idx:2},
    ];
    const allChecked = kit.every(Boolean);
    scr.innerHTML = `
      <div class="section-title">Revision inicial</div>
      ${items.map(it=>`
        <div class="kit-item">
          <div class="kit-check ${kit[it.idx]?'checked':''}" onclick="toggleKit(${it.idx})">${kit[it.idx]?'OK':''}</div>
          <div style="flex:1">
            <div class="kit-label">${it.label}</div>
            <div class="kit-sub">${it.sub}</div>
            <div class="kit-id">${it.id}</div>
          </div>
        </div>
      `).join('')}
      ${allChecked?`<div class="success-box">Recursos listos para continuar.</div>`:''}
      <button class="btn-main purple" ${allChecked?'':'disabled'} onclick="goState(2)">Ir a preprensa</button>
    `;
  } else if(state===2){
    scr.innerHTML = `
      <div class="section-title">Preprensa y definicion de plancha</div>
      ${opInfo()}
      <div class="section-title">La plancha es nueva y requiere grabado?</div>
      <div class="radio-row">
        <div class="radio-opt ${!planchaNueva?'selected':''}" onclick="setPlanchaNueva(false)">No | plancha existente</div>
        <div class="radio-opt ${planchaNueva?'selected':''}" onclick="setPlanchaNueva(true)">Si | plancha nueva</div>
      </div>
      ${planchaNueva ? `
        <div class="alert-box info">Se registra el paso de grabado antes de liberar setup.</div>
        <div class="field-group"><div class="field-label">Hora de ingreso a grabado</div><input type="text" id="f-grabado" placeholder="ej. 2026-04-05 08:00"></div>
        <div class="field-group"><div class="field-label">Comentario tecnico</div><textarea id="f-grabado-notes" placeholder="Notas del grabado o preparacion tecnica"></textarea></div>
        <button class="btn-main purple" onclick="confirmarGrabado()">Confirmar grabado</button>
      ` : `
        <div class="alert-box info">Plancha existente. Puedes pasar directo a preparacion.</div>
        <button class="btn-main go" onclick="goState(3)">Avanzar a preparacion</button>
      `}
    `;
  } else if(state===3){
    scr.innerHTML = `
      <div class="section-title">Setup en curso</div>
      <div class="timer-box"><div class="timer-label">Tiempo de setup</div><div class="timer-val setup" id="timer-display">${fmtTime(timerSecs)}</div></div>
      <div class="op-card">
        <div class="op-row"><span class="op-key">Plancha montada</span><span class="op-val">${plateId()}</span></div>
        <div class="op-row"><span class="op-key">Sustrato</span><span class="op-val">${contextData.materialCode || 'Pendiente'}</span></div>
        <div class="op-row"><span class="op-key">Maquina</span><span class="op-val">${contextData.machineName || 'Sin maquina'}</span></div>
      </div>
      <button class="btn-main go" onclick="goState(4)">Iniciar produccion</button>
      <button class="btn-main paro" onclick="goState(5)">Reportar paro</button>
    `;
    startTimer(inferTimerFromContext());
  } else if(state===4){
    scr.innerHTML = `
      <div class="section-title">Produccion en ejecucion</div>
      <div class="timer-box"><div class="timer-label">Tiempo de tiraje</div><div class="timer-val running" id="timer-display">${fmtTime(timerSecs)}</div></div>
      <div class="op-card">
        <div class="op-row"><span class="op-key">Pies a producir</span><span class="op-val">${Number(contextData.plannedFeet || 0).toLocaleString('es-CR')}</span></div>
        <div class="op-row"><span class="op-key">Maquina</span><span class="op-val">${contextData.machineName || 'Sin maquina'}</span></div>
        <div class="op-row"><span class="op-key">Plancha</span><span class="op-val">${plateId()}</span></div>
      </div>
      <button class="btn-main paro" onclick="goState(5)">Reportar paro</button>
      <button class="btn-main completar" onclick="goState(6)">Finalizar orden</button>
    `;
    startTimer(inferTimerFromContext());
  } else if(state===5){
    scr.innerHTML = `
      <div class="section-title">Registro de paro</div>
      <div class="paro-modal">
        <div class="paro-title">Selecciona el motivo del paro</div>
        <select id="sel-paro">
          <option value="">Seleccionar</option>
          ${stopReasons.map(reason => `<option value="${reason.id}">${reason.reason_group} | ${reason.description}</option>`).join('')}
        </select>
        <div class="timer-box" style="margin-top:12px;margin-bottom:0">
          <div class="timer-label">Tiempo de paro</div>
          <div class="timer-val paro" id="timer-display">${fmtTime(timerSecs)}</div>
        </div>
      </div>
      <button class="btn-main go" onclick="reanudar()">Reanudar produccion</button>
    `;
    startTimer(0);
  } else if(state===6){
    stopTimer();
    const defaultConsumed = Number(contextData.latestWaste?.feet_consumed || contextData.plannedFeet || 0);
    const defaultSetup = Number(contextData.latestWaste?.setup_waste_feet || 0);
    const defaultRun = Number(contextData.latestWaste?.run_waste_feet || 0);
    const useful = Math.max(0, defaultConsumed - defaultSetup - defaultRun);
    scr.innerHTML = `
      <div class="section-title">Declaracion de mermas y cierre</div>
      <div class="alert-box warning">Todos los campos son obligatorios para liberar la maquina.</div>
      <div class="field-group"><div class="field-label">Pies consumidos</div><input type="number" id="f-total" value="${defaultConsumed}" oninput="calcMerma()"></div>
      <div class="field-group"><div class="field-label">Pies merma | Setup</div><input type="number" id="f-setup" value="${defaultSetup}" oninput="calcMerma()"></div>
      <div class="field-group"><div class="field-label">Pies merma | Tiraje</div><input type="number" id="f-tiraje" value="${defaultRun}" oninput="calcMerma()"></div>
      <div class="merma-total"><span>Pies utiles -> ERP</span><span id="pies-utiles" style="font-weight:700;color:#1D9E75">${useful.toLocaleString('es-CR')} pies</span></div>
      <hr class="divider">
      <div class="section-title">Memoria tecnica (${plateId()})</div>
      <div class="field-group"><div class="field-label">Velocidad final estable (pies/min)</div><input type="number" id="f-vel" placeholder="ej. 420"></div>
      <div class="field-group"><div class="field-label">Presion de cilindros (bar)</div><input type="number" id="f-cil" step="0.1" placeholder="ej. 2.4"></div>
      <div class="field-group"><div class="field-label">Linea de anilox utilizada</div><input type="number" id="f-anilox" placeholder="ej. 360"></div>
      <button class="btn-main go" onclick="cerrarOP()">Cerrar orden y enviar al ERP</button>
    `;
  }
}

function setPlanchaNueva(val){ planchaNueva = val; renderScreen(); }
function toggleKit(idx){ kit[idx]=!kit[idx]; renderScreen(); }

async function goState(nextState){
  try {
    if (nextState === 3) await postEvent('setup');
    if (nextState === 4) await postEvent('run');
    stopTimer();
    state = nextState;
    renderStateBar();
    renderBadge();
    renderScreen();
  } catch (error) {
    alert(error.message || 'No se pudo actualizar el control.');
  }
}

async function confirmarGrabado(){
  const value = document.getElementById('f-grabado')?.value;
  const notes = document.getElementById('f-grabado-notes')?.value || '';
  if(!value){ alert('Ingresa la hora de inicio de grabado.'); return; }
  try {
    await postEvent('setup', { notes: `Grabado confirmado: ${value}${notes ? ` | ${notes}` : ''}` });
    document.getElementById('screen').innerHTML += `<div class="success-box" style="margin-top:8px">Grabado registrado: ${value}. Se libera el paso de setup.</div>`;
    setTimeout(()=>{ state = 3; renderStateBar(); renderBadge(); renderScreen(); }, 1200);
  } catch (error) {
    alert(error.message || 'No se pudo registrar el grabado.');
  }
}

async function reanudar(){
  const selected = document.getElementById('sel-paro')?.value;
  if(!selected){ alert('Selecciona un motivo de paro antes de reanudar.'); return; }
  try {
    await postEvent('paro', { stopReasonId: selected });
    await postEvent('run');
    state = 4;
    renderStateBar();
    renderBadge();
    renderScreen();
  } catch (error) {
    alert(error.message || 'No se pudo registrar el paro.');
  }
}

function calcMerma(){
  const t=parseInt(document.getElementById('f-total')?.value||0, 10);
  const s=parseInt(document.getElementById('f-setup')?.value||0, 10);
  const r=parseInt(document.getElementById('f-tiraje')?.value||0, 10);
  const el=document.getElementById('pies-utiles');
  if(el) el.textContent=Math.max(0, t-s-r).toLocaleString('es-CR')+' pies';
}

async function cerrarOP(){
  const vel=document.getElementById('f-vel')?.value;
  const cil=document.getElementById('f-cil')?.value;
  const anilox=document.getElementById('f-anilox')?.value;
  if(!vel||!cil||!anilox){ alert('Completa todos los campos de memoria tecnica.'); return; }
  try {
    const feetConsumed = Number(document.getElementById('f-total')?.value || 0);
    const setupWasteFeet = Number(document.getElementById('f-setup')?.value || 0);
    const runWasteFeet = Number(document.getElementById('f-tiraje')?.value || 0);
    await postWaste({ feetConsumed, setupWasteFeet, runWasteFeet, finalSpeedFpm: Number(vel), aniloxLine: String(anilox), cylinderPressure: String(cil) });
    await postEvent('completado');
    const useful = Math.max(0, feetConsumed - setupWasteFeet - runWasteFeet);
    document.getElementById('screen').innerHTML=`
      <div style="text-align:center;padding:32px 16px">
        <div style="font-size:42px;margin-bottom:12px">OK</div>
        <div style="font-size:18px;font-weight:700;margin-bottom:8px">${contextData.orderCode} cerrada</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:20px">Recibo de produccion enviado al ERP</div>
        <div class="op-card" style="text-align:left">
          <div class="op-row"><span class="op-key">Pies utiles -> ERP</span><span class="op-val" style="color:#1D9E75">${useful.toLocaleString('es-CR')} pies</span></div>
          <div class="op-row"><span class="op-key">Velocidad registrada</span><span class="op-val">${vel} pies/min</span></div>
          <div class="op-row"><span class="op-key">Presion cilindros</span><span class="op-val">${cil} bar</span></div>
          <div class="op-row"><span class="op-key">Anilox</span><span class="op-val">${anilox}</span></div>
        </div>
        <button class="btn-main outline" onclick="window.location.href='/planificacion/preturno'">Volver a pendientes</button>
      </div>
    `;
    state = 6;
    renderStateBar();
    renderBadge();
  } catch (error) {
    alert(error.message || 'No se pudo cerrar la orden.');
  }
}

async function loadContext() {
  try {
    const params = new URLSearchParams({ area:'planchas' });
    const routeId = queryValue('routeId');
    const orderCode = queryValue('orderCode');
    if (routeId) params.set('routeId', routeId);
    if (orderCode) params.set('orderCode', orderCode);
    const [contextRes, reasonsRes] = await Promise.all([fetch(`${API}/contexto?${params.toString()}`), fetch(`${API}/motivos-paro`)]);
    const contextPayload = await contextRes.json();
    const reasonsPayload = await reasonsRes.json();
    if (!contextRes.ok || !contextPayload.ok) throw new Error(contextPayload.error || 'No se pudo cargar el control de planchas.');
    contextData = contextPayload.data;
    stopReasons = reasonsPayload.ok ? reasonsPayload.data : [];
    planchaNueva = false;
    state = statusToStep(contextData.routeStatus);
    if (state > 0) kit = [Boolean(plateId()), Boolean(contextData.materialCode), Number(contextData.tintCount || 0) > 0];
    renderContextHead();
    renderStateBar();
    renderBadge();
    renderScreen();
  } catch (error) {
    document.getElementById('screen').innerHTML = `<div class="loading">${error.message}</div>`;
  }
}

loadContext();
  const erpAccessScript = document.createElement('script');
  erpAccessScript.src = '/access-control.js';
  document.head.appendChild(erpAccessScript);
</script>
</body>
