<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline de Orden — Capacidad Finita</title>
<style>
:root{--font-sans:"Segoe UI",system-ui,sans-serif;--color-text-primary:#1f2b3d;--color-text-secondary:#66758b;--color-background-primary:#f4f7fb;--color-background-secondary:#fff;--color-background-tertiary:#edf2f7;--color-border-secondary:#d8e4ef;--color-border-tertiary:#e4ebf3;--border-radius-md:6px}
html[data-theme="dark"]{--color-text-primary:#e5eefb;--color-text-secondary:#9fb0c8;--color-background-primary:#0f172a;--color-background-secondary:#162033;--color-background-tertiary:#1e293b;--color-border-secondary:#334155;--color-border-tertiary:#26364f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:13px;color:var(--color-text-primary);background:var(--color-background-primary);min-height:100vh}
.top-bar{padding:12px 16px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.top-title{font-size:15px;font-weight:500}
.top-sub{font-size:12px;color:var(--color-text-secondary)}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{font-size:12px;padding:6px 14px;border-radius:var(--border-radius-md);border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-weight:500}
.btn:hover{background:var(--color-background-tertiary)}
.btn.primary{background:#1D9E75;border-color:#0F6E56;color:#fff}
.loading{padding:60px;text-align:center;color:var(--color-text-secondary)}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--color-border-secondary);border-top-color:#1D9E75;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:60px;text-align:center;color:var(--color-text-secondary)}
.empty-icon{font-size:40px;margin-bottom:10px}

.order-header{padding:16px 20px;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}
.order-header-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.oh-field{display:flex;flex-direction:column;gap:2px}
.oh-label{font-size:10px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.04em}
.oh-val{font-size:14px;font-weight:600}
.oh-val.green{color:#0F6E56}
.oh-val.amber{color:#854F0B}
.oh-val.red{color:#A32D2D}

.summary-strip{display:flex;gap:16px;padding:10px 20px;border-bottom:0.5px solid var(--color-border-tertiary);flex-wrap:wrap}
.ss-item{display:flex;align-items:center;gap:6px;font-size:12px}
.ss-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.timeline-container{padding:20px;overflow-x:auto}
.timeline-labels{display:flex;flex-direction:column;gap:0;min-width:160px}
.timeline-track{flex:1;min-width:600px;position:relative}

.tl-row{display:flex;align-items:stretch;min-height:56px;border-bottom:0.5px solid var(--color-border-tertiary)}
.tl-row:last-child{border-bottom:none}
.tl-row:hover{background:var(--color-background-secondary)}
.tl-label-col{width:160px;min-width:160px;padding:8px 12px;border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;justify-content:center;gap:2px}
.tl-process{font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px}
.tl-machine{font-size:10px;color:var(--color-text-secondary)}
.tl-bottleneck-badge{display:inline-block;padding:1px 6px;border-radius:var(--border-radius-md);font-size:9px;font-weight:600;background:#FCEBEB;color:#A32D2D;border:1px solid #f0b5b5}
html[data-theme="dark"] .tl-bottleneck-badge{background:rgba(164,67,67,0.15);border-color:rgba(164,67,67,0.3);color:#f0a0a0}

.tl-bars-col{flex:1;padding:8px 12px;display:flex;align-items:center;gap:0;position:relative}

.tl-bar{height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;position:relative;min-width:2px}
.tl-bar.queue{background:repeating-linear-gradient(45deg,var(--color-background-tertiary),var(--color-background-tertiary) 3px,var(--color-border-secondary) 3px,var(--color-border-secondary) 6px);color:var(--color-text-secondary);font-weight:400;border:1px dashed var(--color-border-secondary)}
.tl-bar.process{background:#378ADD;border:1px solid #185FA5}
.tl-bar.process.bottleneck{background:#E24B4A;border-color:#A32D2D}
html[data-theme="dark"] .tl-bar.queue{background:repeating-linear-gradient(45deg,rgba(255,255,255,0.05),rgba(255,255,255,0.05) 3px,rgba(255,255,255,0.1) 3px,rgba(255,255,255,0.1) 6px)}
html[data-theme="dark"] .tl-bar.process{background:#2a6fb5;border-color:#1a5a95}
html[data-theme="dark"] .tl-bar.process.bottleneck{background:#c0392b;border-color:#962d22}

.tl-bar-label{position:absolute;top:-16px;left:0;font-size:10px;color:var(--color-text-secondary);white-space:nowrap}
.tl-bar-dur{position:absolute;bottom:-16px;left:0;font-size:10px;font-weight:600;color:var(--color-text-primary);white-space:nowrap}
.tl-connector{width:20px;min-width:20px;display:flex;align-items:center;justify-content:center;color:var(--color-border-secondary);font-size:14px}

.tl-dates-col{width:200px;min-width:200px;padding:8px 12px;border-left:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:11px;color:var(--color-text-secondary)}
.tl-date-start{color:var(--color-text-primary);font-weight:500}
.tl-date-end{color:var(--color-text-primary);font-weight:500}

.daily-detail{margin-top:20px;padding:16px 20px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);border:1px solid var(--color-border-secondary)}
.daily-detail-title{font-size:12px;font-weight:600;margin-bottom:10px}
.daily-bars{display:flex;align-items:flex-end;gap:3px;height:80px}
.daily-bar{flex:1;border-radius:2px 2px 0 0;transition:height .3s;position:relative;cursor:default}
.daily-bar:hover{filter:brightness(1.1)}
.daily-bar-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--color-text-secondary);white-space:nowrap}
.daily-cap-line{position:absolute;left:0;right:0;height:1px;border-top:1px dashed var(--color-border-secondary)}
.theme-toggle{width:32px;height:30px;border:1px solid var(--color-border-secondary);border-radius:6px;background:var(--color-background-secondary);color:var(--color-text-primary);cursor:pointer}.theme-toggle-icon-sun::before{content:"☀"}.theme-toggle-icon-moon::before{content:"☾"}.theme-toggle-icon-moon{display:none}html[data-theme="dark"] .theme-toggle-icon-sun{display:none}html[data-theme="dark"] .theme-toggle-icon-moon{display:inline}
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <div class="top-title">📋 Timeline de Orden</div>
    <div class="top-sub" id="order-subtitle">Cargando...</div>
  </div>
  <div class="top-actions">
    <span data-theme-toggle-slot></span>
    <a class="btn" href="/planificacion/capacidad">← Capacidad</a>
    <a class="btn" href="/planificacion/gantt">Gantt</a>
  </div>
</div>

<div id="loading" class="loading"><span class="spinner"></span>Calculando timeline...</div>

<div id="content" style="display:none">
  <div id="order-header" class="order-header"></div>
  <div id="summary-strip" class="summary-strip"></div>
  <div class="timeline-container">
    <div id="timeline-rows"></div>
  </div>
  <div id="daily-detail-area" class="daily-detail" style="margin:0 20px 20px"></div>
</div>

<script>
const API = '/api/planificacion';
const params = new URLSearchParams(window.location.search);
const orderCode = params.get('codigo') || params.get('order') || '';

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function formatDate(d) {
  if (!d) return '—';
  const date = new Date(d.includes('T') ? d : `${d}T12:00:00`);
  return date.toLocaleDateString('es-CR', { weekday: 'short', day: '2-digit', month: 'short' });
}

function formatDateTime(d) {
  if (!d) return '—';
  const date = new Date(d.includes('T') ? d : `${d}T12:00:00`);
  return date.toLocaleString('es-CR', { day: '2-digit', month: 'short', hour:'2-digit', minute:'2-digit' });
}

async function loadTimeline() {
  if (!orderCode) {
    document.getElementById('loading').innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>No se especificó código de orden.<br>Usa: ?codigo=OP-XXXXX</div>';
    return;
  }
  try {
    const res = await fetch(`${API}/capacidad-finita/timeline/${encodeURIComponent(orderCode)}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    const tl = data.data;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('order-subtitle').textContent = `${tl.orderCode} — ${tl.customerName} · ${tl.jobName}`;
    renderOrderHeader(tl);
    renderSummaryStrip(tl);
    renderTimeline(tl);
    renderDailyDetail(tl);
  } catch (e) {
    document.getElementById('loading').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>${esc(e.message)}</div>`;
  }
}

function renderOrderHeader(tl) {
  const promColor = tl.promisedDate && tl.latestEnd && tl.latestEnd > tl.promisedDate ? 'red' : 'green';
  document.getElementById('order-header').innerHTML = `
    <div class="order-header-grid">
      <div class="oh-field"><div class="oh-label">Orden</div><div class="oh-val">${esc(tl.orderCode)}</div></div>
      <div class="oh-field"><div class="oh-label">Cliente</div><div class="oh-val">${esc(tl.customerName)}</div></div>
      <div class="oh-field"><div class="oh-label">Inicio proyectado</div><div class="oh-val">${formatDate(tl.earliestStart)}</div></div>
      <div class="oh-field"><div class="oh-label">Fin proyectado</div><div class="oh-val ${promColor}">${formatDate(tl.latestEnd)}</div></div>
    </div>
  `;
}

function renderSummaryStrip(tl) {
  const items = [
    { color: '#378ADD', label: `${tl.steps.length} procesos`, sub: '' },
    { color: '#D4A017', label: `${tl.totalQueueDays}d espera`, sub: 'cola total' },
    { color: '#1D9E75', label: `${tl.totalProcessDays}d proceso`, sub: 'tiempo activo' },
    { color: '#A32D2D', label: `${tl.totalDays}d total`, sub: 'fin proyectado' },
  ];
  if (tl.promisedDate) {
    const isLate = tl.latestEnd && tl.latestEnd > tl.promisedDate;
    items.push({ color: isLate ? '#A32D2D' : '#1D9E75', label: `Entrega: ${formatDate(tl.promisedDate)}`, sub: isLate ? 'EN RIESGO' : 'a tiempo' });
  }
  if (tl.bottleneckCount > 0) {
    items.push({ color: '#A32D2D', label: `${tl.bottleneckCount} cuello(s)`, sub: 'en la cadena' });
  }
  document.getElementById('summary-strip').innerHTML = items.map(i => `
    <div class="ss-item">
      <div class="ss-dot" style="background:${i.color}"></div>
      <span><b>${i.label}</b>${i.sub ? ' · ' + i.sub : ''}</span>
    </div>
  `).join('');
}

function renderTimeline(tl) {
  const container = document.getElementById('timeline-rows');
  const maxDuration = Math.max(...tl.steps.map(s => s.durationHours + s.queueHours), 1);
  const scale = 100 / maxDuration;

  let html = '';
  tl.steps.forEach((step, i) => {
    const queueW = Math.max(step.queueHours * scale, 0);
    const processW = Math.max(step.durationHours * scale, 2);
    const isBn = step.isBottleneck;

    html += `<div class="tl-row">
      <div class="tl-label-col">
        <div class="tl-process">
          ${esc(step.processName)}
          ${isBn ? '<span class="tl-bottleneck-badge">CUELLO</span>' : ''}
        </div>
        <div class="tl-machine">${esc(step.machineName)}</div>
        <div class="tl-machine">${step.utilizationAtResource}% utilización</div>
      </div>
      <div class="tl-bars-col">`;

    if (step.queueHours > 0) {
      html += `<div class="tl-bar queue" style="width:${queueW}%">
        <span class="tl-bar-label">Cola</span>
        <span>${step.queueHours}h</span>
        <span class="tl-bar-dur">${step.queueDays}d espera</span>
      </div>`;
    }

    html += `<div class="tl-bar process ${isBn ? 'bottleneck' : ''}" style="width:${processW}%">
        <span class="tl-bar-label">${esc(step.processName)}</span>
        <span>${step.durationHours}h</span>
        <span class="tl-bar-dur">${Math.round(step.durationHours / 8 * 10) / 10}d</span>
      </div>`;

    html += `</div>
      <div class="tl-dates-col">
        <div class="tl-date-start">Inicio: ${formatDate(step.projectedStart)}</div>
        <div class="tl-date-end">Fin: ${formatDate(step.projectedEnd)}</div>
        ${step.dayCapacity > 0 ? `<div style="font-size:10px">Cap día: ${step.dayCapacity}h</div>` : ''}
      </div>
    </div>`;

    if (i < tl.steps.length - 1) {
      const nextStep = tl.steps[i + 1];
      if (nextStep.queueHours > 0) {
        html += `<div class="tl-row" style="min-height:24px;border-bottom:0.5px solid var(--color-border-tertiary)">
          <div class="tl-label-col" style="width:160px;min-width:160px;padding:4px 12px;border-right:0.5px solid var(--color-border-tertiary)">
            <div style="font-size:10px;color:var(--color-text-secondary);font-style:italic">Espera antes de ${esc(nextStep.processName)}</div>
          </div>
          <div class="tl-bars-col" style="padding:4px 12px">
            <div style="font-size:10px;color:var(--color-text-secondary)">⏳ ${nextStep.queueHours}h (${nextStep.queueDays}d) — recurso ocupado</div>
          </div>
          <div class="tl-dates-col" style="width:200px;min-width:200px;padding:4px 12px;border-left:0.5px solid var(--color-border-tertiary)">
            <div style="font-size:10px;color:var(--color-text-secondary)">${formatDate(step.projectedEnd)} → ${formatDate(nextStep.projectedStart)}</div>
          </div>
        </div>`;
      }
    }
  });

  container.innerHTML = html;
}

function renderDailyDetail(tl) {
  const area = document.getElementById('daily-detail-area');
  const bottleneckSteps = tl.steps.filter(s => s.isBottleneck);
  if (!bottleneckSteps.length) {
    area.innerHTML = '<div class="daily-detail-title">✓ Sin cuellos de botella en esta cadena</div>';
    return;
  }
  area.innerHTML = bottleneckSteps.map(s => {
    const load = s.dayHoursUsed || 0;
    const cap = s.dayCapacity || 1;
    const pct = Math.round(load / cap * 100);
    return `<div style="margin-bottom:12px">
      <div class="daily-detail-title" style="color:#A32D2D">⚠ ${esc(s.processName)} — ${esc(s.machineName)}</div>
      <div style="font-size:12px;margin-bottom:6px">Utilización: <b>${s.utilizationAtResource}%</b> · Capacidad del día: ${s.dayCapacity}h · Carga: ${s.dayHoursUsed}h</div>
      <div style="height:8px;background:var(--color-background-tertiary);border-radius:4px;overflow:hidden;width:300px">
        <div style="height:100%;width:${Math.min(pct, 100)}%;background:#A32D2D;border-radius:4px"></div>
      </div>
    </div>`;
  }).join('');
}

loadTimeline();
</script>
</body>
</html>
