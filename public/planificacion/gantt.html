<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexo APS — Consola de Planificación</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:13px;color:#1a1a1a;background:#f5f5f3}

/* ── HEADER & TOOLBAR ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #e0e0da;background:#fff;gap:8px;flex-wrap:wrap}
.hdr-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#1D9E75;display:inline-block;flex-shrink:0}
.dot.offline{background:#E24B4A}
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{font-size:11px;padding:5px 11px;border-radius:6px;border:1px solid #d0d0ca;background:#fff;color:#1a1a1a;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f0f0ea}
.btn.primary{background:#e8f0fb;border-color:#b5d0f0;color:#185FA5}
.btn.primary:hover{background:#d5e7f9}
.btn.danger{background:#fceaea;border-color:#f0b5b5;color:#A32D2D}
.btn.active-view{background:#185FA5;border-color:#185FA5;color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:5px}
.badge.crit{background:#fceaea;color:#A32D2D}
.badge.ok{background:#e8f7f1;color:#0F6E56}
.badge.warn{background:#fef3e2;color:#854F0B}
.badge.info{background:#e8f0fb;color:#185FA5}

/* ── STATS BAR ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 16px;border-bottom:1px solid #e0e0da;background:#fff}
.stat{background:#f5f5f3;border-radius:6px;padding:8px 12px}
.stat-lbl{font-size:11px;color:#888;margin-bottom:2px}
.stat-val{font-size:22px;font-weight:500}
.alerts{padding:8px 16px;border-bottom:1px solid #e0e0da;background:#fff;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:38px}
.conflict-toggle-btn.has-conflicts{background:#fceaea;border-color:#f0b5b5;color:#A32D2D}

/* ── VIEW TOGGLE TAB BAR ── */
.view-tabs{display:flex;gap:0;border-bottom:2px solid #e0e0da;background:#fafaf8;padding:0 16px}
.view-tab{font-size:12px;font-weight:500;padding:9px 16px;border:none;background:none;color:#888;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:6px;transition:color .15s,border-color .15s}
.view-tab:hover{color:#378ADD}
.view-tab.active{color:#185FA5;border-bottom-color:#185FA5}
.view-tab .tab-count{font-size:10px;background:#e0e0da;color:#666;border-radius:10px;padding:1px 6px;font-weight:600}
.view-tab.active .tab-count{background:#d5e7f9;color:#185FA5}

/* ── GANTT ── */
.gantt-wrap{overflow-x:auto;background:#fff}
.gantt-inner{min-width:900px;position:relative}
.g-header{display:flex;border-bottom:1px solid #e0e0da;background:#fafaf8}
.res-col{width:190px;min-width:190px;padding:8px 12px;font-size:11px;font-weight:500;color:#888;border-right:1px solid #e0e0da;flex-shrink:0}
.time-col{display:flex;flex-direction:column;flex:1;min-width:0}
.day-hdr{display:flex;border-bottom:1px solid #e0e0da;background:#f0f4f8}
.day-hdr-item{padding:6px 8px 4px;font-size:11px;font-weight:600;color:#445;border-right:1px solid #d8e0e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.time-hdr{display:flex;flex:1}
.t-slot{flex:1;min-width:52px;padding:6px 4px;text-align:center;font-size:10px;color:#aaa;border-right:1px solid #e8e8e4}
.g-row{display:flex;border-bottom:1px solid #e0e0da;min-height:72px;align-items:stretch;position:relative;background:#fff}
.g-row:hover{background:#fafaf8}
.g-row.drag-over .timeline{outline:2px dashed #378ADD;outline-offset:-2px;background:rgba(55,138,221,0.04)}
.res-lbl{width:190px;min-width:190px;padding:8px 12px;border-right:1px solid #e0e0da;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.res-name{font-weight:600;font-size:12px}
.res-sub{font-size:10px;color:#999}
.res-count{font-size:10px;color:#378ADD;font-weight:500}

/* Proceso header */
.proceso-hdr{display:flex;align-items:center;border-bottom:1px solid #e0e0da;border-top:3px solid transparent;background:#f7f7f5}
.proceso-hdr-lbl{width:190px;min-width:190px;padding:8px 12px;font-size:11px;font-weight:700;border-right:1px solid #e0e0da;display:flex;align-items:center;gap:6px;flex-shrink:0}
.proceso-hdr-timeline{flex:1;padding:4px 10px;font-size:10px;color:#aaa;display:flex;align-items:center;gap:8px;justify-content:space-between}
.proceso-empty-note{color:#bbb;font-size:10px}
.proceso-toggle{font-size:10px;padding:3px 8px;border-radius:5px;border:1px solid #d0d0ca;background:#fff;color:#666;cursor:pointer}
.timeline{flex:1;position:relative;display:flex;align-items:center;min-height:72px}
.grid-ln{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.08)}
.day-sep{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.12);pointer-events:none;z-index:2}
.now-line{position:absolute;top:0;bottom:0;width:1px;background:rgba(226,75,74,.55);z-index:60;pointer-events:none}

/* ── TASK BARS (mejoradas) ── */
.task-bar{
  position:absolute;
  height:56px;
  border-radius:8px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 28px 0 10px;
  cursor:grab;
  border:2px solid transparent;
  overflow:hidden;
  white-space:nowrap;
  user-select:none;
  transition:box-shadow .15s,opacity .15s,filter .15s,height .15s;
  min-width:48px;
}
.task-bar:hover{filter:brightness(1.07);z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.task-bar.dragging{opacity:0.4;cursor:grabbing}
.task-bar.drag-target{outline:2.5px dashed rgba(255,255,255,.7);outline-offset:-3px}
.task-bar.chain-active{box-shadow:0 0 0 3px rgba(6,182,212,.6),0 0 20px rgba(6,182,212,.3);z-index:30;filter:brightness(1.08);border-color:#06b6d4!important}
.task-bar.chain-dim{opacity:0.15}
.task-cliente{font-size:9.5px;opacity:0.85;overflow:hidden;text-overflow:ellipsis;line-height:1.2;font-weight:500}
.task-lbl{font-size:11.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.task-sub{font-size:9.5px;opacity:0.80;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.task-mode-pill{display:inline-flex;align-items:center;padding:1px 5px;border-radius:999px;font-size:8.5px;font-weight:700;background:rgba(255,255,255,.22)}
.task-config-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:0;border-radius:5px;background:rgba(255,255,255,.18);color:#fff;font-size:13px;line-height:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;flex-shrink:0}
.task-config-btn:hover{background:rgba(255,255,255,.34)}
.task-progress-track{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(0,0,0,.12);border-radius:0 0 7px 7px;overflow:hidden;z-index:1}
.task-progress-fill{height:100%;background:rgba(255,255,255,.55);border-radius:0 0 7px;transition:width .6s ease}
.task-bar.is-running::after{content:'';position:absolute;inset:0;border-radius:8px;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.07) 50%,transparent 100%);background-size:200% 100%;animation:shine 2.5s ease-in-out infinite;pointer-events:none;z-index:0}
@keyframes shine{0%{background-position:200% 0}100%{background-position:-200% 0}}
.task-late-icon{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:#E24B4A;color:#fff;font-size:10px;line-height:18px;text-align:center;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.25);animation:pulse-warn 1.6s ease-in-out infinite}
@keyframes pulse-warn{0%,100%{box-shadow:0 0 0 0 rgba(226,75,74,.6)}50%{box-shadow:0 0 0 6px rgba(226,75,74,0)}}
.task-color-menu{position:fixed;z-index:800;background:#fff;border:1px solid #d0d0ca;border-radius:8px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);display:grid;grid-template-columns:repeat(5,22px);gap:6px}
.task-color-dot{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.16);cursor:pointer}
.maint-bar{position:absolute;height:40px;background:#f0f0ea;border:1px dashed #c0c0ba;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#888}
.legend{display:flex;gap:14px;padding:8px 16px;border-top:1px solid #e0e0da;background:#fff;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#888}
.leg-dot{width:11px;height:11px;border-radius:3px}

/* ── SVG ARROWS ── */
#arrows-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50;overflow:visible}

/* ── CONFLICTS ── */
.task-bar.conflict-machine{outline:2.5px solid #E24B4A;outline-offset:1px;animation:pulse-red 1.2s ease-in-out infinite}
.task-bar.conflict-sequence{outline:2.5px solid #FF8C00;outline-offset:1px;animation:pulse-orange 1.2s ease-in-out infinite}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(226,75,74,.5)}50%{box-shadow:0 0 0 5px rgba(226,75,74,0)}}
@keyframes pulse-orange{0%,100%{box-shadow:0 0 0 0 rgba(255,140,0,.5)}50%{box-shadow:0 0 0 5px rgba(255,140,0,0)}}
.conflict-badge{background:#fceaea;color:#A32D2D;border:1px solid #f0b5b5;font-size:10px;padding:2px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px}
.conflict-panel{background:#fef8f0;border:1px solid #f5c77e;border-radius:6px;padding:10px;margin-bottom:10px;font-size:11px}
.conflict-panel-title{font-weight:600;color:#854F0B;margin-bottom:6px}
.conflict-row{display:flex;align-items:flex-start;gap:6px;padding:3px 0;color:#5a3a00;border-bottom:1px solid #f5e4c0;font-size:11px}
.conflict-row:last-child{border-bottom:none}

/* ── TOOLTIP ── */
.tt{position:fixed;background:#fff;border:1px solid #d0d0ca;border-radius:8px;padding:10px 13px;font-size:12px;pointer-events:none;z-index:600;min-width:220px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.tt-title{font-weight:600;font-size:13px;margin-bottom:4px}
.tt-cliente{font-size:11px;color:#378ADD;margin-bottom:7px;border-bottom:1px solid #e8e8e4;padding-bottom:6px}
.tt-row{display:flex;justify-content:space-between;gap:14px;margin-bottom:3px;color:#888}
.tt-val{color:#1a1a1a;font-weight:500}

/* ── DETAIL PANEL ── */
.dp{position:fixed;top:0;right:0;width:320px;height:100%;background:#fff;border-left:1px solid #d0d0ca;padding:16px;z-index:500;display:none;overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.10)}
.dp-title{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.dp-subtitle{font-size:11px;color:#378ADD;margin-bottom:14px}
.dp-close{cursor:pointer;font-size:18px;color:#888;line-height:1;padding:2px 6px;border-radius:4px}
.dp-close:hover{background:#f0f0ea}
.dp-field{margin-bottom:10px}
.dp-lbl{font-size:11px;color:#888;margin-bottom:3px}
.dp-val{font-size:13px;font-weight:500}
.dp-input{width:100%;font-size:12px;padding:6px 8px;border:1px solid #d0d0ca;border-radius:6px;background:#fafaf8;color:#1a1a1a}
.dp-section{font-size:10px;font-weight:600;color:#888;margin:14px 0 6px;letter-spacing:.04em;border-bottom:1px solid #e8e8e4;padding-bottom:4px}
.chain-list{margin-bottom:12px}
.chain-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;margin-bottom:3px;font-size:11px;background:#f5f5f3;border:1px solid #e8e8e4}
.chain-item.active{background:#e8f0fb;border-color:#b5d0f0;font-weight:600}
.chain-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dp-color-row{display:flex;gap:7px;flex-wrap:wrap}
.dp-color-row label{display:flex;align-items:center}
.dp-color-row input{position:absolute;opacity:0;pointer-events:none}
.dp-color-swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px #d0d0ca;cursor:pointer}
.dp-color-row input:checked + .dp-color-swatch{border-color:#1a1a1a}
.save-btn{width:100%;padding:8px;background:#e8f0fb;border:1px solid #b5d0f0;color:#185FA5;border-radius:6px;cursor:pointer;font-size:12px;margin-top:10px;font-weight:500}
.save-btn:hover{background:#d0e4f8}
.save-btn.saving{opacity:0.6;cursor:not-allowed}
.impact-box{background:#fef3e2;border:1px solid #f5c77e;border-radius:6px;padding:10px;margin-top:10px;font-size:11px;color:#854F0B}
.impact-title{font-weight:600;margin-bottom:4px}

/* ── PIPELINE VIEW ── */
#pipeline-view{display:none;min-height:400px}
.pipeline-board{display:grid;grid-template-columns:repeat(7,1fr);width:100%;border-top:1px solid #e0e0da}
.pipeline-col{min-width:0;border-right:1px solid #e0e0da}
.pipeline-col:last-child{border-right:none}
.pipeline-col-header{padding:10px 10px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid transparent}
.pipeline-col-title{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px;min-width:0}
.pipeline-col-count{font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px;min-width:22px;text-align:center;flex-shrink:0}
.pipeline-cards{display:flex;flex-direction:column;gap:6px;padding:8px 8px 12px;min-height:80px}
.pipeline-card{background:#fff;border:1px solid #e0e0da;border-radius:7px;padding:8px 10px;cursor:pointer;transition:box-shadow .14s,transform .14s;position:relative;border-left-width:4px}
.pipeline-card:hover{box-shadow:0 3px 12px rgba(0,0,0,.10);transform:translateY(-1px)}
.pipeline-card.is-late{box-shadow:inset 3px 0 0 0 #E24B4A,inset -3px 0 0 0 #E24B4A}
.pipeline-card.is-tight{box-shadow:inset 3px 0 0 0 #BA7517,inset -3px 0 0 0 #BA7517}
.pipeline-card.is-running{box-shadow:inset 3px 0 0 0 #1D9E75,inset -3px 0 0 0 #1D9E75}
.pc-order{font-size:12px;font-weight:700;color:#1a1a1a;margin-bottom:1px;display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.pc-cliente{font-size:11px;color:#378ADD;font-weight:500;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-articulo{font-size:11px;color:#555;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-meta{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pc-chip{font-size:10px;padding:2px 5px;border-radius:4px;font-weight:500;white-space:nowrap}
.pc-chip.dur{background:#f0f0ea;color:#555}
.pc-chip.colores{background:#f0eefb;color:#5b21b6}
.pc-chip.late{background:#fceaea;color:#A32D2D;font-weight:700}
.pc-chip.tight{background:#fef3e2;color:#854F0B}
.pc-chip.maq{background:#f5f0fb;color:#534AB7;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.pc-chip.run{background:#e8f7f1;color:#0F6E56;font-weight:600}
.pc-due{font-size:10px;color:#aaa;margin-top:4px;display:flex;align-items:center;gap:3px}
.pc-due.overdue{color:#A32D2D;font-weight:600}
.pc-due.tight-date{color:#854F0B}
.pc-progress{margin-top:5px;height:3px;background:#f0f0ea;border-radius:2px;overflow:hidden}
.pc-progress-fill{height:100%;border-radius:2px;transition:width .5s ease}
.pipeline-empty{text-align:center;padding:20px 6px;color:#ccc;font-size:11px}
.pipeline-status-note{font-size:10px;color:#bbb;padding:3px 8px;text-align:center}
html[data-theme="dark"] .pipeline-board{border-color:var(--app-border,#334155)}
html[data-theme="dark"] .pipeline-col{border-color:var(--app-border,#334155)}
html[data-theme="dark"] .pipeline-card{background:var(--app-surface-soft,#172033);border-color:var(--app-border,#334155)}
html[data-theme="dark"] .pipeline-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.3)}
html[data-theme="dark"] .pc-order{color:var(--app-text,#e5edf6)}
html[data-theme="dark"] .pc-articulo{color:var(--app-text-muted,#94a3b8)}
html[data-theme="dark"] .pc-chip.dur{background:rgba(255,255,255,.07);color:var(--app-text-muted,#94a3b8)}
html[data-theme="dark"] .pc-due{color:var(--app-text-muted,#94a3b8)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:800;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:12px;width:min(580px,90vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden}
.modal-header{padding:16px 20px;border-bottom:1px solid #e0e0da;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-header h3{margin:0;font-size:15px;font-weight:600}
.modal-close{cursor:pointer;font-size:20px;color:#888;line-height:1;padding:4px 8px;border-radius:6px}
.modal-close:hover{background:#f0f0ea}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1}
.modal-body::-webkit-scrollbar{width:6px}
.modal-body::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
.conflict-group{margin-bottom:14px;border:1px solid #e0e0da;border-radius:8px;overflow:hidden}
.conflict-group-header{padding:10px 12px;background:#f7f7f5;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e0e0da;cursor:pointer}
.conflict-group-header:hover{background:#f0f0ea}
.conflict-group-title{font-size:12px;font-weight:600;color:#1a1a1a;display:flex;align-items:center;gap:6px}
.conflict-group-count{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.conflict-group-body{padding:8px 12px}
.conflict-item{font-size:11px;color:#555;padding:4px 0;border-bottom:1px solid #f0f0ea;display:flex;align-items:flex-start;gap:6px}
.conflict-item:last-child{border-bottom:none}
.conflict-icon{flex-shrink:0;font-size:12px}
.conflict-type-machine{color:#E24B4A}
.conflict-type-sequence{color:#BA7517}
.html[data-theme="dark"] .modal-box{background:var(--app-surface,#111827);border-color:var(--app-border,#334155)}
.html[data-theme="dark"] .modal-header{border-color:var(--app-border,#334155);color:var(--app-text,#e5edf6)}
.html[data-theme="dark"] .modal-body{color:var(--app-text,#e5edf6)}
.html[data-theme="dark"] .conflict-group{border-color:var(--app-border,#334155)}
.html[data-theme="dark"] .conflict-group-header{background:var(--app-surface-soft,#172033);border-color:var(--app-border,#334155)}
.html[data-theme="dark"] .conflict-group-header:hover{background:rgba(255,255,255,.05)}
.html[data-theme="dark"] .conflict-group-title{color:var(--app-text,#e5edf6)}
.html[data-theme="dark"] .conflict-item{color:var(--app-text-muted,#94a3b8);border-color:var(--app-border,#334155)}
.html[data-theme="dark"] .modal-close{color:var(--app-text-muted,#94a3b8)}
.html[data-theme="dark"] .modal-close:hover{background:rgba(255,255,255,.08)}

/* ── MOVE DECISION MODAL ── */
.move-modal-grid{display:flex;gap:12px;margin:12px 0}
.move-modal-left{flex:1;min-width:0}
.move-modal-right{width:220px;flex-shrink:0}
.move-field{margin-bottom:10px}
.move-field label{display:block;font-size:11px;font-weight:600;color:#555;margin-bottom:4px}
.move-field input,.move-field select{width:100%;padding:6px 8px;font-size:12px;border:1px solid #d0d0ca;border-radius:6px;background:#fff;color:#1a1a1a}
.move-field input:focus,.move-field select:focus{outline:none;border-color:#378ADD}
.mini-gantt{position:relative;height:80px;background:#f9f9f7;border:1px solid #e0e0da;border-radius:6px;overflow:hidden}
.mini-gantt-bar{position:absolute;top:8px;height:24px;border-radius:4px;font-size:9px;color:#fff;display:flex;align-items:center;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid rgba(0,0,0,.1)}

<body>

<div id="error-bar" class="error-bar">
  ⚠ <span id="error-msg">No se pudo conectar a la API</span>
  <button class="btn" style="margin-left:auto" onclick="loadFromAPI()">Reintentar</button>
</div>

<div id="app"><div class="loading"><div class="spinner"></div> Cargando órdenes...</div></div>

<div class="tt" id="tt">
  <div class="tt-title" id="tt-t"></div>
  <div class="tt-cliente" id="tt-c"></div>
  <div id="tt-b"></div>
</div>

<div class="dp" id="dp">
  <div class="dp-title">
    <span id="dp-title-txt">Detalle OP</span>
    <span class="dp-close" onclick="closeDP()">✕</span>
  </div>
  <div class="dp-subtitle" id="dp-subtitle"></div>
  <div class="dp-tabs" id="dp-tabs">
    <button class="dp-tab active" data-dp-tab="info" onclick="switchDPTab('info')">📋 Detalle</button>
    <button class="dp-tab" data-dp-tab="flow" onclick="switchDPTab('flow')">🔄 Flujo</button>
  </div>
  <div id="dp-body"></div>
  <button class="save-btn" id="save-btn" onclick="saveDP()">Guardar cambios</button>
</div>

<script>
const API = '/api/planificacion';
let HOURS = [];
let SLOTS = 15;
let DAYS = [];
let zoomLevel = 'week';
const ZOOM_CONFIG = {
  day:    { label: '1 día',   hours: 24,  slotW: 160, granularity: 'halfhour' },
  '3day': { label: '3 días',  hours: 72,  slotW: 80,  granularity: 'hour'     },
  week:   { label: '1 sem',   hours: 168, slotW: 52,  granularity: 'day'      },
  '2week':{ label: '15 días', hours: 360, slotW: 36,  granularity: 'day'      }
};

// Los únicos procesos que aparecen en el Gantt — en este orden exacto
const GANTT_PROCESS_KEYS = ['diseno','preprensa','visto_bueno','impresion','rebobinado','empaque'];
const searchParams = new URLSearchParams(window.location.search);
const autoPlanRequested = searchParams.get('autoplan') === '1';

let orders    = [];
let machines  = [];
let procesos  = [];
let dragOp    = null;
let currentDP = null;
let currentDPTab = 'info';
let dpFlowPayload = null;
let activeChainIds = null;
let isOnline  = false;
let hasAutoPlanned = false;
let currentView = 'pipeline'; // 'pipeline' | 'gantt'
let pipelineFilter = '';
let pipelineFilterEstado = '';
let ganttFilter = ''; // buscador en Gantt
const expandedProcessIds = new Set();
const ROUTE_COLORS = ['#378ADD','#1D9E75','#BA7517','#E24B4A','#639922','#8B5CF6','#0EA5E9','#F59E0B','#64748B',''];

// Pipeline process definitions — el orden importa
const PIPELINE_PROCESSES = [
  { key: 'seguimiento',  label: 'Seguimiento',  icon: '📋', color: '#64748B', bgLight: '#f1f5f9', bgHeader: '#e2e8f0', textColor: '#334155' },
  { key: 'diseno',       label: 'Diseño',        icon: '🎨', color: '#8B5CF6', bgLight: '#f5f3ff', bgHeader: '#ede9fe', textColor: '#5b21b6' },
  { key: 'preprensa',    label: 'Preprensa',     icon: '🖥',  color: '#0EA5E9', bgLight: '#f0f9ff', bgHeader: '#e0f2fe', textColor: '#0369a1' },
  { key: 'visto_bueno',  label: 'Visto Bueno',   icon: '✅', color: '#1D9E75', bgLight: '#f0fdf4', bgHeader: '#dcfce7', textColor: '#15803d' },
  { key: 'impresion',    label: 'Impresión',     icon: '🖨',  color: '#185FA5', bgLight: '#eff6ff', bgHeader: '#dbeafe', textColor: '#1d4ed8' },
  { key: 'rebobinado',   label: 'Rebobinado',    icon: '🔄', color: '#BA7517', bgLight: '#fffbeb', bgHeader: '#fef3c7', textColor: '#92400e' },
  { key: 'empaque',      label: 'Empaque',       icon: '📦', color: '#639922', bgLight: '#f7fee7', bgHeader: '#ecfccb', textColor: '#3f6212' },
];

function normalizeProcessKey(raw) {
  return String(raw || '').trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/\s+/g, '_');
}

function getPipelineProc(processKey) {
  const k = normalizeProcessKey(processKey);
  const found = PIPELINE_PROCESSES.find(p =>
    k === p.key || k.includes(p.key) || p.key.includes(k)
  );
  return found || PIPELINE_PROCESSES[0];
}

function configureTimelineHorizon() {
  const cfg = ZOOM_CONFIG[zoomLevel];
  // SLOTS = number of half-hour blocks in day mode, hours otherwise
  const useHalfHours = cfg.granularity === 'halfhour';
  const slotUnit = useHalfHours ? 0.5 : 1; // hours per slot
  const maxEnd = Math.max(cfg.hours, ...orders.map(o => Number(o.inicio || 0) + Number(o.dur || 0)));
  const minSlots = Math.ceil(cfg.hours / slotUnit);
  SLOTS = useHalfHours
    ? minSlots
    : Math.max(cfg.hours, Math.min(cfg.hours * 2, Math.ceil(maxEnd) + 2));
  const base = new Date();
  base.setHours(6, 0, 0, 0);

  if (useHalfHours) {
    HOURS = Array.from({ length: SLOTS }, (_, i) => {
      const stamp = new Date(base.getTime() + i * 30 * 60000);
      if (i === 0 || (stamp.getHours() === 0 && stamp.getMinutes() === 0)) {
        return stamp.toLocaleDateString('es-CR', { day: '2-digit', month: '2-digit' });
      }
      if (stamp.getMinutes() === 0) {
        return stamp.toLocaleTimeString('es-CR', { hour: 'numeric', hour12: true });
      }
      return stamp.getMinutes() === 30 ? ':30' : '';
    });
  } else if (cfg.granularity === 'hour') {
    HOURS = Array.from({ length: SLOTS }, (_, i) => {
      const stamp = new Date(base.getTime() + i * 3600000);
      if (i === 0 || stamp.getHours() === 0) {
        return stamp.toLocaleDateString('es-CR', { day: '2-digit', month: '2-digit' });
      }
      return stamp.toLocaleTimeString('es-CR', { hour: 'numeric', hour12: true });
    });
  } else {
    HOURS = Array.from({ length: SLOTS }, (_, i) => {
      const stamp = new Date(base.getTime() + i * 3600000);
      if (stamp.getHours() === 6 || i === 0) {
        return stamp.toLocaleDateString('es-CR', { weekday: 'short', day: 'numeric' });
      }
      return '';
    });
  }

  // slotUnit stored globally for bar position calculations
  window._ganttSlotUnit = slotUnit;

  const dayMap = {};
  DAYS = [];
  for (let i = 0; i < SLOTS; i++) {
    const stamp = new Date(base.getTime() + i * slotUnit * 3600000);
    const dayKey = stamp.toLocaleDateString('es-CR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    if (!dayMap[dayKey]) {
      dayMap[dayKey] = {
        key: dayKey,
        label: stamp.toLocaleDateString('es-CR', { weekday: 'long', day: 'numeric', month: 'short' }),
        slot: i
      };
      DAYS.push(dayMap[dayKey]);
    }
  }
}

function setZoom(level) {
  if (!ZOOM_CONFIG[level]) return;
  zoomLevel = level;
  if (orders.length) {
    configureTimelineHorizon();
    renderGantt();
    drawArrows();
  }
  document.querySelectorAll('.zoom-btn').forEach(b => {
    b.classList.toggle('zoom-active', b.dataset.zoom === level);
  });
}

function displayProcessName(value) {
  const raw = String(value || '').trim();
  const k = normalizeProcessKey(raw);
  const labels = {
    diseno:'Diseño', preprensa:'Preprensa', impresion:'Impresión',
    impresion_convencional:'Impresión Convencional', impresion_digital:'Impresión Digital',
    barnizado:'Barniz', barniz:'Barniz', numeracion:'Numeración',
    rebobinado:'Rebobinado', empaque:'Empaque', seguimiento:'Seguimiento',
    visto_bueno:'Visto Bueno'
  };
  return labels[k] || raw || 'Sin proceso';
}

// ── API ──────────────────────────────────────────────────────
async function loadFromAPI() {
  try {
    const [res, costsRes] = await Promise.all([
      fetch(`${API}/gantt-agrupado`),
      fetch('/api/costos-config').catch(() => null)
    ]);
    if (!res.ok) throw new Error('Error HTTP ' + res.status);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error en respuesta');

    let costsProcessOrder = {};
    if (costsRes && costsRes.ok) {
      const costsData = await costsRes.json();
      const defaults = costsData?.general?.processDefaults || [];
      defaults.forEach((p, idx) => {
        const key = (p.key || '').toLowerCase().trim();
        costsProcessOrder[key] = {
          order: p.order != null ? p.order : (idx + 1) * 10,
          ganttEnabled: p.ganttEnabled !== false,
          label: p.label || key
        };
      });
    }

    machines = data.maquinas;
    orders = data.rutas.map(r => ({
      id:          r.codigo_op,
      id_ruta:     r.id_ruta,
      cliente:     r.cliente,
      articulo:    r.articulo,
      saidel:      r.saidel || '—',
      colores:     r.colores,
      pies:        r.pies,
      proceso:     displayProcessName(r.proceso),
      proceso_key: normalizeProcessKey(r.proceso),
      maquina:     r.maquina,
      inicio:      parseFloat(r.inicio),
      dur:         parseFloat(r.dur),
      trans_costo: r.trans_costo || 0,
      dep:         r.dep || null,
      dep_ruta_id: r.dep_ruta_id || null,
      estado:      r.estado,
      alerta:      !!r.alerta,
      alerta_tipo: r.alerta || null,
      fecha_fin_produccion:     r.fecha_fin_produccion || null,
      fecha_entrega_prometida:  r.fecha_entrega_prometida || null,
      route_payload:    r.route_payload || {},
      planning_snapshot: r.planning_snapshot || null,
      manual_lock:  Boolean(r.route_payload?.manualLock),
      schedule_mode: r.route_payload?.scheduleMode || r.route_payload?.schedule_mode || '',
    }));
    configureTimelineHorizon();

    const grupos = {};
    machines.forEach(m => {
      // Normalizar: agregar _matchId con todos los posibles IDs para matching con orders.maquina
      m._matchId = String(m.id_maquina || m.id || m.machine_profile_id || '');
      const processKey = (m.process_key || '').toLowerCase().trim();
      const costCfg = costsProcessOrder[processKey];
      if (costCfg && !costCfg.ganttEnabled) return;
      const key = m.id_proceso || processKey || 0;
      if (!grupos[key]) grupos[key] = {
        id_proceso:   m.id_proceso,
        process_key:  processKey,
        nombre:       displayProcessName(m.proceso_nombre),
        color:        m.color_hex      || '#888',
        icono:        m.proceso_icono  || '⚙',
        orden:        costCfg ? costCfg.order : (m.orden_secuencia || 99),
        maquinas:     []
      };
      grupos[key].maquinas.push(m);
    });
    procesos = Object.values(grupos).sort((a, b) => a.orden - b.orden);

    setOnline(true);
    render();
  } catch (e) {
    setOnline(false);
    showError('No se pudo conectar a la planificación del ERP — ' + e.message);
    if (!orders.length) {
      document.getElementById('app').innerHTML =
        `<div class="loading" style="flex-direction:column;gap:8px">
          <span style="font-size:22px">⚡</span>
          <span>API offline. Asegurate que el servidor Express esté corriendo.</span>
          <code style="font-size:11px;background:#f0f0ea;padding:4px 8px;border-radius:4px">node server.js</code>
         </div>`;
    }
  }
}

async function apiPatch(url, body) {
  const res = await fetch(url, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const payload = await res.json();
  if (!res.ok || payload.ok === false) throw new Error(payload.error || 'No se pudo guardar el cambio.');
  return payload;

// ── CONFLICT DETECTION ──────────────────────────────────────
function detectAllConflicts() {
  const conflicts = [];
  for (let i = 0; i < orders.length; i++) {
    const a = orders[i];
    const aEnd = a.inicio + a.dur;
    for (let j = i + 1; j < orders.length; j++) {
      const b = orders[j];
      const bEnd = b.inicio + b.dur;
      if (a.maquina === b.maquina && a.id_ruta !== b.id_ruta) {
        if (a.inicio < bEnd && aEnd > b.inicio) {
          conflicts.push({ type:'machine', ruta_a:a.id_ruta, ruta_b:b.id_ruta,
            message:`Máquina ${a.maquina}: "${a.id}" y "${b.id}" se superponen`});
        }
      }
      if (a.id === b.id) {
        if (b.dep_ruta_id === a.id_ruta || (b.dep === a.id && b.id_ruta !== a.id_ruta)) {
          if (b.inicio < aEnd) {
            conflicts.push({ type:'sequence', ruta_a:a.id_ruta, ruta_b:b.id_ruta,
              message:`Orden ${a.id}: "${b.proceso}" empieza antes de que "${a.proceso}" termine`});
          }
        }
        if (a.dep_ruta_id === b.id_ruta || (a.dep === b.id && a.id_ruta !== b.id_ruta)) {
          if (a.inicio < bEnd) {
            conflicts.push({ type:'sequence', ruta_a:b.id_ruta, ruta_b:a.id_ruta,
              message:`Orden ${b.id}: "${a.proceso}" empieza antes de que "${b.proceso}" termine`});
          }
        }
      }
    }
  }
  return conflicts;
}

function getOrderChainBounds(orderCode) {
  const ops = orders.filter(o => o.id === orderCode);
  if (!ops.length) return null;
  return ops.reduce((acc, op) => {
    const end = op.inicio + op.dur;
    return { minStart: Math.min(acc.minStart, op.inicio), maxEnd: Math.max(acc.maxEnd, end) };
  }, { minStart: Infinity, maxEnd: 0 });
}

function promisedHourSlot(value) {
  if (!value || !String(value).includes('T')) return null;
  const date = new Date(value);
  if (isNaN(date.getTime())) return null;
  const slot = (date.getHours() + date.getMinutes() / 60) - 6;
  return isFinite(slot) ? Math.max(0, Math.min(SLOTS, slot)) : null;
}

function detectScheduleAlerts() {
  const alerts = [];
  const seen = new Set();
  orders.forEach(op => {
    if (seen.has(op.id)) return;
    seen.add(op.id);
    const productionEnd = firstOrderValue(op.id, 'fecha_fin_produccion');
    const promisedDate  = firstOrderValue(op.id, 'fecha_entrega_prometida');
    if (productionEnd && promisedDate) {
      if (dateKey(productionEnd) > dateKey(promisedDate)) {
        alerts.push({ type:'late', orderCode:op.id, slack:-24, message:`${op.id} termina producción después de fecha estimada` });
        return;
      }
    }
    const dueSlot = promisedHourSlot(op.fecha_entrega_prometida);
    if (dueSlot === null) return;
    const bounds = getOrderChainBounds(op.id);
    if (!bounds) return;
    const slack = Number((dueSlot - bounds.maxEnd).toFixed(2));
    if (slack < 0) {
      alerts.push({ type:'late', orderCode:op.id, slack, message:`${op.id} termina ${Math.abs(slack).toFixed(2)}h después de entrega prometida` });
    } else if (slack <= 1) {
      alerts.push({ type:'tight', orderCode:op.id, slack, message:`${op.id} queda con solo ${slack.toFixed(2)}h de margen` });
    }
  });
  return alerts;
}

function firstOrderValue(orderCode, field) {
  const item = orders.find(o => o.id === orderCode && o[field]);
  return item ? item[field] : null;
}

function dateKey(value) {
  const date = new Date(value);
  if (isNaN(date.getTime())) return '';
  return date.toISOString().slice(0, 10);
}

function orderOverlapsVisible(op) {
  const start = Number(op?.inicio || 0);
  const end = start + Number(op?.dur || 0);
  return start < SLOTS && end > 0;
}

function processDomKey(proc) {
  return String(proc?.id_proceso || proc?.nombre || 'sin-proceso');
}

function machineVisibleOps(machineMatchId) {
  // orders.maquina puede ser machine_profile_id, id_maquina, o cualquier UUID de la API.
  // Comparamos con _matchId que normalizamos al cargar.
  return orders.filter(o => {
    if (!orderOverlapsVisible(o)) return false;
    return String(o.maquina || '') === String(machineMatchId || '');
  });
}

function getMachineMatchId(m) {
  return String(m._matchId || m.id_maquina || m.id || '');
}

function openConflictsModal() {
  const conflicts = detectAllConflicts();
  const scheduleAlertsList = detectScheduleAlerts();
  if (!conflicts.length && !scheduleAlertsList.length) {
    alert('✓ No hay conflictos ni alertas en el tablero.');
    return;
  }

  // Group conflicts by order
  const byOrder = {};
  conflicts.forEach(c => {
    const opA = orders.find(o => o.id_ruta === c.ruta_a);
    const opB = orders.find(o => o.id_ruta === c.ruta_b);
    const orderCode = opA?.id || opB?.id || 'Desconocido';
    if (!byOrder[orderCode]) byOrder[orderCode] = [];
    byOrder[orderCode].push(c);
  });

  // Add schedule alerts by order
  scheduleAlertsList.forEach(sa => {
    const orderCode = sa.orderCode;
    if (!byOrder[orderCode]) byOrder[orderCode] = [];
    byOrder[orderCode].push({ type: sa.type, message: sa.message, isAlert: true });
  });

  let bodyHtml = '';
  Object.keys(byOrder).sort().forEach(orderCode => {
    const items = byOrder[orderCode];
    const machineCount = items.filter(c => c.type === 'machine').length;
    const seqCount = items.filter(c => c.type === 'sequence').length;
    const alertCount = items.filter(c => c.isAlert).length;
    const badges = [];
    if (machineCount) badges.push(`<span class="conflict-type-machine">⊗ ${machineCount} máquina</span>`);
    if (seqCount) badges.push(`<span class="conflict-type-sequence">⧗ ${seqCount} secuencia</span>`);
    if (alertCount) badges.push(`<span style="color:#E24B4A">⚠ ${alertCount} alerta</span>`);

    bodyHtml += `
    <div class="conflict-group">
      <div class="conflict-group-header">
        <div class="conflict-group-title">
          <span>${orderCode}</span>
          <span style="font-weight:400;font-size:10px;color:#888">(${items.length} conflicto${items.length>1?'s':''})</span>
        </div>
        <div style="display:flex;gap:6px;font-size:10px">${badges.join('')}</div>
      </div>
      <div class="conflict-group-body">
        ${items.map(c => {
          if (c.isAlert) {
            const icon = c.type === 'late' ? '⏰' : '⌛';
            return `<div class="conflict-item"><span class="conflict-icon">${icon}</span><span>${c.message}</span></div>`;
          }
          const icon = c.type === 'machine' ? '⊗' : '⧗';
          const cls = c.type === 'machine' ? 'conflict-type-machine' : 'conflict-type-sequence';
          return `<div class="conflict-item"><span class="conflict-icon ${cls}">${icon}</span><span>${c.message}</span></div>`;
        }).join('')}
      </div>
    </div>`;
  });

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
  <div class="modal-box">
    <div class="modal-header">
      <h3>Conflictos del tablero (${conflicts.length} conflicto${conflicts.length!==1?'s':''})</h3>
      <span class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</span>
    </div>
    <div class="modal-body">
      ${bodyHtml || '<div style="text-align:center;color:#aaa;padding:20px">Sin conflictos</div>'}
    </div>
  </div>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function checkMove(id_ruta, newStart, newDur, newMaq) {
  const op = orders.find(o => o.id_ruta === id_ruta);
  if (!op) return [];
  const newEnd = newStart + newDur;
  const issues = [];
  orders.filter(o => o.id_ruta !== id_ruta && o.maquina === newMaq).forEach(o => {
    const oEnd = o.inicio + o.dur;
    if (newStart < oEnd && newEnd > o.inicio) {
      issues.push({ type:'machine', id_ruta:o.id_ruta,
        message:`Máquina ${newMaq}: conflicto con "${o.id}" · ${o.proceso} (${formatHora(o.inicio)}–${formatHora(oEnd)})` });
    }
  });
  const pred = orders.find(o =>
    op.dep_ruta_id === o.id_ruta || (op.dep && op.dep === o.id && o.id_ruta !== id_ruta)
  );
  if (pred) {
    const predEnd = pred.inicio + pred.dur;
    if (newStart < predEnd) {
      issues.push({ type:'sequence', id_ruta:pred.id_ruta,
        message:`"${pred.proceso}" de ${pred.id} termina a las ${formatHora(predEnd)} — no puede empezar antes` });
    }
  }
  orders.filter(o => o.dep_ruta_id === id_ruta || (o.dep === op.id && o.id !== op.id)).forEach(succ => {
    if (succ.inicio < newEnd) {
      issues.push({ type:'sequence', id_ruta:succ.id_ruta,
        message:`"${succ.proceso}" empieza a las ${formatHora(succ.inicio)}, antes de que este proceso termine` });
    }
  });
  return issues;
}

function autoFix(id_ruta, newEnd) {
  function push(rid, mustStartAfter) {
    orders.filter(o =>
      o.dep_ruta_id === rid || (o.dep && orders.find(x => x.id_ruta === rid)?.id === o.dep)
    ).forEach(succ => {
      if (succ.inicio < mustStartAfter) {
        succ.inicio = parseFloat(mustStartAfter.toFixed(2));
        push(succ.id_ruta, succ.inicio + succ.dur);
      }
    });
  }
  push(id_ruta, newEnd);
}

function getMachineKey(machine) {
  return String(machine?.id_maquina || machine?.id || '');
}

function getDirectSuccessors(id_ruta) {
  const current = orders.find(o => o.id_ruta === id_ruta);
  return orders
    .filter(o => o.dep_ruta_id === id_ruta || (o.dep && current && o.dep === current.id && o.id !== current.id))
    .sort((a, b) => {
      const dueDiff = parsePromisedTime(a.fecha_entrega_prometida) - parsePromisedTime(b.fecha_entrega_prometida);
      return dueDiff !== 0 ? dueDiff : a.inicio - b.inicio;
    });
}

function getChainOpsOrdered(rootId) {
  const ordered = [];
  const visited = new Set();
  function walk(routeId) {
    if (visited.has(routeId)) return;
    const op = orders.find(o => o.id_ruta === routeId);
    if (!op) return;
    visited.add(routeId);
    ordered.push(op);
    getDirectSuccessors(routeId).forEach(succ => walk(succ.id_ruta));
  }
  walk(rootId);
  return ordered;
}

function getOrderOps(orderCode) {
  return orders.filter(o => o.id === orderCode);
}

function getChainDuration(chain) {
  return chain.reduce((sum, op) => sum + op.dur, 0);
}

function getChain(id_ruta) {
  const op = orders.find(o => o.id_ruta === id_ruta);
  if (!op) return new Set();
  const codigoOp = op.id;
  const chain = new Set();
  orders.filter(o => o.id === codigoOp).forEach(o => chain.add(o.id_ruta));
  function addUpstream(rutaId) {
    const o = orders.find(x => x.id_ruta === rutaId);
    if (!o || !o.dep_ruta_id || chain.has(o.dep_ruta_id)) return;
    chain.add(o.dep_ruta_id);
    addUpstream(o.dep_ruta_id);
  }
  function addDownstream(rutaId) {
    orders.filter(o => o.dep_ruta_id === rutaId).forEach(o => {
      if (chain.has(o.id_ruta)) return;
      chain.add(o.id_ruta);
      addDownstream(o.id_ruta);
    });
  }
  chain.forEach(rid => { addUpstream(rid); addDownstream(rid); });
  return chain;
}

// ── TASK BAR HTML ────────────────────────────────────────────
function taskBar(op, machineConflictRutas, sequenceConflictRutas) {
  const baseColor = op.alerta ? COLORS.PARO : (COLORS[op.estado] || COLORS.PENDIENTE);
  const customColor = String(op.route_payload?.colorHex || '').trim();
  const c = customColor ? { bg: customColor, bd: customColor, tx: '#fff' } : baseColor;
  const routeArg = String(op.id_ruta).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  let chainClass = '';
  if (activeChainIds) {
    chainClass = activeChainIds.has(op.id_ruta) ? ' chain-active' : ' chain-dim';
  }
  let conflictClass = '';
  if (!activeChainIds) {
    if (machineConflictRutas.has(op.id_ruta)) conflictClass = ' conflict-machine';
    else if (sequenceConflictRutas.has(op.id_ruta)) conflictClass = ' conflict-sequence';
  }
  const scheduleAlert = detectScheduleAlerts().find(e => e.orderCode === op.id);
  const scheduleClass = scheduleAlert
    ? (scheduleAlert.type === 'late' ? ' conflict-machine' : ' conflict-sequence') : '';
  const modeLabel = op.manual_lock ? 'Fijo' : op.schedule_mode === 'backward' ? 'Atrás' : op.schedule_mode === 'forward' ? 'Adelante' : '';
  const isRunning = op.estado === 'RUN' || op.estado === 'SETUP';
  const isLate = scheduleAlert?.type === 'late';
  const planningSnapshot = op.planning_snapshot || op.route_payload;
  const progressPct = isRunning ? Math.min(100, Math.round(Number(planningSnapshot?.progressPct || 0))) : 0;
  const hasProgress = progressPct > 0;
  const runningClass = isRunning ? ' is-running' : '';

  // For very narrow bars: show minimal content
  const barWidthPct = (op.dur / SLOTS) * 100;
  const slotW = ZOOM_CONFIG[zoomLevel].slotW;
  const estPx = (op.dur / SLOTS) * (SLOTS * slotW);
  const isNarrow = estPx < 70;
  const isVeryNarrow = estPx < 36;

  return `<div class="task-bar${chainClass}${conflictClass}${scheduleClass}${runningClass}"
    id="bar-${op.id_ruta}"
    data-id="${op.id}"
    data-ruta="${op.id_ruta}"
    style="left:${pct(op.inicio)};width:${pct(op.dur)};background:${c.bg};border-color:${c.bd};${isVeryNarrow?'padding:0 4px;min-width:24px':''}"
    draggable="true"
    onmouseenter="showTT(event,'${routeArg}')"
    onmouseleave="hideTT()"
    oncontextmenu="openColorMenu(event,'${routeArg}')"
    ondragstart="dragStart(event,'${routeArg}')"
    ondragend="dragEnd(event)"
    onclick="openDP('${routeArg}')"
    title="${op.id} · ${op.cliente} · ${op.proceso} · ${op.dur}h"
  >
    ${isLate ? '<div class="task-late-icon" title="Fuera de fecha prometida">⚠</div>' : ''}
    ${hasProgress ? `<div class="task-progress-track"><div class="task-progress-fill" style="width:${progressPct}%;background:rgba(255,255,255,.55)"></div></div>` : ''}
    ${!isVeryNarrow ? `<button type="button" class="task-config-btn" onclick="event.stopPropagation();openDP('${routeArg}')" title="Configurar">⋯</button>` : ''}
    ${isVeryNarrow
      ? `<div style="width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);margin:auto"></div>`
      : isNarrow
        ? `<div class="task-lbl" style="color:${c.tx};font-size:10px">${op.id}</div>`
        : `<div class="task-cliente" style="color:${c.tx}">${op.cliente}</div>
           <div class="task-lbl" style="color:${c.tx}">${op.id} · ${op.articulo}${op.manual_lock?' [Fijo]':''}</div>
           <div class="task-sub" style="color:${c.tx}">${op.proceso}${op.colores > 0 ? ' · '+op.colores+'C' : ''}${modeLabel?`<span class="task-mode-pill">${modeLabel}</span>`:''}</div>`
    }
  </div>`;
}

// ── MAIN RENDER ─────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');

  // First render: build skeleton
  if (!document.getElementById('hdr-section')) {
    app.innerHTML = `
      <div id="hdr-section"></div>
      <div id="pipeline-view" style="display:none"></div>
      <div id="gantt-view" style="display:none"></div>`;
  }

  renderHeader();

  if (currentView === 'pipeline') {
    document.getElementById('pipeline-view').style.display = 'block';
    document.getElementById('gantt-view').style.display = 'none';
    renderPipeline();
  } else {
    document.getElementById('pipeline-view').style.display = 'none';
    document.getElementById('gantt-view').style.display = 'block';
    renderGantt();
    requestAnimationFrame(() => drawArrows());
  }
}

function switchView(view) {
  currentView = view;
  render();
}

// ── PIPELINE VIEW ────────────────────────────────────────────
function renderPipeline() {
  const container = document.getElementById('pipeline-view');
  const scheduleAlerts = detectScheduleAlerts();
  const allConflicts   = detectAllConflicts();
  const conflictRutaSet = new Set(allConflicts.flatMap(c => [c.ruta_a, c.ruta_b]));

  // Build order route map to find "current process" for each order
  const orderRoutesMap = {};
  orders.forEach(op => {
    if (!orderRoutesMap[op.id]) orderRoutesMap[op.id] = [];
    orderRoutesMap[op.id].push(op);
  });

  // Today range: start_turn_hour 0-24 = today 6am to tomorrow 6am
  const todayBase = new Date();
  todayBase.setHours(6, 0, 0, 0);
  const todayStart = todayBase.getTime();
  const todayEnd = todayStart + 24 * 3600000;

  // Filter: only routes that are the "current process" for their order
  // A route is "current" if: prev process is COMPLETED (or no prev) AND this process is NOT COMPLETED
  let pipelineOrders = [];
  Object.keys(orderRoutesMap).forEach(orderCode => {
    const routes = orderRoutesMap[orderCode];
    routes.forEach(op => {
      if (op.estado === 'COMPLETADO') return;

      // Check if predecessor is completed
      let predCompleted = true;
      if (op.dep_ruta_id) {
        const pred = orders.find(o => o.id_ruta === op.dep_ruta_id);
        predCompleted = pred && pred.estado === 'COMPLETADO';
      }
      if (!predCompleted) return;

      // Check if scheduled for today (start_turn_hour 0-24)
      const inicio = Number(op.inicio || 0);
      if (inicio < 0 || inicio >= 24) return;

      pipelineOrders.push(op);
    });
  });

  // Apply search filter
  if (pipelineFilter) {
    const q = pipelineFilter.toLowerCase();
    pipelineOrders = pipelineOrders.filter(o =>
      o.id.toLowerCase().includes(q) ||
      o.cliente.toLowerCase().includes(q) ||
      o.articulo.toLowerCase().includes(q)
    );
  }

  // Group by pipeline process
  const groups = {};
  PIPELINE_PROCESSES.forEach(pp => { groups[pp.key] = []; });

  pipelineOrders.forEach(op => {
    const pp = getPipelineProc(op.proceso_key);
    if (!groups[pp.key]) groups[pp.key] = [];
    groups[pp.key].push(op);
  });

  // Sort each column by start time
  PIPELINE_PROCESSES.forEach(pp => {
    groups[pp.key].sort((a, b) => {
      const aAlert = scheduleAlerts.find(e => e.orderCode === a.id);
      const bAlert = scheduleAlerts.find(e => e.orderCode === b.id);
      const aPrio = aAlert?.type === 'late' ? 0 : aAlert?.type === 'tight' ? 1 : 2;
      const bPrio = bAlert?.type === 'late' ? 0 : bAlert?.type === 'tight' ? 1 : 2;
      if (aPrio !== bPrio) return aPrio - bPrio;
      return a.inicio - b.inicio;
    });
  });

  let html = `
  <div class="pipeline-filters">
    <input class="pipeline-search" type="text" placeholder="Buscar orden, cliente, artículo…"
      value="${escHtml(pipelineFilter)}"
      oninput="pipelineFilter=this.value;renderPipeline()"
    >
    <span class="filter-lbl" style="font-size:11px;color:#06b6d4;font-weight:600">
      📅 ${todayBase.toLocaleDateString('es-CR', { weekday: 'long', day: 'numeric', month: 'long' })}
    </span>
    <button class="btn" style="margin-left:auto" onclick="pipelineFilter='';renderPipeline()">Limpiar</button>
  </div>
  <div class="pipeline-board" style="padding:0 40px">`;

  PIPELINE_PROCESSES.forEach(pp => {
    const colOrders = groups[pp.key] || [];
    const lateCount = colOrders.filter(o => scheduleAlerts.find(e => e.orderCode === o.id && e.type === 'late')).length;

    html += `
    <div class="pipeline-col">
      <div class="pipeline-col-header" style="background:${pp.bgHeader};border-bottom-color:${pp.color}">
        <div class="pipeline-col-title" style="color:${pp.textColor}">
          <span>${pp.icon}</span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${pp.label}</span>
        </div>
        <div style="display:flex;gap:4px;align-items:center;flex-shrink:0">
          ${lateCount > 0 ? `<span style="font-size:10px;background:#fceaea;color:#A32D2D;border-radius:4px;padding:1px 4px;font-weight:700">⚠${lateCount}</span>` : ''}
          <span class="pipeline-col-count" style="background:${pp.color};color:#fff">${colOrders.length}</span>
        </div>
      </div>
      <div class="pipeline-cards">`;

    if (colOrders.length === 0) {
      html += `<div class="pipeline-empty">Sin órdenes pendientes</div>`;
    } else {
      colOrders.forEach(op => {
        const alert     = scheduleAlerts.find(e => e.orderCode === op.id);
        const isLate    = alert?.type === 'late';
        const isTight   = alert?.type === 'tight';
        const isRunning = op.estado === 'RUN' || op.estado === 'SETUP';
        const hasConflict = conflictRutaSet.has(op.id_ruta);
        const progressPct = isRunning ? Math.min(100, Math.round(Number(op.route_payload?.progressPct || op.planning_snapshot?.progressPct || 0))) : 0;
        const maquinaNombre = (machines.find(m => m.id_maquina === op.maquina || m.id === op.maquina)?.nombre_recurso || '').split(' ').slice(0,2).join(' ');
        const routeArg = String(op.id_ruta).replace(/\\/g,'\\\\').replace(/'/g,"\\'");

        // Format start time
        const inicio = Number(op.inicio || 0);
        const startHour = (6 + Math.floor(inicio)) % 24;
        const startMin = Math.round((inicio % 1) * 60);
        const timeLabel = String(startHour).padStart(2, '0') + ':' + String(startMin).padStart(2, '0');

        let cardExtra = '';
        if (isLate) cardExtra = ' is-late';
        else if (isTight) cardExtra = ' is-tight';
        else if (isRunning) cardExtra = ' is-running';

        const dueLabel = op.fecha_entrega_prometida ? formatPromisedDate(op.fecha_entrega_prometida) : null;
        const dueClass = isLate ? ' overdue' : isTight ? ' tight-date' : '';

        html += `
        <div class="pipeline-card${cardExtra}"
          style="border-left-color:${pp.color}"
          onclick="openDP('${routeArg}')"
        >
          <div class="pc-order">
            <span>${op.id}</span>
            <div style="display:flex;gap:2px;flex-shrink:0">
              ${isLate    ? '<span title="Fuera de fecha prometida" style="color:#E24B4A;font-size:11px">⚠</span>' : ''}
              ${isTight   ? '<span title="Margen ajustado" style="color:#BA7517;font-size:11px">⌛</span>' : ''}
              ${hasConflict ? '<span title="Conflicto de secuencia o máquina" style="color:#E24B4A;font-size:10px">⊗</span>' : ''}
              ${op.manual_lock ? '<span title="Orden fija" style="color:#aaa;font-size:10px">🔒</span>' : ''}
            </div>
          </div>
          <div class="pc-cliente">${escHtml(op.cliente)}</div>
          <div class="pc-articulo" title="${escHtml(op.articulo)}">${escHtml(op.articulo)}</div>
          <div class="pc-meta">
            <span class="pc-chip dur" title="Hora inicio">${timeLabel}</span>
            <span class="pc-chip dur" title="Duración estimada">${op.dur}h</span>
            ${op.colores > 0 ? `<span class="pc-chip colores" title="${op.colores} colores">${op.colores} col.</span>` : ''}
            ${maquinaNombre ? `<span class="pc-chip maq" title="Máquina: ${escHtml(maquinaNombre)}">${escHtml(maquinaNombre)}</span>` : ''}
            ${isLate  ? `<span class="pc-chip late" title="Retraso">+${Math.abs(alert.slack).toFixed(1)}h</span>` : ''}
            ${isTight ? `<span class="pc-chip tight" title="Margen">${alert.slack.toFixed(1)}h</span>` : ''}
            ${isRunning ? `<span class="pc-chip run">${op.estado}</span>` : ''}
          </div>
          ${dueLabel ? `<div class="pc-due${dueClass}" title="Entrega prometida">📅 ${dueLabel}</div>` : ''}
          ${progressPct > 0 ? `
          <div class="pc-progress" title="Progreso: ${progressPct}%">
            <div class="pc-progress-fill" style="width:${progressPct}%;background:${pp.color}"></div>
          </div>` : ''}
        </div>`;
      });
    }

    html += `</div></div>`;
  });

  html += `</div>`;
  container.innerHTML = html;
}

function renderGantt() {
  const container = document.getElementById('gantt-view');
  const allConflicts = detectAllConflicts();
  const machineConflictRutas   = new Set(allConflicts.filter(c=>c.type==='machine').flatMap(c=>[c.ruta_a,c.ruta_b]));
  const sequenceConflictRutas  = new Set(allConflicts.filter(c=>c.type==='sequence').flatMap(c=>[c.ruta_a,c.ruta_b]));

  const slotW = ZOOM_CONFIG[zoomLevel].slotW;

  let html = `
  <div class="gantt-zoom-bar">
    <span class="gantt-zoom-label" style="font-size:11px">Zoom:</span>
    <div class="zoom-group">
      <button class="btn zoom-btn${zoomLevel==='day'?' zoom-active':''}"    data-zoom="day"   onclick="setZoom('day')">1 día</button>
      <button class="btn zoom-btn${zoomLevel==='3day'?' zoom-active':''}"   data-zoom="3day"  onclick="setZoom('3day')">3 días</button>
      <button class="btn zoom-btn${zoomLevel==='week'?' zoom-active':''}"   data-zoom="week"  onclick="setZoom('week')">1 sem</button>
      <button class="btn zoom-btn${zoomLevel==='2week'?' zoom-active':''}"  data-zoom="2week" onclick="setZoom('2week')">15 días</button>
    </div>
    <div style="display:flex;align-items:center;gap:5px;margin-left:8px;border-left:1px solid #555;padding-left:10px">
      <input
        class="pipeline-search"
        type="text"
        placeholder="Buscar orden, cliente, artículo…"
        value="${escHtml(ganttFilter)}"
        oninput="ganttFilter=this.value;renderGantt();requestAnimationFrame(()=>drawArrows())"
        style="width:210px"
      >
      ${ganttFilter ? `<button class="btn" onclick="ganttFilter='';renderGantt();requestAnimationFrame(()=>drawArrows())" title="Limpiar búsqueda">✕</button>` : ''}
    </div>
    <button class="btn" style="margin-left:auto" onclick="clearChain()">Limpiar selección</button>
    <span style="font-size:11px;color:#777">Arrastrá para mover · Click para ver cadena</span>
  </div>
  <div class="gantt-wrap"><div class="gantt-inner" id="gantt-inner" style="min-width:${190 + SLOTS * slotW}px">
    <div class="g-header">
      <div class="res-col">Proceso / Recurso</div>
      <div class="time-col">
        <div class="day-hdr">${DAYS.map((d, di, arr) => {
          const nextSlot = di < arr.length - 1 ? arr[di+1].slot : SLOTS;
          const dayWidth = (nextSlot - d.slot) * slotW;
          return `<div class="day-hdr-item" style="width:${dayWidth}px">${d.label}</div>`;
        }).join('')}</div>
        <div class="time-hdr">${HOURS.map((h, i) => {
          if (!h) return `<div class="t-slot" style="min-width:${slotW}px"></div>`;
          return `<div class="t-slot" style="min-width:${slotW}px">${h}</div>`;
        }).join('')}</div>
      </div>
    </div>`;

  // Filtrar y reordenar estrictamente según GANTT_PROCESS_KEYS
  const ganttProcesos = GANTT_PROCESS_KEYS
    .map(gk => procesos.find(proc => {
      const pk = normalizeProcessKey(proc.process_key || proc.nombre);
      return pk === gk || pk.includes(gk) || gk.includes(pk);
    }))
    .filter(Boolean);

  // Filtro de búsqueda para el Gantt
  const ganttFilterLower = ganttFilter.toLowerCase();
  const filteredOrderIds = ganttFilter
    ? new Set(orders.filter(o =>
        o.id.toLowerCase().includes(ganttFilterLower) ||
        o.cliente.toLowerCase().includes(ganttFilterLower) ||
        o.articulo.toLowerCase().includes(ganttFilterLower)
      ).map(o => o.id_ruta))
    : null;

  ganttProcesos.forEach(proc => {
    const procKey = processDomKey(proc);
    const expanded = expandedProcessIds.has(procKey);
    // Usar getMachineMatchId para buscar órdenes asignadas
    const assignedMachines = proc.maquinas.filter(m => {
      const ops = machineVisibleOps(getMachineMatchId(m));
      return filteredOrderIds ? ops.some(o => filteredOrderIds.has(o.id_ruta)) : ops.length > 0;
    });
    const visibleMachines  = expanded ? proc.maquinas : assignedMachines;
    const hiddenCount = proc.maquinas.length - visibleMachines.length;

    html += `

        <span class="proceso-empty-note">${assignedMachines.length ? 'Recursos con órdenes' : 'Sin recursos asignados'}</span>
        ${hiddenCount > 0 || expanded
          ? `<button type="button" class="proceso-toggle" onclick='toggleProcessMachines(${JSON.stringify(procKey)})'>${expanded?'Ocultar vacías':`Ver todas (${proc.maquinas.length})`}</button>`
          : ''}
      </div>
    </div>`;

    visibleMachines.forEach(m => {
      const mid = getMachineMatchId(m);
      let mOps = machineVisibleOps(mid);
      if (filteredOrderIds) mOps = mOps.filter(o => filteredOrderIds.has(o.id_ruta));
      const machineSub = [m.sub_descripcion || '', mOps.length ? `${mOps.length} asignada${mOps.length>1?'s':''}` : ''].filter(Boolean).join(' · ');

      html += `
      <div class="g-row" data-machine="${mid}" style="border-left:3px solid ${proc.color}">
        <div class="res-lbl">
          <span class="res-name">${m.nombre_recurso}</span>
          ${machineSub ? `<span class="res-sub">${machineSub}</span>` : ''}
          ${mOps.length > 0 ? `<span class="res-count">${mOps.length} orden${mOps.length>1?'es':''}</span>` : ''}
        </div>
        <div class="timeline" data-machine="${mid}">
          <div class="drop-hint"></div>
          ${HOURS.map((_, i) => `<div class="grid-ln" style="left:${pct(i)}"></div>`).join('')}
          ${DAYS.filter(d => d.slot > 0).map(d => `<div class="day-sep" style="left:${pct(d.slot)}"></div>`).join('')}
          ${mOps.map(op => taskBar(op, machineConflictRutas, sequenceConflictRutas)).join('')}
        </div>
      </div>`;
    });
  });

  if (ganttProcesos.length === 0) {
    html += `<div style="padding:32px;text-align:center;color:#aaa">
      ⚙ No hay procesos configurados para el Gantt. <a href="configuracion.html" style="color:#378ADD">Ir a Configuración →</a>
    </div>`;
  }

  html += `</div></div>
  <div class="legend">
    <span class="leg-item"><span class="leg-dot" style="background:#1D9E75"></span>En ejecución</span>
    <span class="leg-item"><span class="leg-dot" style="background:#BA7517"></span>Setup</span>
    <span class="leg-item"><span class="leg-dot" style="background:#378ADD"></span>Pendiente</span>
    <span class="leg-item"><span class="leg-dot" style="background:#E24B4A"></span>Alerta</span>
    <span class="leg-item"><span class="leg-dot" style="background:#639922"></span>Completado</span>
    <span class="leg-item" style="font-size:10px;color:#aaa;margin-left:auto">
      <span style="background:#06b6d4;padding:1px 5px;border-radius:3px;color:#fff">⬤</span> Cadena activa
    </span>
  </div>`;

  container.innerHTML = html;
  setupDropZones();
  requestAnimationFrame(() => drawNowLine());
}

// ── SVG ARROWS ───────────────────────────────────────────────
function drawArrows() {
  const ganttEl = document.getElementById('gantt-inner');
  if (!ganttEl) return;
  document.getElementById('arrows-svg')?.remove();

  const visibleBarIds = new Set();
  orders.forEach(o => {
    const el = document.getElementById('bar-' + o.id_ruta);
    if (el) visibleBarIds.add(o.id_ruta);
  });
  if (!visibleBarIds.size) return;

  const orderMap = new Map(orders.map(o => [o.id_ruta, o]));

  const visibleDeps = [];
  orders.forEach(op => {
    if (!op.dep_ruta_id && !op.dep) return;
    let ancestorId = op.dep_ruta_id;
    if (!ancestorId && op.dep) {
      const srcOp = orders.find(o => o.id === op.dep);
      if (srcOp) ancestorId = srcOp.id_ruta;
    }
    if (!ancestorId) return;

    const visited = new Set([op.id_ruta]);
    let curId = ancestorId;
    while (curId && !visibleBarIds.has(curId) && !visited.has(curId)) {
      visited.add(curId);
      const cur = orderMap.get(curId);
      if (!cur) break;
      let nextId = cur.dep_ruta_id;
      if (!nextId && cur.dep) {
        const nextOp = orders.find(o => o.id === cur.dep);
        if (nextOp) nextId = nextOp.id_ruta;
      }
      curId = nextId;
    }

    if (curId && visibleBarIds.has(curId) && curId !== op.id_ruta) {
      visibleDeps.push({ srcId: curId, dstId: op.id_ruta });
    }
  });

  if (!visibleDeps.length) return;

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.id = 'arrows-svg';
  ganttEl.appendChild(svg);

  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  [
    {id:'arr-normal',color:'#7c8594'},
    {id:'arr-active',color:'#06b6d4'},
    {id:'arr-dim',   color:'#d0d0d0'},
  ].forEach(({id,color}) => {
    const marker = document.createElementNS('http://www.w3.org/2000/svg','marker');
    marker.setAttribute('id',id); marker.setAttribute('markerWidth','10');
    marker.setAttribute('markerHeight','10'); marker.setAttribute('refX','8');
    marker.setAttribute('refY','5'); marker.setAttribute('orient','auto');
    const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points','0 1, 9 5, 0 9'); poly.setAttribute('fill',color);
    marker.appendChild(poly); defs.appendChild(marker);
  });
  svg.appendChild(defs);

  const ganttRect = ganttEl.getBoundingClientRect();

  visibleDeps.forEach(({ srcId, dstId }) => {
    const srcBar = document.getElementById('bar-' + srcId);
    const dstBar = document.getElementById('bar-' + dstId);
    if (!srcBar || !dstBar) return;
    const sRect = srcBar.getBoundingClientRect();
    const dRect = dstBar.getBoundingClientRect();
    const x1 = sRect.right  - ganttRect.left;
    const y1 = sRect.top    - ganttRect.top + sRect.height / 2;
    const x2 = dRect.left   - ganttRect.left;
    const y2 = dRect.top    - ganttRect.top + dRect.height / 2;

    let arrowClass = 'arr-normal';
    if (activeChainIds) {
      arrowClass = (activeChainIds.has(srcId) && activeChainIds.has(dstId)) ? 'arr-active' : 'arr-dim';
    }

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const dx = x2 - x1;
    const dy = y2 - y1;
    const cx1 = x1 + dx * 0.4;
    const cx2 = x2 - dx * 0.4;
    path.setAttribute('d', `M${x1},${y1} C${cx1},${y1} ${cx2},${y2} ${x2},${y2}`);
    path.setAttribute('fill','none');
    path.setAttribute('stroke', arrowClass==='arr-active' ? '#06b6d4' : arrowClass==='arr-dim' ? '#d0d0d0' : '#7c8594');
    path.setAttribute('stroke-width', arrowClass==='arr-active' ? '2.5' : '1.5');
    path.setAttribute('stroke-dasharray', arrowClass==='arr-normal' ? '5 3' : 'none');
    path.setAttribute('marker-end', `url(#${arrowClass})`);
    path.setAttribute('opacity', arrowClass==='arr-dim' ? '0.35' : '0.9');
    svg.appendChild(path);
  });
}

function drawNowLine() {
  document.querySelectorAll('.now-line').forEach(el => el.remove());
  const ganttEl = document.getElementById('gantt-inner');
  if (!ganttEl) return;

  const slotUnit = window._ganttSlotUnit || 1;
  const base = new Date();
  base.setHours(6, 0, 0, 0);
  const nowMs = Date.now();
  const baseMs = base.getTime();
  const hoursSinceBase = (nowMs - baseMs) / 3600000;

  if (hoursSinceBase < 0 || hoursSinceBase >= SLOTS * slotUnit) return;

  const slotPos = hoursSinceBase / slotUnit;
  const leftPct = (slotPos / SLOTS) * 100;

  const line = document.createElement('div');
  line.className = 'now-line';
  line.style.left = leftPct + '%';
  line.style.cursor = 'default';
  line.addEventListener('mouseenter', (e) => {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('es-CR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    const dateStr = now.toLocaleDateString('es-CR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const tt = document.getElementById('tt');
    document.getElementById('tt-t').textContent = 'Hora actual';
    document.getElementById('tt-c').textContent = dateStr;
    document.getElementById('tt-b').innerHTML = `<div class="tt-row"><span>Hora</span><span class="tt-val" style="color:#E24B4A;font-size:14px;font-weight:600">${timeStr}</span></div>`;
    tt.style.display = 'block';
    tt.style.left = (e.clientX + 14) + 'px';
    tt.style.top = (e.clientY - 16) + 'px';
  });
  line.addEventListener('mousemove', (e) => {
    const tt = document.getElementById('tt');
    tt.style.left = (e.clientX + 14) + 'px';
    tt.style.top = (e.clientY - 16) + 'px';
  });
  line.addEventListener('mouseleave', () => {
    document.getElementById('tt').style.display = 'none';
  });
  ganttEl.appendChild(line);
}

function updateNowLine() {
  drawNowLine();
}

function clearChain() {
  activeChainIds = null;
  renderGantt();
  drawArrows();
}

// ── DRAG & DROP ──────────────────────────────────────────────
function dragStart(e, id_ruta) {
  const el = document.getElementById('bar-' + id_ruta);
  if (!el) return;
  dragOp = orders.find(o => o.id_ruta === id_ruta);
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(id_ruta));
  if (el) { el.classList.add('dragging'); }
  // Highlight all timelines as potential drop targets
  requestAnimationFrame(() => {
    document.querySelectorAll('.timeline').forEach(tl => tl.style.cursor = 'copy');
  });
}

function dragEnd(e) {
  document.querySelectorAll('.g-row').forEach(r => r.classList.remove('drag-over'));
  document.querySelectorAll('.timeline').forEach(tl => tl.style.cursor = '');
  if (dragOp) {
    const el = document.getElementById('bar-' + dragOp.id_ruta);
    if (el) { el.classList.remove('dragging'); }
  }
  dragOp = null;
}

function getDropSlot(tl, clientX) {
  const rect = tl.getBoundingClientRect();
  const pctX = (clientX - rect.left) / rect.width;
  const raw  = pctX * SLOTS;
  return Math.round(raw * 4) / 4;
}

function getMachineFromTimeline(tl) {
  return tl.dataset.machine || tl.closest('.g-row')?.dataset?.machine || '';
}

async function handleDrop(e, tl) {
  e.preventDefault();
  tl.closest('.g-row')?.classList.remove('drag-over');

  const draggedId = dragOp?.id_ruta || e.dataTransfer.getData('text/plain');
  const movedOp = dragOp || orders.find(o => String(o.id_ruta) === String(draggedId));
  if (!movedOp) return;

  const newStart = Math.max(0, Math.min(SLOTS - movedOp.dur, getDropSlot(tl, e.clientX)));
  const newMaq   = getMachineFromTimeline(tl);

  if (newStart === movedOp.inicio && newMaq === movedOp.maquina) return;

  const issues  = checkMove(movedOp.id_ruta, newStart, movedOp.dur, newMaq);

  if (issues.length > 0) {
    openMoveModal(movedOp, newStart, newMaq, issues);
    return;
  }

  const before = new Map(orders.map(o => [o.id_ruta, { inicio: o.inicio, maquina: o.maquina }]));
  movedOp.inicio  = newStart;
  movedOp.maquina = newMaq;
  autoFix(movedOp.id_ruta, newStart + movedOp.dur);

  const changedOps = orders.filter(o => {
    const prev = before.get(o.id_ruta) || {};
    return prev.inicio !== o.inicio || prev.maquina !== o.maquina;
  });

  renderGantt();
  requestAnimationFrame(() => drawArrows());

  try {
    await Promise.all(changedOps.map(op => apiPatch(`${API}/gantt/mover`, {
      id_ruta: op.id_ruta, inicio: op.inicio, id_maquina: op.maquina
    })));
    showToast(`✓ Movimiento guardado (${changedOps.length} ruta${changedOps.length>1?'s':''})`, 'ok');
    await loadFromAPI();
  } catch (err) {
    showError('Error guardando movimiento: ' + err.message);
  }
}

function openMoveModal(movedOp, dropStart, dropMaq, issues) {
  const slotUnit = window._ganttSlotUnit || 1;
  const conflictOps = issues.filter(i => i.type === 'machine').map(i => orders.find(o => o.id_ruta === i.id_ruta)).filter(Boolean);

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.style.zIndex = '900';

  const baseDate = new Date();
  baseDate.setHours(6, 0, 0, 0);
  const dropDate = new Date(baseDate.getTime() + dropStart * slotUnit * 3600000);
  const dateStr = dropDate.toISOString().slice(0, 10);
  const hourVal = Math.floor(dropStart);
  const minVal = Math.round((dropStart - hourVal) * 60);

  function renderMiniGantt(centerSlot, containerEl, ghostStart, ghostDur, ghostLabel) {
    const viewSlots = 16;
    const viewStart = Math.max(0, centerSlot - 8);
    const viewEnd = Math.min(SLOTS, viewStart + viewSlots);
    const localMaqOps = orders.filter(o => o.maquina === dropMaq && o.id_ruta !== movedOp.id_ruta && o.inicio < viewEnd && (o.inicio + o.dur) > viewStart);

    let barsHtml = '';
    localMaqOps.forEach(op => {
      const left = ((op.inicio - viewStart) / (viewEnd - viewStart)) * 100;
      const width = (op.dur / (viewEnd - viewStart)) * 100;
      const isConflict = conflictOps.some(c => c.id_ruta === op.id_ruta);
      barsHtml += `<div class="mini-gantt-bar${isConflict ? ' conflict' : ''}" style="left:${left}%;width:${width}%;background:${COLORS[op.estado]?.bg || '#aaa'}" title="${op.id} · ${op.proceso}">${op.id}</div>`;
    });

    if (ghostStart !== undefined && ghostDur !== undefined) {
      const gLeft = ((ghostStart - viewStart) / (viewEnd - viewStart)) * 100;
      const gWidth = (ghostDur / (viewEnd - viewStart)) * 100;
      barsHtml += `<div class="mini-gantt-bar ghost" style="left:${gLeft}%;width:${gWidth}%">${ghostLabel || movedOp.id}</div>`;
    }

    let hoursHtml = '';
    for (let i = viewStart; i < viewEnd; i++) {
      const hLeft = ((i - viewStart) / (viewEnd - viewStart)) * 100;
      hoursHtml += `<div class="mini-gantt-hour-mark" style="position:absolute;left:${hLeft}%;top:0;bottom:0;width:${100/(viewEnd-viewStart)}%;border-left:1px solid #e8e8e4;font-size:8px;color:#bbb;padding:1px 3px">${formatHora(i)}</div>`;
    }

    containerEl.innerHTML = hoursHtml + barsHtml;
    containerEl.dataset.viewStart = viewStart;
    containerEl.dataset.viewEnd = viewEnd;
  }

  function getSelectedSlot() {
    const dateVal = modal.querySelector('#move-date')?.value;
    const hourVal = parseInt(modal.querySelector('#move-hour')?.value || '0');
    const minVal = parseInt(modal.querySelector('#move-min')?.value || '0');
    if (!dateVal) return dropStart;
    const chosen = new Date(dateVal + 'T06:00:00');
    const baseD = new Date();
    baseD.setHours(6, 0, 0, 0);
    const dayOffset = Math.round((chosen - baseD) / 86400000);
    return dayOffset * (24 / slotUnit) + hourVal + minVal / 60;
  }

  function updatePreview() {
    const slot = getSelectedSlot();
    const mg = modal.querySelector('#mini-gantt');
    if (mg) renderMiniGantt(slot, mg, slot, movedOp.dur, movedOp.id);
    const newIssues = checkMove(movedOp.id_ruta, slot, movedOp.dur, dropMaq);
    const conflictInfo = modal.querySelector('#move-conflict-info');
    if (conflictInfo) {
      if (newIssues.length) {
        const machineIssues = newIssues.filter(i => i.type === 'machine');
        conflictInfo.innerHTML = `<span style="color:#E24B4A">⚠ ${machineIssues.length ? machineIssues.length + ' conflicto(s) de máquina' : ''} ${newIssues.filter(i=>i.type==='sequence').length ? newIssues.filter(i=>i.type==='sequence').length + ' de secuencia' : ''}</span>`;
      } else {
        conflictInfo.innerHTML = '<span style="color:#1D9E75">✓ Sin conflictos en este horario</span>';
      }
    }
  }

  modal.innerHTML = `
  <div class="modal-box" style="width:min(700px,92vw)">
    <div class="modal-header">
      <h3>Mover ${movedOp.id} · ${movedOp.proceso}</h3>
      <span class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</span>
    </div>
    <div class="modal-body">
      <div class="move-info">
        <strong>${movedOp.id}</strong> — ${movedOp.cliente || ''} · ${movedOp.articulo || ''}<br>
        Máquina: <strong>${dropMaq || movedOp.maquina}</strong> · Duración: <strong>${movedOp.dur}h</strong> · Actual: ${formatHora(movedOp.inicio)}
      </div>
      <div class="move-modal-grid">
        <div class="move-modal-left">
          <div style="display:flex;gap:8px">
            <div class="move-field"><label>Fecha</label><input type="date" id="move-date" value="${dateStr}"></div>
            <div class="move-field" style="width:80px"><label>Hora</label><input type="number" id="move-hour" value="${hourVal}" min="0" max="23"></div>
            <div class="move-field" style="width:70px"><label>Min</label><input type="number" id="move-min" value="${minVal}" min="0" max="45" step="15"></div>
          </div>
          <div id="move-conflict-info" style="font-size:11px;margin-top:4px"></div>
        </div>
        <div class="move-modal-right">
          <div style="font-size:11px;font-weight:600;color:#555;margin-bottom:4px">Vista previa</div>
          <div class="mini-gantt" id="mini-gantt" style="height:70px"></div>
        </div>
      </div>
      <div class="move-actions">
        <button class="move-btn primary" id="move-confirm">Mover aquí</button>
        <button class="move-btn" id="move-push">Mover al final de la cola</button>
        <button class="move-btn danger" id="move-cancel">Cancelar</button>
      </div>
    </div>
  </div>`;

  document.body.appendChild(modal);

  const miniGanttEl = modal.querySelector('#mini-gantt');
  renderMiniGantt(dropStart, miniGanttEl, dropStart, movedOp.dur, movedOp.id);
  updatePreview();

  modal.querySelector('#move-date').addEventListener('change', updatePreview);
  modal.querySelector('#move-hour').addEventListener('input', updatePreview);
  modal.querySelector('#move-min').addEventListener('input', updatePreview);

  modal.querySelector('#move-confirm').addEventListener('click', async () => {
    const slot = getSelectedSlot();
    const newIssues = checkMove(movedOp.id_ruta, slot, movedOp.dur, dropMaq);
    const machineIssues = newIssues.filter(i => i.type === 'machine');
    if (machineIssues.length) {
      if (!confirm(`Hay ${machineIssues.length} conflicto(s) de máquina. Empurrar procesos existentes para hacer espacio?`)) return;
    }
    modal.remove();
    const before = new Map(orders.map(o => [o.id_ruta, { inicio: o.inicio, maquina: o.maquina }]));
    movedOp.inicio = parseFloat(slot.toFixed(2));
    movedOp.maquina = dropMaq;
    pushForward(movedOp.id_ruta, movedOp.inicio + movedOp.dur, dropMaq);
    autoFix(movedOp.id_ruta, movedOp.inicio + movedOp.dur);
    const changedOps = orders.filter(o => {
      const prev = before.get(o.id_ruta) || {};
      return prev.inicio !== o.inicio || prev.maquina !== o.maquina;
    });
    renderGantt();
    requestAnimationFrame(() => drawArrows());
    try {
      await Promise.all(changedOps.map(op => apiPatch(`${API}/gantt/mover`, {
        id_ruta: op.id_ruta, inicio: op.inicio, id_maquina: op.maquina
      })));
      showToast(`✓ Movimiento guardado (${changedOps.length} ruta${changedOps.length>1?'s':''})`, 'ok');
      await loadFromAPI();
    } catch (err) {
      showError('Error guardando movimiento: ' + err.message);
    }
  });

  modal.querySelector('#move-push').addEventListener('click', async () => {
    modal.remove();
    const machineOps = orders.filter(o => o.maquina === dropMaq && o.id_ruta !== movedOp.id_ruta)
      .sort((a, b) => a.inicio - b.inicio);
    let endSlot = 0;
    machineOps.forEach(op => {
      const opEnd = op.inicio + op.dur;
      if (opEnd > endSlot) endSlot = opEnd;
    });
    const before = new Map(orders.map(o => [o.id_ruta, { inicio: o.inicio, maquina: o.maquina }]));
    movedOp.inicio = parseFloat(endSlot.toFixed(2));
    movedOp.maquina = dropMaq;
    autoFix(movedOp.id_ruta, movedOp.inicio + movedOp.dur);
    const changedOps = orders.filter(o => {
      const prev = before.get(o.id_ruta) || {};
      return prev.inicio !== o.inicio || prev.maquina !== o.maquina;
    });
    renderGantt();
    requestAnimationFrame(() => drawArrows());
    try {
      await Promise.all(changedOps.map(op => apiPatch(`${API}/gantt/mover`, {
        id_ruta: op.id_ruta, inicio: op.inicio, id_maquina: op.maquina
      })));
      showToast(`✓ Movido al final de la cola (${changedOps.length} ruta${changedOps.length>1?'s':''})`, 'ok');
      await loadFromAPI();
    } catch (err) {
      showError('Error guardando movimiento: ' + err.message);
    }
  });

  modal.querySelector('#move-cancel').addEventListener('click', () => modal.remove());
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
}

function pushForward(id_ruta, mustStartAfter, maquina) {
  const slotUnit = window._ganttSlotUnit || 1;
  orders.filter(o => o.maquina === maquina && o.id_ruta !== id_ruta)
    .sort((a, b) => a.inicio - b.inicio)
    .forEach(o => {
      const oEnd = o.inicio + o.dur;
      if (o.inicio < mustStartAfter && oEnd > mustStartAfter) {
        o.inicio = parseFloat(mustStartAfter.toFixed(2));
        o.schedule_mode = 'pushed';
        pushForward(o.id_ruta, o.inicio + o.dur, maquina);
      }
    });
}

function setupDropZones() {
  document.querySelectorAll('.timeline').forEach(tl => {
    tl.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      tl.closest('.g-row')?.classList.add('drag-over');

      // Update drop hint position
      const hint = tl.querySelector('.drop-hint');
      if (hint && dragOp) {
        const slot = getDropSlot(tl, e.clientX);
        hint.style.left = pct(slot);
      }
    });
    tl.addEventListener('dragleave', (e) => {
      if (!tl.contains(e.relatedTarget)) {
        tl.closest('.g-row')?.classList.remove('drag-over');
      }
    });
    tl.addEventListener('drop', e => handleDrop(e, tl));
  });
}

function closeColorMenu() {
  document.querySelector('.task-color-menu')?.remove();
}

function openColorMenu(event, id_ruta) {
