async function setRouteColor(id_ruta, color) {
  const op = orders.find(o => String(o.id_ruta) === String(id_ruta));
  if (!op) return;
  op.route_payload = { ...(op.route_payload || {}), colorHex: color || null };
  renderGantt();
  await apiPatch(`${API}/gantt/mover`, { id_ruta, route_payload_updates: { colorHex: color || null } });
  showToast(color ? 'Color actualizado.' : 'Color por estado restaurado.', 'ok');
  await loadFromAPI();
}

document.addEventListener('click', closeColorMenu);

function getDownstreamOps(id_ruta) {
  const result = [];
  function walk(rid) {
    orders.filter(o => {
      if (o.dep_ruta_id === rid) return true;
      if (!o.dep_ruta_id && o.dep) {
        const src = orders.find(x => x.id === o.dep);
        return src && src.id_ruta === rid;
      }
      return false;
    }).forEach(o => {
      if (!result.find(r => r.id_ruta === o.id_ruta)) {
        result.push(o);
        walk(o.id_ruta);
      }
    });
  }
  walk(id_ruta);
  return result;
}

// ── TOOLTIP ──────────────────────────────────────────────────

    ${scheduleAlert?.type==='tight' ? `<div class="tt-row" style="color:#BA7517"><span>⌛ Margen</span><span class="tt-val" style="color:#BA7517">${scheduleAlert.slack.toFixed(1)}h</span></div>` : ''}

}
function hideTT() { document.getElementById('tt').style.display = 'none'; }

// ── DRAG TO PAN ──────────────────────────────────────────────
let panning = false, panStartX = 0, panStartScroll = 0;
function initPan(e) {
  const wrap = document.querySelector('.gantt-wrap');
  if (!wrap || !e.target.closest('.gantt-wrap')) return;
  if (e.target.closest('.task-bar,.btn,button,a,input,select,textarea,label,.proceso-toggle')) return;
  panning = true;
  panStartX = e.clientX;
  panStartScroll = wrap.scrollLeft;
  document.body.style.cursor = 'grabbing';
  document.body.style.userSelect = 'none';
}
document.addEventListener('mousedown', initPan);
document.addEventListener('mousemove', e => {
  const tt = document.getElementById('tt');
  if (tt && tt.style.display === 'block') {
    tt.style.left = (e.clientX + 14) + 'px';
    tt.style.top  = (e.clientY - 16) + 'px';
  }
  if (panning) {
    const wrap = document.querySelector('.gantt-wrap');
    if (wrap) wrap.scrollLeft = panStartScroll - (e.clientX - panStartX);
  }
});
document.addEventListener('mouseup', () => {
  panning = false;
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

function formatHora(h) {
  const base = 6;
  const total = base + h;
  const hh = Math.floor(total);
  const mm = Math.round((total - hh) * 60);
  const ampm = hh >= 12 ? 'pm' : 'am';
  return `${hh > 12 ? hh - 12 : hh}:${mm.toString().padStart(2,'0')}${ampm}`;
}

function parsePromisedTime(value) {
  if (!value) return Infinity;
  const parsed = new Date(value).getTime();
  return isFinite(parsed) ? parsed : Infinity;
}

function formatPromisedDate(value) {
  if (!value) return 'Sin fecha';
  const date = new Date(value);
  if (isNaN(date.getTime())) return String(value);
  return date.toLocaleDateString('es-CR', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── DETAIL PANEL ─────────────────────────────────────────────
function openDP(id_ruta) {
  const op = orders.find(o => o.id_ruta === id_ruta);
  if (!op) return;
  currentDP = op;
  currentDPTab = 'info';
  dpFlowPayload = null;

  activeChainIds = getChain(id_ruta);
  const ganttWrap = document.querySelector('.gantt-wrap');
  const scrollX = ganttWrap ? ganttWrap.scrollLeft : 0;
  const scrollY = window.scrollY;
  if (currentView === 'gantt') { renderGantt(); drawArrows(); }
  const ganttWrapAfter = document.querySelector('.gantt-wrap');
  if (ganttWrapAfter) ganttWrapAfter.scrollLeft = scrollX;
  window.scrollTo(0, scrollY);

  const allConflicts = detectAllConflicts();
  // Mostrar en la cadena solo los procesos válidos del Gantt (sin planchas, tintas, salida de inventario, etc.)
  const chainOps = orders
    .filter(o => activeChainIds.has(o.id_ruta))
    .filter(o => {
      const pk = normalizeProcessKey(o.proceso_key || o.proceso);
      return GANTT_PROCESS_KEYS.some(gk => pk === gk || pk.includes(gk) || gk.includes(pk));
    })
    .sort((a,b) => {
      const ai = GANTT_PROCESS_KEYS.findIndex(gk => {
        const pk = normalizeProcessKey(a.proceso_key || a.proceso);
        return pk === gk || pk.includes(gk) || gk.includes(pk);
      });
      const bi = GANTT_PROCESS_KEYS.findIndex(gk => {
        const pk = normalizeProcessKey(b.proceso_key || b.proceso);
        return pk === gk || pk.includes(gk) || gk.includes(pk);
      });
      if (ai !== bi) return ai - bi;
      return a.inicio - b.inicio;
    });
  const downstream = getDownstreamOps(id_ruta);

  document.getElementById('dp-title-txt').textContent = op.id;
  document.getElementById('dp-subtitle').textContent  = '👤 ' + op.cliente + ' · ' + op.articulo;

  document.getElementById('dp-body').innerHTML = `
    <div class="dp-section">Cadena de procesos</div>
    <div class="chain-list">
      ${chainOps.map(o => {
        const c = COLORS[o.estado] || COLORS.PENDIENTE;
        return `<div class="chain-item${o.id_ruta===id_ruta?' active':''}">
          <span class="chain-dot" style="background:${c.bg}"></span>
          <span><strong>${o.id}</strong> · ${o.proceso}</span>
          <span style="margin-left:auto;font-size:10px;color:#888">${formatHora(o.inicio)} · ${o.dur}h</span>
        </div>`;
      }).join('')}
    </div>

    <div class="dp-field"><div class="dp-lbl">Artículo</div><div class="dp-val">${escHtml(op.articulo)}</div></div>
    <div class="dp-field"><div class="dp-lbl">Saidel</div><div class="dp-val">${op.saidel}</div></div>
    <div class="dp-field"><div class="dp-lbl">Pies planificados</div><div class="dp-val">${Number(op.pies).toLocaleString()}</div></div>
    <div class="dp-field"><div class="dp-lbl">Entrega prometida</div><div class="dp-val">${formatPromisedDate(op.fecha_entrega_prometida)}</div></div>
    <div class="dp-field"><div class="dp-lbl">Fin producción</div><div class="dp-val">${formatPromisedDate(op.fecha_fin_produccion)}</div></div>
    <div class="dp-field"><div class="dp-lbl">Setup estimado</div><div class="dp-val">${Number(op.route_payload?.setupMinutes||0).toLocaleString('es-CR')} min</div></div>
    <div class="dp-field"><div class="dp-lbl">Corrida estimada</div><div class="dp-val">${Number(op.route_payload?.runMinutes||0).toLocaleString('es-CR')} min</div></div>
    <div class="dp-field"><div class="dp-lbl">Buffer</div><div class="dp-val">${Number(op.route_payload?.bufferMinutes||0).toLocaleString('es-CR')} min</div></div>
    <div class="dp-field"><div class="dp-lbl">Velocidad base</div><div class="dp-val">${Number(op.route_payload?.speedFpm||0).toLocaleString('es-CR')} fpm</div></div>
    <div class="dp-field"><div class="dp-lbl">Modo de acomodo</div>
      <div class="dp-val">${op.manual_lock?'Fijo manual':op.schedule_mode==='backward'?'Prog. hacia atrás':op.schedule_mode==='forward'?'Prog. hacia adelante':'Sin definir'}</div>
    </div>
    <div class="dp-field">
      <div class="dp-lbl">Color</div>
      <div class="dp-color-row">
        ${ROUTE_COLORS.map(color => `
          <label title="${color||'Color por estado'}">
            <input type="radio" name="dp-color" value="${color}" ${String(op.route_payload?.colorHex||'')===color?'checked':''}>
            <span class="dp-color-swatch" style="background:${color||'linear-gradient(135deg,#378ADD 0 50%,#1D9E75 50% 100%)'}"></span>
          </label>
        `).join('')}
      </div>
    </div>
    <div class="dp-field">
      <div class="dp-lbl">Bloqueo manual</div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#46515d">
        <input type="checkbox" id="dp-lock" ${op.manual_lock?'checked':''}>
        Mantener fijo este proceso al optimizar
      </label>
    </div>
    <div class="dp-field">
      <div class="dp-lbl">Bloqueo de orden</div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#46515d">
        <input type="checkbox" id="dp-lock-order" ${chainOps.every(i=>i.manual_lock)?'checked':''}>
        Mantener fija toda la orden ${escHtml(op.id)}
      </label>
    </div>
    <div class="dp-section">Planificación</div>
    <div class="dp-field">
      <div class="dp-lbl">Inicio (horas desde 6am)</div>
      <input class="dp-input" type="number" id="dp-inicio" value="${op.inicio}" min="0" max="${SLOTS}" step="0.25">
    </div>
    <div class="dp-field">
      <div class="dp-lbl">Duración (horas)</div>
      <input class="dp-input" type="number" id="dp-dur" value="${op.dur}" min="0.25" max="${SLOTS}" step="0.25">
    </div>
    <div class="dp-field">
      <div class="dp-lbl">Máquina</div>
      <select class="dp-input" id="dp-maq">
        ${machines.map(m => `<option value="${m.id}"${m.id===op.maquina?' selected':''}>${m.name||m.nombre_recurso||m.id}</option>`).join('')}
      </select>
    </div>
    <div class="dp-section">Estado</div>
    <div class="dp-field">
      <select class="dp-input" id="dp-estado">
        ${['PENDIENTE','SETUP','RUN','PARO','COMPLETADO'].map(s =>
          `<option value="${s}"${s===op.estado?' selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    ${op.dep ? `<div class="dp-field"><div class="dp-lbl">Depende de</div><div class="dp-val">${op.dep}</div></div>` : ''}
    ${op.trans_costo ? `<div class="dp-field"><div class="dp-lbl">Costo lavado</div><div class="dp-val" style="color:#854F0B">${op.trans_costo} min</div></div>` : ''}

    ${downstream.length ? `
    <div class="impact-box">
      <div class="impact-title">⚠ Impacto si movés esta orden</div>
      Se desplazarán ${downstream.length} proceso(s) aguas abajo:<br>
      ${downstream.map(o => `<strong>${o.id}</strong> (${o.proceso})`).join(', ')}
    </div>` : ''}

    ${(() => {
      const myConflicts = allConflicts.filter(c => c.ruta_a===op.id_ruta || c.ruta_b===op.id_ruta);
      if (!myConflicts.length) return '';
      return `<div class="conflict-panel">
        <div class="conflict-panel-title">⊗ Conflictos de esta barra</div>
        ${myConflicts.map(c => `<div class="conflict-row">
          <span>${c.type==='machine'?'🔴 Máquina':'🟠 Secuencia'}</span>
          <span>${c.message}</span>
        </div>`).join('')}
      </div>`;
    })()}
  `;

  document.querySelectorAll('.dp-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dpTab === 'info');
  });
  document.getElementById('save-btn').style.display = '';
  document.getElementById('dp').style.display = 'block';
}

function closeDP() {
  document.getElementById('dp').style.display = 'none';
  currentDP = null;
  activeChainIds = null;
  dpFlowPayload = null;
  currentDPTab = 'info';
  const ganttWrap = document.querySelector('.gantt-wrap');
  const scrollX = ganttWrap ? ganttWrap.scrollLeft : 0;
  const scrollY = window.scrollY;
  if (currentView === 'gantt') { renderGantt(); drawArrows(); }
  else { renderPipeline(); }
  const ganttWrapAfter = document.querySelector('.gantt-wrap');
  if (ganttWrapAfter) ganttWrapAfter.scrollLeft = scrollX;
  window.scrollTo(0, scrollY);
}

function switchDPTab(tab) {
  currentDPTab = tab;
  document.querySelectorAll('.dp-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dpTab === tab);
  });
  document.getElementById('save-btn').style.display = tab === 'info' ? '' : 'none';
  if (tab === 'flow') renderDPFlow();
}

async function renderDPFlow() {
  const body = document.getElementById('dp-body');
  if (!currentDP) return;
  const orderCode = currentDP.id;
  body.innerHTML = '<div style="padding:20px;text-align:center;color:#888;font-size:12px">Cargando seguimiento...</div>';
  try {
    const resp = await fetch('/api/ordenes-produccion/' + encodeURIComponent(orderCode) + '/seguimiento');
    dpFlowPayload = await resp.json();
    const steps = Array.isArray(dpFlowPayload?.steps) ? dpFlowPayload.steps : [];
    body.innerHTML = renderFlowTimeline(steps);
  } catch (e) {
    body.innerHTML = '<div style="padding:20px;text-align:center;color:#E24B4A;font-size:12px">Error al cargar seguimiento</div>';
  }
}

function renderFlowTimeline(steps) {
  if (!steps.length) return '<div style="padding:20px;text-align:center;color:#888;font-size:12px">No hay seguimiento registrado.</div>';
  const doneCount = steps.filter(s => String(s.routeStatus || '').toUpperCase() === 'COMPLETADO').length;
  const total = steps.length;
  const pct = Math.round(doneCount / total * 100);
  const barColor = doneCount === total ? '#1D9E75' : doneCount > 0 ? '#D4A017' : '#d0d0ca';
  const barBg = doneCount === total ? '#ecfdf5' : doneCount > 0 ? '#fef9ee' : '#f4f4f0';

  let html = `
    <div class="flow-header">
      <div><div class="flow-title">Flujo de producción</div>
      <div class="flow-sub">${doneCount} de ${total} etapas completas</div></div>
      <span class="flow-counter" style="background:${barBg};color:${barColor}">${doneCount}/${total}</span>
    </div>
    <div class="flow-progress"><div class="flow-progress-fill" style="width:${pct}%;background:${barColor}"></div></div>`;

  for (let i = 0; i < steps.length; i++) {
    const s = steps[i];
    const status = String(s.routeStatus || 'PENDIENTE').toUpperCase();
    const isDone = status === 'COMPLETADO';
    const isActive = ['RUN', 'SETUP'].includes(status);
    const isStopped = status === 'PARO';
    const isLast = i === steps.length - 1;

    const nodeClass = isDone ? 'tl-node done' : isActive ? 'tl-node active' : isStopped ? 'tl-node paro' : 'tl-node pending';
    const nodeInner = isDone ? '✓' : isActive ? '●' : isStopped ? '✕' : '';
    const titleClass = isDone ? 'done' : isActive ? 'active' : isStopped ? 'stopped' : 'pending';
    const solid = isDone && !isLast && steps[i + 1] && String(steps[i + 1].routeStatus || '').toUpperCase() === 'COMPLETADO';
    const line = isLast ? '' : `<div class="tl-connector ${solid ? 'solid' : 'dashed'}"></div>`;

    let detailRows = '';
    const machineKeys = ['planchas', 'impresion', 'acabados', 'barnizado', 'laminado', 'troquelado', 'estampado', 'embosado', 'numeracion', 'rebobinado'];
    if (machineKeys.includes(s.processKey) && s.planned && s.planned.machineName) {
      detailRows += `<span class="flow-detail-row">⚙ ${escHtml(s.planned.machineName)}</span>`;
    }
    const plannedMin = s.planned && s.planned.minutes > 0 ? s.planned.minutes : 0;
    if (plannedMin > 0) {
      const h = Math.floor(plannedMin / 60);
      const m = Math.round(plannedMin % 60);
      const timeStr = h > 0 ? (m > 0 ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
      detailRows += `<span class="flow-detail-row">⏱ ${timeStr}</span>`;
    }

    const metaParts = [];
    if (s.completedBy) metaParts.push(escHtml(s.completedBy));
    if (s.completedAt) {
      const d = new Date(s.completedAt);
      metaParts.push(d.toLocaleDateString('es-CR') + ' ' + d.toLocaleTimeString('es-CR', { hour: '2-digit', minute: '2-digit' }));
    }

    html += `
      <div class="tl-row">
        <div class="tl-col-left">
          <button type="button" class="${nodeClass}" data-flow-toggle="${i}" style="cursor:pointer;border:none" title="${isDone ? 'Quitar marca' : 'Marcar completado'}">
            <span style="font-size:10px">${nodeInner}</span>
          </button>
          ${line}
        </div>
        <div class="tl-content">
          <div class="tl-step-title ${titleClass}">${escHtml(s.processName || s.processKey || 'Proceso')}</div>
          ${metaParts.length ? `<div class="tl-step-meta">${metaParts.join(' · ')}</div>` : ''}
          ${detailRows ? `<div class="flow-detail-stack">${detailRows}</div>` : ''}
        </div>
      </div>`;
  }

  html += `
    <div class="flow-actions">
      ${steps.map((s, i) => {
        const isDone = String(s.routeStatus || '').toUpperCase() === 'COMPLETADO';
        if (isDone) return '';
        return `<button class="flow-action-btn complete" data-flow-complete="${i}">✓ Completar ${escHtml(s.processName || s.processKey || '')}</button>`;
      }).join('')}
    </div>`;

  return html;
}

async function dpFlowToggle(index) {
  if (!dpFlowPayload) return;
  const steps = dpFlowPayload.steps;
  if (!steps || !steps[index]) return;
  const step = steps[index];
  const isDone = String(step.routeStatus || '').toUpperCase() === 'COMPLETADO';
  try {
    await fetch('/api/ordenes-produccion/' + encodeURIComponent(currentDP.id) + '/seguimiento/marca', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ processKey: step.processKey, marked: !isDone })
    });
    await renderDPFlow();
    if (currentView === 'gantt') { renderGantt(); drawArrows(); }
    else { renderPipeline(); }
  } catch (e) {
    console.error('Flow toggle error:', e);
  }
}

async function dpFlowComplete(index) {
  if (!dpFlowPayload) return;
  const steps = dpFlowPayload.steps;
  if (!steps || !steps[index]) return;
  const step = steps[index];
  const notes = prompt('Nota opcional para ' + (step.processName || step.processKey) + ':', '') || '';
  try {
    await fetch('/api/ordenes-produccion/' + encodeURIComponent(currentDP.id) + '/seguimiento/completar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ processKey: step.processKey, notes })
    });
    await renderDPFlow();
    if (currentView === 'gantt') { renderGantt(); drawArrows(); }
    else { renderPipeline(); }
  } catch (e) {
    console.error('Flow complete error:', e);
  }
}

async function saveDP() {
  if (!currentDP) return;
  const btn = document.getElementById('save-btn');
  btn.textContent = 'Guardando...';
  btn.classList.add('saving');

  const newInicio = parseFloat(document.getElementById('dp-inicio').value);
  const newDur    = parseFloat(document.getElementById('dp-dur').value);
  const newMaq    = document.getElementById('dp-maq').value;
  const newEstado = document.getElementById('dp-estado').value;
  const newLock   = Boolean(document.getElementById('dp-lock')?.checked);
  const newOrderLock = Boolean(document.getElementById('dp-lock-order')?.checked);
  const newColor  = document.querySelector('input[name="dp-color"]:checked')?.value || '';

  if (newInicio !== currentDP.inicio) {
    const downstream = getDownstreamOps(currentDP.id_ruta);
    if (downstream.length > 0) {
      const delta = newInicio - currentDP.inicio;
      if (!confirm(`Mover "${currentDP.id}" ${delta>0?'+':''}${delta.toFixed(2)}h desplazará ${downstream.length} proceso(s) aguas abajo.\n\n¿Confirmar?`)) {
        btn.textContent = 'Guardar cambios';
        btn.classList.remove('saving');
        return;
      }
    }
  }

  try {
    if (newInicio !== currentDP.inicio || newDur !== currentDP.dur || newMaq !== currentDP.maquina) {
      await apiPatch(`${API}/gantt/mover`, { id_ruta:currentDP.id_ruta, inicio:newInicio, duracion:newDur, id_maquina:newMaq });
    }
    if (newLock !== Boolean(currentDP.manual_lock)) {
      await apiPatch(`${API}/gantt/mover`, { id_ruta:currentDP.id_ruta, route_payload_updates:{ manualLock:newLock } });
    }
    if (newColor !== String(currentDP.route_payload?.colorHex||'')) {
      await apiPatch(`${API}/gantt/mover`, { id_ruta:currentDP.id_ruta, route_payload_updates:{ colorHex:newColor||null } });
    }
    const orderOps = getOrderOps(currentDP.id);
    const orderIsLocked = orderOps.length > 0 && orderOps.every(op => Boolean(op.manual_lock));
    if (newOrderLock !== orderIsLocked) {
      await Promise.all(orderOps.map(op =>
        apiPatch(`${API}/gantt/mover`, { id_ruta:op.id_ruta, route_payload_updates:{ manualLock:newOrderLock } })
      ));
    }
    if (newEstado !== currentDP.estado) {
      await apiPatch(`${API}/gantt/estado`, { codigo_op:currentDP.id, estado:newEstado });
    }
    closeDP();
    await loadFromAPI();
  } catch (err) {
    showError('Error guardando cambios: ' + err.message);
    btn.textContent = 'Guardar cambios';
    btn.classList.remove('saving');
  }
}

async function autoSeqCapacidad() {
  try {
    const res = await fetch(`${API}/gantt-capacidad`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error al calcular capacidad finita.');
    const positions = data.data.positions || {};
    let updatedCount = 0;
    orders.forEach(op => {
      const pos = positions[op.id_ruta];
      if (pos) {
        op.inicio = pos.inicio; op.dur = pos.dur;
        op.projectedStart = pos.projectedStart; op.projectedEnd = pos.projectedEnd;
        op.maquina = pos.machineProfileId || pos.resourceId || op.maquina;
        op.capacityResourceId = pos.resourceId || null;
        op.capacityResourceName = pos.resourceName || '';
        op.schedule_mode = 'capacity';
        updatedCount++;
      }
    });
    configureTimelineHorizon();
    render();
    if (data.data.bottlenecks?.length) {
      const bnNames = data.data.bottlenecks.map(b => `${b.machineName} (${b.utilizationPct}%)`).join(', ');
      showCenterMessage(`⚠ Cuellos de botella: ${bnNames}`);
    } else {
      showCenterMessage(`✓ ${updatedCount} rutas re-secuenciadas por capacidad finita.`);
    }
    Promise.all(orders.map(o => apiPatch(`${API}/gantt/mover`, {
      id_ruta: o.id_ruta, inicio: o.inicio, id_maquina: o.maquina,
      planned_start_at: o.projectedStart||null, planned_end_at: o.projectedEnd||null,
      route_payload_updates: { scheduleMode:'capacity', capacityResourceId:o.capacityResourceId||null, capacityResourceName:o.capacityResourceName||'' }
    }))).then(() => loadFromAPI()).catch(e => showError('Error al guardar: ' + e.message));
  } catch (e) {
    showError('Error en capacidad finita: ' + e.message);
  }
}

// ── USER SESSION ─────────────────────────────────────────────
function syncGanttUserName() {
  const el = document.getElementById('ganttUserName');
  if (!el) return;
  try {
    const raw = localStorage.getItem('erp-user-session') || sessionStorage.getItem('erp-user-session');
    if (raw) {
      const s = JSON.parse(raw);
      const name = s.name || s.fullName || s.user || s.username || s.currentUser || '';
      el.textContent = name || 'Sin sesión';
      return;
    }
  } catch (_) {}
  el.textContent = 'Sin sesión';
}

// ── FLOW TAB EVENT DELEGATION ──────────────────────────────
document.getElementById('dp-body').addEventListener('click', (e) => {
  const toggleBtn = e.target.closest('[data-flow-toggle]');
  if (toggleBtn) { dpFlowToggle(Number(toggleBtn.dataset.flowToggle)); return; }
  const completeBtn = e.target.closest('[data-flow-complete]');
  if (completeBtn) { dpFlowComplete(Number(completeBtn.dataset.flowComplete)); return; }
});

// ── POLLING ──────────────────────────────────────────────────
setInterval(() => { if (!currentDP) loadFromAPI(); }, 30000);
setInterval(updateNowLine, 60000);

// ── INIT ─────────────────────────────────────────────────────
loadFromAPI();
</script>
