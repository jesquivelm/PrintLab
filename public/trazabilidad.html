<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trazabilidad del Producto</title>
<style>
:root{
  --font-sans:"Segoe UI",system-ui,sans-serif;--font-mono:'JetBrains Mono',Consolas,monospace;
  --bg:#f4f7fb;--bg2:#ffffff;--bg3:#edf2f7;--bg4:#e2e9f2;
  --border:#d8e4ef;--border2:#c1d0e0;
  --text:#1f2b3d;--text2:#5a6b82;--text3:#8697ad;
  --blue:#1D6FB8;--blue-bg:#e8f2fc;--blue-border:#9fc4ea;
  --green:#0F6E56;--green-bg:#e6f7f1;--green-border:#a3ddc7;
  --amber:#8a5a05;--amber-bg:#fff6df;--amber-border:#e8cd8a;
  --red:#A32D2D;--red-bg:#fcebeb;--red-border:#e8b3b3;
  --purple:#5b3fa3;--purple-bg:#efeaf9;--purple-border:#c7b6e8;
  --gray-bg:#eef1f5;
  --radius:10px;--radius-sm:6px;
  --shadow:0 2px 10px rgba(20,30,50,.06);
}
html[data-theme="dark"]{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--bg4:#22272e;
  --border:#30363d;--border2:#444c56;
  --text:#e6edf3;--text2:#9099ab;--text3:#6e7681;
  --blue:#58a6ff;--blue-bg:#0d2137;--blue-border:#1f6feb;
  --green:#3fb950;--green-bg:#0a1f0e;--green-border:#238636;
  --amber:#d29922;--amber-bg:#1f1800;--amber-border:#9e6a03;
  --red:#f85149;--red-bg:#1f0c0c;--red-border:#b62324;
  --purple:#a371f7;--purple-bg:#1a0f2e;--purple-border:#6e40c9;
  --gray-bg:#1c2128;
  --shadow:0 2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:13px;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
*{scrollbar-width:thin;scrollbar-color:rgba(11,129,184,.42) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(11,129,184,.38);border-radius:999px}

/* ── HEADER ── */
.tz-header{flex-shrink:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;box-shadow:var(--shadow)}
.tz-back{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--text2);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:16px;flex-shrink:0}
.tz-back:hover{color:var(--text);border-color:var(--border2)}
.tz-title-block{min-width:160px}
.tz-title{font-size:16px;font-weight:700;color:var(--text);line-height:1.2}
.tz-subtitle{font-size:11px;color:var(--text3);font-family:var(--font-mono);margin-top:2px}
.tz-fields{display:flex;gap:22px;flex-wrap:wrap;flex:1}
.tz-field{display:flex;flex-direction:column;gap:1px;min-width:70px}
.tz-field-lbl{font-size:9px;letter-spacing:.02em;color:var(--text3);font-family:var(--font-mono)}
.tz-field-val{font-size:12.5px;font-weight:600;color:var(--text)}
.tz-state-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;width:fit-content}
.tz-header-right{display:flex;align-items:center;gap:14px;margin-left:auto}
.tz-progress-wrap{width:120px}
.tz-progress-label{font-size:9px;color:var(--text3);font-family:var(--font-mono);letter-spacing:.02em;margin-bottom:3px;display:flex;justify-content:space-between}
.tz-progress-bar{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden}
.tz-progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:3px;transition:width .4s}
.theme-toggle{width:32px;height:32px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg3);color:var(--text);cursor:pointer}
.theme-toggle-icon-sun::before{content:"☀"}.theme-toggle-icon-moon::before{content:"☾"}
.theme-toggle-icon-moon{display:none}
html[data-theme="dark"] .theme-toggle-icon-sun{display:none}
html[data-theme="dark"] .theme-toggle-icon-moon{display:inline}

/* ── ESTADO ACTUAL ── */
.tz-current{flex-shrink:0;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--bg3);border-bottom:1px solid var(--border);flex-wrap:wrap}
.tz-current-lbl{font-size:10px;color:var(--text3);letter-spacing:.02em;font-family:var(--font-mono);white-space:nowrap}
.tz-current-stage{font-size:13px;font-weight:700}
.tz-current-chip{font-family:var(--font-mono);font-size:11px;padding:3px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg2);color:var(--text2);display:flex;align-items:center;gap:5px}
.tz-current-chip b{color:var(--text);font-weight:600}

/* ── MAPA ── Ocupa todo el espacio restante bajo el encabezado; es la ÚNICA
   zona con scroll de toda la página — su barra queda fija en el borde
   inferior/derecho del viewport, nunca pegada al contenido. Nada dentro de
   ella (motivos, versiones, subprocesos) tiene su propio scroll anidado. */
.tz-map-wrap{flex:1;min-height:0}
.tz-map-scroll{height:100%;overflow:auto;padding:40px 20px}
.tz-map-track{display:flex;align-items:center;justify-content:center;gap:0;min-width:max-content;min-height:100%}
.tz-stage-connector{width:36px;flex-shrink:0;align-self:center;position:relative;height:2px}

.tz-stage{width:230px;flex-shrink:0;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);transition:border-color .15s;position:relative}
.tz-stage.is-focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.tz-stage.st-done{border-top:3px solid var(--green)}
.tz-stage.st-in_progress{border-top:3px solid var(--blue)}
.tz-stage.st-pending{border-top:3px solid var(--border2)}
.tz-stage.st-incidencia{border-top:3px solid var(--red)}
.tz-stage.st-mock-pending{border-top:3px dashed var(--border2)}

.tz-stage-head{display:flex;align-items:center;gap:6px;padding:10px 12px;cursor:pointer;user-select:none}
.tz-stage-icon{font-size:15px;flex-shrink:0}
.tz-stage-title{font-size:12.5px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tz-stage-open{border:0;background:transparent;color:var(--text3);font-size:13px;line-height:1;padding:2px;flex-shrink:0;text-decoration:none;cursor:pointer}
.tz-stage-open:hover{color:var(--blue)}
.tz-chevron{font-size:10px;color:var(--text3);transition:transform .15s;flex-shrink:0}
.tz-chevron.open{transform:rotate(180deg)}

.tz-stage-body{padding:0 12px 12px}
.tz-stage-code{font-family:var(--font-mono);font-size:11px;color:var(--blue);font-weight:600;margin-bottom:6px}
.tz-stage-secondary-code{font-family:var(--font-mono);font-size:9.5px;color:var(--text3);margin:-4px 0 6px}
.tz-stage-status-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--radius-sm);margin-bottom:8px}
.tz-stage-status-badge.st-done{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.tz-stage-status-badge.st-in_progress{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.tz-stage-status-badge.st-pending{background:var(--gray-bg);color:var(--text3);border:1px solid var(--border)}
.tz-stage-status-badge.st-incidencia{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.tz-stage-status-badge.st-mock-pending{background:var(--gray-bg);color:var(--text3);border:1px dashed var(--border2)}
.tz-stage-line{font-size:11.5px;color:var(--text2);margin-bottom:3px;display:flex;justify-content:space-between;gap:8px}
.tz-stage-line span:last-child{color:var(--text);font-weight:600;text-align:right}
.tz-mock-badge{font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--amber);background:var(--amber-bg);border:1px dashed var(--amber-border);padding:1px 6px;border-radius:4px;margin-bottom:8px;display:inline-block}
.tz-incidencia-box{margin-top:8px;padding:7px 9px;background:var(--red-bg);border:1px solid var(--red-border);border-radius:var(--radius-sm);font-size:11px;color:var(--red)}
.tz-incidencia-box div{margin-bottom:2px}
.tz-incidencia-box div:last-child{margin-bottom:0}

/* ── SUBBLOQUE (Solicitud/Aprobación dentro de Cotización) ── */
.tz-subblock{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
.tz-subblock-row{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;padding:2px 0}
.tz-subblock-lbl{color:var(--text2)}
.tz-subblock-val{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.tz-subblock-val.ok{color:var(--green)}
.tz-subblock-val.pending{color:var(--text3)}

/* ── GRUPOS DE COTIZACIÓN ── Columna vertical conectada a Cotización con
   líneas tipo organigrama (una columna troncal + una rama por punto). Cada
   punto es su propio módulo acordeón: al tocarlo, ÉL MISMO crece hacia abajo
   (y un poco hacia lo ancho) con su información — no aparece un panel nuevo
   aparte. Tocarlo de nuevo lo resume, en el mismo lugar. */
@keyframes tz-pop-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.tz-group-branch{flex-shrink:0;width:480px;margin-top:2px;padding-left:74px;position:relative}
/* Orden usa el mismo ancho que la rama de procesos de Cotización — llevan el
   mismo contenido (campos cotizados), así que necesitan el mismo espacio. */
.tz-group-branch.narrow{width:520px}
.tz-group-branch.procesos{width:520px}
/* Cuando Planeación abre su rama de procesos, las dos ramas (la principal y
   la de procesos) crecen lado a lado en su propia fila — el ancho total lo
   decide la suma de sus columnas, nadie encima a lo que viene después
   (la tarjeta de Orden). Ver renderCotizacionColumn. */
.tz-branch-row{display:flex;align-items:center;flex-shrink:0}
.tz-group-item{position:relative;margin-bottom:10px}
.tz-group-item.is-marching .tz-group-row-chip,.tz-group-item.is-marching .tz-node-card{border-color:var(--blue-border)}
.tz-connector-svg{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;z-index:0}
.tz-connector-svg path{fill:none;stroke:var(--border2);stroke-width:2;stroke-dasharray:5 5}
.tz-connector-svg path.is-marching{stroke:var(--blue);animation:tz-march-svg .5s linear infinite}
.tz-connector-svg marker path{stroke:none}
.tz-connector-svg marker.tz-arrow-default path{fill:var(--border2)}
.tz-connector-svg marker.tz-arrow-active path{fill:var(--blue)}
@keyframes tz-march-svg{to{stroke-dashoffset:-20}}
.tz-avatar{border-radius:50%;object-fit:cover;flex-shrink:0;display:inline-block;vertical-align:middle}
.tz-avatar-fallback{background:var(--blue-bg);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--font-sans)}

/* ── Tarjeta de nodo de proceso — UN SOLO componente reutilizado en Orden
   (con foto de quien lo marcó) y en Cotización (con subtotal): borde sutil
   con ícono en chip redondeado, resumen de 1-3 datos SIEMPRE visible (nada
   de acordeones "ciegos" que solo dicen el nombre), y detalle completo
   solo al abrir. Mismo lenguaje visual que .tz-group-row-chip. ── */
.tz-node-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;transition:border-color .12s,box-shadow .12s}
.tz-node-card:hover{border-color:var(--border2)}
.tz-node-card.is-active{border-color:var(--blue-border)}
.tz-node-card.is-open{border-color:var(--blue-border);box-shadow:0 0 0 3px var(--blue-bg)}
.tz-node-head{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;user-select:none}
.tz-node-icon-wrap{width:26px;height:26px;border-radius:8px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.tz-node-title{font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap}
.tz-node-badge{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;flex-shrink:0}
.tz-node-badge.cost{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.tz-node-badge.st-done{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.tz-node-badge.st-in_progress{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.tz-node-badge.st-pending{background:var(--gray-bg);color:var(--text3);border:1px solid var(--border)}
.tz-node-badge.st-incidencia{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.tz-node-summary{padding:0 12px 10px 47px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px}
.tz-tiempo-real{border-top:1px dashed var(--border);padding-top:6px}
.tz-node-detail{background:var(--bg3);border-top:1px solid var(--border);padding:12px 14px;animation:tz-pop-in .2s ease;display:flex;flex-direction:column;gap:12px}
.tz-orden-card-body-top{display:flex;align-items:center;gap:14px}
/* Mismo tamaño/borde que .user-admin-detail-avatar (Configuración → Seguridad
   → Usuarios): 88px, borde blanco de 2px, sombra suave — para no corromper
   la foto al reducirla y mantener el mismo lenguaje visual en toda la app. */
.tz-orden-avatar-wrap{position:relative;flex-shrink:0;width:88px;height:88px}
.tz-orden-avatar-wrap .tz-avatar{width:88px;height:88px;border:2px solid #fff;box-shadow:0 14px 30px rgba(17,143,198,.18)}
.tz-orden-avatar-empty{border-radius:50%;background:var(--bg3);border:1.5px dashed var(--border2)}
.tz-orden-avatar-badge{position:absolute;bottom:0;right:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;border:2px solid var(--bg2)}
.tz-orden-avatar-badge.ok{background:var(--green)}
.tz-orden-avatar-badge.bad{background:var(--red)}
/* Resumen "de oficina" (Creación de Orden, Solicitud, Seguimiento, Diseño,
   Preprensa, Visto Bueno): avatar chico siempre visible, no solo al abrir. */
.tz-orden-person-summary{padding-top:2px;padding-bottom:8px}
.tz-orden-person-summary .tz-orden-card-body-top{gap:9px}
.tz-orden-avatar-wrap-sm{width:40px;height:40px}
.tz-orden-avatar-wrap-sm .tz-avatar{width:40px;height:40px;border-width:1.5px;box-shadow:none}
.tz-orden-avatar-wrap-sm .tz-orden-avatar-badge{width:16px;height:16px;font-size:9px;border-width:1.5px}
.tz-orden-lines{display:flex;flex-direction:column;gap:2px;min-width:0}
.tz-orden-name{font-size:13px;font-weight:700;color:var(--text)}
.tz-orden-line{font-size:11px;color:var(--text2)}
.tz-group-row-chip{display:flex;flex-direction:column;gap:6px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;cursor:pointer;transition:border-color .12s}
.tz-group-row-chip:hover{border-color:var(--border2)}
.tz-group-row-chip.is-open{border-color:var(--blue-border);background:var(--blue-bg);border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.tz-group-row-head{display:flex;align-items:center;gap:7px}
.tz-group-row-head .tz-avatar{margin-left:auto}
.tz-group-row-icon{font-size:14px;flex-shrink:0}
.tz-group-row-label{font-size:12px;font-weight:700}
.tz-group-row-facts{padding-top:4px;border-top:1px dashed var(--border)}
.tz-group-detail-inline{background:var(--bg2);border:1.5px solid var(--blue-border);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);padding:12px 14px;animation:tz-pop-in .22s ease}
.tz-group-detail-title{font-size:13px;font-weight:700;margin-bottom:10px}
.tz-group-section{margin-bottom:12px}
.tz-group-section:last-child{margin-bottom:0}
.tz-group-section-title{font-family:var(--font-mono);font-size:10px;letter-spacing:.02em;color:var(--blue);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.tz-fact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}
.tz-fact-grid.single-col{grid-template-columns:1fr}
.tz-table-scroll{overflow-x:auto}
.tz-ink-table{border-collapse:collapse;font-size:11px;min-width:100%}
.tz-ink-table th,.tz-ink-table td{padding:4px 10px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.tz-ink-table th{color:var(--text3);font-weight:600;font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.02em}
.tz-ink-table td:first-child,.tz-ink-table th:first-child{text-align:left;font-weight:600;color:var(--text)}
.tz-fact-wide{grid-column:1 / -1}
.tz-fact-strong span:last-child{color:var(--blue)}
.tz-group-empty{color:var(--text3);font-size:11px}

/* ── PROCESO — motivos como acordeón, versiones con árbol de tintas/sellos ── */
.tz-proceso-motivos{display:flex;flex-direction:column;gap:8px}
.tz-proceso-motivo{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.tz-proceso-motivo.is-open{border-color:var(--blue-border)}
.tz-proceso-motivo-head{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer;user-select:none}
.tz-proceso-motivo-title{font-size:12px;font-weight:700;color:var(--text)}
.tz-proceso-version{display:flex;align-items:flex-start;gap:14px;padding:10px 12px 12px 30px;border-top:1px dashed var(--border)}
.tz-proceso-image-placeholder{flex-shrink:0;width:64px;height:64px;border-radius:var(--radius-sm);border:1.5px dashed var(--border2);display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--text3);font-family:var(--font-mono);text-align:center}
.tz-proceso-summary{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}

/* ── Árbol de versión: conector elegante (no ASCII) — un nodo raíz con
   halo azul (la versión) y sus ramas colgando con guía + codo redondeado ── */
.tz-tree{flex:1;min-width:0}
.tz-tree-root{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px}
.tz-tree-root-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px var(--blue-bg);flex-shrink:0}
.tz-tree-root-meta{font-weight:600;color:var(--text3);font-size:10.5px;font-family:var(--font-mono)}
.tz-tree-branch{margin-left:3px}
.tz-tree-row{position:relative;padding:4px 0 4px 20px;border-left:1.5px solid var(--border2);display:flex;align-items:baseline;gap:7px}
.tz-tree-row:last-child{border-left-color:transparent}
.tz-tree-row::before{content:'';position:absolute;left:-1.5px;top:13px;width:16px;height:1.5px;background:var(--border2);border-bottom-left-radius:5px}
.tz-tree-value{font-family:var(--font-mono);font-weight:700;font-size:12.5px;color:var(--blue);min-width:16px}
.tz-tree-tag{font-size:11px;color:var(--text2)}

/* ── EXPANSIÓN (nivel 2: subprocesos horizontales) ── */
.tz-expand{border-top:1px solid var(--border);background:var(--bg3);border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.tz-expand-inner{padding:12px}
.tz-sub-track{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.tz-sub-node{width:132px;flex-shrink:0;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;cursor:pointer}
.tz-sub-node.st-done{border-color:var(--green-border)}
.tz-sub-node.st-in_progress{border-color:var(--blue-border);box-shadow:0 0 0 2px var(--blue-bg)}
.tz-sub-node.st-incidencia{border-color:var(--red-border)}
.tz-sub-connector{display:flex;align-items:center;justify-content:center;width:20px;flex-shrink:0;color:var(--border2);font-size:13px}
.tz-sub-name{font-size:11.5px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tz-sub-status{font-family:var(--font-mono);font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.tz-sub-status.st-done{color:var(--green)}
.tz-sub-status.st-in_progress{color:var(--blue)}
.tz-sub-status.st-pending{color:var(--text3)}
.tz-sub-status.st-incidencia{color:var(--red)}
.tz-sub-meta{font-size:10px;color:var(--text3);margin-top:4px}

/* ── EVENTOS (nivel 3) ── */
.tz-events{margin-top:10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);max-height:180px;overflow-y:auto}
.tz-events-hdr{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.02em;color:var(--text3);padding:7px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2)}
.tz-event-row{display:flex;gap:8px;padding:5px 10px;border-bottom:1px solid var(--border);font-size:11px}
.tz-event-row:last-child{border-bottom:none}
.tz-event-time{font-family:var(--font-mono);color:var(--text3);min-width:42px;flex-shrink:0}
.tz-event-msg{color:var(--text2)}
.tz-event-msg b{color:var(--text);font-weight:600}
.tz-events-empty{padding:10px;text-align:center;color:var(--text3);font-size:11px}

/* ── LOADING / EMPTY ── */
.tz-loading,.tz-empty{flex:1;padding:80px 20px;text-align:center;color:var(--text3)}
.tz-loading .spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.tz-empty-icon{font-size:34px;margin-bottom:8px}
</style>
</head>
