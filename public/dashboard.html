<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme.js"></script>
    <title>PrintLab</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#118fc6">
    <link rel="apple-touch-icon" href="/assets/bootstrap/branding-logoUrl.png">
    <link rel="stylesheet" href="/styles.css?v=20260924-desplegables">
    <style>
        /* Impresion: el modulo activo vive en un <iframe> del shell. Al imprimir se retira
           todo el cromo del shell y se aplana el layout (que normalmente fija el iframe al
           viewport con scroll interno) para que el iframe activo fluya y el navegador
           pueda paginar su contenido completo. El FORMATO del documento lo define el
           @media print de la propia pagina embebida (p.ej. orden-produccion.html); aqui
           NO se replica. dashboard.js fija la altura real del iframe en beforeprint. */
        @page { size: letter portrait; margin: 8mm 9mm; }
        @media print {
            body > *:not(.app-shell) { display: none !important; }
            .app-shell.dashboard-app-shell > *:not(.dashboard-workspace-shell) { display: none !important; }
            .dashboard-workspace-shell > *:not(#dashboardWorkspace) { display: none !important; }
            #dashboardWorkspace > .dashboard-frame-host:not(.is-print-target) { display: none !important; }
            .dashboard-frame-host.is-print-target .dashboard-float-bar,
            .dashboard-frame-host.is-print-target .dashboard-float-resize { display: none !important; }

            html, body {
                background: #fff !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .app-shell.dashboard-app-shell,
            .dashboard-workspace-shell,
            #dashboardWorkspace,
            .dashboard-frame-host.is-print-target {
                margin: 0 !important;
                padding: 0 !important;
                border: 0 !important;
                min-height: 0 !important;
                max-height: none !important;
                height: auto !important;
                overflow: visible !important;
                background: #fff !important;
                background-image: none !important;
                break-before: auto !important;
                break-after: auto !important;
                page-break-before: auto !important;
                page-break-after: auto !important;
            }
            .app-shell.dashboard-app-shell { display: block !important; }
            .dashboard-workspace-shell { display: block !important; }
            #dashboardWorkspace { position: static !important; }
            .dashboard-frame-host.is-print-target {
                position: static !important;
                inset: auto !important;
                display: block !important;
            }
            .dashboard-frame-host.is-print-target > .dashboard-frame {
                position: static !important;
                inset: auto !important;
                display: block !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                min-height: 0 !important;
                max-height: none !important;
                border: 0 !important;
                vertical-align: top !important;
                /* la altura la fija dashboard.js en beforeprint (un <iframe> con
                   height:auto mide 150px, no su contenido) */
            }
        }
    </style>
</head>
<body class="dashboard-body">

                    <button type="button" class="dashboard-card" data-route="/ordenes-produccion" data-label="&Oacute;rdenes" data-icon-key="dashboardOrders">

                    <button type="button" class="dashboard-card" data-route="/calidad" data-label="Calidad" data-icon-key="dashboardCalidad">
