// subir imágenes/archivos y aprobar desde acá queda pendiente de definir aparte),
// más dos pestañas propias: Montaje y Troquel (troquel cotizado en la orden vs. vigente
// de producción, sellos y core/sentido de bobinado) y la captura de Tintas/Especificación
// ya existente.
// ════════════════════════════════════════════
let preprensaState={oid:null,data:null,curM:0,curV:0,tab:'general'};
async function loadPreprensaData(oid){
  const r=await fetch('/api/produccion-preprensa?orden='+encodeURIComponent(oid),{headers:sessionHeader()});
  const p=await r.json();
  if(!r.ok||!p.ok)throw new Error(p.error||'No se pudo cargar el panel de preprensa.');
  preprensaState={oid,data:p.data,curM:0,curV:0,tab:preprensaState.tab||'general'};
}
function ppNav(id){preprensaState.tab=id;refreshOrderModal(preprensaState.oid);}
function buildPreprensaPanel(o){
  const rows=producedValuesCache[o.id+'|preprensa'];
  if(!rows)loadProducedValuesFor(o.id,'preprensa').then(()=>refreshOrderModal(o.id));
  if(preprensaState.oid!==o.id||!preprensaState.data){
    loadPreprensaData(o.id).then(()=>refreshOrderModal(o.id)).catch(e=>{preprensaState={oid:o.id,data:{__err:e.message},tab:'general'};refreshOrderModal(o.id);});
    return `<div class="qd-panel"><div class="qd-empty">Cargando especificación de preprensa…</div></div>`;
  }
  const d=preprensaState.data;
  if(d.__err)return `<div class="qd-panel"><div class="qd-empty">${dzEsc(d.__err)}</div></div>`;
  if(!rows)return `<div class="qd-panel"><div class="qd-empty">Cargando datos de producción…</div></div>`;

  // Reloj — mismo mecanismo que Diseño/Tintas/Impresión (orderStartTime/pauseStarts).
  const st2=stOf(o),key=orderKey(o);
  const cStart=(orderStartTime[key]||o.actualStartDt||o.startDt);
  const cStartMs=cStart?new Date(cStart).getTime():0;
  let cCls='',cTxt='00:00:00',cState='<b>En espera</b> · sin iniciar';
  if(st2==='inprog'){cCls='run';cTxt=dzHMS(Date.now()-cStartMs);cState='<b>En curso</b> · corriendo';}
  else if(st2==='paused'){
    if(o.suspendidaProduccion){cCls='paused';const ps=pauseStarts[key];cTxt=dzHMS((ps?ps.startTs:Date.now())-cStartMs);cState='<b>⛔ Suspendida</b> · esperando a Planificación';}
    else{cCls='run';cTxt=dzHMS(Date.now()-cStartMs);cState='<b>En pausa</b> · el reloj sigue corriendo';}
  }
  else if(st2==='done'){cTxt=dzHMS((o.actualEndDt?new Date(o.actualEndDt).getTime():Date.now())-cStartMs);cState='<b>Completada</b> · tiempo final';}
  const pauseBoxHtml=(st2==='paused'&&!o.suspendidaProduccion)?(()=>{
    const psStart=o.pausedSince?new Date(o.pausedSince).getTime():((pauseStarts[key]&&pauseStarts[key].startTs)||Date.now());
    const quien=o.pauseOperator||(pauseStarts[key]&&pauseStarts[key].operator)||'';
    const motivo=o.pauseLabel||(pauseStarts[key]&&(pauseStarts[key].reason||pauseStarts[key].note))||'';
    return `<div class="qd-panel dz-pause-box">
      <div class="qd-panel-hdr">⏸ En Pausa</div>
      <div class="dz-pause-box-row">${quien?`<b>${dzEsc(quien)}</b> pausó esta orden`:'Esta orden está pausada'}${motivo?` por: <b>${dzEsc(motivo)}</b>`:''}</div>
      <div class="dz-clock dz-clock-mini dz-clock-alerta live-seconds" data-start="${psStart}">${dzHMS(Date.now()-psStart)}</div>
    </div>`;
  })():'';
  let cActs='';
  if(st2==='pending')cActs+=`<button class="dz-act dz-act-start" onclick="doStart('${o.id}','${o.name}',this)">▶ Iniciar proceso</button>`;
  if(st2==='inprog'){cActs+=`<button class="dz-act dz-act-done" onclick="doComplete('${o.id}','${o.name}')">■ Finalizar proceso</button>`;
    cActs+=`<button class="dz-act dz-act-pause" onclick="openPauseModal('${o.id}','${o.name}','preprensa')">⏸ Pausar</button>`;}
  if(st2==='paused')cActs+=`<button class="dz-act dz-act-start" onclick="doResume('${o.id}',this)">▶ Reanudar</button>`;
  if(st2==='done')cActs+=`<button class="dz-act dz-act-start" onclick="abrirNuevoCiclo('${o.id}','${dzEsc(o.name)}','preprensa')">▶ Iniciar</button>`;
  const clockHtml=`<div class="dz-clock-wrap">
    <div class="dz-clock ${cCls}" ${(st2==='inprog'||(st2==='paused'&&!o.suspendidaProduccion))?`data-start="${cStartMs}"`:''}>${cTxt}</div>
    <div class="dz-clock-side">
      <div class="dz-clock-state">${cState}</div>
      <div class="dz-actrow">${cActs}</div>
    </div>
  </div>${pauseBoxHtml}`;

  const secHead=(k,t)=>`<div class="dz-sec-h"><div>${k?`<div class="dz-sec-k">${k}</div>`:''}<div class="dz-sec-t">${t}</div></div></div>`;

  // Pestañas viejas (Información del Arte / Montaje y Troquel / Acabados) retiradas — ahora
  // solo Información General (mismo formato de Impresión) y Eventos. Especificación del Arte
  // y Notas se agregan al final de Información General.
  if(preprensaState.tab==='espec'||preprensaState.tab==='montaje'||preprensaState.tab==='acab')preprensaState.tab='general';
  const tab=preprensaState.tab||'general';
  // Especificación del Arte ya vive DENTRO de cada bloque de Arte (dzInfoGeneralMotivoBloque),
  // no aparte. Notas para Producción sigue independiente, fuera de los artes.
  const notasHtml=`<section class="dz-sec">
        ${secHead('','Notas para Producción')}
        <div class="dz-sec-b"><textarea class="dz-notes" readonly>${dzEsc(d.spec.notas||'')}</textarea></div>
      </section>`;
  const generalHtml=`${buildDzInfoGeneralTab(o,d,'preprensa')}${notasHtml}`;
  return `<div class="dzp" id="ppp">
    ${ccBannerHtml(d.cambiosCliente)}
    ${clockHtml}
    <div class="dz-tabs">
      <button class="${tab==='general'?'on':''}" onclick="ppNav('general')">Información General</button>
      <button class="${tab==='eventos'?'on':''}" onclick="ppNav('eventos')">Eventos</button>
    </div>
    <div class="dz-tabbody">
      ${tab==='general'?generalHtml:''}
      ${tab==='eventos'?buildDzEventosTab(o,'preprensa'):''}
    </div>
  </div>`;
}

// Bloque D — Acabados como lista vertical: un bloque por cada acabado que la orden SÍ lleva
// (los apagados no aparecen), con su descripción corta y sus características (cotizado↔real
// editables) debajo. Reemplaza la grilla de 4 cuadritos + el panel de especificación aparte.
// Compartido entre Diseño y Preprensa. NO resetea _qdRowRegistry (lo hace buildOrderDetailContent).
function buildAcabadosListaHtml(o,d){
  const rows=producedValuesCache[o.id+'|acabados'];
  if(!_acabadosCatalogCache)loadAcabadosCatalogos().then(()=>refreshOrderModal(o.id));
  if(!rows){
    loadProducedValuesFor(o.id,'acabados').then(()=>refreshOrderModal(o.id));
    return `<section class="dz-sec"><div class="dz-sec-h"><div><div class="dz-sec-t">Acabados</div></div></div><div class="dz-sec-b"><div class="qd-empty">Cargando acabados…</div></div></section>`;
  }
  const prefijoDe={'Barniz':'barniz_','Laminado':'laminado_','Estampado':'foil_'};
  const activos=(d.acabados||[]).filter(a=>a.activo).map(a=>({nombre:a.nombre,detalle:a.detalle||'',prefijo:prefijoDe[a.nombre]||null}));
  // Acabados que solo viven en las filas (embosado/curado) y no en d.acabados.
  const usados=new Set(activos.map(a=>a.prefijo).filter(Boolean));
  if(rows.some(r=>r.campo.startsWith('embosado_'))&&!usados.has('embosado_'))activos.push({nombre:'Embosado / Relieve',detalle:'',prefijo:'embosado_'});
  if(rows.some(r=>r.campo.startsWith('curado_'))&&!usados.has('curado_'))activos.push({nombre:'Curado / Secado',detalle:'',prefijo:'curado_'});

  const header=`<div class="dz-sec-h"><div><div class="dz-sec-t">Acabados</div></div></div>`;
  if(!activos.length){
    return `<section class="dz-sec">${header}<div class="dz-sec-b"><div class="dz-sub">Esta orden no lleva acabados.</div></div></section>`;
  }
  const g=groupRowsByMotivo(rows);
  const motivoKeys=Object.keys(g);
  const multi=motivoKeys.length>1;
  const bloque=(it)=>{
    let filasHtml='';
    if(it.prefijo){
      filasHtml=motivoKeys.map(mi=>{
        const fs=(g[mi]||[]).filter(r=>r.campo.startsWith(it.prefijo));
        if(!fs.length)return '';
        return `${multi?`<div class="qd-motivo-title">Arte ${Number(mi)+1}</div>`:''}${fs.map(r=>qdRowFromRecord(o,r)).join('')}`;
      }).join('');
    }
    return `<div class="dz-acab-block">
      <div class="dz-acab-hdr"><span class="dz-ck">✓</span><b>${dzEsc(it.nombre)}</b>${it.detalle?`<span class="dz-acab-det">${dzEsc(it.detalle)}</span>`:''}</div>
      ${filasHtml?`<div class="dz-acab-body">${filasHtml}</div>`:''}
    </div>`;
  };
  return `<section class="dz-sec">
    ${header}
    <div class="dz-sec-b"><div class="dz-acab-list">${activos.map(bloque).join('')}</div></div>
  </section>`;
}

// Especificación de acabados capturable en MES (barniz, laminado, foil, embosado, curado).
// Panel siempre visible; solo aparece si el trabajo tiene esos acabados (el seed no crea las filas si no).
// NO resetea _qdRowRegistry (lo hace buildOrderDetailContent una sola vez).
function buildAcabadosPanel(o){
  const rows=producedValuesCache[o.id+'|acabados'];
  if(!_acabadosCatalogCache)loadAcabadosCatalogos().then(()=>refreshOrderModal(o.id));
  if(!rows){
    loadProducedValuesFor(o.id,'acabados').then(()=>refreshOrderModal(o.id));
    return `<div class="qd-panel"><div class="qd-empty">Cargando acabados…</div></div>`;
  }
  const g=groupRowsByMotivo(rows);
  const motivoKeys=Object.keys(g);
  if(!motivoKeys.length)return'';
  const body=motivoKeys.length>1
    ? motivoKeys.map(mi=>`<div class="qd-motivo"><div class="qd-motivo-title">Arte ${Number(mi)+1}</div>${g[mi].map(r=>qdRowFromRecord(o,r)).join('')}</div>`).join('')
    : (g[motivoKeys[0]]||[]).map(r=>qdRowFromRecord(o,r)).join('');
  return `<div class="qd-panel">
    <div class="qd-panel-hdr">Especificación de Acabados</div>
    ${body}
  </div>`;
}
// Tiempos reales de Montaje/Tiraje (cronometrados por eventos de fase, ver
// buildFaseButtonsRebobinado) — de solo lectura, el backend los calcula.
let rebobinadoTiemposCache={};
async function loadRebobinadoTiempos(oid){
  try{
    const res=await fetch(`/api/mes/rebobinado-tiempos?orderCode=${encodeURIComponent(oid)}`,{headers:sessionHeader()});
    const payload=await res.json().catch(()=>({}));
    rebobinadoTiemposCache[oid]=payload.ok?payload.data:{};
  }catch(e){rebobinadoTiemposCache[oid]={};}
  return rebobinadoTiemposCache[oid];
}
// Tiempos reales de las fases de Impresión (Montaje / Tiraje) — para reconstruir el estado del
// botón principal al recargar la página (mismo patrón que rebobinadoTiemposCache).
let impresionTiemposCache={};
async function loadImpresionTiempos(oid){
  try{
    const res=await fetch(`/api/mes/impresion-tiempos?orderCode=${encodeURIComponent(oid)}`,{headers:sessionHeader()});
    const payload=await res.json().catch(()=>({}));
    impresionTiemposCache[oid]=payload.ok?payload.data:{};
  }catch(e){impresionTiemposCache[oid]={};}
  return impresionTiemposCache[oid];
}
function fmtMinRebobinado(min){
  const n=Number(min);
  if(!n||n<=0)return'';
  const h=Math.floor(n/60),m=Math.round(n%60);
  return h>0?`${h}h ${m}min`:`${m} min`;
}
// Pestaña "Eventos" de Impresión — junta lo que antes estaba repartido en Información General
// (tiempos de Montaje/Tiraje, merma vs. cotizado, merma por causa de paro) más el historial de
// eventos de la orden, para que la pestaña principal quede solo con los datos de trabajo del día.
function buildImpresionEventosTab(o){
  const key=orderKey(o), logs=eventLogs[key]||[];
  const tImp=impresionTiemposCache[o.id]||{};
  const tiemposBlock=`<div class="qd-panel">
    <div class="qd-panel-hdr">Tiempos</div>
    <div class="qd-row"><span class="qd-row-lbl">Tiempo de Montaje</span><span class="qd-row-val">${fmtMinRebobinado(tImp.montaje_min)}</span></div>
    <div class="qd-row"><span class="qd-row-lbl">Tiempo de Tiraje</span><span class="qd-row-val">${fmtMinRebobinado(tImp.tiraje_min)}</span></div>
    <div class="qd-row"><span class="qd-row-lbl">Tiempo Total</span><span class="qd-row-val">${fmtMinRebobinado(tImp.total_min)}</span></div>
  </div>`;
  // Suspender Producción vive acá ahora (a la par del título), no en la fila de botones de
  // arriba — solo tiene sentido mientras el proceso está corriendo.
  const suspenderBtn=stOf(o)==='inprog'?`<button class="dz-act-icon dz-act-icon-danger" title="Suspender Producción: detiene el reloj y avisa a Planificación" onclick="openSuspenderModal('${o.id}','${o.name}','impresion')">${shellIconSpanHtml('produccionSuspenderProduccion','⛔','Suspender Producción')}</button>`:'';
  const logsBlock=`<div class="qd-panel">
    <div class="qd-panel-hdr" style="display:flex;align-items:center;justify-content:space-between">
      <span>Historial de Eventos</span>
      ${suspenderBtn}
    </div>
    <div class="evlog">
      ${logs.length?logs.map(ev=>{const ic=EVENT_ICON_MAP[ev.tipo];return`<div class="ev-row"><span class="ev-time">${ev.time}</span><span class="ev-icon">${ic?shellIconSpanHtml(ic.key,ic.fallback,'Evento'):(ev.tipo||'')}</span><span class="ev-msg">${ev.msg}</span></div>`;}).join('')
      :'<div class="qd-empty">Sin eventos registrados.</div>'}
    </div>
  </div>`;
  return `${tiemposBlock}${buildMermaPanel(o)}${logsBlock}`;
}
// Merma de Ajuste: el operario va sumando cantidad (no reemplaza el valor vigente).
function openIncrementoMermaAjuste(idx){
  const opts=_qdRowRegistry[idx];
  if(!opts)return;
  showModal2(`<h3>+ Agregar Merma de Ajuste</h3>
    <div class="modal-sub">${opts.orderCode}</div>
    <div class="section-lbl">Vigente Actual</div>
    <div style="font-family:var(--font-mono);font-size:15px;color:var(--text3);margin-bottom:14px">${opts.valorProducido||opts.valorCotizado||'0'} m</div>
    <div class="section-lbl">Cantidad a Agregar (m)</div>
    <input class="note-input" id="incMermaInput" type="number" min="0" step="1" placeholder="0" style="margin-bottom:14px;font-family:var(--font-mono);min-height:auto;padding:12px 14px">
    <div class="modal-btns">
      <button class="mbtn-cancel" onclick="closeModal2()">Cancelar</button>
      <button class="mbtn-confirm mbtn-green" onclick="confirmIncrementoMerma(${idx})">✓ Agregar</button>
    </div>`);
}
async function confirmIncrementoMerma(idx){
  const opts=_qdRowRegistry[idx];
  if(!opts)return;
  const input=document.getElementById('incMermaInput');
  const cantidad=Math.round(Number(input?input.value:0)||0);
  if(cantidad<=0){showToast('⚠ Indicá una cantidad mayor a 0');return;}
  try{
    const res=await fetch('/api/produccion/valores-motivo',{
      method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},
      body:JSON.stringify({orderCode:opts.orderCode,motivoIndice:opts.motivoIndice||0,proceso:opts.proceso,campo:opts.campo,
        etiqueta:opts.etiqueta,unidad:opts.unidad,valorCotizado:opts.valorCotizado,valorProducido:cantidad,
        incrementar:true,operatorName:currentUserName()})
    });
    const payload=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(payload.error||'No se pudo guardar.');
    closeModal2();showToast('✓ Merma de ajuste actualizada');
    delete producedValuesCache[opts.orderCode+'|'+opts.proceso];
    refreshOrderModal(opts.orderCode);
  }catch(e){showToast(e.message||'Error al guardar');}
}
function buildRebobinadoPanel(o,rows){
  const g=groupRowsByMotivo(rows);
  const motivoKeys=Object.keys(g);
  if(!_outputTypesCache)loadOutputTypesCatalog().then(()=>refreshOrderModal(o.id));
  if(rebobinadoTiemposCache[o.id]===undefined)loadRebobinadoTiempos(o.id).then(()=>refreshOrderModal(o.id));

  if(!motivoKeys.length)return`<div class="qd-panel"><div class="qd-empty">Sin datos cotizados de rebobinado disponibles para esta orden.</div></div>`;

  // Diámetro, ancho y espesor de pared del Core ya no van en filas de texto — se ven marcados
  // sobre la foto real del core (rebobinado-core-cotas.svg). Abajo de la imagen solo queda un
  // resumen de 5 datos, en dos columnas, mostrando nada más lo Producido (sin columna Cotizado).
  // Velocidad y Cantidad Empalmes Máximo quedan apiladas en su columna; Sentido de Bobinado
  // (con la foto) ocupa la columna de al lado a lo alto de esas dos filas — ver
  // qd-rebo-resumen-item-sentido en el CSS, para que la foto no estire la fila de Velocidad.
  const REBOBINADO_RESUMEN_CAMPOS=['productos_por_rollo','rebobinado_distancia_recorrida_m','rebobinado_velocidad','rebobinado_empalmes_maximo','tipo_salida','rebobinado_rollos_completos','rebobinado_etiquetas_rollo_remanente'];
  const resumenIdx=(campo)=>{const i=REBOBINADO_RESUMEN_CAMPOS.indexOf(campo);return i===-1?999:i;};
  const renderResumenRow=(r)=>{
    if(r.campo==='tipo_salida'){
      const match=findOutputTypeImage(r.valor_producido||r.valor_cotizado);
      const imgUrl=match&&(match.image_url||match.imageUrl);
      // Tocar la foto amplía la imagen (dzZoom) en vez de abrir el editor del valor — por eso
      // detiene la propagación antes de que llegue al onclick de la fila.
      return qdRowResumenProducido(o,r,{extraHtml:imgUrl?`<img class="qd-rebo-resumen-thumb" src="${imgUrl}" alt="Sentido de bobinado" onclick="event.stopPropagation();dzZoom('${String(imgUrl).replace(/'/g,"\\'")}')">`:''});
    }
    // Distancia Recorrida, Rollos Completos y Rollo Remanente ya no se editan a mano desde acá:
    // salen de lo declarado al finalizar Tiraje (confirmFinalizarFaseRebobinado).
    if(r.campo==='rebobinado_distancia_recorrida_m'||r.campo==='rebobinado_rollos_completos'||r.campo==='rebobinado_etiquetas_rollo_remanente'){
      return qdRowResumenProducido(o,r,{soloLectura:true});
    }
    return qdRowResumenProducido(o,r);
  };

  const coreImgBlock=`<div class="qd-rebo-core-img-wrap"><img class="qd-rebo-core-img" src="/assets/rebobinado-core-cotas.svg?v=20260918-2" alt="Medidas del core: diámetro, ancho y espesor de pared"></div>`;

  return `<div class="qd-panel">
    <div class="qd-panel-hdr">Rebobinado</div>
    ${coreImgBlock}
    ${motivoKeys.map(mi=>`<div class="qd-motivo">
      ${motivoKeys.length>1?`<div class="qd-motivo-title">Arte ${Number(mi)+1}</div>`:''}
      <div class="qd-rebo-resumen-grid">
        ${g[mi].filter(r=>REBOBINADO_RESUMEN_CAMPOS.includes(r.campo)).sort((a,b)=>resumenIdx(a.campo)-resumenIdx(b.campo)).map(r=>renderResumenRow(r)).join('')}
      </div>
    </div>`).join('')}
  </div>`;
}
// Pestaña "Eventos" de Rebobinado — tiempos de Montaje/Tiraje, contadores de lo declarado al
// finalizar cada fase (metros y productos), botón Suspender Producción (encima de la tabla de
// tiempos) e historial de eventos. Igual patrón que buildImpresionEventosTab.
function buildRebobinadoEventosTab(o){
  const key=orderKey(o), logs=eventLogs[key]||[];
  const st2=stOf(o);
  const tiempos=rebobinadoTiemposCache[o.id]||{};
  const suspenderBtn=st2==='inprog'?`<button class="dz-act-icon dz-act-icon-danger" title="Suspender Producción: detiene el reloj y avisa a Planificación" onclick="openSuspenderModal('${o.id}','${o.name}','rebobinado')">${shellIconSpanHtml('produccionSuspenderProduccion','⛔','Suspender Producción')}</button>`:'';
  const fmtEntero=(v)=>{const n=Number(v);return isFinite(n)?n.toLocaleString('es-CR'):'';};
  const tiemposBlock=`<div class="qd-panel">
    <div class="qd-panel-hdr" style="display:flex;align-items:center;justify-content:space-between">
      <span>Tiempos</span>
      ${suspenderBtn}
    </div>
    <div class="qd-row"><span class="qd-row-lbl">Tiempo de Montaje</span><span class="qd-row-val">${fmtMinRebobinado(tiempos.montaje_min)}</span></div>
    <div class="qd-row"><span class="qd-row-lbl">Tiempo de Tiraje</span><span class="qd-row-val">${fmtMinRebobinado(tiempos.tiraje_min)}</span></div>
    <div class="qd-row"><span class="qd-row-lbl">Tiempo Total</span><span class="qd-row-val">${fmtMinRebobinado(tiempos.total_min)}</span></div>
  </div>`;
  // Contadores de lo declarado al finalizar cada fase (solo lectura): metros de Montaje
  // (merma) y de Tiraje (buen estado), y los productos del cierre de Tiraje (rollos completos,
  // remanente y total contabilizado con lo que dijo el operario).
  const rowsRebo=producedValuesCache[o.id+'|rebobinado'];
  if(!rowsRebo)loadProducedValuesFor(o.id,'rebobinado').then(()=>refreshOrderModal(o.id));
  const findRebo=(campo)=>(rowsRebo||[]).find(r=>r.campo===campo);
  const valRebo=(campo)=>{const r=findRebo(campo);return (r&&(r.valor_producido||r.valor_cotizado))||'';};
  const mermaMts=Number(tiempos.montaje_m)||0;
  const tirajeMts=Number(tiempos.tiraje_m)||0;
  const totalMts=Number(tiempos.total_m)||0;
  const rollosN=Number(valRebo('rebobinado_rollos_completos'))||0;
  const remanenteN=Number(valRebo('rebobinado_etiquetas_rollo_remanente'))||0;

    <div class="qd-panel-hdr">Contadores del Tiraje</div>

    <div class="qd-row"><span class="qd-row-lbl">Metros Tiraje en Buen Estado</span><span class="qd-row-val">${tirajeMts>0?`${fmtEntero(tirajeMts)} m`:''}</span></div>

    <div class="qd-row"><span class="qd-row-lbl">Rollos Completos</span><span class="qd-row-val">${fmtEntero(rollosN)}</span></div>
    ${remanenteN>0?`<div class="qd-row"><span class="qd-row-lbl">Rollo Remanente</span><span class="qd-row-val">${fmtEntero(remanenteN)}</span></div>`:''}
    ${conteoTotal!=null?`<div class="qd-row"><span class="qd-row-lbl"><b>Productos Contabilizados en Buen Estado</b></span><span class="qd-row-val"><b>${fmtEntero(conteoTotal)}</b></span></div>`:''}
  </div>`;
  const logsBlock=`<div class="qd-panel">
    <div class="qd-panel-hdr">Historial de Eventos</div>
    <div class="evlog">
      ${logs.length?logs.map(ev=>{const ic=EVENT_ICON_MAP[ev.tipo];return`<div class="ev-row"><span class="ev-time">${ev.time}</span><span class="ev-icon">${ic?shellIconSpanHtml(ic.key,ic.fallback,'Evento'):(ev.tipo||'')}</span><span class="ev-msg">${ev.msg}</span></div>`;}).join('')
      :'<div class="qd-empty">Sin eventos registrados.</div>'}
    </div>

// Grupo visual por campo de empaque. Los que no estén aquí caen en "Otros".

const EMPAQUE_GRUPOS={
  empaque_operarios:'Personal',
  tipo_core:'Cores',
  empaque_tipo_caja:'Cajas', empaque_caja_largo:'Cajas', empaque_caja_ancho:'Cajas', empaque_caja_alto:'Cajas', empaque_cantidad_rollos:'Cajas',

const EMPAQUE_ORDEN_GRUPOS=['Personal','Cores','Cajas','Bolsas','Peso y Cierre','Tarima','Otros'];
// Bloque I — orden de los campos dentro de cada sub-sección. "Operarios en Proceso" sube

const EMPAQUE_ORDEN_CAMPOS=['empaque_operarios',
  'tipo_core','empaque_tipo_caja','empaque_caja_largo','empaque_caja_ancho','empaque_caja_alto',
  'empaque_cantidad_rollos','empaque_rollos_sueltos','empaque_cantidad_cajas','empaque_cajas_utilizadas','empaque_caja_cortada',

const empaqueOrdenIdx=(campo)=>{const i=EMPAQUE_ORDEN_CAMPOS.indexOf(campo);return i===-1?999:i;};
// Bloque I — campos de empaque retirados de la ventana (siguen en BD para órdenes viejas).

const EMPAQUE_CAMPOS_OCULTOS=new Set(['empaque_gancho_core','empaque_etiquetas_por_core','empaque_caja_dimensiones','etiquetas_por_caja','empaque_caja_cortada','empaque_cantidad_cores','empaque_etiquetas_por_rollo','empaque_costo_caja','empaque_subtotal_cajas']);
function buildEmpaquePanel(o,rows,coreRows){
  rows=(rows||[]).filter(r=>!EMPAQUE_CAMPOS_OCULTOS.has(r.campo));
  if(!_cajasCatalogoCache)loadCajasCatalogo().then(()=>refreshOrderModal(o.id));
  if(!_bolsasCatalogoCache)loadBolsasCatalogo().then(()=>refreshOrderModal(o.id));
  const g=groupRowsByMotivo(rows);

  const motivoKeys=[...new Set([...Object.keys(g),...Object.keys(coreByMotivo)])];

  if(!motivoKeys.length)return`<div class="qd-panel"><div class="qd-empty">Sin datos de empaque para esta orden.</div></div>`;

  const sumEmp=(campo,which)=>{let any=false,s=0;rows.filter(x=>x.campo===campo).forEach(r=>{const v=which==='prod'?(r.valor_producido||''):(r.valor_cotizado||'');const nn=parseFloat(String(v).replace(/[,\s]/g,''));if(isFinite(nn)){s+=nn;any=true;}});return any?s:null;};
  const pedidoCli=sumEmp('empaque_cantidad_final','cot');

  if(pedidoCli!=null){
    const falta=empacadoReal!=null?Math.max(0,Math.round(pedidoCli-empacadoReal)):Math.round(pedidoCli);
    rows.forEach(r=>{if(r.campo==='empaque_faltante'&&(empacadoReal!=null)){r.valor_producido=String(falta);r.valor_cotizado=r.valor_cotizado||'0';}});

  return `${faltanteBanner}<div class="qd-panel emp-panel"><div class="qd-panel-hdr">Empaque</div>
    ${motivoKeys.map(mi=>{
      const secc={};
      (g[mi]||[]).forEach(r=>{const k=EMPAQUE_GRUPOS[r.campo]||'Otros';(secc[k]=secc[k]||[]).push(r);});
      // "Cantidad de Productos Solicitados" siempre visible: si la orden todavía no tiene

      // Número sin decimales de más: 3.0000 → 3, 12.50 → 12.5
      const fmtLimpio=(v)=>{const t=String(v==null?'':v).trim();if(t==='')return'';const n=Number(t);return isFinite(n)?String(Math.round(n*100)/100):t;};

            </div>`;
      const subHdr=(k)=>`<div class="qd-sub-hdr" data-grupo="${dzEsc(k)}">${dzEsc(k)}</div>`;
      const body=EMPAQUE_ORDEN_GRUPOS.filter(k=>secc[k]).map(k=>{

          const coreRows=coreByMotivo[mi]||[];

          if(tipoCore){

        }
        if(k==='Cajas'){

          if(tipoCaja){

          return `<div class="qd-sub-hdr" data-grupo="Cajas">Cajas</div>${filaTipo}${resto.map(r=>qdRowEmpaqueUnaColumna(o,r)).join('')}`;
        }
        if(k==='Bolsas'){
          // Tipo de Bolsa lleva la cantidad solicitada entre paréntesis, sin etiqueta propia.
          const tipoBolsa=porCampo(secc[k],'empaque_tipo_bolsa');
          const cantBolsas=porCampo(secc[k],'empaque_cantidad_bolsas');
          if(tipoBolsa){
            const cantVal=cantBolsas?String(cantBolsas.valor_producido||cantBolsas.valor_cotizado||'').trim():'';

            const resto=ordenados(secc[k]).filter(r=>!['empaque_tipo_bolsa','empaque_cantidad_bolsas'].includes(r.campo));

            const filaTipo=valorRow(tipoBolsa,cantHtml);

          // "Cantidad de Productos Solicitados" (lo que pidió el cliente, de solo lectura) va

          const solicRow=(o.quantity?{campo:'empaque_cantidad_solicitada',motivo_indice:mi,proceso:'empaque',etiqueta:'Cantidad de Productos Solicitados',unidad:'',valor_cotizado:'',valor_producido:String(o.quantity)}:null);
          const lista=ordenados(secc[k]);
          const iFinal=lista.findIndex(r=>r.campo==='empaque_cantidad_final');
          const filas=[];
          if(solicRow&&iFinal!==-1){
            // Inserta lo solicitado justo antes de lo empacado — comparación de un vistazo.
            lista.forEach((r)=>{
              if(r.campo==='empaque_cantidad_final'){
                filas.push(`<div class="qd-row qd-row-1col"><span class="qd-row-lbl">Cantidad de Productos Solicitados</span><span class="qd-row-1col-val">${Number(o.quantity).toLocaleString('es-CR')}</span></div>`);
              }
              filas.push(qdRowEmpaqueUnaColumna(o,r));

          }else{
            lista.forEach((r)=>filas.push(qdRowEmpaqueUnaColumna(o,r)));
            if(solicRow)filas.push(`<div class="qd-row qd-row-1col"><span class="qd-row-lbl">Cantidad de Productos Solicitados</span><span class="qd-row-1col-val">${Number(o.quantity).toLocaleString('es-CR')}</span></div>`);

      }).join('');
      return multi?`<div class="qd-motivo"><div class="qd-motivo-title">Arte ${Number(mi)+1}</div>${body}</div>`:body;
    }).join('')}
  </div>`;

// Merma % real vs. cotizada — panel siempre visible. Sustrato/foil/laminado/tinta.
// El operador carga el % producido; se sincroniza a las columnas *_vigente de producto y orden.
// NO resetea _qdRowRegistry (lo hace buildOrderDetailContent una sola vez).
let _mermaCausaCache={};
function loadMermaPorCausa(oid){
  return fetch(`/api/mes/merma-por-causa?orderCode=${encodeURIComponent(oid)}`,{headers:sessionHeader()})
    .then(r=>r.json()).then(p=>{_mermaCausaCache[oid]=p&&p.ok?p:{data:[],totalMetros:0};return _mermaCausaCache[oid];})
    .catch(()=>{_mermaCausaCache[oid]={data:[],totalMetros:0};return _mermaCausaCache[oid];});
}
function buildMermaPanel(o){
  const rows=producedValuesCache[o.id+'|merma'];
  const causa=_mermaCausaCache[o.id];
  if(!rows||!causa){
    if(!rows)loadProducedValuesFor(o.id,'merma').then(()=>refreshOrderModal(o.id));
    if(!causa)loadMermaPorCausa(o.id).then(()=>refreshOrderModal(o.id));
    return `<div class="qd-panel"><div class="qd-empty">Cargando merma…</div></div>`;
  }
  // Solo se muestra lo que ya tiene un dato cargado (cotizado o producido). Las filas vacías
  // (cotizado y producido nulos) no se listan — este panel no es el sitio donde el operario
  // carga la merma por primera vez, eso ya se pide al cerrar el proceso.
  const rowsConDato=rows.filter(r=>(r.valor_cotizado!=null&&r.valor_cotizado!=='')||(r.valor_producido!=null&&r.valor_producido!==''));
  const g=groupRowsByMotivo(rowsConDato);
  const motivoKeys=Object.keys(g);
  // Un paro sin pérdida de material (0 m y 0 kg) no aporta a un reporte de merma — se descarta.
  const causaData=(causa.data||[]).filter(c=>Number(c.desperdicio_m||0)>0||Number(c.desperdicio_kg||0)>0);
  const causaBlock=causaData.length?`<div class="qd-panel-hdr" style="margin-top:12px">Merma por Causa de Paro — ${(causa.totalMetros||0).toLocaleString('es-CR')} m</div>
    ${causaData.map(c=>`<div class="qd-row"><span class="qd-row-lbl">${c.motivo_paro}${c.cantidad_paros>1?` (${c.cantidad_paros})`:''}</span><span class="qd-row-val">${Number(c.desperdicio_m||0).toLocaleString('es-CR')} m</span></div>`).join('')}`:'';
  if(!motivoKeys.length&&!causaBlock)return'';
  const body=motivoKeys.length>1
    ? motivoKeys.map(mi=>`<div class="qd-motivo"><div class="qd-motivo-title">Arte ${Number(mi)+1}</div>${g[mi].map(r=>qdRowFromRecord(o,r)).join('')}</div>`).join('')
    : (g[motivoKeys[0]]||[]).map(r=>qdRowFromRecord(o,r)).join('');
  return `<div class="qd-panel">
    ${body?`<div class="qd-panel-hdr">Merma vs. Cotizado (%)</div>${body}`:''}
    ${causaBlock}
  </div>`;
}
// "Tiempos y Merma por Fase" se movió por completo a Comparativa (orden-produccion.js /
// producto-documento.js) — ya no vive en ningún panel de este modal de Producción.
function buildProcessDataPanel(o){
  const proc=activeProc;
  if(!QD_PROCESSES.includes(proc))return'';
  if(proc==='diseno')return buildDisenoPanel(o);
  if(proc==='tintas')return buildTintasPanel(o);
  if(proc==='preprensa')return buildPreprensaPanel(o);
  const rows=producedValuesCache[o.id+'|'+proc];
  const needsCore=proc==='empaque';
  const coreRows=needsCore?producedValuesCache[o.id+'|rebobinado']:null;
  if(!rows||(needsCore&&!coreRows)){
    const loaders=[loadProducedValuesFor(o.id,proc)];
    if(needsCore)loaders.push(loadProducedValuesFor(o.id,'rebobinado'));
    Promise.all(loaders).then(()=>refreshOrderModal(o.id));
    return `<div class="qd-panel"><div class="qd-empty">Cargando datos de producción…</div></div>`;
  }
  if(proc==='visto_bueno')return buildVistoBuenoPanel(o,rows);
  if(proc==='impresion')return buildImpresionPanel(o,rows);
  if(proc==='rebobinado')return buildRebobinadoPanel(o,rows);
  if(proc==='empaque')return buildEmpaquePanel(o,rows,(coreRows||[]).filter(r=>r.campo==='core_diameter'||r.campo==='core_width'));
  return '';
}

let _dzTintaCatalogCache={};
async function dzLoadTintaCatalog(tipo){
  if(_dzTintaCatalogCache[tipo])return _dzTintaCatalogCache[tipo];
  const url=tipo==='proceso'?'/api/tintas/productos?tipo=TINTA_UV'
    :tipo==='adicional'?'/api/tintas/productos?tipo=BLANCO'
    :tipo==='directo'?'/api/tintas/pantones/recetas?estado=VIGENTE'
    :null;
  if(!url){_dzTintaCatalogCache[tipo]=[];return [];}
  try{
    const r=await fetch(url,{headers:sessionHeader()});
    const data=await r.json();
    _dzTintaCatalogCache[tipo]=Array.isArray(data)?data:[];
  }catch(e){_dzTintaCatalogCache[tipo]=[];}
  return _dzTintaCatalogCache[tipo];
}
function dzTintaColorEncode(nombre,hex){return `${nombre||''}::${hex||''}`;}
function dzTintaColorDecode(v){
  if(!v)return {nombre:'',hex:''};
  const i=String(v).indexOf('::');
  if(i<0)return {nombre:v,hex:''};
  return {nombre:v.slice(0,i),hex:v.slice(i+2)};
}
// A diferencia de mesEstValorReal (fijo a motivo 0), esta sí respeta el motivo — Diseño y
// Preprensa repiten el bloque de tintas por cada motivo/arte de la orden.
function dzTintaProducido(oid,proceso,motivoIndice,campo){
  const rows=producedValuesCache[oid+'|'+proceso]||[];
  const r=rows.find(x=>x.campo===campo&&Number(x.motivo_indice)===Number(motivoIndice||0));
  return r&&r.valor_producido!=null&&r.valor_producido!==''?r.valor_producido:null;
}
function buildDzTintasPivotTable(o,m,proceso){
  const motivoIndice=m?m.indice:0;
  const tintas=m?(m.tintas||[]).filter(t=>t.tipo!=='barniz'):[];
  if(!tintas.length)return '';
  const headCells=tintas.map(t=>`<th class="ta-c">Est. ${t.estacion+1}<button class="qd-edit-btn imp-piv-edit" title="Editar tinta" onclick="openDzTintaEditor('${o.id}','${proceso}',${motivoIndice},${t.estacion})">${shellIconSpanHtml('produccionEditarValor','✎','Editar')}</button></th>`).join('');
  const tipoCells=tintas.map(t=>{
    const campo='tinta_tipo_est'+t.estacion;
    const real=dzTintaProducido(o.id,proceso,motivoIndice,campo);
    const tipoKey=real||t.tipo;
    const editado=!!real&&real!==t.tipo;
    return `<td class="ta-c${editado?' qd-editado':''}">${dzEsc(DZ_TIPO[tipoKey]||tipoKey||'')}${editado?'<span class="qd-edited-dot" title="Editado"></span>':''}</td>`;
  }).join('');
  const colorCells=tintas.map(t=>{
    const campo='tinta_color_est'+t.estacion;
    const real=dzTintaProducido(o.id,proceso,motivoIndice,campo);
    const dec=real?dzTintaColorDecode(real):{nombre:t.etiqueta||'',hex:t.color||''};
    if(!dec.nombre)return `<td class="ta-c"></td>`;
    return `<td class="ta-c${real?' qd-editado':''}">${dec.hex?`<span class="dz-tinta-dot-circle" style="--dz-tinta-dot:${dec.hex}"></span>`:''}${dzEsc(dec.nombre)}${real?'<span class="qd-edited-dot" title="Editado"></span>':''}</td>`;
  }).join('');
  return `<div class="imp-piv-wrap"><table class="imp-piv-table">
    <thead><tr><th></th>${headCells}</tr></thead>
    <tbody>
      <tr><td class="imp-piv-lbl">Tipo</td>${tipoCells}</tr>
      <tr><td class="imp-piv-lbl">Color</td>${colorCells}</tr>
    </tbody>
  </table></div>`;
}
let _dzTintaEditCtx=null;
async function openDzTintaEditor(oid,proceso,motivoIndice,estacion){
  const st=proceso==='preprensa'?preprensaState:proceso==='tintas'?tintasState:disenoState;
  const m=((st.data&&st.data.motivos)||[]).find(x=>x.indice===motivoIndice);
  const t=((m&&m.tintas)||[]).find(x=>x.estacion===estacion)||{};
  const tipoCampo='tinta_tipo_est'+estacion, colorCampo='tinta_color_est'+estacion;
  const tipoReal=dzTintaProducido(oid,proceso,motivoIndice,tipoCampo);
  const colorReal=dzTintaProducido(oid,proceso,motivoIndice,colorCampo);
  const tipoActual=tipoReal||t.tipo||'proceso';
  const colorDec=colorReal?dzTintaColorDecode(colorReal):{nombre:t.etiqueta||'',hex:t.color||''};
  await dzLoadTintaCatalog(tipoActual);
  _dzTintaEditCtx={oid,proceso,motivoIndice,estacion,tipoCotizado:t.tipo||'',colorCotizado:t.etiqueta||''};
  showModal2(dzTintaEditorHtml(tipoActual,colorDec.nombre));
}
function dzTintaEditorHtml(tipoActual,colorActual){
  const tipos=[{v:'proceso',l:'Proceso'},{v:'directo',l:'Directo'},{v:'adicional',l:'Adicional'}];
  const catalogo=_dzTintaCatalogCache[tipoActual]||[];

  // Solo un color "Directo" (Pantone) viene de una fórmula — Proceso/Adicional son tintas de
  // catálogo fijo, no tiene sentido "crear una fórmula" para esas.
  const crearFormulaBtn=tipoActual==='directo'
    ?`<button type="button" class="mbtn-confirm mbtn-blue" style="margin-top:8px;width:100%" onclick="abrirFormulaDesdeProduccion()">+ Crear fórmula nueva</button>`:'';
  return `<h3>✎ Tinta</h3>
    <div class="section-lbl">Tipo</div>
    <select class="note-input" id="dzTintaTipoInput" style="min-height:auto;padding:12px 14px" onchange="dzTintaEditorTipoChanged(this.value)">
      ${tipos.map(o=>`<option value="${o.v}"${o.v===tipoActual?' selected':''}>${o.l}</option>`).join('')}
    </select>
    <div class="section-lbl" style="margin-top:10px">Color</div>
    <select class="note-input" id="dzTintaColorInput" style="min-height:auto;padding:12px 14px;margin-bottom:0">${colorOpts}</select>
    ${crearFormulaBtn}
    <div class="section-lbl" style="margin-top:10px">Comentario (opcional)</div>
    <textarea class="note-input" id="dzTintaComentario" placeholder="Opcional" style="min-height:50px"></textarea>
    <div class="modal-btns">
      <button class="mbtn-cancel" onclick="closeModal2()">Cancelar</button>
      <button class="mbtn-confirm mbtn-green" onclick="confirmDzTintaSave()">✓ Guardar</button>
    </div>`;
}
async function dzTintaEditorTipoChanged(tipo){
  await dzLoadTintaCatalog(tipo);
  const sel=document.getElementById('dzTintaColorInput');
  if(sel){
    const catalogo=_dzTintaCatalogCache[tipo]||[];
    sel.innerHTML=`<option value="">— Elegí un color —</option>`+catalogo.map(c=>`<option value="${dzEsc(c.nombre)}">${dzEsc(c.nombre)}</option>`).join('');

async function confirmDzTintaSave(){
  const ctx=_dzTintaEditCtx;
  if(!ctx)return;
  const tipoInput=document.getElementById('dzTintaTipoInput');
  const colorInput=document.getElementById('dzTintaColorInput');
  const comentario=(document.getElementById('dzTintaComentario')||{}).value||'';
  const tipo=tipoInput?tipoInput.value:ctx.tipoCotizado;
  const colorNombre=colorInput?colorInput.value:ctx.colorCotizado;
  const catalogo=_dzTintaCatalogCache[tipo]||[];
  const entry=catalogo.find(c=>c.nombre===colorNombre);
  // color_hex (recetas Pantone) ya es un hex real; color (tintas.productos) es un NOMBRE
  // ("Cian", "Magenta"...) — se traduce con dzTintaColor(), igual que hace el resto de Producción.
  const hex=entry?dzTintaColor(entry.color_hex||entry.color||''):'';
  const colorValor=dzTintaColorEncode(colorNombre,hex);
  try{
    const r1=await fetch('/api/produccion/valores-motivo',{method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},
      body:JSON.stringify({orderCode:ctx.oid,motivoIndice:ctx.motivoIndice,proceso:ctx.proceso,campo:'tinta_tipo_est'+ctx.estacion,
        etiqueta:'Tipo de Tinta',valorCotizado:ctx.tipoCotizado,valorProducido:tipo,justificacion:comentario||undefined,operatorName:currentUserName()})});
    const p1=await r1.json().catch(()=>({}));
    if(r1.status===409&&p1.needsJustification){showToast('⚠ Este dato ya se había editado — escribí un comentario y guardá de nuevo');return;}
    if(!r1.ok)throw new Error(p1.error||'No se pudo guardar el tipo.');
    const r2=await fetch('/api/produccion/valores-motivo',{method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},
      body:JSON.stringify({orderCode:ctx.oid,motivoIndice:ctx.motivoIndice,proceso:ctx.proceso,campo:'tinta_color_est'+ctx.estacion,
        etiqueta:'Color de Tinta',valorCotizado:ctx.colorCotizado,valorProducido:colorValor,justificacion:comentario||undefined,operatorName:currentUserName()})});
    const p2=await r2.json().catch(()=>({}));
    if(r2.status===409&&p2.needsJustification){showToast('⚠ Este dato ya se había editado — escribí un comentario y guardá de nuevo');return;}
    if(!r2.ok)throw new Error(p2.error||'No se pudo guardar el color.');
  }catch(e){showToast(e.message||'Error al guardar');return;}
  delete producedValuesCache[ctx.oid+'|'+ctx.proceso];
  closeModal2();
  showToast('✓ Tinta actualizada');
  refreshOrderModal(ctx.oid);
}

// ── "+ Crear fórmula nueva" desde el editor de Tinta (estación "Directo") ──
// Mismo modal de "Nueva Fórmula de Tinta" que ya existe en Tintas → Recetas y Fórmulas
// (public/tintas/recetas.html), con TODOS sus campos — solo cambia de pestañas a secciones
// para no importar la hoja de estilos completa de esa pantalla. Guarda en el mismo catálogo
// general (POST /api/tintas/pantones/recetas) y, al terminar, la nueva tinta aparece de una
// vez en la lista de colores de esta estación, ya seleccionada.
let pfCatalogo=[],pfMarcas=[],pfFamilias=[],pfClientes=[],pfPantonesBiblioteca=[],pfIngredienteSeq=0;
async function pfFetchConFallback(endpoint){
  try{const r=await fetch('/api/tintas'+endpoint,{headers:sessionHeader()});if(!r.ok)throw new Error();return await r.json();}
  catch(e){return [];}
}
async function abrirFormulaDesdeProduccion(){
  if(!_dzTintaEditCtx)return;
  const [prod,marc,fam,cli]=await Promise.all([
    pfFetchConFallback('/productos'),pfFetchConFallback('/marcas'),pfFetchConFallback('/familias'),pfFetchConFallback('/clientes')
  ]);
  pfCatalogo=Array.isArray(prod)?prod:[];pfMarcas=Array.isArray(marc)?marc:[];pfFamilias=Array.isArray(fam)?fam:[];pfClientes=Array.isArray(cli)?cli:[];
  try{const r=await fetch('/api/tintas/pantones/biblioteca',{headers:sessionHeader()});pfPantonesBiblioteca=r.ok?await r.json():[];}catch(e){pfPantonesBiblioteca=[];}
  pfIngredienteSeq=0;
  showModal2(dzFormulaModalHtml(),false);
  document.getElementById('modalBox2').classList.add('modal-formula');
  pfPoblarSelectsCatalogo();
  pfAgregarIngredienteRow();
  // Pre-llena el nombre con el Pantone que ya pide esta estación, para no partir de cero.
  const nombreSugerido=(_dzTintaEditCtx.colorCotizado||'').trim();
  if(nombreSugerido){const el=document.getElementById('pfNombre');if(el)el.value=nombreSugerido;}
}
function pfPoblarSelect(id,items,placeholder){
  const sel=document.getElementById(id);if(!sel)return;
  sel.innerHTML=`<option value="">${placeholder}</option>`+items.map(it=>`<option value="${it.id}">${dzEsc(it.nombre)}</option>`).join('');
}
function pfPoblarSelectsCatalogo(){
  pfPoblarSelect('pfMarcaId',pfMarcas,'Sin marca');
  pfPoblarSelect('pfFamiliaId',pfFamilias,'Sin familia');

  if(dl)dl.innerHTML=pfClientes.map(c=>`<option data-id="${c.id}" value="${dzEsc(c.partner_name)}">`).join('');
  const dlp=document.getElementById('pfListaPantonesBiblioteca');
  if(dlp)dlp.innerHTML=pfPantonesBiblioteca.map(p=>`<option value="${dzEsc(p.codigo_pantone)}${p.nombre?' - '+dzEsc(p.nombre):''}">`).join('');

function pfOnClienteInput(){
  const input=(document.getElementById('pfClienteBusqueda')||{}).value||'';
  const match=pfClientes.find(c=>String(c.partner_name).toLowerCase()===input.trim().toLowerCase());
  document.getElementById('pfClienteId').value=match?match.id:'';
}
function pfOnPantoneInput(){
  const input=((document.getElementById('pfPantoneBusqueda')||{}).value||'').trim();
  const match=pfPantonesBiblioteca.find(p=>(p.codigo_pantone+(p.nombre?' - '+p.nombre:''))===input);
  document.getElementById('pfPantoneId').value=match?match.id:'';
  if(match){
    document.getElementById('pfCodigoPantone').value=match.codigo_pantone||'';
    if(match.color_hex)document.getElementById('pfColorHex').value=match.color_hex;
  }
}
function pfOpcionesCatalogo(selectedId){
  if(!pfCatalogo.length)return '<option value="">Sin tintas en el catálogo</option>';
  return pfCatalogo.map(p=>{
    const sel=String(p.id)===String(selectedId)?' selected':'';
    return `<option value="${p.id}"${sel}>${dzEsc(p.codigo_interno)} - ${dzEsc(p.nombre)} ($${Number(p.costo_promedio||0).toFixed(2)}/${dzEsc(p.unidad_medida_base||'KG')})</option>`;

function pfAgregarIngredienteRow(data){
  data=data||{};
  pfIngredienteSeq++;

  const row=document.createElement('div');
  row.className='pf-ing-row';row.dataset.rowId=rowId;
  row.innerHTML=`<select class="note-input pf-ing-producto" style="min-height:auto;padding:8px;margin-bottom:0">${pfOpcionesCatalogo(data.producto_id)}</select>

function pfQuitarIngredienteRow(rowId){
  const row=document.querySelector('.pf-ing-row[data-row-id="'+rowId+'"]');
  if(row)row.remove();
  pfActualizarTotales();
}
function pfLeerIngredientes(){
  return Array.from(document.querySelectorAll('.pf-ing-row')).map((row,idx)=>{
    const productoId=row.querySelector('.pf-ing-producto').value;
    const producto=pfCatalogo.find(p=>String(p.id)===String(productoId));
    return {producto_id:productoId,nombre:producto?producto.nombre:'',codigo_interno:producto?producto.codigo_interno:'',
      cantidad:Number(row.querySelector('.pf-ing-cantidad').value)||0,orden:Number(row.querySelector('.pf-ing-orden').value)||(idx+1)};
  });
}
function pfActualizarTotales(){
  const base=Number((document.getElementById('pfCantidadBase')||{}).value)||0;
  const unidadBase=(document.getElementById('pfUnidadBase')||{}).value||'G';
  const ingredientes=pfLeerIngredientes();
  const suma=ingredientes.reduce((a,c)=>a+c.cantidad,0);
  document.querySelectorAll('.pf-ing-row').forEach(row=>{
    const cant=Number(row.querySelector('.pf-ing-cantidad').value)||0;
    const pct=suma>0?(cant/suma*100):0;
    row.querySelector('.pf-ing-pct').textContent=pct.toFixed(2)+'%';
  });
  const totalEl=document.getElementById('pfFormulaTotalResumen');
  if(totalEl)totalEl.textContent='Suma ingresada: '+suma.toFixed(3)+' '+unidadBase+'  |  Base declarada: '+base.toFixed(3)+' '+unidadBase;
}

async function pfGuardarFormula(){

  const codigoInterno=(document.getElementById('pfCodigoInterno').value||'').trim();
  const nombre=(document.getElementById('pfNombre').value||'').trim();
  if(!codigoInterno||!nombre){showToast('⚠ Código interno y nombre son obligatorios.');return;}
  if(!ingredientes.length){showToast('⚠ Agregá al menos un componente con cantidad mayor a cero.');return;}
  const sumaBase=ingredientes.reduce((a,c)=>a+c.cantidad,0);
  const gv=(id)=>{const el=document.getElementById(id);return el?(el.value||'').trim():'';};
  const payload={
    codigo_interno:codigoInterno,nombre:nombre,
    nombre_comercial:gv('pfNombreComercial')||null,pantone_id:gv('pfPantoneId')||null,
    cliente_id:gv('pfClienteId')||null,cliente_nota:gv('pfClienteNota')||null,codigo_cliente:gv('pfCodigoCliente')||null,
    marca_id:gv('pfMarcaId')||null,familia_id:gv('pfFamiliaId')||null,
    descripcion:gv('pfDescripcion')||null,estado:gv('pfEstado')||'VIGENTE',confidencialidad:gv('pfConfidencialidad')||'INTERNO',
    observaciones:gv('pfObservaciones')||null,origen:gv('pfOrigen')||'Pantone',codigo_pantone:gv('pfCodigoPantone')||null,
    codigo_fabricante:gv('pfCodigoFabricante')||null,acabado:gv('pfAcabado')||null,color_hex:gv('pfColorHex')||null,
    sustrato:gv('pfSustrato')||null,maquina_nombre:gv('pfMaquinaNombre')||null,anilox:gv('pfAnilox')||null,
    tecnologia:gv('pfTecnologia')||null,aprobado_xrite:document.getElementById('pfAprobadoXrite').checked,
    disponible_gramos:Number(gv('pfDisponibleGramos'))||0,
    cantidad_base:Number(gv('pfCantidadBase'))||sumaBase,unidad_base:gv('pfUnidadBase')||'G',
    orden_mezcla:gv('pfOrdenMezcla')||null,tiempo_mezclado_min:gv('pfTiempoMezclado')||null,
    velocidad_agitacion:gv('pfVelocidadAgitacion')||null,temperatura_c:gv('pfTemperatura')||null,
    tiempo_reposo_min:gv('pfTiempoReposo')||null,filtrado:gv('pfFiltrado')||null,malla:gv('pfMalla')||null,
    instrucciones:gv('pfInstrucciones')||null,viscosidad:gv('pfViscosidad')||null,ph:gv('pfPh')||null,
    densidad:gv('pfDensidad')||null,brillo:gv('pfBrillo')||null,opacidad:gv('pfOpacidad')||null,
    tiempo_secado:gv('pfTiempoSecado')||null,vida_util:gv('pfVidaUtil')||null,
    componentes:ingredientes.map(c=>({producto_tinta_id:c.producto_id,porcentaje:Number((c.cantidad/sumaBase*100).toFixed(3)),cantidad_referencia:c.cantidad,orden:c.orden}))
  };
  const btn=document.getElementById('pfSaveBtn');
  btn.disabled=true;const textoOriginal=btn.textContent;btn.textContent='Guardando…';
  try{
    const r=await fetch('/api/tintas/pantones/recetas',{method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},body:JSON.stringify(payload)});
    const nueva=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(nueva.error||'No se pudo guardar la fórmula.');
    // La lista de colores "Directo" de la estación se actualiza al toque — se agrega la nueva
    // tinta al catálogo en memoria (aunque el próximo refresco normal filtre por VIGENTE) y
    // vuelve a abrir el editor de la estación con esta fórmula ya seleccionada.
    const entry={id:nueva.id,nombre:nombre,color_hex:payload.color_hex||''};

    showModal2(dzTintaEditorHtml('directo',nombre),false);
  }catch(e){

// Un bloque completo por cada motivo/arte de la orden (a pedido: se repite, no se resume).
// Colapsable (<details>): el primero abierto, el resto cerrado — el usuario puede abrir los
// que quiera. editableArte: solo Diseño puede cargar/reemplazar la imagen del arte y la forma;
// Preprensa las ve de solo lectura.
function dzInfoGeneralMotivoBloque(o,d,m,proceso,editableArte,isFirst){
  const general=d.general||{};
  const p=m.producto||{};
  // Respaldo orden → producto: si esta línea no tiene fila propia en flexo_products (motivo sin
  // producto creado), la orden ya trae su propia copia de sustrato/SKU desde que se creó.
  const materialName=p.materialName||general.materialName||'';
  const skuLocal=p.sku||general.skuLocal||'';
  // ID del troquel: mismo dato ya resuelto por el backend para el acabado "Troquelado"
  // (producto → orden → cálculo) — más confiable que leer solo p.dieCode.
  const dieCode=((d.acabados||[]).find(a=>a.nombre==='Troquelado')||{}).detalle||p.dieCode||'';
  const dimTxt=(p.widthIn&&p.lengthIn)?`${p.widthIn.toFixed(2)} × ${p.lengthIn.toFixed(2)} in`
    :((d.medida&&d.medida.anchoIn&&d.medida.largoIn)?`${(+d.medida.anchoIn).toFixed(2)} × ${(+d.medida.largoIn).toFixed(2)} in`:'');
  // Sin guiones para "sin dato" (regla del proyecto): la etiqueta se muestra igual, el valor
  // queda vacío. f() es para las casillas que si no tienen valor DESAPARECEN por completo (fila 2).
  const g=(v)=>v?dzEsc(v):'';
  const f=(label,val)=>val?`<div class="dz-f"><label>${label}</label><b>${dzEsc(val)}</b></div>`:'';
  // Nombre del producto: el nombre del propio arte/motivo (el mismo que ya usa Impresión para
  // identificarlo) — no el nombre general del trabajo, para no perderse cuando hay varios artes.
  const nombreProducto=[p.nombre||m.nombre,dimTxt].filter(Boolean).join(' — ');

  const aplicacionSuperficie=[general.aplicacion,p.surfaceType].filter(Boolean).join(' · ');
  // Fila 2: Aplicación y Superficie / Insumos del Cliente / Referencia — cada casilla solo
  // aparece si tiene valor. SKU Cliente / SKU Local / Cantidad van fijas en la fila de arriba
  // (a la par una de otra) aunque no tengan valor, para que siempre se vean juntas.
  // Referencia incluye qué cambia (Medidas/Arte/Textos/Otros) y su descripción, si los hay.
  const referenciaTxt=general.referencia
    ? [general.referencia,[general.referenciaCambios?('Cambia: '+general.referenciaCambios):'',general.referenciaComentario||''].filter(Boolean).join(' — ')].filter(Boolean).join(' · ')
    : '';
  const fila2=[
    f('Aplicación y Superficie',aplicacionSuperficie),
    f('Insumos del Cliente',general.insumosCliente),
    f('Referencia',referenciaTxt)
  ].filter(Boolean).join('');

  const acabadosExtra=(d.acabados||[]).filter(a=>a.activo&&(a.nombre==='Barniz'||a.nombre==='Laminado'||a.nombre==='Estampado'));

  const salidaImg=findOutputTypeImage(general.tipoSalida);
  const salidaImgUrl=salidaImg&&(salidaImg.image_url||salidaImg.imagen_url||salidaImg.imageUrl);
  // El Tipo de Salida "de verdad" es el número del catálogo (salidaImg.codigo) — la orden a
  // veces trae el id viejo (una letra) en vez del número; si hay match de catálogo, se muestra
  // el número; si no, el campo queda vacío (no se inventa un número que no existe).
  const salidaNum=salidaImg?(salidaImg.codigo||salidaImg.nombre||''):'';
  if(!_outputTypesCache)loadOutputTypesCatalog().then(()=>refreshOrderModal(o.id));
  const arte=((m.versiones&&m.versiones[0]&&m.versiones[0].artes&&m.versiones[0].artes[0])||null);

  // Columna izquierda = información, columna derecha = imágenes (Tipo de Salida queda a la
  // par de su imagen, arriba de la columna derecha).
  const imgBox=(url,alt,onclick,extra)=>`<div class="dz-infogen-imgbox">${url?`<img src="${url}" alt="${alt}" onclick="${onclick}">`:'<span class="dz-art-empty">Sin imagen</span>'}${extra||''}</div>`;
  // Caja de Tipo de Salida: etiqueta + número grande centrado a la izquierda, imagen a la
  // derecha (pegada al número, no al borde de la caja) — mismo tamaño de caja que antes.
  const salidaBox=`<div class="dz-infogen-imgbox dz-infogen-salidabox">
    <div class="dz-infogen-salida-info"><label>Tipo Salida</label>${salidaNum?`<b class="dz-infogen-salida-num">${dzEsc(salidaNum)}</b>`:''}</div>
    <div class="dz-infogen-salida-imgwrap">${salidaImgUrl?`<img src="${salidaImgUrl}" alt="Tipo de salida" onclick="event.stopPropagation();dzZoom('${salidaImgUrl}')">`:'<span class="dz-art-empty">Sin imagen</span>'}</div>
  </div>`;

  // Especificación del Arte — vive DENTRO de este bloque de arte (no aparte), cerca de la
  // imagen del arte. Diseño la edita (Forma); Preprensa la ve de solo lectura, mismo formato
  // de letra que el resto de las casillas de esta pestaña.
  const spec=d.spec||{};
  const formaSel=spec.forma||'';
  const formaCampo=editableArte
    ?`<select class="dz-forma-select" onchange="dzSetForma(this.value)">
        <option value=""${formaSel?'':' selected'}>— elegí una forma —</option>
        ${DZ_FORMAS.map(fm=>`<option value="${fm}"${formaSel.toLowerCase()===fm.toLowerCase()?' selected':''}>${fm}</option>`).join('')}
      </select>`
    :`<b>${g(formaSel)}</b>`;
  // Forma ahora vive arriba, en la fila de ID del Troquel/Tipo de Etiquetado (pedido del dueño
  // 20260915). El diagrama se deja oculto (no borrado) para probar el layout sin él.
  const formaFieldHtml=`<div class="dz-f"><label>Forma${editableArte?'':' <span class="dz-sub">(la define Diseño)</span>'}</label>${formaCampo}${spec.formaTroquel?`<div class="dz-sub" style="margin-top:4px">Troquel sugiere: ${dzEsc(spec.formaTroquel)}</div>`:''}</div>`;
  const especArteHtml=`<div class="dz-forma-block" style="display:none">
      ${dzFormaDiagram(formaSel,d.medida.anchoIn,d.medida.largoIn)}
    </div>`;

  return `<details class="dz-sec dz-infogen-motivo"${isFirst?' open':''}>
    <summary class="dz-sec-h"><div class="dz-sec-k">Arte ${m.indice+1}</div></summary>
    <div class="dz-sec-b">
      <div class="dz-specg">
        <div class="dz-f" style="grid-column:span 2"><label>Producto</label><b>${g(nombreProducto)}</b></div>
        <div class="dz-f"><label>Tipo de Trabajo</label><b>${g(general.tipoTrabajo)}</b></div>
        <div class="dz-f"><label>Tipo de Producto</label><b>${g(p.productType||general.tipoProducto)}</b></div>
        <div class="dz-f"><label>SKU Cliente</label><b>${g(p.skuCliente||general.skuCliente)}</b></div>
        <div class="dz-f"><label>SKU Local</label><b>${g(skuLocal)}</b></div>
        <div class="dz-f"><label>Cantidad de Productos</label><b>${Number(m.cantidad||0).toLocaleString('es-CR')}</b></div>
        ${fila2}
      </div>
      <div class="dz-infogen-row" style="margin-top:10px;border-top:1px solid var(--dz-b);padding-top:10px">
        <div class="dz-infogen-left">
          <div class="dz-f"><label>Nombre del Sustrato</label><b>${g(materialName)}</b></div>
          <div class="dz-infogen-triple">
            <div class="dz-f"><label>ID del Troquel</label><b>${g(dieCode)}</b></div>
            <div class="dz-f"><label>Tipo de Etiquetado</label><b>${g(general.tipoEtiquetado)}</b></div>
            ${formaFieldHtml}
          </div>
          ${acabadosExtra.length?`<div class="dz-acab-list-h">${acabadosExtra.map(a=>`<div class="dz-acab-block"><div class="dz-acab-hdr"><b>${dzEsc(a.nombre)}</b><span class="dz-acab-det">${dzEsc(a.detalle||'')}</span></div></div>`).join('')}</div>`:''}
        </div>
        <div class="dz-infogen-right">
          ${salidaBox}
        </div>
      </div>
      ${buildDzTintasPivotTable(o,m,proceso)}
      <div class="dz-infogen-arte-wrap" style="margin-top:10px">
        ${imgBox(arte?arte.url:'','Arte',arte?`dzZoom('${arte.url}')`:'',editableArte?`<button class="dz-btn" style="font-size:10px;padding:3px 8px;margin-top:6px" onclick="dzUpload(${m.indice},0)">↥ ${arte?'Reemplazar':'Cargar'}</button>`:'')}
      </div>
      <div style="margin-top:10px">${especArteHtml}</div>
    </div>
  </details>`;
}
function buildDzInfoGeneralTab(o,d,proceso){
  const motivos=Array.isArray(d.motivos)?d.motivos:[];
  if(!motivos.length)return `<div class="qd-panel"><div class="qd-empty">El cálculo de esta orden no tiene artes registrados.</div></div>`;
  const editableArte=proceso==='diseno';
  return motivos.map((m,i)=>dzInfoGeneralMotivoBloque(o,d,m,proceso,editableArte,i===0)).join('');
}

let disenoState={oid:null,data:null,curM:0,curV:0,tab:'general'};
function dzEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function loadDisenoData(oid){

  const p=await r.json();
  if(!r.ok||!p.ok)throw new Error(p.error||'No se pudo cargar el panel de diseño.');

function buildDisenoPanel(o){
  if(!producedValuesCache[o.id+'|diseno'])loadProducedValuesFor(o.id,'diseno').then(()=>refreshOrderModal(o.id));
  if(disenoState.oid!==o.id||!disenoState.data){
    loadDisenoData(o.id).then(()=>refreshOrderModal(o.id)).catch(e=>{disenoState={oid:o.id,data:{__err:e.message},curM:0,curV:0,tab:'general'};refreshOrderModal(o.id);});
    return `<div class="qd-panel"><div class="qd-empty">Cargando especificación de diseño…</div></div>`;
  }
  const d=disenoState.data;
  if(d.__err)return `<div class="qd-panel"><div class="qd-empty">${dzEsc(d.__err)}</div></div>`;
  const st=disenoState;
  const secHead=(k,t,chip)=>`<div class="dz-sec-h"><div>${k?`<div class="dz-sec-k">${k}</div>`:''}<div class="dz-sec-t">${t}</div></div>${chip?`<span class="dz-chip">${chip}</span>`:''}</div>`;

  if(st.tab==='aprob'||st.tab==='montaje'||st.tab==='acab'||st.tab==='archivos')st.tab='general'; // pestañas viejas retiradas
  const tab=st.tab||'general';
  // Reloj + estado del proceso (arriba, debajo del nombre).
  const st2=stOf(o), key=orderKey(o);
  const cStart=(orderStartTime[key]||o.actualStartDt||o.startDt);
  const cStartMs=cStart?new Date(cStart).getTime():0;
  let cCls='',cTxt='00:00:00',cState='<b>En espera</b> · sin iniciar';
  if(st2==='inprog'){cCls='run';cTxt=dzHMS(Date.now()-cStartMs);cState='<b>En curso</b> · corriendo';}
  else if(st2==='paused'){
    if(o.suspendidaProduccion){cCls='paused';const ps=pauseStarts[key];cTxt=dzHMS((ps?ps.startTs:Date.now())-cStartMs);cState='<b>⛔ Suspendida</b> · esperando a Planificación';}
    else{cCls='run';cTxt=dzHMS(Date.now()-cStartMs);cState='<b>En pausa</b> · el reloj sigue corriendo';}
  }
  else if(st2==='done'){cTxt=dzHMS((o.actualEndDt?new Date(o.actualEndDt).getTime():Date.now())-cStartMs);cState='<b>Completada</b> · tiempo final';}
  const pauseBoxHtml=(st2==='paused'&&!o.suspendidaProduccion)?(()=>{
    const psStart=o.pausedSince?new Date(o.pausedSince).getTime():((pauseStarts[key]&&pauseStarts[key].startTs)||Date.now());
    const quien=o.pauseOperator||(pauseStarts[key]&&pauseStarts[key].operator)||'';
    const motivo=o.pauseLabel||(pauseStarts[key]&&(pauseStarts[key].reason||pauseStarts[key].note))||'';
    return `<div class="qd-panel dz-pause-box">
      <div class="qd-panel-hdr">⏸ En Pausa</div>
      <div class="dz-pause-box-row">${quien?`<b>${dzEsc(quien)}</b> pausó esta orden`:'Esta orden está pausada'}${motivo?` por: <b>${dzEsc(motivo)}</b>`:''}</div>
      <div class="dz-clock dz-clock-mini dz-clock-alerta live-seconds" data-start="${psStart}">${dzHMS(Date.now()-psStart)}</div>
    </div>`;
  })():'';
  let cActs='';
  if(st2==='pending')cActs+=`<button class="dz-act dz-act-start" onclick="doStart('${o.id}','${o.name}',this)">▶ Iniciar proceso</button>`;
  if(st2==='inprog'){cActs+=`<button class="dz-act dz-act-done" onclick="doComplete('${o.id}','${o.name}')">■ Finalizar proceso</button>`;
    cActs+=`<button class="dz-act dz-act-pause" onclick="openPauseModal('${o.id}','${o.name}','diseno')">⏸ Pausar</button>`;}
  if(st2==='paused')cActs+=`<button class="dz-act dz-act-start" onclick="doResume('${o.id}',this)">▶ Reanudar</button>`;
  if(st2==='done')cActs+=`<button class="dz-act dz-act-start" onclick="abrirNuevoCiclo('${o.id}','${dzEsc(o.name)}','diseno')">▶ Iniciar</button>`;

  // Especificación del Arte ya vive DENTRO de cada bloque de Arte (dzInfoGeneralMotivoBloque),
  // no aparte. Notas para Producción sigue independiente, fuera de los artes.
  const notasHtml=`<section class="dz-sec">
        ${secHead('','Notas para Producción')}
        <div class="dz-sec-b"><textarea class="dz-notes" id="dzNotes" placeholder="Instrucciones para Producción…" onblur="dzSaveNotes()">${dzEsc(d.spec.notas||'')}</textarea></div>
      </section>`;
  const generalHtml=`${buildDzInfoGeneralTab(o,d,'diseno')}${notasHtml}`;

  return `<div class="dzp" id="dzp">
    ${ccBannerHtml(d.cambiosCliente)}
    <div class="dz-clock-wrap">
      <div class="dz-clock ${cCls}" ${(st2==='inprog'||(st2==='paused'&&!o.suspendidaProduccion))?`data-start="${cStartMs}"`:''}>${cTxt}</div>
      <div class="dz-clock-side">
        <div class="dz-clock-state">${cState}</div>
        <div class="dz-actrow">${cActs}</div>
      </div>
    </div>${pauseBoxHtml}

    <div class="dz-tabs">
      <button class="${tab==='general'?'on':''}" onclick="dzTab('general')">Información General</button>
      <button class="${tab==='eventos'?'on':''}" onclick="dzTab('eventos')">Eventos</button>
    </div>

    <div class="dz-tabbody">
      ${tab==='general'?generalHtml:''}
      ${tab==='eventos'?buildDzEventosTab(o,'diseno'):''}
    </div>
  </div>`;
}

function buildTintasPanel(o){
  const rows=producedValuesCache[o.id+'|tintas'];
  if(!rows)loadProducedValuesFor(o.id,'tintas').then(()=>refreshOrderModal(o.id));
  // Viscosidad/Temperatura por estación las captura Impresión, no Tintas — se leen de solo
  // lectura acá (Tintas todavía no las puede editar, a pedido explícito del dueño).
  const impresionRows=producedValuesCache[o.id+'|impresion'];
  if(!impresionRows)loadProducedValuesFor(o.id,'impresion').then(()=>refreshOrderModal(o.id));
  if(tintasState.oid!==o.id||!tintasState.data){
    loadTintasData(o.id).then(()=>refreshOrderModal(o.id)).catch(e=>{tintasState={oid:o.id,data:{__err:e.message},tab:'general'};refreshOrderModal(o.id);});
    return `<div class="qd-panel"><div class="qd-empty">Cargando especificación de tintas…</div></div>`;
  }
  const d=tintasState.data;
  if(d.__err)return `<div class="qd-panel"><div class="qd-empty">${dzEsc(d.__err)}</div></div>`;
  if(!rows)return `<div class="qd-panel"><div class="qd-empty">Cargando datos de producción…</div></div>`;

  const st2=stOf(o),key=orderKey(o);
  const cStart=(orderStartTime[key]||o.actualStartDt||o.startDt);
  const cStartMs=cStart?new Date(cStart).getTime():0;
  let cCls='',cTxt='00:00:00',cState='<b>En espera</b> · sin iniciar';
  if(st2==='inprog'){cCls='run';cTxt=dzHMS(Date.now()-cStartMs);cState='<b>En curso</b> · corriendo';}
  else if(st2==='paused'){
    if(o.suspendidaProduccion){cCls='paused';const ps=pauseStarts[key];cTxt=dzHMS((ps?ps.startTs:Date.now())-cStartMs);cState='<b>⛔ Suspendida</b> · esperando a Planificación';}
    else{cCls='run';cTxt=dzHMS(Date.now()-cStartMs);cState='<b>En pausa</b> · el reloj sigue corriendo';}
  }
  else if(st2==='done'){cTxt=dzHMS((o.actualEndDt?new Date(o.actualEndDt).getTime():Date.now())-cStartMs);cState='<b>Completada</b> · tiempo final';}
  const pauseBoxHtml=(st2==='paused'&&!o.suspendidaProduccion)?(()=>{
    const psStart=o.pausedSince?new Date(o.pausedSince).getTime():((pauseStarts[key]&&pauseStarts[key].startTs)||Date.now());
    const quien=o.pauseOperator||(pauseStarts[key]&&pauseStarts[key].operator)||'';
    const motivo=o.pauseLabel||(pauseStarts[key]&&(pauseStarts[key].reason||pauseStarts[key].note))||'';
    return `<div class="qd-panel dz-pause-box">
      <div class="qd-panel-hdr">⏸ En Pausa</div>
      <div class="dz-pause-box-row">${quien?`<b>${dzEsc(quien)}</b> pausó esta orden`:'Esta orden está pausada'}${motivo?` por: <b>${dzEsc(motivo)}</b>`:''}</div>
      <div class="dz-clock dz-clock-mini dz-clock-alerta live-seconds" data-start="${psStart}">${dzHMS(Date.now()-psStart)}</div>
    </div>`;
  })():'';
  let cActs='';
  if(st2==='pending')cActs+=`<button class="dz-act dz-act-start" onclick="doStart('${o.id}','${o.name}',this)">▶ Iniciar proceso</button>`;
  if(st2==='inprog'){cActs+=`<button class="dz-act dz-act-done" onclick="doComplete('${o.id}','${o.name}')">■ Finalizar proceso</button>`;
    cActs+=`<button class="dz-act dz-act-pause" onclick="openPauseModal('${o.id}','${o.name}','tintas')">⏸ Pausar</button>`;}
  if(st2==='paused')cActs+=`<button class="dz-act dz-act-start" onclick="doResume('${o.id}',this)">▶ Reanudar</button>`;
  if(st2==='done')cActs+=`<button class="dz-act dz-act-start" onclick="abrirNuevoCiclo('${o.id}','${dzEsc(o.name)}','tintas')">▶ Iniciar</button>`;
  const clockHtml=`<div class="dz-clock-wrap">
    <div class="dz-clock ${cCls}" ${(st2==='inprog'||(st2==='paused'&&!o.suspendidaProduccion))?`data-start="${cStartMs}"`:''}>${cTxt}</div>
    <div class="dz-clock-side">
      <div class="dz-clock-state">${cState}</div>
      <div class="dz-actrow">${cActs}</div>
    </div>
  </div>${pauseBoxHtml}`;

  const tab=tintasState.tab||'general';
  const generalHtml=buildTintasSoloTintasTab(o,d);
  return `<div class="dzp" id="tzp">
    ${ccBannerHtml(d.cambiosCliente)}
    ${clockHtml}
    <div class="dz-tabs">
      <button class="${tab==='general'?'on':''}" onclick="tzNav('general')">Información General</button>
      <button class="${tab==='eventos'?'on':''}" onclick="tzNav('eventos')">Eventos</button>
    </div>
    <div class="dz-tabbody">
      ${tab==='general'?generalHtml:''}
      ${tab==='eventos'?buildDzEventosTab(o,'tintas'):''}
    </div>
  </div>`;
}
// A diferencia de Diseño/Preprensa (dzInfoGeneralMotivoBloque, que trae Producto/SKU/
// Cantidad/Aplicación/Troquel/Forma/Salida/Imagen del arte), Tintas SOLO necesita ver el
// sustrato y la tabla de tintas por estación de cada arte — a pedido explícito del dueño,
// todo lo demás le sobra. Mismo estilo de bloque desplegable (<details>) que el resto.
function buildTintasSoloTintasTab(o,d){
  const motivos=Array.isArray(d.motivos)?d.motivos:[];
  if(!motivos.length)return `<div class="qd-panel"><div class="qd-empty">El cálculo de esta orden no tiene artes registrados.</div></div>`;
  const materialName=(d.general&&d.general.materialName)||'';
  return motivos.map((m,i)=>{
    const piv=buildTintasEstacionTable(o,m);
    return `<details class="dz-sec dz-infogen-motivo"${i===0?' open':''}>
      <summary class="dz-sec-h"><div class="dz-sec-k">Arte ${m.indice+1}</div></summary>
      <div class="dz-sec-b">
        <div class="dz-f"><label>Sustrato</label><b>${materialName?dzEsc(materialName):''}</b></div>
        ${piv||'<div class="dz-sub" style="margin-top:8px">Sin tintas configuradas para este arte.</div>'}
      </div>
    </details>`;
  }).join('');
}
// Tabla de tintas por estación propia de Tintas — igual que buildDzTintasPivotTable (Tipo/Color
// editables con el lápiz) más las filas que el dueño pidió ver acá aunque todavía no se puedan
// cambiar desde Tintas: Cobertura y Anilox (BCM) vienen cotizados del cálculo; Viscosidad y
// Temperatura las captura Impresión (de solo lectura acá, en blanco hasta que Impresión las
// registre); Consumo es el kg calculado que ya trae el cálculo, la única forma en que Tintas
// sabe cuánto va a tener que preparar.
function buildTintasEstacionTable(o,m){
  const motivoIndice=m?m.indice:0;
  const tintas=m?(m.tintas||[]).filter(t=>t.tipo!=='barniz'):[];
  if(!tintas.length)return '';
  const numFmt=(x,dec)=>x==null||x===''||isNaN(Number(x))?'':Number(x).toLocaleString('es-CR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  const headCells=tintas.map(t=>`<th class="ta-c">Est. ${t.estacion+1}<button class="qd-edit-btn imp-piv-edit" title="Editar tinta" onclick="openDzTintaEditor('${o.id}','tintas',${motivoIndice},${t.estacion})">${shellIconSpanHtml('produccionEditarValor','✎','Editar')}</button></th>`).join('');
  const tipoCells=tintas.map(t=>{
    const campo='tinta_tipo_est'+t.estacion;
    const real=dzTintaProducido(o.id,'tintas',motivoIndice,campo);
    const tipoKey=real||t.tipo;
    const editado=!!real&&real!==t.tipo;
    return `<td class="ta-c${editado?' qd-editado':''}">${dzEsc(DZ_TIPO[tipoKey]||tipoKey||'')}${editado?'<span class="qd-edited-dot" title="Editado"></span>':''}</td>`;
  }).join('');
  const colorCells=tintas.map(t=>{
    const campo='tinta_color_est'+t.estacion;
    const real=dzTintaProducido(o.id,'tintas',motivoIndice,campo);
    const dec=real?dzTintaColorDecode(real):{nombre:t.etiqueta||'',hex:t.color||''};
    if(!dec.nombre)return `<td class="ta-c"></td>`;
    return `<td class="ta-c${real?' qd-editado':''}">${dec.hex?`<span class="dz-tinta-dot-circle" style="--dz-tinta-dot:${dec.hex}"></span>`:''}${dzEsc(dec.nombre)}${real?'<span class="qd-edited-dot" title="Editado"></span>':''}</td>`;
  }).join('');
  const coberturaCells=tintas.map(t=>`<td class="ta-c">${t.coberturaPct!=null?numFmt(t.coberturaPct,0)+' %':''}</td>`).join('');
  const aniloxCells=tintas.map(t=>`<td class="ta-c">${t.bcmAnilox!=null?numFmt(t.bcmAnilox,2)+' BCM':''}</td>`).join('');
  const viscCells=tintas.map(t=>{
    const v=dzTintaProducido(o.id,'impresion',motivoIndice,'viscosidad_est'+t.estacion);
    return `<td class="ta-c">${v?dzEsc(v)+' seg':''}</td>`;
  }).join('');
  const tempCells=tintas.map(t=>{
    const v=dzTintaProducido(o.id,'impresion',motivoIndice,'temperatura_est'+t.estacion);
    return `<td class="ta-c">${v?dzEsc(v)+' °C':''}</td>`;
  }).join('');
  const consumoCells=tintas.map(t=>`<td class="ta-c">${t.consumoKg!=null?numFmt(t.consumoKg,4)+' kg':''}</td>`).join('');
  return `<div class="imp-piv-wrap"><table class="imp-piv-table">
    <thead><tr><th></th>${headCells}</tr></thead>
    <tbody>
      <tr><td class="imp-piv-lbl">Tipo</td>${tipoCells}</tr>
      <tr><td class="imp-piv-lbl">Color</td>${colorCells}</tr>
      <tr><td class="imp-piv-lbl">Cobertura</td>${coberturaCells}</tr>
      <tr><td class="imp-piv-lbl">Anilox (BCM)</td>${aniloxCells}</tr>
      <tr><td class="imp-piv-lbl">Viscosidad</td>${viscCells}</tr>
      <tr><td class="imp-piv-lbl">Temperatura</td>${tempCells}</tr>
      <tr><td class="imp-piv-lbl">Consumo</td>${consumoCells}</tr>
    </tbody>
  </table></div>`;
}
function tzNav(id){tintasState.tab=id;refreshOrderModal(tintasState.oid);}
function tzReload(){const oid=tintasState.oid;tintasState.data=null;loadTintasData(oid).then(()=>refreshOrderModal(oid)).catch(e=>showToast(e.message));}
async function tzApprove(){
  const yaAprob=!!(tintasState.data&&tintasState.data.aprobacion&&tintasState.data.aprobacion.aprobadoEn);
  if(!confirm(yaAprob?'¿Quitar la aprobación de tintas de esta orden?':'¿Aprobar la receta de tintas de esta orden para producción?'))return;
  try{
    const res=await fetch('/api/produccion/tintas/aprobar',{method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},body:JSON.stringify({orderCode:tintasState.oid,anular:yaAprob})});
    const p=await res.json();if(!res.ok||!p.ok)throw new Error(p.error||'No se pudo registrar la aprobación.');
    showToast(yaAprob?'Aprobación retirada':'✓ Tintas aprobadas');tzReload();
  }catch(e){showToast(e.message||'Error al registrar la aprobación');}
}
function tzAddFile(){
  const inp=document.createElement('input');inp.type='file';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=async()=>{
      const st=tintasState,m=st.data.motivos[st.curM],vv=m.versiones[st.curV];
      try{
        const res=await fetch('/api/produccion/tintas-archivos',{method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},
          body:JSON.stringify({orderCode:st.oid,motivoIndice:m.indice,versionIndice:vv?vv.indice:null,nombre:f.name,contenidoBase64:r.result})});
        const p=await res.json();if(!res.ok||!p.ok)throw new Error(p.error||'No se pudo subir el archivo.');
        showToast('✓ Archivo cargado');tzReload();
      }catch(e){showToast(e.message||'Error al subir el archivo');}
    };
    r.readAsDataURL(f);};
  inp.click();
}

const DZ_FORMAS=['Vertical','Horizontal','Cuadrada','Circular','Ovalada','Irregular'];
async function dzSetForma(val){
  // Endpoint propio: guarda directo en la orden, sin justificación. Update optimista para el diagrama.
  const prev=(disenoState.data&&disenoState.data.spec)?disenoState.data.spec.forma:'';
  if(disenoState.data&&disenoState.data.spec)disenoState.data.spec.forma=val;
  refreshOrderModal(disenoState.oid);
  try{
    const res=await fetch('/api/produccion/diseno/forma',{method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},
      body:JSON.stringify({orderCode:disenoState.oid,forma:val})});
    const p=await res.json().catch(()=>({}));
    if(!res.ok||!p.ok)throw new Error(p.error||'No se pudo guardar la forma.');
    showToast('✓ Forma guardada');
  }catch(e){
    if(disenoState.data&&disenoState.data.spec)disenoState.data.spec.forma=prev;
    refreshOrderModal(disenoState.oid);
    showToast(e.message||'Error al guardar la forma');
  }
}
function dzFormaDiagram(forma,anchoIn,largoIn){
  const f=String(forma||'').toLowerCase();
  const W=118,H=118,cx=W/2,cy=H/2;
  const aTxt=anchoIn?(+anchoIn).toFixed(2)+' in':'';
  const lTxt=largoIn?(+largoIn).toFixed(2)+' in':'';
  let shape;
  if(f==='circular')shape=`<circle cx="${cx}" cy="${cy}" r="40" />`;
  else if(f==='ovalada')shape=`<ellipse cx="${cx}" cy="${cy}" rx="46" ry="32" />`;
  else if(f==='cuadrada')shape=`<rect x="${cx-38}" y="${cy-38}" width="76" height="76" rx="4"/>`;
  else if(f==='horizontal')shape=`<rect x="${cx-50}" y="${cy-30}" width="100" height="60" rx="4"/>`;
  else if(f==='irregular')shape=`<path d="M18 46 Q22 20 50 22 Q86 16 96 44 Q104 78 74 92 Q40 104 22 80 Q10 64 18 46Z"/>`;
  else shape=`<rect x="${cx-30}" y="${cy-50}" width="60" height="100" rx="4"/>`; // vertical (default)
  return `<div class="dz-forma-diag">
    <div class="dz-forma-atop">Ancho · ${aTxt}</div>
    <div class="dz-forma-mid">
      <svg viewBox="0 0 ${W} ${H}" width="118" height="118">${shape}</svg>
      <span class="dz-forma-aside">Alto · ${lTxt}</span>
    </div>
  </div>`;
}
