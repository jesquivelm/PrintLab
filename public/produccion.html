// Valor REAL registrado por la planta para un campo de estación (cobertura/densidad/BCM/factor),
// leído del cache de valores_produccion_motivo del proceso activo. null si no hay real cargado.
function mesEstValorReal(oid,campo){
  const proc=activeProc||'impresion';
  const rows=producedValuesCache[oid+'|'+proc]||[];
  const r=rows.find(x=>x.campo===campo&&Number(x.motivo_indice)===0);
  return r&&r.valor_producido!=null&&r.valor_producido!==''?r.valor_producido:null;
}
// Abre el editor cotizado↔real (mismo de la ficha) para un campo de estación. El proceso sale
// de activeProc, así la misma tarjeta sirve en Diseño / Preprensa / Tintas / Impresión.
function mesEditEstacionValor(oid,est0,campo,label,unidad,cotizado){
  const proc=activeProc||'impresion';
  const rows=producedValuesCache[oid+'|'+proc]||[];
  const cur=rows.find(x=>x.campo===campo&&Number(x.motivo_indice)===0);
  openValorProduccionEditor({
    orderCode:oid,motivoIndice:0,proceso:proc,campo,
    etiqueta:label,unidad:unidad||'',
    valorCotizado:cotizado!=null&&cotizado!==''?String(cotizado):'',
    valorProducido:cur&&cur.valor_producido!=null?String(cur.valor_producido):(cotizado!=null?String(cotizado):''),
    onSaved:()=>{delete producedValuesCache[oid+'|'+proc];refreshOrderModal(oid);}
  });
}
// Mueve una estación una posición a la izquierda/derecha (intercambia asignación completa con la
// vecina). Alternativa accesible al arrastre. dir = -1 | 1.
function mesMoveStation(oid,i,dir){
  const lo=MES_STATION_RANGE[0], hi=MES_STATION_RANGE[MES_STATION_RANGE.length-1];
  const j=i+dir;
  if(j<lo||j>hi)return;
  const s=mesState.slots, dt=mesState.slotData;
  const ts=s[i]; s[i]=s[j]; s[j]=ts;
  const td=dt[i]; dt[i]=dt[j]; dt[j]=td;
  mesState.selectedStation=j;
  refreshOrderModal(oid);
}

function buildStationCard(oid,i,tintas){
  const d=mesState.slotData[i]||{};
  const isBarniz=mesState.slots[i]==='barniz';
  const isGoma=mesState.slots[i]==='goma';
  const isEmpty=mesState.slots[i]==='empty';
  const dotStyle=d.color?`background:${dzEsc(d.color)}`:'';
  const isSelected=mesState.selectedStation===i;
  const sel=`mesSelectStation(${i},'${oid}')`;
  const lo=MES_STATION_RANGE[0], hi=MES_STATION_RANGE[MES_STATION_RANGE.length-1];
  const hdr=`<div class="mes-sc-hdr">
      <span class="mes-sc-grip" draggable="true" data-station-grip="${i}" title="Arrastrá para reordenar">⋮⋮</span>
      <span class="mes-sc-dot" style="${dotStyle}" onclick="${sel}"></span>
      <span class="mes-sc-title" onclick="${sel}">Estación ${i}</span>
      <span class="mes-sc-move">
        <button type="button" onclick="mesMoveStation('${oid}',${i},-1)" ${i<=lo?'disabled':''} aria-label="Mover a la izquierda">◀</button>
        <button type="button" onclick="mesMoveStation('${oid}',${i},1)" ${i>=hi?'disabled':''} aria-label="Mover a la derecha">▶</button>
      </span>
    </div>`;
  const tintaOpts=`<option value=""${d.tintaIdx===''?' selected':''}>— Vacía —</option>`
    +tintas.map((t,idx)=>`<option value="${idx}"${String(idx)===String(d.tintaIdx)?' selected':''}>${dzEsc(t.etiqueta||('Tinta '+(idx+1)))} (${DZ_TIPO[t.tipo]||t.tipo||''})</option>`).join('');
  // Estación vacía: tarjeta mínima (solo el nombre) — antes mostraba todos los campos igual,
  // apretados y sin sentido ("se achican y se ponen feas").
  if(isEmpty){
    return `<div class="mes-station-card empty${isSelected?' selected':''}" data-station-key="${i}">
      ${hdr}
      <label class="mes-sc-lbl">Tinta</label>
      <select class="mes-select" onfocus="${sel}" onchange="mesSelTinta(${i},this.value,'${oid}')">${tintaOpts}</select>
      <div class="mes-sc-empty-note">Sin asignar</div>
    </div>`;
  }
  const aniloxCat=mesAniloxCatalog||[];
  const aniloxOpts=`<option value=""${d.anilox?'':' selected'}>— Seleccionar —</option>`
    +aniloxCat.filter(a=>a.activo!==false).map(a=>`<option value="${dzEsc(a.codigo)}"${a.codigo===d.anilox?' selected':''}>${dzEsc(a.codigo)} — ${a.lineatura||'?'} LPI / ${a.bcm||'?'} BCM</option>`).join('');
  const cilindroCat=mesCilindroCatalog||[];
  const cilindroOpts=`<option value=""${d.cilindro?'':' selected'}>— Seleccionar —</option>`
    +cilindroCat.filter(c=>c.estado!=='baja').map(c=>`<option value="${dzEsc(c.codigo)}"${c.codigo===d.cilindro?' selected':''}>${dzEsc(c.codigo)} — ${c.dientes||'?'} dientes</option>`).join('');
  // Cotizado por estación (receta real de la orden) + fila editable "real" para cobertura,
  // densidad, BCM y factor de transferencia. est0 = índice 0-based que usan los campos
  // tinta_est{n} / densidad_est{n} / bcm_est{n} / factor_est{n} de valores_produccion_motivo.
  const cot=tintas[Number(d.tintaIdx)]||{};
  const est0=i-1;
  const num=(v,dec)=>(v!=null&&v!==''&&!isNaN(Number(v)))?Number(v).toFixed(dec):null;
  const edProc=activeProc||'impresion';
  const edRow=(label,campo,cotVal,unidad,dec)=>{
    const real=mesEstValorReal(oid,campo);
    const cotTxt=num(cotVal,dec);
    const shown=real!=null?real:(cotTxt!=null?cotTxt:null);
    const circle=qdConfirmCircle(oid,edProc,campo,0,(cotTxt!=null?cotTxt:''),label,unidad||'');
    return `<label class="mes-sc-lbl">${label}</label>
    <div class="mes-sc-ed" style="cursor:default;padding-right:8px">
      <span class="mes-sc-ed-v">${shown!=null?dzEsc(String(shown))+(unidad?' '+unidad:''):'—'}</span>
      <span class="mes-sc-ed-cot">cotizado: ${cotTxt!=null?cotTxt+(unidad?' '+unidad:''):'—'}</span>
      <span class="mes-sc-actions">${circle}<button class="qd-edit-btn" title="Editar" onclick="mesEditEstacionValor('${oid}',${est0},'${campo}','${dzEsc(label)}','${unidad}','${cotVal!=null?cotVal:''}')">${shellIconSpanHtml('produccionEditarValor','✎','Editar')}</button></span>
    </div>`;
  };
  const tintaMetrics=isBarniz?'':`
    ${edRow('Cobertura','tinta_est'+est0,cot.coberturaPct,'%',1)}
    ${edRow('Densidad','densidad_est'+est0,cot.densidad,'kg/L',2)}`;
  const aniloxMetrics=isBarniz?'':`
    ${edRow('BCM Anilox','bcm_est'+est0,cot.bcmAnilox,'BCM',2)}
    ${edRow('Factor Transferencia','factor_est'+est0,cot.factorTransferencia,'%',2)}`;
  return `<div class="mes-station-card${isBarniz?' barniz':''}${isGoma?' goma':''}${isSelected?' selected':''}" data-station-key="${i}">
    ${hdr}
    <label class="mes-sc-lbl">Tinta</label>
    <select class="mes-select" onfocus="${sel}" onchange="mesSelTinta(${i},this.value,'${oid}')">${tintaOpts}</select>
    ${tintaMetrics}
    ${isBarniz?`
    <label class="mes-sc-lbl">Tipo de Barniz</label>
    <select class="mes-select" onfocus="${sel}" onchange="mesState.slotData[${i}].barnizTipo=this.value">
      <option ${d.barnizTipo==='Brillante UV'?'selected':''}>Brillante UV</option>
      <option ${d.barnizTipo==='Mate UV'?'selected':''}>Mate UV</option>
    </select>
    <label class="mes-sc-lbl">Aplicación</label>
    <select class="mes-select" onfocus="${sel}" onchange="mesState.slotData[${i}].barnizZonif=this.value">
      <option ${d.barnizZonif==='Total'?'selected':''}>Total</option>
      <option ${d.barnizZonif==='Reservado'?'selected':''}>Reservado</option>
    </select>
    <label class="mes-sc-lbl">Zona (si aplica)</label>
    <input class="mes-input" type="text" placeholder="Ej: logo central" onfocus="${sel}" value="${dzEsc(d.barnizZona||'')}" onchange="mesState.slotData[${i}].barnizZona=this.value">
    `:''}
    ${d.tipo==='directo'?`
    <label class="mes-sc-lbl">Referencia Pantón</label>
    <input class="mes-input" type="text" onfocus="${sel}" value="${dzEsc(d.pantoneRef||'')}" onchange="mesState.slotData[${i}].pantoneRef=this.value">
    `:''}
    ${aniloxMetrics}
    <label class="mes-sc-lbl">Anilox (inventario)</label>
    <select class="mes-select" onfocus="${sel}" onchange="mesState.slotData[${i}].anilox=this.value">${aniloxOpts}</select>
    <label class="mes-sc-lbl">Cilindro (inventario)</label>
    <select class="mes-select" onfocus="${sel}" onchange="mesState.slotData[${i}].cilindro=this.value">${cilindroOpts}</select>
    <label class="mes-sc-lbl">Viscosidad (seg)</label>
    <input class="mes-input" type="number" onfocus="${sel}" value="${dzEsc(d.visc||'')}" onchange="mesState.slotData[${i}].visc=this.value">
    <label class="mes-sc-lbl">Temperatura (°C)</label>
    <input class="mes-input" type="number" step="0.1" onfocus="${sel}" value="${dzEsc(d.temp||'')}" onchange="mesState.slotData[${i}].temp=this.value">
    <!-- "Medir color" oculto por ahora (a pedido) — la función sigue intacta, ver mesOpenSpectro -->
  </div>`;
}

// ════════════════════════════════════════════════════════════════════
// Tabla de tintas volteada — solo para la pestaña "Máquina" de Impresión: cada
// columna es una estación (1 a 10) y cada fila es un dato (Tipo, Cobertura,
// Anilox/BCM, Densidad, Transferencia). Reemplaza las tarjetas verticales
// (buildStationCardsRow) SOLO aquí — Diseño/Preprensa/Tintas siguen usando las
// tarjetas sin cambios. Un solo lápiz por estación (en el encabezado de su
// columna) abre un popover para editar sus 4 valores a la vez, en vez de un
// lápiz + círculo de confirmar por cada celda.
// ════════════════════════════════════════════════════════════════════
function impresionEstacionTipo(i,tintas){
  const d=mesState.slotData[i]||{};
  if(mesState.slots[i]==='empty')return '';
  if(mesState.slots[i]==='barniz')return 'Barniz'+(d.barnizTipo?' · '+d.barnizTipo:'');
  if(mesState.slots[i]==='goma')return 'Goma';
  const t=tintas[Number(d.tintaIdx)];
  return t?(DZ_TIPO[t.tipo]||''):'';
}
// Nombre del color asignado a la estación (ej. "Cyan", "Pantone 286 C") — separado del Tipo
// (Proceso/Directo/Adicional), que es la clasificación, no el nombre.
function impresionEstacionColorLabel(i,tintas){
  const d=mesState.slotData[i]||{};
  if(mesState.slots[i]==='empty'||mesState.slots[i]==='barniz'||mesState.slots[i]==='goma')return '';
  const t=tintas[Number(d.tintaIdx)];
  return t?(t.etiqueta||''):'';
}
function impresionEstacionColorHex(i,tintas){
  if(mesState.slots[i]!=='empty'&&mesState.slots[i]!=='barniz'&&mesState.slots[i]!=='goma'){
    const d=mesState.slotData[i]||{};
    const t=tintas[Number(d.tintaIdx)];
    if(t)return dzTintaColor(t.color);
  }
  return null;
}
// Decimales fijos por métrica de estación: la Transferencia se maneja con dos, el resto de
// campos numéricos con uno. Los campos con tipo:'select' (Anilox/Cilindro/Curado) no comparan
// contra un cotizado — son datos de ejecución que no vienen del cálculo original — se guardan
// igual por la vía de siempre (valores_produccion_motivo → columnas *_vigente en la Orden y en
// el SKU), solo que sin comparación cotizado/producido.
const IMPRESION_CURADO_OPCIONES=[{v:'uv',l:'UV'},{v:'aire_caliente',l:'Aire Caliente'}];
const IMPRESION_ESTACION_CAMPOS=[
  {label:'Cobertura',campoBase:'tinta_est',unidad:'%',dec:0,cot:t=>t.coberturaPct},
  {label:'Transferencia',campoBase:'factor_est',unidad:'%',dec:0,cot:t=>t.factorTransferencia},
  {label:'Anilox',campoBase:'anilox_codigo_est',tipo:'select',opciones:()=>(mesAniloxCatalog||[]).filter(a=>a.activo!==false).map(a=>({v:a.codigo,l:`${a.codigo} — ${a.lineatura||'?'} LPI / ${a.bcm||'?'} BCM`}))},
  {label:'Cilindro',campoBase:'cilindro_codigo_est',tipo:'select',opciones:()=>(mesCilindroCatalog||[]).filter(c=>c.estado!=='baja').map(c=>({v:c.codigo,l:`${c.codigo} — ${c.dientes||'?'} dientes`}))},
  {label:'Viscosidad',campoBase:'viscosidad_est',unidad:'seg',dec:1},
  {label:'Temperatura',campoBase:'temperatura_est',unidad:'°C',dec:1},
  {label:'Tipo de Curado',campoBase:'curado_est',tipo:'select',opciones:()=>IMPRESION_CURADO_OPCIONES.map(x=>({v:x.v,l:x.l}))}
];
// Anilox (BCM) y Densidad: ya no se editan aquí (a pedido) — quedan como referencia de solo
// lectura, tomadas directo de la receta cotizada de la tinta.
const IMPRESION_ESTACION_SOLO_LECTURA=[
  {label:'Anilox (BCM) Cotizado',dec:0,cot:t=>t.bcmAnilox},
  {label:'Densidad',unidad:'kg/L',dec:2,cot:t=>t.densidad}
];
function buildImpresionTintasPivotTable(o){
  const oid=o.id;
  const ink=mesOrderInk[oid];
  if(!ink||ink.loading||!ink.loaded)return `<div class="qd-empty">Cargando tintas de la orden…</div>`;
  const tintas=ink.tintas||[];
  const cols=MES_STATION_RANGE;
  const conMetricas=(i)=>mesState.slots[i]!=='empty'&&mesState.slots[i]!=='barniz'&&mesState.slots[i]!=='goma';
  const headCells=cols.map(i=>`<th class="ta-c">Est. ${i}${mesState.slots[i]==='empty'?'':`<button class="qd-edit-btn imp-piv-edit" title="Editar estación" onclick="openImpresionEstacionEditor('${oid}',${i})">${shellIconSpanHtml('produccionEditarValor','✎','Editar')}</button>`}</th>`).join('');
  const tipoCells=cols.map(i=>`<td class="ta-c">${dzEsc(impresionEstacionTipo(i,tintas))}</td>`).join('');
  const colorCells=cols.map(i=>{
    const hex=impresionEstacionColorHex(i,tintas);
    const nombre=impresionEstacionColorLabel(i,tintas);
    if(!nombre)return `<td class="ta-c"></td>`;
    return `<td class="ta-c">${hex?`<span class="dz-tinta-dot-circle" style="--dz-tinta-dot:${hex}"></span>`:''}${dzEsc(nombre)}</td>`;
  }).join('');
  const filaSoloLecturaHtml=(def)=>{
    const cells=cols.map(i=>{
      if(!conMetricas(i))return `<td class="ta-c"></td>`;
      const d=mesState.slotData[i]||{};
      const t=tintas[Number(d.tintaIdx)]||{};
      const cotVal=def.cot(t);
      const cotTxt=(cotVal!=null&&cotVal!==''&&!isNaN(Number(cotVal)))?Number(cotVal).toFixed(def.dec):null;
      return `<td class="ta-c">${cotTxt!=null?cotTxt+(def.unidad?' '+def.unidad:''):''}</td>`;
    }).join('');
    return `<tr><td class="imp-piv-lbl">${def.label}</td>${cells}</tr>`;
  };
  const filaHtml=(def)=>{
    const cells=cols.map(i=>{
      if(!conMetricas(i))return `<td class="ta-c"></td>`;
      const d=mesState.slotData[i]||{};
      const t=tintas[Number(d.tintaIdx)]||{};
      const campo=def.campoBase+(i-1);
      const real=mesEstValorReal(oid,campo);
      if(def.tipo==='select'){
        const opciones=def.opciones();
        const opt=opciones.find(x=>String(x.v)===String(real));
        const shown=real!=null&&real!==''?(opt?opt.l:real):null;
        return `<td class="ta-c">${shown!=null?dzEsc(shown):''}</td>`;
      }
      const cotVal=def.cot?def.cot(t):null;
      const cotTxt=(cotVal!=null&&cotVal!==''&&!isNaN(Number(cotVal)))?Number(cotVal).toFixed(def.dec):null;
      const realTxt=real!=null&&!isNaN(Number(real))?Number(real).toFixed(def.dec):null;
      const shown=realTxt!=null?realTxt:cotTxt;
      const editado=realTxt!=null&&cotTxt!=null&&realTxt!==cotTxt;
      return `<td class="ta-c${editado?' qd-editado':''}">${shown!=null?shown+(def.unidad?' '+def.unidad:''):''}${editado?'<span class="qd-edited-dot" title="Editado"></span>':''}</td>`;
    }).join('');
    return `<tr><td class="imp-piv-lbl">${def.label}</td>${cells}</tr>`;
  };
  return `<div class="imp-piv-wrap">
  <table class="imp-piv-table">
    <thead><tr><th></th>${headCells}</tr></thead>
    <tbody>
      <tr><td class="imp-piv-lbl">Tipo</td>${tipoCells}</tr>
      <tr><td class="imp-piv-lbl">Color</td>${colorCells}</tr>
      ${IMPRESION_ESTACION_SOLO_LECTURA.map(filaSoloLecturaHtml).join('')}
      ${IMPRESION_ESTACION_CAMPOS.map(filaHtml).join('')}
    </tbody>
  </table>
  </div>`;
}
let _impEstEditCtx=null;
function openImpresionEstacionEditor(oid,i){
  const proc=activeProc||'impresion';
  const tintas=(mesOrderInk[oid]&&mesOrderInk[oid].tintas)||[];
  const d=mesState.slotData[i]||{};
  const t=tintas[Number(d.tintaIdx)]||{};
  const campos=IMPRESION_ESTACION_CAMPOS.map(def=>{
    const campo=def.campoBase+(i-1);
    const real=mesEstValorReal(oid,campo);
    if(def.tipo==='select'){
      const opciones=def.opciones();
      return {campo,label:def.label,unidad:'',tipo:'select',opciones,cotTxt:'',val:real!=null?real:''};
    }
    const cotVal=def.cot?def.cot(t):null;
    const cotTxt=(cotVal!=null&&cotVal!==''&&!isNaN(Number(cotVal)))?Number(cotVal).toFixed(def.dec):'';
    return {campo,label:def.label,unidad:def.unidad,cotTxt,val:real!=null?real:cotTxt};
  });
  _impEstEditCtx={oid,proc,campos};
  const rowsHtml=campos.map((c,idx)=>{
    const lbl=`<div class="section-lbl" style="margin-top:${idx?10:0}px">${c.label}${c.cotTxt!==''?` <span style="color:var(--text3);font-weight:400">(cotizado: ${c.cotTxt}${c.unidad?' '+c.unidad:''})</span>`:''}</div>`;
    if(c.tipo==='select'){
      const opts=`<option value=""${c.val?'':' selected'}>— Sin definir —</option>`+c.opciones.map(o=>`<option value="${dzEsc(o.v)}"${String(o.v)===String(c.val)?' selected':''}>${dzEsc(o.l)}</option>`).join('');
      return `${lbl}<select class="note-input" id="impEstInput${idx}" style="min-height:auto;padding:12px 14px;font-family:var(--font-mono)">${opts}</select>`;
    }
    return `${lbl}<input class="note-input" id="impEstInput${idx}" type="text" value="${dzEsc(c.val)}" style="min-height:auto;padding:12px 14px;font-family:var(--font-mono)">`;
  }).join('');
  showModal2(`<h3>✎ Estación ${i}${t.etiqueta?' — '+dzEsc(t.etiqueta):''}</h3>
    <div class="modal-sub">${oid}</div>
    ${rowsHtml}
    <div class="section-lbl" style="margin-top:20px">Motivo del cambio (solo si ese dato ya se había editado antes)</div>
    <textarea class="note-input" id="impEstJust" placeholder="Opcional" style="min-height:50px"></textarea>
    <div class="modal-btns">
      <button class="mbtn-cancel" onclick="closeModal2()">Cancelar</button>
      <button class="mbtn-confirm mbtn-green" onclick="confirmImpresionEstacionSave()">✓ Guardar</button>
    </div>`);
  document.getElementById('modalBox2').classList.add('modal-estacion');
}
async function confirmImpresionEstacionSave(){
  const ctx=_impEstEditCtx;
  if(!ctx)return;
  const just=(document.getElementById('impEstJust')||{}).value||'';
  for(let idx=0;idx<ctx.campos.length;idx++){
    const c=ctx.campos[idx];
    const input=document.getElementById('impEstInput'+idx);
    const val=input?input.value:c.val;
    if(val===c.val)continue;
    try{
      const res=await fetch('/api/produccion/valores-motivo',{method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},
        body:JSON.stringify({orderCode:ctx.oid,motivoIndice:0,proceso:ctx.proc,campo:c.campo,etiqueta:c.label,unidad:c.unidad,
          valorCotizado:c.cotTxt,valorProducido:val,justificacion:just||undefined,operatorName:currentUserName()})});
      const payload=await res.json().catch(()=>({}));
      if(res.status===409&&payload.needsJustification){
        showToast('⚠ "'+c.label+'" ya se había editado antes — escribí el motivo del cambio arriba y guardá de nuevo');
        return;
      }
      if(!res.ok)throw new Error(payload.error||'No se pudo guardar.');
    }catch(e){showToast(e.message||'Error al guardar');return;}
  }
  delete producedValuesCache[ctx.oid+'|'+ctx.proc];
  closeModal2();
  showToast('✓ Estación actualizada');
  refreshOrderModal(ctx.oid);
}

function mesSelectStation(key,oid){
  if(mesState.selectedStation===key)return;
  mesState.selectedStation=key;
  refreshOrderModal(oid);
  requestAnimationFrame(()=>mesScrollToSelection(oid));
}
// Posición X (en el espacio del viewBox del SVG) del centro de cada "estación" seleccionable.
function mesStationSvgX(key){
  if(key==='desbobinado')return 84.27;
  if(key==='laminado')return 1969.98;
  if(key==='estampado')return 2314.76;
  if(key==='troquelado')return null; // sin ilustración propia todavía
  const i=Number(key);
  return Number.isFinite(i)?(i-1)*MES_STATION_PITCH+210:null;
}
function mesScrollToSelection(oid){
  const box=document.getElementById('modalBox');
  if(!box)return;
  const key=mesState.selectedStation;
  const card=box.querySelector(`[data-station-key="${CSS.escape(String(key))}"]`);
  if(card)card.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  const wrap=box.querySelector('.mes-svg-wrap');
  const svg=wrap?wrap.querySelector('svg'):null;
  const targetX=mesStationSvgX(key);
  if(wrap&&svg&&targetX!=null){
    const scale=svg.getBoundingClientRect().width/GALLUS_W;
    if(scale>0){
      const target=targetX*scale-wrap.clientWidth/2;
      wrap.scrollTo({left:Math.max(0,target),behavior:'smooth'});
    }
  }
}

function mesSelTinta(i,val,oid){
  const tintas=(mesOrderInk[oid]&&mesOrderInk[oid].tintas)||[];
  const d=mesState.slotData[i]=mesState.slotData[i]||{};
  if(val===''){
    mesState.slots[i]='empty';
    d.tintaIdx='';d.etiqueta='';d.color='';d.tipo='';d.pantoneRef='';d.lampOn=false;
  }else{
    const t=tintas[Number(val)]||null;
    d.tintaIdx=val;d.etiqueta=t?(t.etiqueta||''):'';d.color=t?(t.color||''):'';d.tipo=t?t.tipo:'';
    mesState.slots[i]=(t&&t.tipo==='barniz')?'barniz':(t&&t.tipo==='goma')?'goma':'tinta';

    if(t&&t.tipo==='directo'&&!d.pantoneRef)d.pantoneRef=t.etiqueta||'';
  }
  refreshOrderModal(oid);
}

let stationHistoryOpen={};
let stationHistoryData={};

function toggleStationHistory(oid){
  stationHistoryOpen[oid]=!stationHistoryOpen[oid];
  const el=document.getElementById('stationHistoryList_'+oid);
  if(!el)return;
  if(stationHistoryOpen[oid]){
    el.classList.add('open');

    el.classList.remove('open');

async function loadStationHistory(oid){
  const el=document.getElementById('stationHistoryList_'+oid);
  if(!el)return;
  el.innerHTML='<div style="font-family:var(--font-mono);font-size:13px;color:#475569;padding:8px;text-align:center">Cargando...</div>';
  try{
    const res=await fetch(`/api/mes/historial-config?orderCode=${encodeURIComponent(oid)}`,{
      headers:{...sessionHeader()}
    });
    const json=await res.json();
    if(!json.ok||!json.data||json.data.length===0){
      el.innerHTML='<div style="font-family:var(--font-mono);font-size:13px;color:#475569;padding:8px;text-align:center">Sin historial para esta orden</div>';
      return;
    }
    stationHistoryData[oid]=json.data;
    const inkColorMap={
      cyan:'#06b6d4',magenta:'#ec4899',amarillo:'#eab308',negro:'#1e293b',
      blanco:'#f8fafc',pantone:'#f97316',barniz:'#a78bfa',empty:'#1e2d3d'
    };
    el.innerHTML=json.data.map((cfg,i)=>{
      const dt=new Date(cfg.created_at);
      const dateStr=dt.toLocaleDateString('es-CR',{day:'2-digit',month:'2-digit'})+' '+dt.toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'});
      const op=cfg.operator_name||'Operario';
      return`<div class="station-history-item" onclick="loadStationConfig('${oid}',${i})">
        <span class="station-history-date">${dateStr}</span>
        <span class="station-history-operator">${op}</span>
        <div class="station-history-stations">
          ${MES_STATION_RANGE.map(s=>{
            const ink=cfg['ink_type_slot_'+s]||cfg.ink_type||'empty';
            const col=inkColorMap[ink]||'#1e2d3d';
            return`<div class="station-history-chip" style="background:${col}" title="S${s}: ${ink}"></div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('');
  }catch(e){
    el.innerHTML='<div style="font-family:var(--font-mono);font-size:13px;color:#f85149;padding:8px;text-align:center">Error al cargar</div>';
  }
}

async function loadStationConfig(oid,idx){
  const cfgs=stationHistoryData[oid];
  if(!cfgs||!cfgs[idx])return;
  const cfg=cfgs[idx];
  try{
    const res=await fetch(`/api/mes/config-estaciones?orderCode=${encodeURIComponent(oid)}`,{
      headers:{...sessionHeader()}
    });
    const json=await res.json();
    if(!json.ok||!json.data||json.data.length===0){
      showToast('No se pudo cargar la configuración');
      return;
    }
    const allConfigs=json.data;
    const cfgTime=new Date(cfg.created_at).getTime();
    const groupConfigs=allConfigs.filter(c=>{
      const cTime=new Date(c.created_at).getTime();
      return Math.abs(cTime-cfgTime)<3600000;
    });
    if(groupConfigs.length===0){
      showToast('No se encontraron estaciones para esta configuración');
      return;
    }
    const tintas=(mesOrderInk[oid]&&mesOrderInk[oid].tintas)||[];
    for(const st of groupConfigs){
      const slot=st.slot_number;
      if(slot<1||slot>MES_STATION_COUNT)continue;
      const inkType=st.ink_type||'empty';
      if(inkType==='empty'){
        mesState.slots[slot]='empty';
        mesState.slotData[slot]={tintaIdx:'',etiqueta:'',color:'',tipo:'',visc:'22',temp:'23.5',anilox:'',cilindro:'',barnizTipo:'Brillante UV',barnizZonif:'Total',barnizZona:'',pantoneRef:'',lampOn:false};
        continue;
      }
      // El historial guarda el tipo real (proceso/directo/adicional/barniz/goma) desde este panel, o
      // un nombre de color legado en registros viejos — se intenta emparejar contra la receta actual
      // de la orden por tipo; si no calza, se muestra la etiqueta guardada tal cual.
      const tIdx=tintas.findIndex(t=>t.tipo===inkType);
      const matched=tIdx>=0?tintas[tIdx]:null;
      mesState.slots[slot]=inkType==='barniz'?'barniz':inkType==='goma'?'goma':'tinta';
      mesState.slotData[slot]={
        tintaIdx:matched?String(tIdx):'',
        etiqueta:matched?(matched.etiqueta||''):inkType,
        color:matched?(matched.color||''):'',
        tipo:matched?matched.tipo:inkType,
        visc:String(st.viscosity||22),
        temp:String(st.temperature||23.5),
        anilox:st.anilox_code||'',
        cilindro:st.cilindro_code||'',
        barnizTipo:st.barniz_tipo||'Brillante UV',
        barnizZonif:st.barniz_zonif||'Total',
        barnizZona:st.barniz_zona||'',
        pantoneRef:st.pantone_ref||'',
        lampOn:inkType==='goma'||!!st.lamp_on
      };
    }
    mesState.slotsInitFor=oid;
    refreshOrderModal(oid);
    showToast('✓ Configuración cargada del historial');
  }catch(e){
    showToast('Error al cargar configuración');
  }
}

async function saveStationConfig(oid,aprobar){
  const stations=[];
  MES_STATION_RANGE.forEach(i=>{
    const slot=mesState.slots[i]||'empty';
    const d=mesState.slotData[i]||{};
    stations.push({
      slotNumber:i,
      inkType:slot==='empty'?'empty':(d.tipo||'tinta'),
      tipoTintaReal:d.tipo||'',
      inkLabel:d.etiqueta||'',
      viscosity:Number(d.visc||0),
      temperature:Number(d.temp||0),
      aniloxCode:d.anilox||'',
      pantoneRef:d.pantoneRef||'',
      barnizTipo:d.barnizTipo||'',
      barnizZonif:d.barnizZonif||'',
      barnizZona:d.barnizZona||'',
      cilindroCode:d.cilindro||'',
      // La lámpara ya no se enciende a mano — se enciende sola en cuanto la estación tiene algo asignado.
      lampOn:slot!=='empty'
    });
  });
  try{
    const res=await fetch('/api/mes/config-estaciones',{
      method:'POST',
      headers:{'Content-Type':'application/json',...sessionHeader()},
      body:JSON.stringify({
        orderCode:oid,
        productCode:oid,
        machineName:currentMachineName()||'',
        operatorName:currentUserName(),
        stations:stations,
        aprobar:!!aprobar
      })
    });
    const json=await res.json();
    if(json.ok){
      showToast(aprobar?'✓ Configuración aprobada y guardada':'✓ Configuración guardada en historial');
      if(json.aprobacion)mesApproval[oid]=json.aprobacion;
      if(stationHistoryOpen[oid])loadStationHistory(oid);
      refreshOrderModal(oid);
    }else{
      showToast('Error: '+(json.error||'No se pudo guardar'));
    }
  }catch(e){
    showToast('Error al guardar configuración');
  }
}

// Guardar desde la pieza compartida (Diseño / Preprensa / Tintas). Mismo endpoint y mismo
// historial que la barra de Impresión; sin aprobar.
function guardarConfigMaquina(oid){ saveStationConfig(oid,false); }

// Al abrir la ventana: sobreponer los valores REALES ya guardados (production_station_configs)
// encima de la receta cotizada, una sola vez por orden, para que se vea lo último guardado.
// No pisa ediciones sin guardar (corre una vez, después de mesEnsureSlotsInit).
async function mesHydrateSavedStations(oid){
  if(mesState.savedHydratedFor===oid)return;
  mesState.savedHydratedFor=oid;
  try{
    const res=await fetch(`/api/mes/config-estaciones?orderCode=${encodeURIComponent(oid)}`,{headers:{...sessionHeader()}});
    const json=await res.json();
    if(!json.ok||!Array.isArray(json.data)||!json.data.length)return;
    // Grupo más reciente = filas dentro de 1h del created_at máximo.
    const maxT=Math.max(...json.data.map(c=>new Date(c.created_at).getTime()));
    const grupo=json.data.filter(c=>Math.abs(new Date(c.created_at).getTime()-maxT)<3600000);
    let cambio=false;
    grupo.forEach(st=>{
      const slot=st.slot_number;
      if(slot<1||slot>MES_STATION_COUNT)return;
      const d=mesState.slotData[slot]; if(!d)return;
      if(st.anilox_code)d.anilox=st.anilox_code;
      if(st.cilindro_code)d.cilindro=st.cilindro_code;
      if(st.viscosity)d.visc=String(st.viscosity);
      if(st.temperature)d.temp=String(st.temperature);
      if(st.pantone_ref)d.pantoneRef=st.pantone_ref;
      if(st.barniz_tipo)d.barnizTipo=st.barniz_tipo;
      if(st.barniz_zonif)d.barnizZonif=st.barniz_zonif;
      if(st.barniz_zona)d.barnizZona=st.barniz_zona;
      cambio=true;
    });
    if(cambio)refreshOrderModal(oid);
  }catch(e){/* si falla, se queda con la receta cotizada */}
}

// Arrastre de tarjetas de estación para reordenarlas (además de los botones ◀▶). El grip

let _mesCardDrag=null;
document.addEventListener('dragstart',(e)=>{
  const grip=e.target.closest&&e.target.closest('.mes-sc-grip');
  if(!grip)return;
  const card=grip.closest('.mes-station-card');
  _mesCardDrag={from:Number(grip.getAttribute('data-station-grip')),oid:_mesCurrentOid()};
  if(card)card.classList.add('is-dragging');
  e.dataTransfer.effectAllowed='move';
  try{e.dataTransfer.setData('text/plain',String(_mesCardDrag.from));}catch(_){}
});
document.addEventListener('dragend',()=>{
  document.querySelectorAll('.mes-station-card.is-dragging,.mes-station-card.drag-over').forEach(el=>el.classList.remove('is-dragging','drag-over'));
  _mesCardDrag=null;
});
document.addEventListener('dragover',(e)=>{
  if(!_mesCardDrag)return;
  const card=e.target.closest&&e.target.closest('.mes-station-card[data-station-key]');
  if(!card||!/^\d+$/.test(card.getAttribute('data-station-key')))return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.mes-station-card.drag-over').forEach(el=>el.classList.remove('drag-over'));
  card.classList.add('drag-over');
});
document.addEventListener('drop',(e)=>{
  if(!_mesCardDrag)return;
  const card=e.target.closest&&e.target.closest('.mes-station-card[data-station-key]');
  const dragState=_mesCardDrag;_mesCardDrag=null;
  document.querySelectorAll('.mes-station-card.is-dragging,.mes-station-card.drag-over').forEach(el=>el.classList.remove('is-dragging','drag-over'));
  if(!card||!/^\d+$/.test(card.getAttribute('data-station-key')))return;
  e.preventDefault();
  const to=Number(card.getAttribute('data-station-key'));
  const from=dragState.from;
  if(!from||!to||from===to)return;
  // Reinserta la estación 'from' en la posición 'to', corriendo las de en medio (no un swap seco).
  const s=mesState.slots, dt=mesState.slotData;
  const order=MES_STATION_RANGE.slice();
  const seqSlots=order.map(i=>s[i]), seqData=order.map(i=>dt[i]);
  const fi=from-1, ti=to-1;
  seqSlots.splice(ti,0,seqSlots.splice(fi,1)[0]);
  seqData.splice(ti,0,seqData.splice(fi,1)[0]);
  order.forEach((slotNum,k)=>{ s[slotNum]=seqSlots[k]; dt[slotNum]=seqData[k]; });
  mesState.selectedStation=to;
  refreshOrderModal(dragState.oid||_mesCurrentOid());
});
function _mesCurrentOid(){
  const p=document.querySelector('.mes-panel[id^="mesPanel_"]');
  return p?p.id.replace('mesPanel_',''):null;
}

function findOrderRouteId(oid){
  // Buscar la ruta activa para el proceso actual
  let route=productionRoutes.find(r=>r.orderCode===oid&&r.processKey===activeProc);
  if(route)return route.routeId||'';
  // Si no se encuentra con el proceso activo, buscar cualquier ruta pendiente/en proceso para esta orden
  route=productionRoutes.find(r=>r.orderCode===oid&&(r.routeStatus==='PENDIENTE'||r.routeStatus==='RUN'||r.routeStatus==='SETUP'||r.routeStatus==='PARO'));
  return route?.routeId||'';
}
const _mesEventsInFlight=new Set();
function setBtnLoading(btn,loadingLabel){
  if(!btn||btn.classList.contains('is-loading'))return;
  btn.dataset.originalHtml=btn.innerHTML;
  btn.classList.add('is-loading');
  btn.innerHTML=`<span class="btn-spinner"></span>${loadingLabel}`;
}
function clearBtnLoading(btn){
  if(!btn||!btn.classList.contains('is-loading'))return;
  btn.classList.remove('is-loading');
  if(btn.dataset.originalHtml!==undefined)btn.innerHTML=btn.dataset.originalHtml;
}
async function postMesEvent(oid,eventType,notes='',extra={}){
  const guardKey=oid+'|'+eventType;
  if(_mesEventsInFlight.has(guardKey))throw new Error('Ya se está procesando esta acción, esperá un momento.');
  _mesEventsInFlight.add(guardKey);
  try{
    // routeIdOverride: para "Iniciar" un proceso YA completado (nuevo ciclo) — ahí no hay
    // ruta "activa" que buscar (findOrderRouteId ignora el processKey en su respaldo y podría
    // agarrar la ruta de OTRO proceso de la misma orden), así que se manda el id exacto del
    // proceso que ya resolvió abrirNuevoCiclo().
    const routeId=extra.routeIdOverride||findOrderRouteId(oid);
    if(!routeId)throw new Error('No se encontró la ruta activa de la orden.');
    const res=await fetch('/api/mes/evento',{
      method:'POST',
      headers:{'Content-Type':'application/json',...sessionHeader()},
      body:JSON.stringify({routeId,eventType,operatorName:currentUserName(),notes,
        desperdicioMetros:extra.desperdicioMetros!=null?extra.desperdicioMetros:undefined,
        desperdicioKg:extra.desperdicioKg!=null?extra.desperdicioKg:undefined,
        distanciaConsumidaM:extra.distanciaConsumidaM!=null?extra.distanciaConsumidaM:undefined})
    });
    const payload=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(payload.error||'No se pudo registrar el avance.');
    await loadProductionFlow();
    return payload;
  } finally {
    _mesEventsInFlight.delete(guardKey);
  }
}
async function doStart(oid,name,btn){
  // Punto 2: Verificar si ya existe una orden en proceso en este proceso productivo
  const existingActive=findActiveOrderInProcess(oid);
  if(existingActive){
    showBlockedOrderModal(existingActive);
    return;
  }
  setBtnLoading(btn,'Iniciando…');
  const key=orderKey(oid);
  try{await postMesEvent(oid,'run','Inicio de proceso');}catch(e){showToast(e.message);clearBtnLoading(btn);return;}
  orderStates[key]='inprog';
  orderStartTime[key]=nowSim();
  addLog(key,'inicio','Orden iniciada');
  renderQueue();refreshOrderModal(oid);showToast(`▶ ${oid} iniciada`);
}
// Rebobinado: "Iniciar Montaje" es el primer paso — arranca el proceso (run) y la fase de
// Montaje juntos, para que el cronometraje de fases rija desde el inicio (no como una acción
// aparte más abajo). Fases Montaje→Tiraje siguen con marcarFase (genérica por oid+fase).
async function doStartRebobinadoMontaje(oid,name,btn){
  const existingActive=findActiveOrderInProcess(oid);

  }

  }catch(e){showToast(e.message);clearBtnLoading(btn);return;}

  orderStartTime[key]=nowSim();

// Impresión: igual que Rebobinado — "Iniciar Montaje" arranca el proceso (run) y la fase de

async function doResume(oid,btn){
  const key=orderKey(oid);
  // Si hay una devolución todavía en manos de otro departamento, la prensa no
  // puede reanudar: la orden espera a que el ticket vuelva.
  const rt=productionRoutes.find(r=>r.routeId===key);
  if(rt&&rt.devolucion&&rt.devolucion.tenedorActual){
    const lbl=PROC_LABEL_DEVOL[rt.devolucion.tenedorActual]||rt.devolucion.tenedorActual;
    showToast(`No se puede reanudar todavía: la devolución está con ${lbl}.`);
    return;
  }
  setBtnLoading(btn,'Reanudando…');
  if(pauseStarts[key]){
    const dur=Math.round((Date.now()-pauseStarts[key].startTs)/60000);
    addLog(key,'inicio',`Reanudada (pausa: ${dur}min — ${pauseStarts[key].reason})`);
    clearInterval(pauseTimerIvs[key]);
    delete pauseStarts[key];delete pauseTimerIvs[key];
  }
  try{await postMesEvent(oid,'run','Reanudación de proceso');}catch(e){showToast(e.message);clearBtnLoading(btn);return;}
  orderStates[key]='inprog';
  renderQueue();refreshOrderModal(oid);showToast(`▶ Orden ${oid} reanudada`);
}

}
async function confirmComplete(oid,name,btn){
  setBtnLoading(btn,'Completando…');

  const routeId=findOrderRouteId(oid);

let _valorProdCtx=null;
function openValorProduccionEditor(opts){
  _valorProdCtx=opts;

    <div class="section-lbl">Valor de Producción</div>
    ${inputHtml}
    <div class="modal-btns">
      <button class="mbtn-cancel" onclick="closeModal2()">Cancelar</button>
      <button class="mbtn-confirm mbtn-green" onclick="confirmValorProduccionSave()">✓ Guardar</button>
    </div>`);
}
async function confirmValorProduccionSave(justificacion,overrideValue){
  const ctx=_valorProdCtx;
  if(!ctx)return;
  const input=document.getElementById('valorProdInput');
  const valorProducido=overrideValue!==undefined?overrideValue:(input?input.value:ctx.valorProducido);
  try{
    const res=await fetch('/api/produccion/valores-motivo',{
      method:'POST',
      headers:{'Content-Type':'application/json',...sessionHeader()},
      body:JSON.stringify({
        orderCode:ctx.orderCode,motivoIndice:ctx.motivoIndice||0,proceso:ctx.proceso,campo:ctx.campo,
        etiqueta:ctx.etiqueta,unidad:ctx.unidad,valorCotizado:ctx.valorCotizado,valorProducido,
        justificacion,operatorName:currentUserName()
      })
    });
    const payload=await res.json().catch(()=>({}));
    if(res.status===409&&payload.needsJustification){
      openJustificacionModal(payload.previousChange,valorProducido);
      return;
    }
    if(!res.ok)throw new Error(payload.error||'No se pudo guardar.');
    closeModal2();
    showToast('✓ Valor de producción guardado');
    if(ctx.onSaved)ctx.onSaved(payload.data);
  }catch(e){
    showToast(e.message||'Error al guardar');
  }
}
function openJustificacionModal(previousChange,valorProducido){
  const when=fmtTs(new Date(previousChange.at));
  showModal2(`<h3>⚠ Este campo ya fue modificado</h3>
    <div class="modal-sub">Por ${previousChange.by} — ${when} (valor anterior: ${previousChange.previousValue||'—'})</div>

      <button class="mbtn-cancel" onclick="closeModal2()">Cancelar</button>
      <button class="mbtn-confirm mbtn-amber" onclick="submitJustificacion('${String(valorProducido).replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">✓ Aceptar Cambio</button>
    </div>`);
}
function submitJustificacion(valorProducido){
  const just=document.getElementById('justificacionInput').value.trim();

// Catálogo de Tipos de Caja — mismo catálogo de Configuración de Costos (acabados.cajas) que
// usa el cálculo (calculo-flexografia). Producción elige de esta misma lista, no escribe libre.
let _cajasCatalogoCache=null;
function loadCajasCatalogo(){
  if(_cajasCatalogoCache)return Promise.resolve(_cajasCatalogoCache);
  return fetch('/api/costos-config',{headers:sessionHeader()}).then(r=>r.json()).then(cfg=>{
    const cajas=(cfg&&cfg.acabados&&Array.isArray(cfg.acabados.cajas))?cfg.acabados.cajas:[];
    _cajasCatalogoCache=[...new Set(cajas.map(c=>c.nombre).filter(Boolean))];
    return _cajasCatalogoCache;
  }).catch(()=>{_cajasCatalogoCache=[];return _cajasCatalogoCache;});
}
// Catálogo de Tipos de Bolsa — mismo catálogo de Configuración de Costos (acabados.bolsas) y
// mismo resumen (nombre · material · ancho x largo · color) que usa el cálculo. Sin costo.
let _bolsasCatalogoCache=null;
function resumenBolsaProduccion(b){
  const partes=[String(b.nombre||'').trim()];
  if(b.material)partes.push(String(b.material).trim());
  const ancho=Number(b.anchoCm)||0,largo=Number(b.largoCm)||0;
  if(ancho>0||largo>0)partes.push(`${ancho}x${largo} cm`);
  if(b.color)partes.push(String(b.color).trim());
  return partes.filter(Boolean).join(' · ');
}
function loadBolsasCatalogo(){
  if(_bolsasCatalogoCache)return Promise.resolve(_bolsasCatalogoCache);
  return fetch('/api/costos-config',{headers:sessionHeader()}).then(r=>r.json()).then(cfg=>{
    const bolsas=(cfg&&cfg.acabados&&Array.isArray(cfg.acabados.bolsas))?cfg.acabados.bolsas:[];
    _bolsasCatalogoCache=[...new Set(bolsas.map(resumenBolsaProduccion).filter(Boolean))];
    return _bolsasCatalogoCache;
  }).catch(()=>{_bolsasCatalogoCache=[];return _bolsasCatalogoCache;});
}

// Botón redondo "salió igual a lo cotizado": sella (o retira) la confirmación con usuario,
// fecha y hora. El backend graba el historial aunque el valor no cambie.
async function toggleQdConfirm(idx){
  const opts=_qdRowRegistry[idx];
  if(!opts)return;
  const cot=(opts.valorCotizado===undefined||opts.valorCotizado===null)?'':String(opts.valorCotizado);
  if(cot===''){showToast('⚠ Este dato no tiene un valor cotizado con el cual comparar');return;}
  const confirmar=!opts.confirmado;
  try{
    const res=await fetch('/api/produccion/valores-motivo',{
      method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},
      body:JSON.stringify({orderCode:opts.orderCode,motivoIndice:opts.motivoIndice||0,proceso:opts.proceso,
        campo:opts.campo,etiqueta:opts.etiqueta,unidad:opts.unidad,valorCotizado:opts.valorCotizado,
        confirmar,operatorName:currentUserName()})
    });
    const payload=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(payload.error||'No se pudo guardar.');
    showToast(confirmar?'✓ Confirmado: salió igual a lo cotizado':'Confirmación retirada');
    delete producedValuesCache[opts.orderCode+'|'+opts.proceso];
    refreshOrderModal(opts.orderCode);
  }catch(e){showToast(e.message||'Error al guardar');}
}
// Círculo de confirmación reutilizable para cualquier renglón editable de las pantallas nuevas
// (fichitas de Diseño/Tintas, filas de dos columnas de Preprensa/Rebobinado, tarjetas de estación,
// lista de acabados). Lee el estado real de producedValuesCache. Devuelve '' si no hay cotizado.
function qdConfirmCircle(oid,proceso,campo,motivoIndice,cotizado,etiqueta,unidad){
  const cot=(cotizado==null?'':String(cotizado));
  if(cot==='')return'';
  const mi=Number(motivoIndice||0);
  const rows=producedValuesCache[oid+'|'+proceso]||[];
  const rec=rows.find(r=>r.campo===campo&&Number(r.motivo_indice)===mi);
  const prod=(rec&&rec.valor_producido!=null)?String(rec.valor_producido):'';
  const cotRef=(rec&&rec.valor_cotizado!=null&&rec.valor_cotizado!=='')?String(rec.valor_cotizado):cot;
  const confirmado=!!(rec&&rec.cambiado_por&&prod!==''&&prod===cotRef);
  const idx=registerQdRow({orderCode:oid,motivoIndice:mi,proceso,campo,etiqueta:etiqueta||campo,unidad:unidad||'',valorCotizado:cotRef,valorProducido:prod,confirmado});
  const titulo=confirmado
    ? `Confirmado por ${rec.cambiado_por||'—'}${rec.cambiado_en?' · '+fmtTs(new Date(rec.cambiado_en)):''} — tocá para quitar la confirmación`
    : 'Confirmar que salió igual a lo cotizado';
  return `<button class="qd-confirm-btn${confirmado?' is-confirmed':''}" title="${dzEsc(titulo)}" onclick="event.stopPropagation();toggleQdConfirm(${idx})">${confirmado?'✓':''}</button>`;
}
// Redondeo general para cualquier valor numérico de cotizado/producido que no tenga ya su
// propio formato (Impresión, Empaque y Rebobinado tienen el suyo — ver más abajo). Máximo 2
// decimales, y si el número es entero se muestra sin decimales (3, no 3.00) — así un dato que
// en realidad es una cantidad entera nunca aparece con decimales, sin tener que listar campo
// por campo. Texto (tipo, color, lote, código) pasa intacto porque Number(...) da NaN.
function qdFmtNum(val){
  if(val==null||val==='')return val;
  const n=Number(val);
  if(!isFinite(n))return String(val);
  return String(Math.round(n*100)/100);
}
function qdRowFromRecord(o,row){
  const cot=row.valor_cotizado||'';
  const prod=row.valor_producido||'';
  const displayVal=qdFmtNum(prod||cot)||'—';
  const isOverridden=!!(prod&&cot&&prod!==cot);
  const confirmado=!!(row.cambiado_por&&prod!==''&&cot!==''&&String(prod)===String(cot));
  const opcionesFn=QD_CAMPO_OPCIONES[row.campo];
  const opciones=opcionesFn?opcionesFn():null;
  const idx=registerQdRow({orderCode:o.id,motivoIndice:row.motivo_indice,proceso:row.proceso,campo:row.campo,etiqueta:row.etiqueta,unidad:row.unidad||'',valorCotizado:cot,valorProducido:prod,opciones,confirmado});
  return `<div class="qd-row">
    <span class="qd-row-lbl">${row.etiqueta}</span>
    <span class="qd-row-val${isOverridden?' produced':''}">${displayVal}${row.unidad&&displayVal!=='—'?' '+row.unidad:''}</span>
    ${cot!==''?`<button class="qd-confirm-btn${confirmado?' is-confirmed':''}" title="${confirmado?'Confirmado: salió igual a lo cotizado. Tocá para quitar la confirmación.':'Confirmar que salió igual a lo cotizado'}" onclick="toggleQdConfirm(${idx})">${confirmado?'✓':''}</button>`:''}
    <button class="qd-edit-btn" onclick="openQdRowEditor(${idx})">${shellIconSpanHtml('produccionEditarValor','✎','Editar')}</button>
  </div>`;
}
function qdRowReadOnly(row){
  const displayVal=qdFmtNum(row.valor_producido||row.valor_cotizado)||'—';
  return `<div class="qd-row">
    <span class="qd-row-lbl">${row.etiqueta}</span>
    <span class="qd-row-val">${displayVal}${row.unidad&&displayVal!=='—'?' '+row.unidad:''}</span>
  </div>`;
}
// Campos cargados por desplegable en el cálculo: producción elige de la misma lista.
const QD_CAMPO_OPCIONES={
  empaque_tipo_caja: ()=>_cajasCatalogoCache,
  empaque_tipo_bolsa: ()=>_bolsasCatalogoCache,
  impresion_sustrato_nombre: ()=>_sustratosCatalogoCache,
  barniz_tipo: ()=>_acabadosCatalogCache&&_acabadosCatalogCache.barniz,
  laminado_film_tipo: ()=>_acabadosCatalogCache&&_acabadosCatalogCache.laminado,
  foil_tipo: ()=>_acabadosCatalogCache&&_acabadosCatalogCache.foil
};
// Campos que el operador debe llenar sí o sí antes de terminar Empaque — hoy solo la cantidad
// final, que es la que se entrega al inventario de producto terminado de SAP al completar.
const QD_CAMPO_REQUERIDO=new Set(['empaque_cantidad_final','productos_por_rollo']);
// Fila de dos columnas (Cotizado | Producción) — mismo motor de guardado que qdRowFromRecord,
// solo cambia la presentación para que ambos valores se vean siempre, sin depender del modal.
function qdRowDosColumnas(o,row,opts){
  const ocultarConfirm=!!(opts&&opts.ocultarConfirm);
  const cot=row.valor_cotizado||'';
  const prod=row.valor_producido||'';
  const u=row.unidad?' '+row.unidad:'';
  const cotDisp=cot?qdFmtNum(cot)+u:'—';
  const prodDisp=prod?qdFmtNum(prod)+u:(cot?qdFmtNum(cot)+u:'—');
  const opcionesFn=QD_CAMPO_OPCIONES[row.campo];
  const opciones=opcionesFn?opcionesFn():null;
  const requerido=QD_CAMPO_REQUERIDO.has(row.campo);
  const sinLlenar=requerido&&!prod;
  const confirmado=!!(row.cambiado_por&&prod!==''&&cot!==''&&String(prod)===String(cot));
  const idx=registerQdRow({orderCode:o.id,motivoIndice:row.motivo_indice,proceso:row.proceso,campo:row.campo,etiqueta:row.etiqueta,unidad:row.unidad||'',valorCotizado:cot,valorProducido:prod,opciones,confirmado});
  return `<div class="qd-row qd-row-2col${sinLlenar?' qd-row-pendiente':''}"${requerido?` title="Obligatorio para completar el proceso"`:''}>
    <span class="qd-row-lbl">${row.etiqueta}</span>
    <span class="qd-row-val qd-row-cot">${cotDisp}</span>
    <span class="qd-row-val qd-row-prod" onclick="openQdRowEditor(${idx})">${prodDisp}${(cot!==''&&!ocultarConfirm)?`<button class="qd-confirm-btn${confirmado?' is-confirmed':''}" title="${confirmado?'Confirmado: salió igual a lo cotizado. Tocá para quitar la confirmación.':'Confirmar que salió igual a lo cotizado'}" onclick="event.stopPropagation();toggleQdConfirm(${idx})">${confirmado?'✓':''}</button>`:''}<button class="qd-edit-btn">${shellIconSpanHtml('produccionEditarValor','✎','Editar')}</button></span>
  </div>`;
}
// Campos de cantidad en Empaque que se muestran enteros y con espacio cada millar (ej.
// "10 000"), en vez del número tal cual venía de la BD — mismo criterio que QD_REBO_MILES_CAMPOS.
const EMPAQUE_MILES_CAMPOS=new Set(['empaque_cantidad_cores','empaque_cantidad_cajas',
  'empaque_cajas_utilizadas','empaque_rollos_sueltos','empaque_etiquetas_por_rollo',
  'empaque_cantidad_final','empaque_faltante','empaque_operarios']);
// Rollos por Caja nunca puede mostrarse a medias — no pueden entrar 6.6 rollos en una caja.
// Se muestra siempre redondeado HACIA ABAJO (nunca al más cercano), con espacio de millar.
function qdFmtMilesPiso(val){
  const n=Number(val);
  if(!isFinite(n))return String(val);
  return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}
// Empaque: una sola columna (Producido), sin mostrar el Cotizado por separado — llega ya
// relleno con la sugerencia del cálculo/orden y el operario solo lo cambia si hace falta.
// opts.agrupado: muestra el valor dentro de paréntesis y sin borde inferior — para las filas
// que se agrupan con otra (Ej. "Tipo de Caja (30×20×12 cm)").
function qdRowEmpaqueUnaColumna(o,row,opts){
  const cot=row.valor_cotizado||'';
  const prod=row.valor_producido||'';
  const u=row.unidad&&!opts?.agrupado?' '+row.unidad:'';
  const editado=!!(prod&&cot&&prod!==cot);
  let val=prod||cot;
  if(val!==''&&row.campo==='empaque_cantidad_rollos')val=qdFmtMilesPiso(val);
  else if(val!==''&&EMPAQUE_MILES_CAMPOS.has(row.campo))val=qdFmtMiles(val);
  else if(val!=='')val=qdFmtNum(val);
  const disp=val?val+u:'';
  const requerido=QD_CAMPO_REQUERIDO.has(row.campo);
  const sinLlenar=requerido&&!prod;
  const opcionesFn=QD_CAMPO_OPCIONES[row.campo];
  const opciones=opcionesFn?opcionesFn():null;
  const idx=registerQdRow({orderCode:o.id,motivoIndice:row.motivo_indice,proceso:row.proceso,campo:row.campo,etiqueta:row.etiqueta,unidad:row.unidad||'',valorCotizado:cot,valorProducido:prod,opciones});
  const valorHtml=opts?.agrupado
    ?`(${disp.replace(/\s*$/,'')})`
    :disp;
  return `<div class="qd-row qd-row-1col${sinLlenar?' qd-row-pendiente':''}${opts?.agrupado?' qd-row-agrupada':''}"${requerido?` title="Obligatorio para completar el proceso"`:''}>
    <span class="qd-row-lbl">${opts?.agrupado?'':row.etiqueta}</span>
    <span class="qd-row-1col-val${editado?' qd-editado':''}" onclick="openQdRowEditor(${idx})">${valorHtml}${editado?`<span class="qd-edited-dot" title="Editado — tocá para ver el historial" onclick="event.stopPropagation();openValorHistorialMini(${row.id},'${dzEsc(row.etiqueta)}')"></span>`:''}${opts?.agrupado?'':`<button class="qd-edit-btn" title="Editar">${shellIconSpanHtml('produccionEditarValor','✎','Editar')}</button>`}</span>
  </div>`;
}
// Igual pero sin edición — para los datos de Core que se editan en Rebobinado, no en Empaque.
function qdRowEmpaqueUnaColumnaSoloLectura(row){
  const cot=row.valor_cotizado||'';

// Campos del resumen de Rebobinado que se muestran sin decimales y con espacio cada millar
// (ej. 12 500), en vez del número cotizado/producido tal cual venía de la BD.
const QD_REBO_MILES_CAMPOS=new Set(['productos_por_rollo','rebobinado_velocidad','rebobinado_distancia_recorrida_m']);
function qdFmtMiles(val){
  const n=Number(val);
  if(!isFinite(n))return String(val);
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}
// Fila compacta de una sola columna (solo Producción) para el resumen de Rebobinado, cuando el
// diámetro/ancho/espesor de Core ya se ven en la imagen y no hace falta repetir el Cotizado.
function qdRowResumenProducido(o,row,opts){
  let prod=row.valor_producido||row.valor_cotizado||'';
  if(prod!==''&&QD_REBO_MILES_CAMPOS.has(row.campo))prod=qdFmtMiles(prod);
  else if(prod!=='')prod=qdFmtNum(prod);
  const u=row.unidad?' '+row.unidad:'';
  const prodDisp=prod?prod+u:'—';
  const soloLectura=!!(opts&&opts.soloLectura);
  const extraHtml=(opts&&opts.extraHtml)||'';
  // El "Sentido de Bobinado" se destaca con letra mucho más grande que el resto de este resumen.
  const claseSentido=row.campo==='tipo_salida'?' qd-rebo-resumen-val-sentido':'';
  // Sentido de Bobinado ocupa su propia columna a lo alto de 2 filas, para no forzar a
  // Velocidad/Empalmes Máximo a estirarse por la foto del sentido — quedan apiladas al lado.
  const claseItem=row.campo==='tipo_salida'?' qd-rebo-resumen-item-sentido':'';
  const idx=registerQdRow({orderCode:o.id,motivoIndice:row.motivo_indice,proceso:row.proceso,campo:row.campo,etiqueta:row.etiqueta,unidad:row.unidad||'',valorCotizado:row.valor_cotizado||'',valorProducido:row.valor_producido||''});
  return `<div class="qd-rebo-resumen-item${claseItem}">
    <span class="qd-rebo-resumen-lbl">${row.etiqueta}</span>
    <span class="qd-rebo-resumen-val${claseSentido}${soloLectura?' qd-rebo-resumen-readonly':''}"${soloLectura?'':` onclick="openQdRowEditor(${idx})"`}>${prodDisp}${soloLectura?'':`<button class="qd-edit-btn">${shellIconSpanHtml('produccionEditarValor','✎','Editar')}</button>`}${extraHtml}</span>
  </div>`;
}
// Decimales fijos por campo en Información General de Impresión — la velocidad y las mermas
// venían con hasta 4 decimales heredados del cálculo interno, sin significado real para el
// operario. Todos los metros se muestran redondeados a número entero.
const IMPRESION_INFO_DECIMALES={impresion_velocidad_media:0,impresion_merma_montaje_m:2,
  impresion_merma_corrida_m:2,impresion_merma_ajuste_paros_m:2,impresion_sustrato_consumido_m:0};
function qdFmtImpresionValor(campo,val){
  if(val==null||val==='')return'';
  const dec=IMPRESION_INFO_DECIMALES[campo];
  if(dec==null)return qdFmtNum(val);
  const n=Number(val);
  return isNaN(n)?String(val):n.toLocaleString('es-CR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
// Fila de un solo valor (Información General de Impresión): muestra el cotizado, y si el
// operario lo editó, lo reemplaza visualmente por el valor real. Sin botón de confirmar —
// si nadie lo toca, se entiende aprobado tal cual se cotizó. El puntito azul marca que fue
// editado y, al tocarlo, abre el historial de ese cambio (quién, cuándo, antes/después) —
// ese historial ya lo guarda /api/produccion/valores-motivo en valores_produccion_historial.
// Solo "Velocidad de Máquina" es editable por el operario — el resto de la ficha general
// (sustrato, cantidad consumida, cantidad de productos) es de solo lectura.
const IMPRESION_INFO_EDITABLE=new Set(['impresion_velocidad_media','impresion_desbobinado_tension']);
async function openValorHistorialMini(valorId,etiqueta){
  showModal2(`<h3>Historial — ${dzEsc(etiqueta)}</h3><div id="valorHistorialMiniList" class="historial-list"><div class="qd-empty">Cargando…</div></div><div class="modal-btns"><button class="mbtn-cancel" onclick="closeModal2()">Cerrar</button></div>`);
  try{
    const res=await fetch('/api/produccion/valores-motivo/historial?valorId='+encodeURIComponent(valorId),{headers:sessionHeader()});
    const payload=await res.json().catch(()=>({}));
    const rows=payload.ok&&Array.isArray(payload.data)?payload.data:[];
    const el=document.getElementById('valorHistorialMiniList');
    if(!el)return;
    el.innerHTML=rows.length?rows.map(r=>`<div class="historial-item">
      <div class="historial-item-hdr"><span class="hist-ico ch">✎</span><span class="hist-fecha">${fmtTs(new Date(r.creado_en))}</span></div>
      <div class="historial-item-body">${dzEsc(r.valor_anterior||'—')} → <b>${dzEsc(r.valor_nuevo||'—')}</b> · ${dzEsc(r.cambiado_por||'—')}${r.justificacion?` · "${dzEsc(r.justificacion)}"`:''}</div>
    </div>`).join(''):'<div class="qd-empty">Sin cambios registrados.</div>';
  }catch(e){
    const el=document.getElementById('valorHistorialMiniList');
    if(el)el.innerHTML='<div class="qd-empty">No se pudo cargar el historial.</div>';
  }
}
function groupRowsByMotivo(rows){
  const g={};
  rows.forEach(r=>{(g[r.motivo_indice]=g[r.motivo_indice]||[]).push(r);});
  return g;
}
// Extra de Aprobaciones (ex Visto Bueno): cliente, estado derivado del último evento en
// vb_historial (pendiente de enviar / pendiente de recibir / recibido) e historial completo.
let aprobacionesExtraCache={};
async function loadAprobacionesExtra(oid){
  try{
    const r=await fetch('/api/produccion-aprobaciones-extra?orden='+encodeURIComponent(oid),{headers:sessionHeader()});
    const p=await r.json();
    aprobacionesExtraCache[oid]=(p.ok?p.data:null);
  }catch(e){aprobacionesExtraCache[oid]=null;}
  return aprobacionesExtraCache[oid];
}
async function registrarEventoAprobacion(oid,evento,motivo,categoria,cambios){
  try{
    const res=await fetch('/api/produccion-aprobaciones/evento',{
      method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},
      body:JSON.stringify({orderCode:oid,evento,motivo:motivo||'',categoria:categoria||'',...(Array.isArray(cambios)&&cambios.length?{cambios}:{})})
    });
    const p=await res.json().catch(()=>({}));
    if(!res.ok||!p.ok)throw new Error(p.error||'No se pudo registrar el evento.');
    delete aprobacionesExtraCache[oid];
    showToast({cambios_cliente:'✓ Cambios registrados — la orden volvió a Diseño',vb_iniciar:'▶ Aprobación iniciada',vb_pausar:'⏸ Aprobación en pausa',vb_reanudar:'▶ Aprobación reanudada',vb_finalizar:'✓ Trabajo de aprobación finalizado',enviado:'📤 Enviado — queda pendiente de aprobación',recibido:'✓ Recibido'}[evento]||'✓ Registrado');
    if(typeof closeModal2==='function')closeModal2();
    refreshOrderModal(oid);
    if(aprobPendientesView)renderQueue();
    return true;
  }catch(e){showToast(e.message||'Error al registrar el evento');return false;}
}
// Iniciar Aprobaciones: arranca el proceso general (ruta de producción, igual que en cualquier
// otro proceso) y el cronómetro de trabajo, en un solo clic — así queda registrado tanto en la
// ruta como en el historial de aprobaciones quién lo hizo.
async function iniciarAprobacion(oid,name,btn){
  const existingActive=findActiveOrderInProcess(oid);
  if(existingActive){showBlockedOrderModal(existingActive);return;}
  setBtnLoading(btn,'Iniciando…');
  const key=orderKey(oid);
  try{await postMesEvent(oid,'run','Inicio de proceso');}catch(e){showToast(e.message);clearBtnLoading(btn);return;}
  orderStates[key]='inprog';orderStartTime[key]=nowSim();
  addLog(key,'inicio','Orden iniciada');
  await registrarEventoAprobacion(oid,'vb_iniciar');
  renderQueue();
}
// Termina el trabajo de aprobación y, según el Tipo de Envío de la orden, decide qué sigue:
// si no necesita envío, completa el proceso ahí mismo; si necesita envío, lo marca como enviado
// y lo deja pendiente de recibir (no completa la ruta todavía — eso pasa al marcar "Recibido").
async function finalizarAprobacion(oid){
  const extra=aprobacionesExtraCache[oid];
  const necesitaEnvio=!!(extra&&extra.muestrasTipo&&extra.muestrasTipo!=='No necesita');
  const ok=await registrarEventoAprobacion(oid,'vb_finalizar');
  if(!ok)return;
  if(necesitaEnvio){
    await registrarEventoAprobacion(oid,'enviado');
    refreshAprobPendientesBadge();
    return;
  }
  await completarRutaAprobacion(oid);
}
// Reintento: el trabajo ya se había finalizado pero por algún motivo (conexión, recarga de
// página) no se llegó a enviar/completar — no vuelve a finalizar (ya está finalizado), solo
// retoma el paso que faltaba.
async function reintentarCierreAprobacion(oid){
  const extra=aprobacionesExtraCache[oid];
  const necesitaEnvio=!!(extra&&extra.muestrasTipo&&extra.muestrasTipo!=='No necesita');
  if(necesitaEnvio){
    await registrarEventoAprobacion(oid,'enviado');
    refreshAprobPendientesBadge();
  }else{
    await completarRutaAprobacion(oid);
  }
}
async function completarRutaAprobacion(oid){
  const routeId=findOrderRouteId(oid);
  if(!routeId){showToast('⚠ No se encontró la ruta de producción para esta orden. Refrescá la página e intentá de nuevo.');return;}
  const key=orderKey(oid);
  try{await postMesEvent(oid,'completado','Proceso visto_bueno completado');}catch(e){showToast(e.message);return;}
  orderStates[key]='done';
  if(pauseStarts[key]){clearInterval(pauseTimerIvs[key]);delete pauseStarts[key];delete pauseTimerIvs[key];}
  addLog(key,'completado','Orden completada');
  closeModal();renderQueue();showToast(`✓ ${oid} completada`);
  refreshAprobPendientesBadge();
}

const APROBACION_ESTADO_LABEL={pendiente_enviar:'Pendiente de Enviar',pendiente_recibir:'Pendiente de Recibir',recibido:'Recibido'};
// Reloj único de Aprobaciones (ver nota junto a isVistoBueno más arriba). Usa el cronómetro de
// vb_proceso como única fuente de verdad para "cuánto lleva" y "quién lo hizo". Al finalizar el
// trabajo, el botón que aparece depende del Tipo de Envío de la orden: si no necesita envío,
// termina ahí mismo (Completar); si sí, se manda (Enviar) y queda pendiente hasta que alguien
// marque "Recibido" en la pestaña Eventos.
function buildAprobacionClockHtml(o){
  const extra=aprobacionesExtraCache[o.id];
  if(extra===undefined)loadAprobacionesExtra(o.id).then(()=>refreshOrderModal(o.id));
  const vb=(extra&&extra.vbProceso)||{estado:'sin_iniciar',acumuladoSeg:0};
  const vbElapsedMs=(Number(vb.acumuladoSeg)||0)*1000+((vb.estado==='en_curso'&&vb.inicioEnMs)?(Date.now()-vb.inicioEnMs):0);
  const necesitaEnvio=!!(extra&&extra.muestrasTipo&&extra.muestrasTipo!=='No necesita');
  let cCls=vb.estado==='en_curso'?'run':(vb.estado==='pausado'?'paused':'');
  let cState={sin_iniciar:'<b>En espera</b> · sin iniciar',en_curso:'<b>En curso</b> · corriendo',pausado:'<b>En pausa</b>',finalizado:'<b>Trabajo finalizado</b>'}[vb.estado]||'';
  if(o.suspendidaProduccion){cCls='paused';cState='<b>⛔ Suspendida</b> · esperando a Planificación';}
  let cActs='';
  if(vb.estado==='sin_iniciar')cActs=`<button class="dz-act dz-act-start" onclick="iniciarAprobacion('${o.id}','${o.name}',this)">▶ Iniciar</button>`;
  else if(vb.estado==='en_curso'){
    cActs+=`<button class="dz-act dz-act-pause" onclick="registrarEventoAprobacion('${o.id}','vb_pausar')">⏸ Pausar</button>`;
    cActs+=`<button class="dz-act dz-act-done" onclick="finalizarAprobacion('${o.id}')">${necesitaEnvio?'📤 Enviar':'✓ Completar'}</button>`;
  } else if(vb.estado==='pausado'){
    cActs+=`<button class="dz-act dz-act-start" onclick="registrarEventoAprobacion('${o.id}','vb_reanudar')">▶ Reanudar</button>`;
    cActs+=`<button class="dz-act dz-act-done" onclick="finalizarAprobacion('${o.id}')">${necesitaEnvio?'📤 Enviar':'✓ Completar'}</button>`;
  } else if(vb.estado==='finalizado'){
    const tiempoLbl=`<span class="dz-sub">Tiempo de trabajo: <b>${dzHMS(vbElapsedMs)}</b>${vb.operador?' · '+dzEsc(vb.operador):''}</span>`;
    if(extra&&extra.estado==='pendiente_recibir'){
      cState='<b>📤 Enviado</b> · esperando respuesta';
      cActs=tiempoLbl;
    }else if(stOf(o)!=='done'){
      // Se finalizó el trabajo pero por algún motivo no se llegó a enviar/completar
      // (por ejemplo, se perdió la conexión a mitad de camino) — se puede reintentar aquí.
      cActs=`${tiempoLbl} <button class="dz-act dz-act-done" onclick="reintentarCierreAprobacion('${o.id}')">${necesitaEnvio?'📤 Enviar':'✓ Completar'}</button>`;
    }else{
      cActs=tiempoLbl;
    }
  }
  const tipoEnvioLine=(extra&&extra.muestrasTipo)?`<div class="dz-sub" style="margin-top:8px">Tipo de Envío: <b>${dzEsc(extra.muestrasTipo)}</b></div>`:'';
  return `<div class="dz-clock-wrap">
    <div class="dz-clock ${cCls}" ${vb.estado==='en_curso'?`data-vb-start="${vb.inicioEnMs||0}" data-vb-acc="${vb.acumuladoSeg||0}"`:''}>${dzHMS(vbElapsedMs)}</div>
    <div class="dz-clock-side"><div class="dz-clock-state">${cState}</div><div class="dz-actrow">${cActs}</div></div>
  </div>${tipoEnvioLine}`;
}
