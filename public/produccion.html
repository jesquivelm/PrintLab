function dzFecha(v){if(!v)return '—';const dt=new Date(v);if(isNaN(dt.getTime()))return '—';return dt.toLocaleString('es-CR',{dateStyle:'short',timeStyle:'short'});}
function dzHMS(ms){let s=Math.max(0,Math.floor(Number(ms||0)/1000));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);s=s%60;return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;}
// Mismo criterio que resolveTintaColor() de la ficha de la orden (orden-produccion.js).
const DZ_TINTA_HEX={cian:'#00AEEF',cyan:'#00AEEF',magenta:'#EC008C',amarillo:'#FFD400',yellow:'#FFD400',negro:'#1A1A1A',black:'#1A1A1A',blanco:'#FFFFFF',white:'#FFFFFF'};
// Tabla de tintas reordenable por arrastre — compartida por Diseño, Tintas y Preprensa
// (misma fuente de verdad: ui_state.types[idx].inkStations en flexo_calculations, igual
// que el cálculo). editCoberturaFn es el nombre de la función global a llamar al hacer clic
// en la cobertura ('dzEditTinta'/'tzEditTinta'), o null si esa columna es de solo lectura.
function buildTintasReordenableHtml(orderCode,m,tintas,numFmt,editCoberturaFn){
  if(!m)return '<div class="dz-sub">Esta orden no tiene artes en el cálculo; no hay receta de tintas para mostrar.</div>';
  if(!tintas.length)return '<div class="dz-sub">Sin tintas configuradas para este arte en la orden.</div>';
  const covProc=editCoberturaFn==='tzEditTinta'?'tintas':(editCoberturaFn==='dzEditTinta'?'diseno':'');
  const filas=tintas.map((t,i)=>{
    const hex=dzTintaColor(t.color);
    const est=(t.estacion??i);
    const coberturaTxt=t.coberturaPct!=null?numFmt(t.coberturaPct,0)+' %':'—';
    const covCircle=(editCoberturaFn&&covProc&&t.coberturaPct!=null)
      ?qdConfirmCircle(orderCode,covProc,'tinta_est'+est,m.indice,String(t.coberturaPct),(t.etiqueta||('Estación '+(est+1))),'%'):'';
    const coberturaCell=editCoberturaFn
      ?`<span class="dz-cov-wrap">${coberturaTxt}${covCircle}<button class="qd-edit-btn" title="Editar" onclick="${editCoberturaFn}(${est},'${dzEsc(t.etiqueta||'')}','${t.coberturaPct!=null?t.coberturaPct:''}')">${shellIconSpanHtml('produccionEditarValor','✎','Editar')}</button></span>`
      :coberturaTxt;
    return `<tr class="tinta-drag-row${t.activo===false?' inact':''}" draggable="true" data-tinta-order="${dzEsc(orderCode)}" data-tinta-motivo="${m.indice}" data-tinta-index="${i}">
      <td class="ta-r"><span class="tinta-drag-handle" title="Arrastrar para reordenar">⋮⋮</span> ${est+1}</td>
      <td><span class="dz-badge">${DZ_TIPO[t.tipo]||t.tipo||''}</span></td>
      <td><span class="dz-tinta-dot ${hex?'':'none'}" style="${hex?`--dz-tinta-dot:${hex}`:''}"></span>${dzEsc(t.etiqueta||'—')}${t.activo===false?' <span class="dz-sub">· inactiva</span>':''}</td>
      <td class="ta-r">${coberturaCell}</td>
      <td class="ta-r">${numFmt(t.bcmAnilox,2)}</td>
      <td class="ta-r">${numFmt(t.factorTransferencia,2)}</td>
      <td class="ta-r">${numFmt(t.densidad,2)}</td>
      <td class="ta-r">${t.consumoKg!=null?numFmt(t.consumoKg,4)+' kg':'—'}</td>
    </tr>`;
  }).join('');
  return `<table class="dz-tt dz-tt-full tinta-drag-table">
    <thead><tr><th class="ta-r">#</th><th>Tipo</th><th>Tinta</th><th class="ta-r">Cobertura</th><th class="ta-r">BCM Anilox</th><th class="ta-r">Factor Transf.</th><th class="ta-r">Densidad</th><th class="ta-r">Consumo</th></tr></thead>
    <tbody>${filas}</tbody>
    <tfoot><tr><td colspan="7">Consumo Total de Tintas</td><td class="ta-r">${m.consumoTotalKg!=null?numFmt(m.consumoTotalKg,4)+' kg':'—'}</td></tr></tfoot>
  </table>`;
}
let _tintaDragState=null;
document.addEventListener('dragstart',(e)=>{
  const row=e.target.closest&&e.target.closest('.tinta-drag-row');
  if(!row)return;
  _tintaDragState={orderCode:row.dataset.tintaOrder,motivoIndice:Number(row.dataset.tintaMotivo),fromIndex:Number(row.dataset.tintaIndex)};
  row.classList.add('is-dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',row.dataset.tintaIndex);
});
document.addEventListener('dragend',()=>{
  document.querySelectorAll('.tinta-drag-row').forEach(el=>el.classList.remove('is-dragging','drag-over-top','drag-over-bottom'));
  _tintaDragState=null;
});
document.addEventListener('dragover',(e)=>{
  if(!_tintaDragState)return;
  const row=e.target.closest&&e.target.closest('.tinta-drag-row');
  if(!row||row.dataset.tintaOrder!==_tintaDragState.orderCode||Number(row.dataset.tintaMotivo)!==_tintaDragState.motivoIndice)return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.tinta-drag-row').forEach(el=>el.classList.remove('drag-over-top','drag-over-bottom'));
  const rect=row.getBoundingClientRect();
  const midY=rect.top+rect.height/2;
  row.classList.add(e.clientY<midY?'drag-over-top':'drag-over-bottom');
});
document.addEventListener('drop',(e)=>{
  if(!_tintaDragState)return;
  const row=e.target.closest&&e.target.closest('.tinta-drag-row');
  if(!row||row.dataset.tintaOrder!==_tintaDragState.orderCode||Number(row.dataset.tintaMotivo)!==_tintaDragState.motivoIndice){_tintaDragState=null;return;}
  e.preventDefault();
  const toIndex=Number(row.dataset.tintaIndex);
  const before=row.classList.contains('drag-over-top');
  const{orderCode,motivoIndice,fromIndex}=_tintaDragState;
  _tintaDragState=null;
  if(fromIndex!==toIndex)reordenarTintaMotivo(orderCode,motivoIndice,fromIndex,toIndex,before);
});
async function reordenarTintaMotivo(orderCode,motivoIndice,fromIndex,toIndex,before){
  try{
    const res=await fetch('/api/produccion/tintas/reordenar',{method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},
      body:JSON.stringify({orderCode,motivoIndice,fromIndex,toIndex,before})});
    const p=await res.json().catch(()=>({}));
    if(!res.ok||!p.ok)throw new Error(p.error||'No se pudo reordenar la tinta.');
    disenoState.oid=null;disenoState.data=null;
    preprensaState.oid=null;preprensaState.data=null;
    tintasState.oid=null;tintasState.data=null;
    showToast('✓ Orden de tintas actualizado');
    refreshOrderModal(orderCode);
  }catch(e){showToast(e.message||'Error al reordenar');}
}
function dzTintaColor(raw){const v=String(raw==null?'':raw).trim();if(!v)return '';if(/^#?[0-9a-fA-F]{3}(?:[0-9a-fA-F]{3})?$/.test(v))return v.charAt(0)==='#'?v:'#'+v;return DZ_TINTA_HEX[v.toLowerCase()]||'';}
function dzKb(b){b=Number(b)||0;if(b>=1048576)return (b/1048576).toFixed(1)+' MB';if(b>=1024)return Math.round(b/1024)+' KB';return b+' B';}
function dzIni(n){n=String(n||'').trim();if(!n)return '—';const p=n.split(/\s+/);return ((p[0]||'')[0]||'').toUpperCase()+((p[1]||'')[0]||'').toUpperCase();}

// Campos retirados del panel (ya no aportan al operario, o se mudaron a la pestaña Eventos —
// merma vs. cotizado y merma por causa de paro ya se ven en buildMermaPanel dentro de esa
// pestaña, ver buildImpresionEventosTab) — filtrados aunque una orden ya sembrada antes de este
// cambio todavía tenga la fila vieja en valores_produccion_motivo.
const IMPRESION_CAMPOS_OCULTOS=new Set(['impresion_sellos_estado','impresion_operarios',
  'impresion_bobinas_consumidas','impresion_lote_sustrato','impresion_metros_buenos_entregados',
  'impresion_cantidad_buena_millares','impresion_rechazo_millares','impresion_rechazo_motivo',
  'impresion_merma_montaje_m','impresion_merma_corrida_m','impresion_merma_ajuste_paros_m']);
// Campos por estación (tinta_est0, bcm_est0, factor_est0, densidad_est0, ...) — desde que existe
// la tabla volteada de la pestaña Máquina, esos datos viven solo ahí; ya no se repiten aquí.
const IMPRESION_CAMPO_ESTACION_RE=/^(tinta|bcm|factor|densidad|anilox_codigo|cilindro_codigo|viscosidad|temperatura|curado)_est\d+$/;
// Cantidad de Sustrato / Velocidad / Tensión, y por separado Barniz / ID del Troquel / Laminado /
// Estampado: misma tabla volteada que ya usan las estaciones de tinta (imp-piv-table — ver
// buildImpresionTintasPivotTable) en vez de columnas de ancho fijo. Una tabla real deja que cada
// columna se ajuste sola al texto que lleva adentro, así una etiqueta larga no se aprieta contra
// el lápiz de editar ni se parte en dos líneas.
const IMPRESION_ETIQUETA_CORTA={impresion_sustrato_consumido_m:'Cantidad Sustrato',impresion_velocidad_media:'Velocidad Impresión'};
function buildImpresionCamposTabla(o,campos){
  const headCells=campos.map(row=>{
    const editable=IMPRESION_INFO_EDITABLE.has(row.campo);
    const lblDisp=IMPRESION_ETIQUETA_CORTA[row.campo]||row.etiqueta;
    if(!editable)return `<th class="ta-c">${dzEsc(lblDisp)}</th>`;
    const idx=registerQdRow({orderCode:o.id,motivoIndice:row.motivo_indice,proceso:row.proceso,campo:row.campo,etiqueta:row.etiqueta,unidad:row.unidad||'',valorCotizado:row.valor_cotizado||'',valorProducido:row.valor_producido||''});
    return `<th class="ta-c">${dzEsc(lblDisp)}<button class="qd-edit-btn imp-piv-edit" title="Editar" onclick="openQdRowEditor(${idx})">${shellIconSpanHtml('produccionEditarValor','✎','Editar')}</button></th>`;
  }).join('');
  const cells=campos.map(row=>{
    const cot=row.valor_cotizado||'',prod=row.valor_producido||'';
    const editado=!!(prod&&cot&&prod!==cot);
    const val=prod||cot;
    const u=row.unidad?' '+row.unidad:'';
    const disp=val?qdFmtImpresionValor(row.campo,val)+u:'';
    return `<td class="ta-c${editado?' qd-editado':''}">${dzEsc(disp)}</td>`;
  }).join('');
  return `<div class="imp-piv-wrap"><table class="imp-piv-table">
    <thead><tr>${headCells}</tr></thead>
    <tbody><tr>${cells}</tr></tbody>
  </table></div>`;
}
function buildImpresionAcabadosTabla(items){
  const headCells=items.map(([lbl])=>`<th class="ta-c">${dzEsc(lbl)}</th>`).join('');
  const cells=items.map(([,v])=>`<td class="ta-c">${dzEsc(v)}</td>`).join('');
  return `<div class="imp-piv-wrap"><table class="imp-piv-table">
    <thead><tr>${headCells}</tr></thead>
    <tbody><tr>${cells}</tr></tbody>
  </table></div>`;
}
function buildImpresionPanel(o,rows){
  if(!_sustratosCatalogoCache)loadSustratosCatalogo().then(()=>refreshOrderModal(o.id));
  if(!mesOrderInk[o.id])loadMesOrderInk(o.id).then(()=>refreshOrderModal(o.id));
  rows=(rows||[]).filter(r=>!IMPRESION_CAMPOS_OCULTOS.has(r.campo)&&!IMPRESION_CAMPO_ESTACION_RE.test(r.campo));

    <span class="qd-row-lbl">Sustrato a Utilizar</span>
    <span class="qd-row-1col-val">${dzEsc(sustratoVal)}</span>
  </div>`:'';
  // Fila 2: Cantidad de Sustrato + Velocidad de Impresión + Tensión de Desbobinado, en tabla.
  const maquinaCampos=['impresion_sustrato_consumido_m','impresion_velocidad_media','impresion_desbobinado_tension']
    .map(c=>byCampo[c]).filter(Boolean);
  const maquinaGrid=maquinaCampos.length?buildImpresionCamposTabla(o,maquinaCampos):'';
  // Barniz / ID del Troquel / Laminado / Estampado — mismo dato que ya cotizó Diseño (acabados

  // orden realmente los lleva.
  const acabados=(mesOrderInk[o.id]&&mesOrderInk[o.id].acabados)||[];
  const acabValor=(nombre)=>{const a=acabados.find(x=>x.nombre===nombre);return (a&&a.activo)?(a.detalle||''):'';};

  const acabGrid=acabItems.length?buildImpresionAcabadosTabla(acabItems):'';

// ── Fases de tiempo de Impresión (Montaje → Setup → Corrida → Limpieza) ──
// Estado local optimista; la verdad vive en los eventos de production_route_events y la
// calcula syncCapturaFasesImpresion en el backend. Se reinicia al recargar la página.
const faseImpresion={};
const FASES_IMP=[['montaje','Montaje'],['setup','Setup'],['corrida','Corrida'],['limpieza','Limpieza']];
function faseSt(oid,f){return (faseImpresion[oid]||{})[f]||'todo';}
function buildFaseButtons(oid){
  return `<div class="fase-row"><span class="fase-lbl">Fases:</span>${FASES_IMP.map(([f,lbl])=>{
    const s=faseSt(oid,f);
    const cls=s==='done'?'fase-done':s==='run'?'fase-run':'fase-todo';
    const ic=s==='done'?'✓':s==='run'?'⏹':'▶';
    return `<button class="fase-btn ${cls}" ${s==='done'?'disabled':''} onclick="marcarFase('${oid}','${f}',this)">${ic} ${lbl}</button>`;
  }).join('')}</div>`;
}
async function marcarFase(oid,fase,btn){
  const cur=faseSt(oid,fase);
  if(cur==='done')return;
  const evt=cur==='todo'?fase+'_inicio':fase+'_fin';
  setBtnLoading(btn,'…');
  try{await postMesEvent(oid,evt,`Fase ${fase} — ${cur==='todo'?'inicio':'fin'}`);}
  catch(e){showToast(e.message);clearBtnLoading(btn);return;}
  faseImpresion[oid]=faseImpresion[oid]||{};
  faseImpresion[oid][fase]=cur==='todo'?'run':'done';
  addLog(orderKey(oid),'fase',`Fase ${fase}: ${cur==='todo'?'inicio':'fin'}`);
  delete rebobinadoTiemposCache[oid];delete impresionTiemposCache[oid];
  refreshOrderModal(oid);
  showToast(`⏱ ${fase} ${cur==='todo'?'iniciada':'finalizada'}`);
}
// Rebobinado: al finalizar Montaje o Tiraje, el operario debe declarar cuántos metros se
// consumieron en esa fase — de ahí salen los % de merma de montaje/tiraje (server.js:
// capturarDistanciaFaseRebobinado). No usa marcarFase directo porque necesita ese dato extra.
// proc: 'rebobinado' | 'impresion'. La última fase (rebobinado: 'tiraje'; impresión: 'corrida')
// cierra todo el proceso al confirmar. El modal NO se cierra al tocar fuera (bloqueado=true).
const FASE_FINAL_PROC={rebobinado:'tiraje',impresion:'corrida'};
function faseLbl(fase){return fase==='montaje'?'Montaje':(fase==='corrida'||fase==='tiraje')?'Tiraje':fase;}
function finalizarFaseRebobinado(oid,fase,proc){
  proc=proc||'rebobinado';
  const esCierreTirajeRebobinado=proc==='rebobinado'&&fase===FASE_FINAL_PROC.rebobinado;
  
  // Buscar información de referencia de la orden para mostrarla dentro del modal
  const routeProc=(productionRoutes||[]).find(r=>r.orderCode===oid&&r.processKey===(proc||'rebobinado'));
  const routeGen=(productionRoutes||[]).find(r=>r.orderCode===oid);
  const route=routeProc||routeGen;
  const cachedValores=producedValuesCache[oid+'|'+(proc||'rebobinado')]||[];
  
  let mtsProg=null;
  if(route&&route.baseFeet) mtsProg=Math.round(Number(route.baseFeet)*0.3048);
  
  let prodPorRollo=null;
  const itemProdRollo=cachedValores.find(v=>v.campo==='productos_por_rollo');
  if(itemProdRollo&&(itemProdRollo.valorCotizado||itemProdRollo.valorProducido)){
    prodPorRollo=itemProdRollo.valorCotizado||itemProdRollo.valorProducido;
  }

  const itemsRef=[];
  if(route&&route.productName) itemsRef.push(`<div><span style="font-size:12px;color:var(--text2);display:block">Producto</span><strong style="color:var(--text1)">${dzEsc(route.productName)}</strong></div>`);
  if(mtsProg!=null&&mtsProg>0) itemsRef.push(`<div><span style="font-size:12px;color:var(--text2);display:block">Metros Programados</span><strong style="color:var(--text1)">${mtsProg.toLocaleString('es-CR')} m</strong></div>`);
  if(prodPorRollo!=null) itemsRef.push(`<div><span style="font-size:12px;color:var(--text2);display:block">Etiquetas por Rollo</span><strong style="color:var(--text1)">${Number(prodPorRollo).toLocaleString('es-CR')}</strong></div>`);
  if(route&&route.customerName) itemsRef.push(`<div><span style="font-size:12px;color:var(--text2);display:block">Cliente</span><strong style="color:var(--text1)">${dzEsc(route.customerName)}</strong></div>`);

  const blockRefData=itemsRef.length?`
    <div style="background:var(--bg3,#1c2128);border:1px solid var(--border2,#444c56);border-radius:8px;padding:12px 14px;margin:14px 0 16px;text-align:left">
      <div style="font-weight:600;font-size:13px;color:var(--blue,#58a6ff);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px">📋 Información de Referencia de la Orden</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 14px">
        ${itemsRef.join('')}
      </div>
    </div>`:'';

  const camposRollos=esCierreTirajeRebobinado?`
    <p style="font-size:16px;color:var(--text2);margin:20px 0 10px">¿Cuántos rollos completos salieron?</p>
    <input class="note-input" id="rebRollosCompletosInput" type="number" min="0" step="1" placeholder="0" style="font-family:var(--font-mono)">
    <p style="font-size:16px;color:var(--text2);margin-bottom:10px">Si quedó un rollo suelto (parcial), ¿cuánta cantidad tiene?</p>
    <input class="note-input" id="rebRolloRemanenteInput" type="number" min="0" step="1" placeholder="0 si no quedó ninguno" style="font-family:var(--font-mono)">
    <p style="font-size:16px;color:var(--text2);margin-bottom:10px">¿Cuántos productos se produjeron en total? (sirve para comparar contra lo que pidió el cliente)</p>
    <input class="note-input" id="rebProductosTotalInput" type="number" min="0" step="1" placeholder="0" style="font-family:var(--font-mono)">`:'';
  showModal2(`<h3>⏹ Finalizar ${faseLbl(fase)}</h3>
    <div class="modal-sub">${oid}</div>
    ${blockRefData}
    <p style="font-size:16px;color:var(--text2);margin-bottom:10px">¿Cuántos metros se consumieron durante esta fase?</p>
    <input class="note-input" id="distanciaFaseInput" type="number" min="0" step="1" placeholder="0" style="font-family:var(--font-mono)">
    ${camposRollos}
    <div class="modal-btns">
      <button class="mbtn-cancel" onclick="closeModal2()">Cancelar</button>
      <button class="mbtn-confirm mbtn-green" onclick="confirmFinalizarFaseRebobinado('${oid}','${fase}','${proc}',this)">✓ Confirmar</button>
    </div>`,true);
}
async function confirmFinalizarFaseRebobinado(oid,fase,proc,btn){
  proc=proc||'rebobinado';
  const input=document.getElementById('distanciaFaseInput');
  // Se remueve la restricción estricta de metros > 0 para no bloquear la continuación del proceso a empaque
  const dist=Math.max(0,Math.round(Number(input?input.value:0)||0));
  const esCierreTirajeRebobinado=proc==='rebobinado'&&fase===FASE_FINAL_PROC.rebobinado;
  const rollosCompletos=esCierreTirajeRebobinado?Math.max(0,Math.round(Number(document.getElementById('rebRollosCompletosInput')?.value)||0)):0;
  const rolloRemanente=esCierreTirajeRebobinado?Math.max(0,Math.round(Number(document.getElementById('rebRolloRemanenteInput')?.value)||0)):0;
  const productosTotal=esCierreTirajeRebobinado?Math.max(0,Math.round(Number(document.getElementById('rebProductosTotalInput')?.value)||0)):0;
  setBtnLoading(btn,'Guardando…');
  try{await postMesEvent(oid,fase+'_fin',`Fase ${fase} — fin`,{distanciaConsumidaM:dist});}
  catch(e){console.warn('Advertencia registrando evento de fase:',e.message);}
  if(esCierreTirajeRebobinado){
    try{
      const nombre=currentUserName();
      await fetch('/api/produccion/valores-motivo',{method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},
        body:JSON.stringify({orderCode:oid,motivoIndice:0,proceso:'rebobinado',campo:'rebobinado_rollos_completos',etiqueta:'Rollos Completos Producidos',valorProducido:rollosCompletos,operatorName:nombre})}).catch(()=>{});
      await fetch('/api/produccion/valores-motivo',{method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},
        body:JSON.stringify({orderCode:oid,motivoIndice:0,proceso:'rebobinado',campo:'rebobinado_etiquetas_rollo_remanente',etiqueta:'Etiquetas del Rollo Remanente',valorProducido:rolloRemanente,operatorName:nombre})}).catch(()=>{});
      await fetch('/api/produccion/valores-motivo',{method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},
        body:JSON.stringify({orderCode:oid,motivoIndice:0,proceso:'rebobinado',campo:'rebobinado_productos_producidos_total',etiqueta:'Productos Producidos en Total',valorProducido:productosTotal,operatorName:nombre})}).catch(()=>{});
    }catch(e){console.warn('Advertencia registrando valores de rollos:',e.message);}
  }
  faseImpresion[oid]=faseImpresion[oid]||{};
  faseImpresion[oid][fase]='done';
  addLog(orderKey(oid),'fase',`Fase ${faseLbl(fase)}: fin (${dist} m)`);
  delete rebobinadoTiemposCache[oid];delete impresionTiemposCache[oid];
  // La fase final cierra todo el proceso (no hay botón "Completar").
  if(fase===FASE_FINAL_PROC[proc]){
    const key=orderKey(oid);
    try{await postMesEvent(oid,'completado',`Proceso ${proc} completado`);}
    catch(e){console.warn('Advertencia marcando proceso completado:',e.message);}
    orderStates[key]='done';
    if(pauseStarts[key]){clearInterval(pauseTimerIvs[key]);delete pauseStarts[key];delete pauseTimerIvs[key];}
    addLog(key,'completado',`${proc==='impresion'?'Impresión':'Rebobinado'} completado`);
    closeModal2();closeModal();renderQueue();
    showToast(`✓ ${oid} — ${proc==='impresion'?'impresión':'rebobinado'} completado`);
    // El aviso de faltante corre aparte y nunca bloquea el cierre del proceso
    if(esCierreTirajeRebobinado){
      fetch('/api/produccion/rebobinado/verificar-faltante',{method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},body:JSON.stringify({orderCode:oid})})
        .then(r=>r.json()).then(p=>{
          if(p&&p.ok&&p.faltante>0)showToast(`⚠ ${oid}: faltan ${p.faltante.toLocaleString('es-CR')} unidades vs. lo pedido — se avisó a Planificación`);
        }).catch(()=>{});
    }
    return;
  }
  closeModal2();
  refreshOrderModal(oid);
  showToast(`⏱ ${faseLbl(fase)} finalizada`);
}

// ── "Iniciar" cuando el proceso ya se completó antes (nuevo ciclo) ──
// Aplica a los 6 procesos: una vez que un proceso ya terminó un tiraje/finalizó una vez,
// el botón vuelve a decir "Iniciar" y abre este modal — pregunta qué se quiere iniciar
// (para Impresión/Rebobinado, la fase; para el resto, solo confirma) y muestra el
// historial de ciclos anteriores de esa orden en ese proceso.
const FASES_REB=[['montaje','Montaje'],['tiraje','Tiraje']];
const FASES_POR_PROC_CICLO={impresion:FASES_IMP,rebobinado:FASES_REB};
const EVENTO_LABEL_CICLO={run:'Iniciado',completado:'Completado',paro:'Pausado',suspender:'Suspendida',
  montaje_inicio:'Inicio de Montaje',montaje_fin:'Fin de Montaje',setup_inicio:'Inicio de Setup',setup_fin:'Fin de Setup',
  corrida_inicio:'Inicio de Tiraje',corrida_fin:'Fin de Tiraje',tiraje_inicio:'Inicio de Tiraje',tiraje_fin:'Fin de Tiraje',
  limpieza_inicio:'Inicio de Limpieza',limpieza_fin:'Fin de Limpieza'};
function renderHistorialCiclos(eventos){
  if(!eventos||!eventos.length)return `<div style="color:var(--text2)">Sin ciclos anteriores registrados.</div>`;
  const ciclos=[];let actual=[];
  eventos.forEach(e=>{actual.push(e);if(String(e.event_type).toLowerCase()==='completado'){ciclos.push(actual);actual=[];}});
  if(actual.length)ciclos.push(actual);
  const fmt=d=>{try{return new Date(d).toLocaleString('es-CR',{dateStyle:'short',timeStyle:'short'});}catch(_){return '';}};
  return ciclos.map((ci,idx)=>{
    const inicio=ci[0]&&ci[0].created_at,fin=ci[ci.length-1]&&ci[ci.length-1].created_at;
    const dur=(inicio&&fin)?dzHMS(new Date(fin)-new Date(inicio)):'';
    const filas=ci.map(e=>{
      const et=String(e.event_type).toLowerCase();
      return `<div style="display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid var(--border2);font-size:14px">
        <span>${dzEsc(EVENTO_LABEL_CICLO[et]||e.event_type)}</span>
        <span style="color:var(--text2)">${fmt(e.created_at)}${e.operator_name?' · '+dzEsc(e.operator_name):''}</span>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:12px;padding:10px 12px;border:1px solid var(--border2);border-radius:8px">
      <div style="font-weight:600;margin-bottom:6px;font-size:15px">Ciclo ${idx+1}${dur?` · duró ${dur}`:' · en curso'}</div>
      ${filas}
    </div>`;
  }).join('');
}
async function abrirNuevoCiclo(oid,name,procKey){
  showModal2(`<h3 style="font-size:22px">▶ Iniciar — ${dzEsc(name)}</h3>
    <div class="modal-sub" style="font-size:15px">${dzEsc(oid)} · este proceso ya se completó antes</div>
    <div style="padding:24px 0;color:var(--text2)">Cargando historial…</div>`,false);
  let procesoId=null,eventos=[];
  try{
    const r=await fetch(`/api/produccion/ciclos?orden=${encodeURIComponent(oid)}&proceso=${encodeURIComponent(procKey)}`,{headers:sessionHeader()});
    const p=await r.json();
    if(p.ok){procesoId=p.procesoId;eventos=p.eventos||[];}
  }catch(e){}
  if(!procesoId){
    showModal2(`<h3 style="font-size:22px">▶ Iniciar — ${dzEsc(name)}</h3>
      <div class="modal-sub" style="font-size:15px">${dzEsc(oid)}</div>
      <div style="padding:20px 0;color:#c0392b">No se pudo cargar la información de este proceso. Cerrá esta ventana e intentá de nuevo.</div>
      <div class="modal-btns"><button class="mbtn-cancel" onclick="closeModal2()">Cerrar</button></div>`,false);
    return;
  }
  // procesoId identifica exactamente ESTE proceso de ESTA orden (no el que sea que "postMesEvent"
  // adivine) — así el nuevo ciclo nunca puede arrancar por error otro proceso de la misma orden.
  const fases=FASES_POR_PROC_CICLO[procKey]||null;
  const opciones=fases
    ? fases.map(([f,lbl])=>`<button class="mbtn-confirm mbtn-green" style="margin:4px 8px 4px 0" onclick="iniciarNuevoCicloFase('${oid}','${procesoId}','${f}',this)">▶ ${lbl}</button>`).join('')
    : `<button class="mbtn-confirm mbtn-green" onclick="iniciarNuevoCicloSimple('${oid}','${procesoId}',this)">▶ Iniciar</button>`;
  showModal2(`<h3 style="font-size:22px">▶ Iniciar — ${dzEsc(name)}</h3>
    <div class="modal-sub" style="font-size:15px">${dzEsc(oid)} · este proceso ya se completó antes</div>
    <div style="font-size:16px;font-weight:600;margin:18px 0 8px">Historial de ciclos anteriores</div>
    <div style="margin-bottom:18px;max-height:300px;overflow:auto">${renderHistorialCiclos(eventos)}</div>
    <div style="font-size:16px;color:var(--text2);margin-bottom:10px">¿Qué querés iniciar?</div>
    <div class="modal-btns" style="flex-wrap:wrap;gap:8px">${opciones}<button class="mbtn-cancel" onclick="closeModal2()">Cancelar</button></div>`,false);
}
async function iniciarNuevoCicloSimple(oid,procesoId,btn){
  setBtnLoading(btn,'Iniciando…');
  try{await postMesEvent(oid,'run','Nuevo ciclo de trabajo',{routeIdOverride:procesoId});}
  catch(e){showToast(e.message);clearBtnLoading(btn);return;}
  orderStates[procesoId]='inprog';
  orderStartTime[procesoId]=nowSim();
  addLog(procesoId,'inicio','Nuevo ciclo de trabajo iniciado');
  closeModal2();renderQueue();refreshOrderModal(oid);
  showToast(`▶ ${oid} — nuevo ciclo iniciado`);
}
async function iniciarNuevoCicloFase(oid,procesoId,fase,btn){
  setBtnLoading(btn,'Iniciando…');
  try{
    await postMesEvent(oid,'run','Nuevo ciclo de trabajo',{routeIdOverride:procesoId});
    if(fase!=='montaje')await postMesEvent(oid,fase+'_inicio',`Nuevo ciclo — fase ${fase}`,{routeIdOverride:procesoId});
  }catch(e){showToast(e.message);clearBtnLoading(btn);return;}
  orderStates[procesoId]='inprog';
  orderStartTime[procesoId]=nowSim();
  faseImpresion[oid]={};
  faseImpresion[oid][fase]='run';
  delete rebobinadoTiemposCache[oid];delete impresionTiemposCache[oid];
  addLog(procesoId,'inicio',`Nuevo ciclo iniciado — ${fase}`);
  closeModal2();renderQueue();refreshOrderModal(oid);
  showToast(`▶ ${oid} — nuevo ciclo (${faseLbl(fase)})`);
}

// PAUSE MODAL
// ════════════════════════════════════════════
let _pauseType=null,_pauseCat=null,_pauseOid=null,_pauseName=null,_pausePid=null,_pauseWaste='';
function _capturePauseWaste(){const el=document.getElementById('pauseWaste');if(el)_pauseWaste=el.value;}

// Inventario de motivos de Proceso/Calidad por departamento — configurable en
// Configuración General → Producción. Se cachea por proceso; si el servidor no
// responde, se usa la lista fija de PROCS como respaldo para no dejar al operario sin opciones.
let _motivosPausaCache={};
function loadMotivosPausa(pid){
  if(_motivosPausaCache[pid])return Promise.resolve(_motivosPausaCache[pid]);
  return fetch(`/api/produccion/motivos-pausa?proceso=${encodeURIComponent(pid)}`,{headers:sessionHeader()})
    .then(r=>r.json()).then(d=>{
      const items=(d&&d.ok&&Array.isArray(d.items)?d.items:[]).filter(it=>it.activo!==false);
      _motivosPausaCache[pid]=items.length?items:_motivosPausaFallback(pid);
      return _motivosPausaCache[pid];
    }).catch(()=>{_motivosPausaCache[pid]=_motivosPausaFallback(pid);return _motivosPausaCache[pid];});
}
function _motivosPausaFallback(pid){
  const proc=PROCS.find(p=>p.id===pid);
  return (proc?proc.cats:[]).map(c=>({motivo:c,solicitaMerma:true}));
}

function openPauseModal(oid,name,pid){
  _pauseOid=oid;_pauseName=name;_pausePid=pid;_pauseType=null;_pauseCat=null;_pauseWaste='';
  document.getElementById('overlay2').style.display='flex';
  document.getElementById('modalBox2').className='modal modal-pausa';
  renderPauseModal();
  if(!_motivosPausaCache[pid])loadMotivosPausa(pid).then(()=>{if(_pauseOid===oid&&_pausePid===pid)renderPauseModal();});
}

function renderPauseModal(){
  const motivos=_motivosPausaCache[_pausePid]||[];
  const motivoSel=motivos.find(m=>m.motivo===_pauseCat);
  const pideMerma=!motivoSel||motivoSel.solicitaMerma!==false;
  let sub='';
  if(_pauseType==='proceso'){
    sub=`<div class="section-lbl" style="margin-top:20px">Causa del Proceso / Calidad</div>
    <div class="reason-grid">${motivos.length?motivos.map(m=>`<button class="rbtn${_pauseCat===m.motivo?' sel-red':''}" onclick="_selCat('${m.motivo.replace(/'/g,"\\'")}');renderPauseModal()">${m.motivo}</button>`).join(''):'<div style="opacity:.6;font-size:13px">Cargando motivos…</div>'}</div>
    ${(_pauseCat&&pideMerma)?`<div class="section-lbl" style="margin-top:20px">Merma de este paro (metros)</div>
    <input class="note-input" id="pauseWaste" type="number" min="0" step="1" placeholder="0" value="${_pauseWaste||''}" style="min-height:auto;padding:12px 14px;font-family:var(--font-mono)">`:''}`;
  } else if(_pauseType==='personal'){
    sub=`<div class="section-lbl" style="margin-top:20px">Tipo de Descanso</div>
    <div class="reason-grid">${PERSONAL.map(r=>`<button class="rbtn${_pauseCat===r.id?' sel-green':''}" onclick="_selCat('${r.id}');renderPauseModal()">${r.lbl}${r.dur?` <span style='opacity:.6'>(${r.dur}min)</span>`:''}</button>`).join('')}</div>`;
  } else if(_pauseType==='mantenimiento'){
    sub=`<div class="section-lbl" style="margin-top:20px">Tipo de Mantenimiento</div>
    <div class="reason-grid">${MAINT.map(r=>`<button class="rbtn${_pauseCat===r.id?' sel-blue':''}" onclick="_selCat('${r.id}');renderPauseModal()">${r.lbl}</button>`).join('')}</div>`;
  }
  const canConfirm=_pauseType&&_pauseCat;
  // ¿Este motivo devuelve el trabajo a un paso de atrás?
  const destino=(_pauseType==='proceso'&&_pauseCat)?destinoDeMotivo(_pausePid,_pauseCat):null;
  const destinoLbl=destino?(PROC_LABEL_DEVOL[destino]||destino):'';
  const devolNote=destino?`<div class="devol-note">↩ Esto <b>devuelve la orden a ${destinoLbl}</b>. La orden queda en pausa acá hasta que ${destinoLbl} resuelva y la mande de vuelta.</div>`:'';
  document.getElementById('modalBox2').innerHTML=`
    <h3>⏸ Pausar orden</h3>
    <div class="modal-sub">${_pauseOid} — ${_pauseName}</div>
    <div class="section-lbl">Tipo de Pausa</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px">
      <button class="rbtn${_pauseType==='proceso'?' sel-red':''}" onclick="_selType('proceso');renderPauseModal()">⚙️ Proceso / calidad</button>
      <button class="rbtn${_pauseType==='personal'?' sel-green':''}" onclick="_selType('personal');renderPauseModal()">🧍 Tiempo personal</button>
      <button class="rbtn${_pauseType==='mantenimiento'?' sel-blue':''}" onclick="_selType('mantenimiento');renderPauseModal()">🔧 Mantenimiento</button>
    </div>
    ${sub}
    ${devolNote}
    <textarea class="note-input" id="pauseNote" placeholder="${destino?'Contá qué está mal, para que '+destinoLbl+' sepa qué revisar...':'Observación adicional (opcional)...'}"></textarea>
    <div class="modal-btns">
      <button class="mbtn-cancel" onclick="closeModal2()">Cancelar</button>
      <button class="mbtn-confirm mbtn-amber" onclick="confirmPause(this)" ${canConfirm?'':'disabled style="opacity:.45;cursor:default"'}>${destino?'↩ Pausar y devolver a '+destinoLbl:'⏸ Registrar pausa'}</button>
    </div>`;
}
window._selType=function(t){_capturePauseWaste();_pauseType=t;_pauseCat=null;}
window._selCat=function(c){_capturePauseWaste();_pauseCat=c;}

// Nombre legible del tipo/motivo de pausa para el registro y Reportería. Tiempo Personal y
// Mantenimiento guardan un id interno (wc, prev...) en _pauseCat; acá se traduce a su etiqueta
// en español, sin el ícono, para que la bitácora y el Pareto de causas no muestren códigos.
const TIPO_PAUSA_LABEL={proceso:'Proceso / Calidad',personal:'Tiempo Personal',mantenimiento:'Mantenimiento'};
function _catLabelPausa(){
  if(_pauseType==='personal')return((PERSONAL.find(r=>r.id===_pauseCat)||{}).lbl||_pauseCat).replace(/^\S+\s*/,'');
  if(_pauseType==='mantenimiento')return((MAINT.find(r=>r.id===_pauseCat)||{}).lbl||_pauseCat).replace(/^\S+\s*/,'');
  return _pauseCat;
}

async function confirmPause(btn){
  if(!_pauseType||!_pauseCat)return;
  _capturePauseWaste();
  setBtnLoading(btn,'Registrando…');
  const key=orderKey(_pauseOid);
  const note=document.getElementById('pauseNote').value;
  const _motivoSel=(_motivosPausaCache[_pausePid]||[]).find(m=>m.motivo===_pauseCat);
  const _pideMerma=_pauseType==='proceso'&&(!_motivoSel||_motivoSel.solicitaMerma!==false);
  const wasteMetros=_pideMerma?Math.round(Math.max(0,Number(_pauseWaste)||0)):0;
  const destino=(_pauseType==='proceso')?destinoDeMotivo(_pausePid,_pauseCat):null;
  const tipoLbl=TIPO_PAUSA_LABEL[_pauseType]||_pauseType;
  const catLbl=_catLabelPausa();
  let paroPayload;
  try{paroPayload=await postMesEvent(_pauseOid,'paro',`${tipoLbl} — ${catLbl}${note?' ('+note+')':''}`,{desperdicioMetros:wasteMetros||undefined});}catch(e){showToast(e.message);clearBtnLoading(btn);return;}
  // Motivo que pertenece a un paso de atrás: además de pausar, crea la devolución.
  if(destino){
    try{
      const r=await fetch('/api/produccion/devoluciones',{method:'POST',headers:{'Content-Type':'application/json',...sessionHeader()},
        body:JSON.stringify({routeId:orderKey(_pauseOid),motivo:_pauseCat,clasificacion:_pauseCat,comentario:note||'',eventoParoId:paroPayload&&paroPayload.event?paroPayload.event.id:undefined})});
      const p=await r.json().catch(()=>({}));
      if(!r.ok)showToast(p.error||'La pausa quedó registrada, pero no se pudo crear la devolución.');
    }catch(e){showToast('La pausa quedó registrada, pero no se pudo crear la devolución.');}
  }
  orderStates[key]='paused';
  pauseStarts[key]={startTs:Date.now(),reason:catLbl,note,operator:currentUserName()};
  const iv=setInterval(()=>updatePauseDisp(key),1000);
  pauseTimerIvs[key]=iv;
  addLog(key,'pausa',`Pausa: ${tipoLbl} — ${catLbl}${note?' ('+note+')':''}${destino?` · devuelta a ${PROC_LABEL_DEVOL[destino]||destino}`:''}`);
  closeModal2();renderQueue();refreshOrderModal(_pauseOid);
  showToast(destino?`↩ Orden devuelta a ${PROC_LABEL_DEVOL[destino]||destino}`:`⏸ Pausa registrada — ${catLbl}`);
}

function updatePauseDisp(oid){
  const key=orderKey(oid);
  const ps=pauseStarts[key];if(!ps)return;
  const el=document.getElementById('pt_'+key);if(!el)return;
  const sec=Math.floor((Date.now()-ps.startTs)/1000);
  const m=Math.floor(sec/60),s=sec%60;
  el.textContent=`⏱ ${m}:${pad2(s)}`;
}

// SUSPENDER PRODUCCIÓN — como Pausar (mismo reloj detenido, cualquiera la puede reanudar
// después), pero además queda marcada como urgente para que Planificación la revise y decida
// qué sigue con la orden. Reanudar (▶ Reanudar, ya existente) quita la marca solo.
// ════════════════════════════════════════════
let _suspOid=null,_suspName=null,_suspPid=null;
function openSuspenderModal(oid,name,pid){
  _suspOid=oid;_suspName=name;_suspPid=pid;
  showModal2(`<h3>⛔ Suspender Producción</h3>
    <p style="color:var(--text2);font-size:16px;line-height:1.5;margin:0 0 16px">
      Se detiene el reloj de <b>${dzEsc(name)}</b> y la orden le va a aparecer a Planificación
      como urgente para que decida qué sigue. Mientras tanto, cualquier operario la puede
      reanudar con el botón "▶ Reanudar".
    </p>
    <div class="section-lbl">¿Por qué hay que suspenderla? (obligatorio)</div>
    <textarea id="suspenderMotivo" class="note-input" rows="3" placeholder="Ej: se acabó el turno y no se pudo terminar el montaje"></textarea>
    <div class="modal-btns">
      <button class="mbtn-cancel" onclick="closeModal2()">Cancelar</button>
      <button class="mbtn-confirm mbtn-red" onclick="confirmSuspender(this)">⛔ Suspender</button>
    </div>`);
}
async function confirmSuspender(btn){
  const motivo=(document.getElementById('suspenderMotivo').value||'').trim();
  if(!motivo){showToast('Contá brevemente por qué hay que suspenderla.');return;}
  setBtnLoading(btn,'Suspendiendo…');
  const key=orderKey(_suspOid);
  try{await postMesEvent(_suspOid,'suspender',motivo);}catch(e){showToast(e.message);clearBtnLoading(btn);return;}
  orderStates[key]='paused';
  pauseStarts[key]={startTs:Date.now(),reason:'Suspendida',note:motivo,operator:currentUserName()};
  const iv=setInterval(()=>updatePauseDisp(key),1000);
  pauseTimerIvs[key]=iv;
  addLog(key,'suspendido',`Producción suspendida: ${motivo}`);
  closeModal2();renderQueue();refreshOrderModal(_suspOid);
  showToast('⛔ Producción suspendida — Planificación la va a revisar');
}

// ════════════════════════════════════════════
// DEVOLUCIONES — banda de urgencias del departamento
// ════════════════════════════════════════════
function escDev(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let _devolItems=[];
async function loadDevolucionesUrgentes(proc){
  const band=document.getElementById('devolBand');
  if(!band||!proc)return;
  try{
    const r=await fetch('/api/produccion/devoluciones?proceso='+encodeURIComponent(proc),{headers:sessionHeader()});
    const p=await r.json().catch(()=>({}));
    if(!r.ok||!p.ok){band.innerHTML='';return;}
    _devolItems=p.items||[];
    if(!_devolItems.length){band.innerHTML='';return;}
    band.innerHTML=`<div class="devol-band">
      <div class="devol-band-hdr">↩ Devoluciones — atención urgente (${_devolItems.length})</div>
      ${_devolItems.map(renderDevolCard).join('')}
    </div>`;
  }catch(e){band.innerHTML='';}
}
function renderDevolCard(d){
  const since=new Date(d.creadoEn).getTime();
  const origen=d.procesoOrigenLabel||d.procesoOrigen;
  const acepBtn=d.aceptada?'':`<button class="devol-act devol-act-accept" onclick="devolAceptar('${d.id}')">Aceptar</button>`;
  const pasarBtn=d.puedePasarAtras?`<button class="devol-act devol-act-back" onclick="devolPasarAtras('${d.id}','${escDev(d.pasoAtrasLabel)}')">Pasar a ${escDev(d.pasoAtrasLabel)}</button>`:'';
  return `<div class="devol-card lvl-${nivelEspera(since)}">
    <div class="devol-card-top">
      <span class="devol-card-order">${escDev(d.orderCode)}</span>
      <span class="devol-card-wait aprob-wait" data-since="${since}">${fmtEspera(since)}</span>
    </div>
    <div class="devol-card-job">${escDev(d.trabajo)} · ${escDev(d.cliente)}</div>
    <div class="devol-card-motivo"><b>${escDev(d.motivo)}</b> — viene de ${escDev(origen)}</div>
    ${d.comentario?`<div class="devol-card-note">${escDev(d.comentario)}</div>`:''}
    <div class="devol-card-acts">
      ${acepBtn}${pasarBtn}
      <button class="devol-act devol-act-done" onclick="devolResolver('${d.id}','${escDev(d.procesoOrigen)}')">Resolver</button>
      <button class="devol-act devol-act-detail" onclick="devolVerDetalle('${d.id}')">Ver historial</button>
    </div>
  </div>`;
}
async function devolAceptar(id){

let _shellConfig=null;
// Renderiza un ícono del catálogo (Configuración → Diseño → Íconos) como HTML string —
// mismo mecanismo que renderThemeIcon (SVG con máscara / imagen / glifo), para botones que
// se reconstruyen seguido (innerHTML) y no pueden apuntar a un elemento fijo.
function shellIconSpanHtml(key,fallback,alt){
  const ic=(_shellConfig&&_shellConfig.icons)||{};
  const g=(_shellConfig&&_shellConfig.general)||{};
  let v=String(ic[key]||fallback||'').trim();
  const suffix=key.replace(/^produccion/,'Produccion');
  const sz=Number(g['iconSize'+suffix])||18;
  const clr=g['iconColor'+suffix]||'#1e516d';
  const escAttr=(s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  if(/\.svg(\?|#|$)/i.test(v)||v.indexOf('data:image/svg+xml')===0){
    const s=escAttr(v);
    return `<span style="display:inline-flex;width:${sz}px;height:${sz}px;-webkit-mask-image:url('${s}');mask-image:url('${s}');-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;background-color:${clr}"></span>`;
  }
  if(/^(\/|data:image\/)/i.test(v)){
    return `<img style="width:${sz}px;height:${sz}px;object-fit:contain" src="${escAttr(v)}" alt="${escAttr(alt||'')}">`;
  }
  return `<span style="font-size:${sz}px;color:${clr}">${dzEsc(v)}</span>`;
}
// Tamaño configurado (Configuración → Diseño → Íconos) para un ícono del catálogo,
// sin renderizarlo — usado para que texto acompañante escale junto con el ícono.
function shellIconSizeFor(key,fallback){
  const g=(_shellConfig&&_shellConfig.general)||{};
  const suffix=key.replace(/^produccion/,'Produccion');
  return Number(g['iconSize'+suffix])||fallback||18;
}

async function abrirOrdenDesdeBusqueda(orderCode,processKey){
  const proc=processKey||activeProc;
  if(!proc)return;
  if(!PROCS.find(p=>p.id===proc)){
    showToast('Esta orden está en un proceso que no se maneja en esta pantalla.');
    return;
  }
  if(proc!==activeProc)selProc(proc);
  let o=makeOrders(proc,null).find(x=>x.id===orderCode);
  if(!o){
    // No está en la cola activa (ya completó este proceso, o está esperando un
    // paso anterior) — se trae su detalle directo y se agrega a la lista en
    // memoria para poder abrir su ventana igual que cualquier otra orden.
    try{
      const res=await fetch(`/api/produccion/orden-proceso/${encodeURIComponent(orderCode)}/${encodeURIComponent(proc)}`,{headers:sessionHeader()});
      const payload=await res.json().catch(()=>({}));
      if(!res.ok||!payload.ok||!payload.route)throw new Error(payload.error||'No se pudo abrir esa orden.');
      productionRoutes=productionRoutes.filter(r=>!(r.orderCode===orderCode&&r.processKey===proc));
      productionRoutes.push(payload.route);
      o=makeOrders(proc,null).find(x=>x.id===orderCode);
    }catch(e){
      showToast(e.message);
      return;
    }
  }
  if(!o)return;
  clearProdSearch(false);
  if(o.machineName&&o.machineName!==activeMach){
    activeMach=o.machineName;
    const pd=PROCS.find(p=>p.id===proc);
    if(pd&&pd.machines&&pd.machines.includes(o.machineName)){
      document.getElementById('machBar').style.display='flex';
      document.getElementById('machBtns').innerHTML=pd.machines.map((m,i)=>
        `<button class="mb${m===o.machineName?' act':''}" onclick="selMach('${m.replace(/'/g,"\\'")}',this)">${m}</button>`
      ).join('');
    }
    renderQueue();
  }
  openOrderModal(orderCode,null);
}

const HIST_ORDEN_ESTADO={
  EN_MARCHA:{lbl:'En proceso',cls:'st-run'},
  EN_PARO:{lbl:'Pausada',cls:'st-paro'},
  COMPLETADO:{lbl:'Completada',cls:'st-done'},
  PENDIENTE:{lbl:'Pendiente',cls:'st-pend'},
  DETENIDA:{lbl:'Detenida',cls:'st-det'},

// Arrastrar la ventana por el encabezado (posición fija mientras esté abierta).
(function(){
  document.addEventListener('DOMContentLoaded',()=>{
    const ov=document.getElementById('overlayVerOrden');
    const panel=ov&&ov.querySelector('.vo-panel');
    const hdr=ov&&ov.querySelector('.vo-hdr');
    if(!ov||!panel||!hdr)return;
    let sx=0,sy=0,px=0,py=0,arrastrando=false;
    hdr.addEventListener('pointerdown',(e)=>{
      if(e.target.closest('button'))return;
      arrastrando=true;
      const r=panel.getBoundingClientRect();
      panel.style.right='auto';panel.style.bottom='auto';
      panel.style.left=r.left+'px';panel.style.top=r.top+'px';
      panel.style.width=r.width+'px';panel.style.height=r.height+'px';
      sx=e.clientX;sy=e.clientY;px=r.left;py=r.top;
      hdr.setPointerCapture(e.pointerId);
    });
    hdr.addEventListener('pointermove',(e)=>{
      if(!arrastrando)return;
      panel.style.left=Math.max(0,px+e.clientX-sx)+'px';
      panel.style.top=Math.max(0,py+e.clientY-sy)+'px';
    });
    hdr.addEventListener('pointerup',()=>{arrastrando=false;});
    hdr.addEventListener('pointercancel',()=>{arrastrando=false;});
  });
})();
async function loadHistorial(){
  const el=document.getElementById('historialList');
  if(!el)return;
  try{
    const params=new URLSearchParams();
    if(_historialQ.trim())params.set('q',_historialQ.trim());
    params.set('limit','150');
    const res=await fetch('/api/mes/historial-ordenes?'+params.toString(),{headers:sessionHeader()});
    const payload=await res.json().catch(()=>({}));
    if(!res.ok||!payload.ok)throw new Error(payload.error||'No se pudo cargar el historial.');
    renderHistorialOrdenesList(payload.orders||[]);
  }catch(e){
    el.innerHTML=`<div class="qd-empty">${e.message}</div>`;
  }
}
function renderHistorialOrdenesList(orders){
  const el=document.getElementById('historialList');
  if(!el)return;
  if(!orders.length){el.innerHTML='<div class="qd-empty">Sin órdenes trabajadas todavía.</div>';return;}
  el.innerHTML=orders.map((o)=>{
    const st=HIST_ORDEN_ESTADO[o.estado]||{lbl:o.estado||'—',cls:'st-pend'};
    const lapso=o.startedAt
      ? (o.endedAt?`${fmtTs(new Date(o.startedAt))} → ${fmtTs(new Date(o.endedAt))}`:`Desde ${fmtTs(new Date(o.startedAt))}`)
      : 'Sin trabajar aún';
    const duracion=`${o.endedAt?'Duró':'Lleva'} ${fmtDuration(o.durationMinutes)}`;
    const meta=[
      o.quantity!=null?`Cantidad: ${Number(o.quantity).toLocaleString('es-GT')}`:'',
      duracion
    ].filter(Boolean).join(' · ');
    // Chip de estado: si la orden sigue en proceso, el chip dice EN QUÉ proceso está (con el
    // color de ese proceso, formato hist-proc); solo dice "Completada" cuando Empaque terminó.
    let chipHtml;
    if(o.enProceso&&o.currentProcess){
      const clave=Object.entries(HIST_PROC_LABEL).find(([,lbl])=>lbl===o.currentProcess)?.[0]||'';
      const color=HIST_PROC_COLOR[clave]||'#0b81b8';
      chipHtml=`<span class="busq-status st-proc" style="--hp:${color}">${dzEsc(o.currentProcess)}</span>`;
    }else{
      chipHtml=`<span class="busq-status ${st.cls}">${st.lbl}</span>`;
    }
    const acabados=(o.acabados||[]).map(a=>`<span class="hist-orden-acabado">${dzEsc(a)}</span>`).join('');
    return `<div class="hist-orden-card" onclick="abrirHistorialOrdenDetalle('${o.orderCode.replace(/'/g,"\\'")}','${dzEsc(o.orderCode)}')">
      <div class="hist-orden-hdr">
        <span class="historial-orden">${dzEsc(o.orderCode)}</span>
        <span class="hist-orden-name">${dzEsc(o.productName)}</span>
        ${chipHtml}
      </div>
      ${o.customerName?`<div class="busq-item-customer">${dzEsc(o.customerName)}</div>`:''}
      <div class="hist-orden-foot">
        ${meta?`<span class="busq-item-meta">${meta}</span>`:''}
        <span class="hist-orden-fechalapso">${lapso}</span>
        <button class="hist-orden-ver" title="Ver orden" onclick="event.stopPropagation();abrirVerOrdenProduccion('${o.orderCode.replace(/'/g,"\\'")}')">${shellIconSpanHtml('produccionVerOrden','↗','Ver orden')}</button>
      </div>
      ${acabados?`<div class="hist-orden-acabados">${acabados}</div>`:''}
    </div>`;
  }).join('');
}
async function abrirHistorialOrdenDetalle(orderCode,orderCodeDisplay){
  showModal3(`<div class="hist-modal-hdr"><h3>Eventos — <span class="historial-orden">${orderCodeDisplay}</span></h3><button class="modal-close-x" onclick="closeModal3()" aria-label="Cerrar">✕</button></div>
    <div id="historialDetalleList" class="historial-list"><div class="qd-empty">Cargando…</div></div>`);
  document.getElementById('modalBox3').classList.add('modal-historial');
  const el=document.getElementById('historialDetalleList');
  try{
    const params=new URLSearchParams({orderCode,limit:'200'});
    const res=await fetch('/api/mes/historial?'+params.toString(),{headers:sessionHeader()});
    const payload=await res.json().catch(()=>({}));
    if(!res.ok||!payload.ok)throw new Error(payload.error||'No se pudo cargar el detalle.');
    renderHistorialList(payload.data||[],'historialDetalleList');
  }catch(e){
    el.innerHTML=`<div class="qd-empty">${e.message}</div>`;
  }
}
const HIST_PROC_COLOR={diseno:'#a855f7',preprensa:'#6366f1',visto_bueno:'#0ea5e9',tintas:'#06b6d4',impresion:'#f59e0b',rebobinado:'#14b8a6',empaque:'#84cc16',acabados:'#ec4899',merma:'#ef4444',troquelado:'#78716c',sellos:'#8b5cf6',barnizado:'#eab308',laminado:'#0284c7',estampado:'#db2777',programacion:'#3b82f6',identificacion:'#10b981'};
const HIST_PROC_LABEL={diseno:'Diseño',preprensa:'Preprensa',visto_bueno:'Aprobaciones',tintas:'Tintas',impresion:'Impresión',rebobinado:'Rebobinado',empaque:'Empaque',acabados:'Acabados',merma:'Merma',troquelado:'Troquelado',sellos:'Sellos',barnizado:'Barniz',laminado:'Laminado',estampado:'Estampado',programacion:'Planeación',identificacion:'Identificación'};
// La clave normalizada (diseno, preprensa...) es la que trae color — el nombre bonito
// (con tildes, "Aprobaciones" en vez de "Visto Bueno", etc.) se resuelve aparte para
// que un evento y un cambio de valor del mismo proceso salgan pintados igual.
function histProcBadge(clave,etiquetaAlterna){
  const k=String(clave||'').toLowerCase();
  const c=HIST_PROC_COLOR[k]||'#64748b';
  const lbl=HIST_PROC_LABEL[k]||etiquetaAlterna||k;
  if(!lbl)return'';
  return `<span class="hist-proc" style="--hp:${c}">${dzEsc(lbl)}</span>`;
}
function histProcDotColor(clave){
  const k=String(clave||'').toLowerCase();
  return HIST_PROC_COLOR[k]||'#64748b';
}
function histDayLabel(d){
  const s=d.toLocaleDateString('es-CR',{weekday:'long',day:'numeric',month:'long'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
// Pinta la línea de tiempo de eventos de UNA orden: agrupada por día y en orden
// cronológico (lo primero que pasó arriba, lo más reciente abajo) para que se lea
// como la historia de la orden y no como un tiradero de renglones sueltos.
function renderHistorialList(rows,targetId){
  const el=document.getElementById(targetId||'historialList');
  if(!el)return;
  if(!rows.length){el.innerHTML='<div class="qd-empty">Sin resultados.</div>';return;}
  const norm=v=>String(v==null?'':v).trim();
  const ordenados=[...rows].sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  let diaActual='';
  const html=[];
  ordenados.forEach((r)=>{
    const fechaObj=new Date(r.fecha);
    const diaKey=fechaObj.toDateString();
    if(diaKey!==diaActual){
      diaActual=diaKey;
      html.push(`<div class="hist-tl-day">${histDayLabel(fechaObj)}</div>`);
    }
    const hora=fmtH(fechaObj);
    if(r.tipo==='evento'){
      const desp=[];
      if(r.desperdicioMetros)desp.push(`${r.desperdicioMetros} m`);
      if(r.desperdicioKg)desp.push(`${r.desperdicioKg} kg`);
      const claveProc=r.claveProceso||r.proceso;
      const metaPartes=[r.operador?dzEsc(r.operador):'',r.notas?dzEsc(r.notas):'',desp.length?`Desperdicio ${desp.join(' / ')}`:''].filter(Boolean);
      html.push(`<div class="hist-tl-item">
        <span class="hist-tl-dot" style="--hp:${histProcDotColor(claveProc)}"></span>
        <div class="hist-tl-hdr">${histProcBadge(claveProc,r.proceso)}<span class="hist-tl-time">${hora}</span></div>
        <div class="hist-tl-body">${dzEsc(r.evento||'')}</div>
        ${metaPartes.length?`<div class="hist-tl-meta">${metaPartes.join(' · ')}</div>`:''}
      </div>`);
      return;
    }
    const cot=norm(r.valorCotizado), nuevo=norm(r.valorNuevo), unidad=r.unidad?' '+dzEsc(r.unidad):'';
    const dif=(cot!==''&&nuevo!==''&&cot!==nuevo)
      ? `<span class="hist-dif">≠ cotizado ${dzEsc(cot)}${unidad}</span>`
      : (cot!==''&&nuevo!==''&&cot===nuevo ? `<span class="hist-eq">= cotizado</span>` : '');
    const metaPartes=[r.operador?dzEsc(r.operador):'',r.justificacion?`“${dzEsc(r.justificacion)}”`:''].filter(Boolean);
    html.push(`<div class="hist-tl-item">
      <span class="hist-tl-dot" style="--hp:${histProcDotColor(r.proceso)}"></span>
      <div class="hist-tl-hdr">${histProcBadge(r.proceso)}<span class="hist-tl-time">${hora}</span></div>
      <div class="hist-tl-body"><b>${dzEsc(r.etiqueta||r.campo)}</b>: ${dzEsc(norm(r.valorAnterior))} → ${dzEsc(nuevo)}${unidad} ${dif}</div>
      ${metaPartes.length?`<div class="hist-tl-meta">${metaPartes.join(' · ')}</div>`:''}
    </div>`);
  });
  el.innerHTML=html.join('');
}

// ════════════════════════════════════════════
// SINCRONÍA DE ARRASTRE — dibujo ↔ tarjetas de estación (Panel MES de Impresión)
// Los dos paneles tienen anchos totales muy distintos (el dibujo es mucho más ancho que la fila
// de tarjetas), así que la sincronía es proporcional (mismo % de scroll), no pixel a pixel —
// es lo más parejo posible dado el tamaño. Delegado en document porque el modal se re-renderiza
// completo en cada refresco (los listeners puestos directo en los paneles se perderían).
// ════════════════════════════════════════════
let _mesDragEl=null,_mesDragStartX=0,_mesDragStartScroll=0;
document.addEventListener('mousedown',(e)=>{
  if(e.button!==0)return;
  const el=e.target.closest('.mes-svg-wrap,.mes-stations-row');
  if(!el||e.target.closest('select,input,button,a,textarea'))return;
  _mesDragEl=el;_mesDragStartX=e.clientX;_mesDragStartScroll=el.scrollLeft;
  el.classList.add('mes-dragging');
});
document.addEventListener('mousemove',(e)=>{
  if(!_mesDragEl)return;
  _mesDragEl.scrollLeft=_mesDragStartScroll-(e.clientX-_mesDragStartX);
});
document.addEventListener('mouseup',()=>{
  if(_mesDragEl)_mesDragEl.classList.remove('mes-dragging');
  _mesDragEl=null;
});
let _mesSyncingScroll=false;
function _mesSyncScroll(from,to){
  if(!to)return;
  const fromMax=from.scrollWidth-from.clientWidth;
  const toMax=to.scrollWidth-to.clientWidth;
  if(fromMax<=0||toMax<=0)return;
  _mesSyncingScroll=true;
  to.scrollLeft=(from.scrollLeft/fromMax)*toMax;
  _mesSyncingScroll=false;
}
document.addEventListener('scroll',(e)=>{
  const el=e.target;
  if(!el||!el.classList||_mesSyncingScroll)return;
  const panel=el.closest?.('.mes-panel');
  if(!panel)return;
  if(el.classList.contains('mes-svg-wrap'))_mesSyncScroll(el,panel.querySelector('.mes-stations-row'));
  else if(el.classList.contains('mes-stations-row'))_mesSyncScroll(el,panel.querySelector('.mes-svg-wrap'));
},true);

syncOperatorName();
loadDevolConfig();
loadProductionFlow().catch(e=>showToast(e.message)).finally(()=>{renderProcs();if(activeProc)renderQueue();});
refreshAprobPendientesBadge();
renderClock();
setInterval(renderClock,1000);
setInterval(()=>{
  document.querySelectorAll('.live-seconds').forEach(el=>{
    const start=Number(el.dataset.start||0);
    if(!start)return;
    const sec=Math.max(0,Math.floor((Date.now()-start)/1000));
    const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
    el.textContent=h>0?`${h}:${pad2(m)}:${pad2(s)}`:`${m}:${pad2(s)}`;
  });
  document.querySelectorAll('.dz-clock.run[data-start]').forEach(el=>{
    const start=Number(el.dataset.start||0);
    if(start)el.textContent=dzHMS(Date.now()-start);
  });
  // Reloj en vivo del proceso de visto bueno (Bloque F).
  document.querySelectorAll('.dz-clock[data-vb-start]').forEach(el=>{
    const start=Number(el.dataset.vbStart||0), acc=Number(el.dataset.vbAcc||0);
    if(start)el.textContent=dzHMS(acc*1000+(Date.now()-start));
  });
  // Relojes en vivo de la lista "pendientes por recuperar del cliente" (Bloque F).
  document.querySelectorAll('.aprob-wait[data-since]').forEach(el=>{
    const since=Number(el.dataset.since||0);
    if(!since)return;
    el.textContent=fmtEspera(since);
    const card=el.closest('.aprob-card');
    if(card){const n=nivelEspera(since);if(!card.classList.contains('lvl-'+n)){card.classList.remove('lvl-ok','lvl-warn','lvl-alarm');card.classList.add('lvl-'+n);}}
  });
},1000);
// Refresh queue every 15s to update countdown rings y timeline; refresca el modal abierto cada minuto (no cada segundo)
setInterval(()=>{loadProductionFlow().catch(()=>{}).finally(()=>{renderProcs();if(activeProc)renderQueue();});},15000);
setInterval(refreshAprobPendientesBadge,60000);
setInterval(()=>{
  const box=document.getElementById('modalBox');
  const oid=box.classList.contains('modal-order')?box.querySelector('.modal-order-id')?.textContent.trim():null;
  if(oid)refreshOrderModal(oid);
},60000);
</script>
