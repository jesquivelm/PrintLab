<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
    <script src="/desplegable.js?v=20260924-desplegable-v5"></script>
<script src="/access-control.js?v=20260923-mensajes-carga"></script>
<title>MES Flexografía — Cola del Operador</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--bg4:#22272e;
  --border:#30363d;--border2:#444c56;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --blue:#58a6ff;--blue-bg:#0d2137;--blue-border:#1f6feb;
  --green:#3fb950;--green-bg:#0a1f0e;--green-border:#238636;
  --amber:#d29922;--amber-bg:#1f1800;--amber-border:#9e6a03;
  --red:#f85149;--red-bg:#1f0c0c;--red-border:#b62324;
  --purple:#a371f7;--purple-bg:#1a0f2e;--purple-border:#6e40c9;
  --cyan:#39d0d8;--cyan-bg:#041f24;
  --gallus-bg:#0e1016;--gallus-paper:#dedede;
  --varnish:#e0b84b;--varnish-bg:#241f0c;--varnish-border:#8a7220;
  --font-mono:'JetBrains Mono',monospace;
  --font-sans:'DM Sans',sans-serif;
}
html[data-theme="light"]{
  --bg:#f5f7fb;--bg2:#ffffff;--bg3:#eef2f7;--bg4:#dde5ef;
  --border:#d5dde8;--border2:#aebccd;
  --text:#17212f;--text2:#526070;--text3:#788596;
  --blue:#0b81b8;--blue-bg:#e6f4fb;--blue-border:#8ed1ee;
  --green:#16823b;--green-bg:#e7f7ec;--green-border:#83d39a;
  --amber:#a16207;--amber-bg:#fff5d9;--amber-border:#dfb75a;
  --red:#c4322b;--red-bg:#ffe9e8;--red-border:#ee8d88;
  --purple:#6d42c7;--purple-bg:#f0eafd;--purple-border:#bca9ef;
  --cyan:#0f8792;--cyan-bg:#e4f8fb;
  --gallus-bg:#eef1f5;--gallus-paper:#7c8698;
  --varnish:#a1780f;--varnish-bg:#fdf3d9;--varnish-border:#d4ac4a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;min-height:100vh}
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.tb-left{display:flex;align-items:center;gap:14px}
.tb-clock-wrap{margin:0;padding:6px 12px;gap:12px}
.tb-clock-wrap .dz-clock{font-size:25px;padding:3px 10px}
.tb-clock-wrap .dz-clock-side{gap:3px}
.date-lbl{font-size:16px;color:var(--text2)}
.shift-badge{font-family:var(--font-mono);font-size:16px;font-weight:700;padding:4px 12px;border-radius:3px;letter-spacing:.08em}
.sn{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}
.sd{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.se{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.fmt-toggle{font-family:var(--font-mono);font-size:16px;padding:3px 10px;border-radius:3px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;transition:.15s}
.fmt-toggle:hover{color:var(--text);border-color:var(--blue)}
.tb-right{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--text2);white-space:nowrap;position:relative}
.operator-name{color:var(--text);font-weight:500}
.theme-hdr-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:transparent;border:none;cursor:pointer}
html[data-theme="dark"] .theme-hdr-btn .theme-icon-sun{display:inline-block}
html[data-theme="dark"] .theme-hdr-btn .theme-icon-moon{display:none}
html[data-theme="light"] .theme-hdr-btn .theme-icon-moon{display:inline-block}
html[data-theme="light"] .theme-hdr-btn .theme-icon-sun{display:none}
.proc-strip{display:flex;gap:25px;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.pb{font-family:var(--font-mono);font-size:16px;padding:6px 14px;border-radius:3px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;position:relative;white-space:nowrap;transition:.12s;letter-spacing:.02em}
.pb:hover{border-color:var(--border2);color:var(--text)}
.pb.act{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue)}
.pbadge{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;font-size:16px;font-weight:700;border-radius:999px;min-width:22px;height:22px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
.prod-search-wrap{position:absolute;top:calc(100% + 8px);right:0;display:none;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.24);padding:8px;z-index:250}
.prod-search-wrap.open{display:flex}
.prod-search{width:min(320px,80vw);height:34px;padding:0 30px 0 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:14px;font-family:inherit;outline:none}
.prod-search::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.prod-search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(17,143,198,.15)}
.prod-search-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:0;background:transparent;color:var(--text3);font-size:15px;line-height:1;cursor:pointer;border-radius:50%;align-items:center;justify-content:center}
.prod-search-clear:hover{color:var(--text);background:var(--bg2)}
.prod-search-hint{padding:6px 20px;font-size:14px;color:var(--text3);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-shrink:0}
.prod-search-hint b{color:var(--text2)}
.mbar{display:flex;align-items:center;gap:8px;padding:6px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0}
.mlbl{font-family:var(--font-mono);font-size:13px;color:var(--text3);letter-spacing:.08em}
.mb{font-family:var(--font-mono);font-size:13px;padding:3px 12px;border-radius:3px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;transition:.12s}
.mb:hover{border-color:var(--border2);color:var(--text)}
.mb.act{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.queue{flex:1;overflow-y:auto;padding:12px 20px}
.day-sep{display:flex;align-items:center;gap:10px;margin:20px 0 12px}
.day-sep::before,.day-sep::after{content:'';flex:1;height:1px;background:var(--border)}
.day-sep-tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:.05em;white-space:nowrap;padding:6px 16px;border-radius:999px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2)}
.day-sep-tag.today{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue)}
.ocard{border:1px solid var(--border);border-radius:6px;background:var(--bg2);margin-bottom:6px;overflow:hidden;transition:border-color .15s}
.ocard:hover{border-color:var(--border2)}
.ocard.bl-blue{border-left:3px solid var(--blue)}
.ocard.bl-green{border-left:3px solid var(--green)}
.ocard.bl-amber{border-left:3px solid var(--amber)}
.ocard.bl-red{border-left:3px solid var(--red)}
.ocard.bl-gray{border-left:3px solid var(--text3)}
.ohead{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none}
.oid{font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--blue);min-width:84px}
.ohead-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ohead-top{display:flex;align-items:center;gap:10px;min-width:0}
.ohead-customer{font-size:18px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oname{font-size:18px;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otime{font-family:var(--font-mono);font-size:16px;color:var(--text2);white-space:nowrap}
.delay-chip{font-family:var(--font-mono);font-size:16px;padding:3px 9px;border-radius:3px;white-space:nowrap}
.delay-chip.late{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.delay-chip.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.delay-chip.inprog{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.delay-chip.paused{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.delay-chip.suspendida{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);font-weight:700}
.delay-chip.done{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.delay-chip.pending{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.chev{font-size:13px;color:var(--text3);flex-shrink:0;transition:transform .15s}
.chev.open{transform:rotate(180deg)}
.odetail{display:none;border-top:1px solid var(--border);padding:12px 14px}
.odetail.open{display:block}

/* ── TIMELINE MEJORADO ── */
.timeline-wrap{margin-bottom:14px}
.tl-label{font-family:var(--font-mono);font-size:13px;color:var(--text3);letter-spacing:.08em;margin-bottom:7px;display:flex;justify-content:space-between}
.tl-bar{height:12px;border-radius:3px;background:var(--bg3);border:1px solid var(--border);overflow:hidden;position:relative}
.tl-planned{position:absolute;top:0;left:0;height:100%;background:var(--border2);border-radius:3px}
.tl-real{position:absolute;top:0;left:0;height:100%;background:var(--blue);border-radius:3px;transition:width .5s}
.tl-real.late{background:var(--red)}
.tl-real.done{background:var(--green)}
/* Marcador de "ahora" en la barra */
.tl-now-marker{position:absolute;top:-2px;width:2px;height:calc(100%+4px);background:var(--amber);border-radius:1px;transition:left .5s;z-index:2}
.tl-legend{display:flex;gap:14px;margin-top:6px;font-family:var(--font-mono);font-size:13px;color:var(--text3)}
.tl-legend span{display:flex;align-items:center;gap:5px}
.dot-plan{width:9px;height:9px;border-radius:2px;background:var(--border2)}
.dot-real{width:9px;height:9px;border-radius:2px;background:var(--blue)}
.dot-late{width:9px;height:9px;border-radius:2px;background:var(--red)}

/* ── ORDEN ACTIVA (fijada arriba) ── */
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.25}}
.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:7px;animation:pulse-dot 1.1s ease-in-out infinite;flex-shrink:0;box-shadow:0 0 6px var(--green)}
.pinned-active-sec{margin-bottom:16px}
.pinned-active-hdr{display:flex;align-items:center;font-family:var(--font-mono);font-size:13px;color:var(--green);margin-bottom:8px;letter-spacing:.05em;text-transform:none}
.ocard.is-active-pinned{border:1px solid var(--green-border);box-shadow:0 0 0 1px var(--green-border) inset}
.live-seconds{font-family:var(--font-mono);font-size:13px;color:var(--green);white-space:nowrap;font-weight:700}
/* Bloque F — lista "pendientes por recuperar del cliente" */
.aprob-pendientes-hdr{font-family:var(--font-mono);font-size:12px;color:var(--text3);letter-spacing:.04em;margin-bottom:10px}
.aprob-card{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-left:3px solid var(--text3);border-radius:6px;background:var(--bg2);padding:10px 12px;margin-bottom:6px;transition:.15s}
.aprob-card:hover{border-color:var(--border2)}
.aprob-card-main{flex:1;min-width:0;cursor:pointer}
.aprob-card-top{display:flex;align-items:baseline;gap:8px}
.aprob-card-top .oid{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--blue)}
.aprob-cliente{font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aprob-card-sub{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aprob-card-time{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0}
.aprob-wait{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--text2);font-variant-numeric:tabular-nums}
.aprob-wait-lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.aprob-recibir{flex-shrink:0;font-size:12px;padding:6px 12px}
.aprob-card.lvl-warn{border-left-color:var(--amber);background:var(--amber-bg)}
.aprob-card.lvl-warn .aprob-wait{color:var(--amber)}
.aprob-card.lvl-alarm{border-left-color:var(--red);background:var(--red-bg)}
.aprob-card.lvl-alarm .aprob-wait{color:var(--red)}
.aprob-card.lvl-alarm{animation:aprobPulse 1.6s ease-in-out infinite}
@keyframes aprobPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 0 3px rgba(239,68,68,.18)}}
.aprob-icon-btn{position:relative}
.aprob-badge{position:absolute;top:-2px;right:-4px;min-width:16px;height:16px;padding:0 3px;border-radius:999px;background:var(--red,#ef4444);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;font-family:var(--font-mono)}
/* Devoluciones de proceso — banda de urgencias y nota en el modal de pausa */
.devol-band{margin-bottom:12px}
.devol-band-hdr{display:flex;align-items:center;font-family:var(--font-mono);font-size:13px;color:var(--red,#A32D2D);margin-bottom:8px;letter-spacing:.04em}
.devol-card{border:1px solid var(--border);border-left:3px solid var(--red,#A32D2D);border-radius:6px;background:var(--red-bg,var(--bg2));padding:10px 12px;margin-bottom:6px}
.devol-card.lvl-warn{border-left-color:var(--amber)}
.devol-card.lvl-alarm{border-left-color:var(--red);animation:aprobPulse 1.6s ease-in-out infinite}
.devol-card-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.devol-card-order{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--blue)}
.devol-card-wait{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--text2);font-variant-numeric:tabular-nums}
.devol-card-job{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.devol-card-motivo{font-size:12px;color:var(--text);margin-top:6px}
.devol-card-note{font-size:12px;color:var(--text2);margin-top:4px;padding:6px 8px;background:var(--bg3);border-radius:4px}
.devol-card-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.devol-act{font-size:12px;padding:5px 10px;border-radius:4px;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;transition:.12s}
.devol-act:hover{border-color:var(--border2)}
.devol-act-accept{border-color:var(--blue);color:var(--blue)}
.devol-act-back{border-color:var(--amber);color:var(--amber)}
.devol-act-done{border-color:var(--green);color:var(--green)}
.devol-note{margin:10px 0;padding:9px 11px;border-radius:6px;background:var(--amber-bg,#fff5e6);border:1px solid var(--amber);font-size:12px;color:var(--text);line-height:1.5}
.devol-detail-line{font-size:12px;color:var(--text2);margin-top:6px}
.devol-detail-tbl{width:100%;border-collapse:collapse;font-size:12px}
.devol-detail-tbl th,.devol-detail-tbl td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
.devol-detail-tbl th{color:var(--text3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.devol-detail-scroll{scrollbar-width:thin;scrollbar-color:rgba(11,129,184,0.42) transparent}
.devol-detail-scroll::-webkit-scrollbar{width:8px;height:8px}
.devol-detail-scroll::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(11,129,184,0.38)}
.devol-detail-scroll::-webkit-scrollbar-track{background:transparent}
/* Bloque F — modal "registrar cambios del cliente" con lista de cambios */
.cc-row{display:flex;gap:6px;align-items:flex-start;margin-bottom:8px}
.cc-row .cc-cat{width:150px;flex-shrink:0;margin-bottom:0}
.cc-row .cc-desc{flex:1;margin-bottom:0;min-height:44px}
.cc-row .cc-del{flex-shrink:0;border:1px solid var(--border);background:var(--bg2);color:var(--text3);border-radius:4px;width:28px;height:28px;cursor:pointer;font-size:12px}
.cc-row .cc-del:hover{color:var(--red);border-color:var(--red-border)}
.cc-banner{background:var(--red-bg,rgba(239,68,68,.1));border:1px solid var(--red-border,rgba(239,68,68,.35));border-left:4px solid var(--red,#ef4444);border-radius:6px;padding:10px 14px;margin-bottom:14px}
.cc-banner-hdr{font-size:13px;font-weight:700;color:var(--red,#ef4444);margin-bottom:4px}
.cc-banner-list{margin:0;padding-left:20px;font-size:13px;color:var(--text2)}
.cc-banner-list li{margin:2px 0}
.cc-banner-list b{color:var(--text)}
.active-warning-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--amber)}
.emp-alert{background:var(--red-bg,rgba(239,68,68,.1));border:1px solid var(--red-border,rgba(239,68,68,.35));border-left:4px solid var(--red,#ef4444);border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--red,#ef4444)}
.active-warning-link{font-family:var(--font-mono);font-size:13px;color:var(--blue);background:var(--blue-bg);border:1px solid var(--blue-border);padding:6px 14px;border-radius:3px;cursor:pointer;white-space:nowrap}
.active-warning-link:hover{background:var(--blue-border);color:#fff}

/* ── COUNTDOWN RING ── */
.countdown-wrap{display:flex;align-items:center;gap:18px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:12px}
.countdown-ring-svg{flex-shrink:0}
.countdown-ring-track{fill:none;stroke:var(--bg4);stroke-width:8}
.countdown-ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s ease,stroke .5s;transform:rotate(-90deg);transform-origin:center}
.countdown-info{flex:1}
.countdown-label{font-family:var(--font-mono);font-size:13px;color:var(--text3);letter-spacing:.1em;margin-bottom:3px}
.countdown-time-display{font-family:var(--font-mono);font-size:28px;font-weight:700;letter-spacing:.04em;line-height:1}
.countdown-sub{font-family:var(--font-mono);font-size:13px;margin-top:6px;padding:3px 9px;border-radius:3px;display:inline-block}
.countdown-sub.green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.countdown-sub.red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.countdown-sub.amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.countdown-elapsed{flex-shrink:0;padding:0 18px;border-left:1px solid var(--border);border-right:1px solid var(--border);text-align:center}
.countdown-elapsed-label{font-family:var(--font-mono);font-size:13px;color:var(--text3);letter-spacing:.1em;margin-bottom:3px}
.countdown-elapsed-value{font-family:var(--font-mono);font-size:26px;font-weight:700;letter-spacing:.03em;line-height:1;color:var(--text)}
.countdown-elapsed-est{font-family:var(--font-mono);font-size:13px;color:var(--text3);margin-top:6px}

.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;background:var(--bg3);border:1px solid var(--border);border-top:1px solid var(--border2);border-radius:0 0 6px 6px;padding:12px 16px}
.dgrid.standalone{border-radius:6px;border-top:1px solid var(--border)}
.di-lbl{font-family:var(--font-mono);font-size:13px;color:var(--text3);letter-spacing:.08em;margin-bottom:3px}
.di-val{font-size:15px;color:var(--text);font-weight:600}
.mat-sec{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:10px;margin-bottom:10px}
.mat-hdr{font-family:var(--font-mono);font-size:13px;color:var(--text3);letter-spacing:.08em;margin-bottom:8px}
.mat-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.mat-id{font-family:var(--font-mono);font-size:13px;color:var(--cyan);min-width:100px}
.mat-name{font-size:13px;color:var(--text2);flex:1}
.mat-qty{font-family:var(--font-mono);font-size:13px;color:var(--text);min-width:60px;text-align:right}
.sap-btn{font-family:var(--font-mono);font-size:13px;padding:3px 10px;border-radius:3px;border:1px solid var(--blue-border);background:var(--blue-bg);color:var(--blue);cursor:pointer;transition:.15s;white-space:nowrap}
.sap-btn:hover{background:var(--blue-border);color:#fff}
.sap-btn.sent{border-color:var(--green-border);background:var(--green-bg);color:var(--green);cursor:default}
.act-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@keyframes btn-spin{to{transform:rotate(360deg)}}
.btn-spinner{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:btn-spin .6s linear infinite;margin-right:7px;vertical-align:-1.5px}
.is-loading{opacity:.72;cursor:wait!important;pointer-events:none}
.btn-ini{font-family:var(--font-mono);font-size:13px;padding:8px 18px;border-radius:3px;border:1px solid var(--green-border);background:var(--green-bg);color:var(--green);cursor:pointer;transition:.15s}
.btn-ini:hover{background:var(--green-border);color:#fff}
.btn-done{font-family:var(--font-mono);font-size:13px;padding:8px 18px;border-radius:3px;border:1px solid var(--blue-border);background:var(--blue-bg);color:var(--blue);cursor:pointer;transition:.15s}
.btn-done:hover{background:var(--blue-border);color:#fff}
.btn-pau{font-family:var(--font-mono);font-size:13px;padding:8px 18px;border-radius:3px;border:1px solid var(--amber-border);background:var(--amber-bg);color:var(--amber);cursor:pointer;transition:.15s}
.btn-pau:hover{background:var(--amber-border);color:#fff}
.fase-row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.fase-lbl{font-family:var(--font-mono);font-size:12px;color:var(--text3);letter-spacing:.06em;align-self:center;margin-right:2px}
.fase-btn{font-family:var(--font-mono);font-size:12px;padding:6px 12px;border-radius:3px;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:.12s}
.fase-btn.fase-run{border-color:var(--amber-border);background:var(--amber-bg);color:var(--amber)}
.fase-btn.fase-done{border-color:var(--green-border);background:var(--green-bg);color:var(--green);cursor:default}
.fase-btn.fase-todo:hover{border-color:var(--text2);color:var(--text)}
.btn-log{font-family:var(--font-mono);font-size:13px;padding:8px 14px;border-radius:3px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;transition:.15s;margin-left:auto}
.btn-log:hover{color:var(--text);border-color:var(--text2)}
.btn-mes{font-family:var(--font-mono);font-size:13px;padding:8px 14px;border-radius:3px;border:1px solid var(--purple-border);background:var(--purple-bg);color:var(--purple);cursor:pointer;transition:.15s}
.btn-mes:hover{background:var(--purple-border);color:#fff}
/* Botón solicitud materia prima */
.btn-mp{font-family:var(--font-mono);font-size:13px;padding:6px 12px;border-radius:3px;border:1px solid var(--cyan-bg);border-color:#0e7490;background:var(--cyan-bg);color:var(--cyan);cursor:pointer;transition:.15s}
.btn-mp:hover{background:#0e7490;color:#fff}
.pause-timer{font-family:var(--font-mono);font-size:13px;color:var(--amber);letter-spacing:.04em}
.evlog{margin-top:10px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:10px;max-height:150px;overflow-y:auto}
.evlog-hdr{font-family:var(--font-mono);font-size:13px;color:var(--text3);letter-spacing:.08em;margin-bottom:6px}
.ev-row{display:flex;gap:14px;padding:6px 0;border-bottom:1px solid var(--border);font-size:16px}
.ev-row:last-child{border-bottom:none}
.ev-time{font-family:var(--font-mono);color:var(--text3);min-width:48px;flex-shrink:0}
.ev-icon{width:20px;flex-shrink:0;text-align:center}
.ev-msg{color:var(--text2)}
/* ── Historial general (lista de órdenes + detalle de eventos por orden) ── */
.modal.modal-historial{width:940px}
/* ── Modal "Nueva Fórmula de Tinta" embebido en Tintas de Producción ── */
.modal.modal-formula{width:900px}
.pf-ing-row{display:grid;grid-template-columns:1fr 90px 60px 60px 30px;gap:6px;align-items:center;margin-bottom:6px}
.hist-modal-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.hist-modal-hdr h3{margin:0}
.hist-orden-card{padding:12px 10px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:6px}
.hist-orden-card:last-child{border-bottom:none}
.hist-orden-card:hover{background:var(--bg3)}
.hist-orden-hdr{display:flex;align-items:center;gap:8px}
.hist-orden-name{font-size:16px;color:var(--text);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Chip de estado de la orden en el Historial — formato vivo con el color del proceso actual */
.hist-orden-card .busq-status{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.hist-orden-card .busq-status.st-proc{color:var(--hp,#0b81b8);background:color-mix(in srgb,var(--hp,#0b81b8) 15%,transparent);border:1px solid color-mix(in srgb,var(--hp,#0b81b8) 45%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--hp,#0b81b8) 35%,transparent);animation:histProcPulse 2.4s ease-in-out infinite}
@keyframes histProcPulse{0%,100%{box-shadow:0 0 6px color-mix(in srgb,var(--hp,#0b81b8) 25%,transparent)}50%{box-shadow:0 0 14px color-mix(in srgb,var(--hp,#0b81b8) 55%,transparent)}}
@media (prefers-reduced-motion: reduce){.hist-orden-card .busq-status.st-proc{animation:none}}
.hist-orden-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.hist-orden-ver{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:none;background:transparent;border-radius:8px;cursor:pointer;color:var(--text2);transition:background .12s,color .12s}
.hist-orden-ver:hover{background:var(--bg3);color:var(--text)}
.hist-orden-fechalapso{margin-left:auto;text-align:right;font-size:13px;color:var(--text3);font-family:var(--font-mono);line-height:1.35}
.hist-orden-lapso{font-size:14px;color:var(--text3);margin-top:3px;font-family:var(--font-mono)}
.hist-orden-acabados{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.hist-orden-acabado{font-size:12px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:999px;padding:2px 8px}
.historial-list{max-height:56vh;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:4px 10px;margin-bottom:14px;
  scrollbar-width:thin;scrollbar-color:rgba(11,129,184,.42) transparent}
.historial-list::-webkit-scrollbar{width:8px;height:8px}
.historial-list::-webkit-scrollbar-track{background:transparent}
.historial-list::-webkit-scrollbar-thumb{background:rgba(11,129,184,.38);border-radius:999px}
.historial-item{padding:12px 0;border-bottom:1px solid var(--border)}
.historial-item:last-child{border-bottom:none}
.historial-item-hdr{display:flex;align-items:center;justify-content:flex-start;gap:10px;font-family:var(--font-mono);font-size:14px;color:var(--text3);margin-bottom:5px}
.historial-orden{color:var(--blue);font-weight:700}
.historial-item-body{font-size:16px;color:var(--text2)}
.historial-item-body b{color:var(--text)}
/* Bloque J — Historial con más vida */
.hist-fecha{margin-left:auto}
.hist-ico{width:18px;text-align:center;flex-shrink:0}
.hist-ico.ch{color:var(--blue)}
.hist-ico.ev{color:var(--text3)}
.hist-proc{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;color:var(--hp,#64748b);background:color-mix(in srgb,var(--hp,#64748b) 15%,transparent);border:1px solid color-mix(in srgb,var(--hp,#64748b) 40%,transparent)}
.hist-dif{display:inline-block;font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--red,#ef4444);background:var(--red-bg,rgba(239,68,68,.1));border:1px solid var(--red-border,rgba(239,68,68,.35));border-radius:4px;padding:1px 6px;margin:0 2px}
/* ── Ver Orden (Historial de Producción) — ventana flotante: se arrastra por el encabezado
   y se estira/encoge desde las orillas; el contenido interno usa el Scrollbar Azul ── */
.vo-overlay{align-items:center;justify-content:center}
.vo-panel{position:fixed;display:flex;flex-direction:column;width:1180px;max-width:none;height:92vh;background:var(--bg2,var(--bg));border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35);resize:both;min-width:520px;min-height:360px}
.vo-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);cursor:move;user-select:none}
.vo-hdr h3{margin:0;font-size:16px}
.vo-hdr .vo-sub{font-size:12px;color:var(--text3);margin-top:2px}
.vo-panel iframe{flex:1;width:100%;border:0;display:block;background:var(--bg);overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(11,129,184,.42) transparent}
.vo-panel iframe::-webkit-scrollbar{width:8px;height:8px}
.vo-panel iframe::-webkit-scrollbar-track{background:transparent}
.vo-panel iframe::-webkit-scrollbar-thumb{background:rgba(11,129,184,.38);border-radius:999px}
/* ── Línea de tiempo de eventos por orden (detalle del Historial de Producción) ── */
.hist-tl-day{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.hist-tl-day:first-child{margin-top:2px}
.hist-tl-item{position:relative;padding:8px 0 8px 20px;margin-left:5px;border-left:2px solid var(--border)}
.hist-tl-item:last-child{border-left-color:transparent}
.hist-tl-dot{position:absolute;left:-7px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--hp,#64748b);border:2px solid var(--bg2);box-shadow:0 0 0 2px color-mix(in srgb,var(--hp,#64748b) 45%,transparent)}
.hist-tl-hdr{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.hist-tl-time{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--text3)}
.hist-tl-body{font-size:15px;color:var(--text2);line-height:1.5}
.hist-tl-body b{color:var(--text)}
.hist-tl-meta{font-size:13px;color:var(--text3);margin-top:2px}
/* ── Buscar orden por proceso ── */
.busq-item{padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer}
.busq-item:last-child{border-bottom:none}
.busq-item:hover{background:var(--bg3)}
.busq-item-hdr{display:flex;align-items:baseline;gap:8px}
.busq-item-name{font-size:16px;color:var(--text);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.busq-item-customer{font-size:16px;color:var(--text3);margin-top:1px}
.busq-item-meta{font-size:14px;color:var(--text3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.busq-status{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 7px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.busq-status.st-run{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.busq-status.st-paro{background:var(--amber-bg,rgba(245,158,11,.12));color:var(--amber,#b45309);border:1px solid var(--amber-border,rgba(245,158,11,.35))}
.busq-status.st-done{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.busq-status.st-pend{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.busq-status.st-det{background:var(--red-bg,rgba(239,68,68,.1));color:var(--red,#ef4444);border:1px solid var(--red-border,rgba(239,68,68,.35))}
.hist-eq{display:inline-block;font-family:var(--font-mono);font-size:11px;color:var(--text3);margin:0 2px}
/* ── DATOS COTIZADOS / PRODUCIDOS (Preprensa, Diseño, Visto Bueno, Tintas, Rebobinado, Empaque) ── */
.qd-panel{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:16px 18px;margin-bottom:12px}
/* Títulos de panel/sub-panel con el mismo resplandor "neón" que los modales — azul para el
   título principal, púrpura para el sub-título — para que el módulo no se vea gris y apagado. */
.qd-panel-hdr{font-family:var(--font-mono);font-size:16px;font-weight:600;color:#0b6fb8;text-shadow:0 0 8px rgba(11,111,184,.22);letter-spacing:.05em;margin-bottom:12px}
html[data-theme="dark"] .qd-panel-hdr{color:#6fc3ff;text-shadow:0 0 10px rgba(111,195,255,.45)}
.qd-sub-hdr{font-family:var(--font-mono);font-size:15px;color:#7c3aed;text-shadow:0 0 7px rgba(124,58,237,.2);font-weight:700;letter-spacing:.04em;margin:14px 0 6px;padding-top:8px;border-top:1px solid var(--border)}
html[data-theme="dark"] .qd-sub-hdr{color:#c9a8ff;text-shadow:0 0 9px rgba(201,168,255,.35)}
.qd-sub-hdr:first-child{margin-top:0;padding-top:0;border-top:none}
.qd-motivo{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.qd-motivo:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.qd-motivo-title{font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px}
.qd-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.qd-row:last-child{border-bottom:none}
.qd-row-lbl{flex:1;font-family:var(--font-mono);font-size:16px;color:var(--text2)}
.qd-row-val{font-family:var(--font-mono);font-size:16px;color:var(--text);text-align:right;min-width:110px}
.qd-row-val.produced{color:var(--green)}
.qd-edit-btn{font-family:var(--font-mono);font-size:14px;padding:6px;min-height:38px;min-width:38px;border-radius:6px;border:0;background:transparent;color:var(--blue);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.qd-edit-btn:hover{color:var(--blue-border)}
.qd-confirm-btn{flex:none;width:34px;height:34px;padding:0;border-radius:50%;border:2px solid var(--border);background:transparent;color:#fff;font-size:16px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s}
.qd-confirm-btn:hover{border-color:var(--green)}
.qd-confirm-btn.is-confirmed{background:var(--green);border-color:var(--green)}
.qd-row-2col{padding:14px 0;gap:20px}
.qd-row-2col .qd-row-lbl{font-size:17px}
.qd-row-2col .qd-row-cot{min-width:150px;font-size:17px;color:var(--text2);padding-right:6px}
.qd-row-2col .qd-row-prod{min-width:150px;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:flex-end;gap:6px}
.qd-row-2col .qd-row-prod:hover{color:var(--blue)}
.qd-row-2col .qd-row-prod-locked{cursor:default;color:var(--text2)}
.qd-row-2col.qd-row-pendiente{background:var(--amber-bg,rgba(245,158,11,.08));margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:4px}
.dz-row2-ed{margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:4px}
.dz-row2-ed .qd-row-prod{cursor:default}
.dz-row2-ed .qd-row-prod:hover{color:inherit}
.qd-req-mark{color:var(--amber,#f59e0b);font-size:11px;vertical-align:middle}
.qd-2col-hdr{font-family:var(--font-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);padding-bottom:6px}
.qd-row-1col{padding:14px 0;gap:24px}
.qd-row-1col .qd-row-lbl{font-size:17px}
.qd-row-1col-val{display:inline-flex;align-items:center;gap:6px;min-width:140px;font-family:var(--font-mono);font-size:17px;color:var(--text);text-align:right;justify-content:flex-end}
.qd-row-1col-val.qd-editado{color:var(--blue)}
/* Empaque: mismo motor de filas, pero más compacto y con títulos de sección llamativos
   (a pedido del dueño — se veía "muerto", todo el mismo gris sin diferenciarse).
   Cada grupo lleva su propio color neón: Personal índigo, Cores fucsia, Cajas cian,
   Bolsas ámbar, Peso y Cierre verde y Tarima violeta — el panel deja de ser un solo gris. */
.emp-panel{background:linear-gradient(180deg,color-mix(in srgb,var(--bg3) 88%,#0b81b8 12%),var(--bg3))}
.emp-panel .qd-row-1col{padding:6px 0;gap:16px}
.emp-panel .qd-sub-hdr{margin:10px 0 2px;padding-top:8px;font-size:15px}
.emp-panel .qd-motivo{margin-bottom:8px;padding-bottom:6px}
.emp-panel .qd-row{border-bottom-color:color-mix(in srgb,var(--border) 70%,transparent)}
.emp-panel .qd-row-lbl{color:var(--text)}
/* Los valores en paréntesis van dentro de la etiqueta, mismo texto que el resto: sin color
   ni tamaño especial — es información, no decoración. */
.emp-panel .qd-row-lbl{white-space:nowrap}
.emp-panel .qd-sub-hdr[data-grupo="Personal"]{color:#818cf8;text-shadow:0 0 8px rgba(129,140,248,.5)}
.emp-panel .qd-sub-hdr[data-grupo="Cores"]{color:#f472b6;text-shadow:0 0 8px rgba(244,114,182,.5)}
.emp-panel .qd-sub-hdr[data-grupo="Cajas"]{color:#00d9c0;text-shadow:0 0 8px rgba(0,217,192,.45)}
.emp-panel .qd-sub-hdr[data-grupo="Bolsas"]{color:#fbbf24;text-shadow:0 0 8px rgba(251,191,36,.45)}
.emp-panel .qd-sub-hdr[data-grupo="Peso y Cierre"]{color:#4ade80;text-shadow:0 0 8px rgba(74,222,128,.45)}
.emp-panel .qd-sub-hdr[data-grupo="Tarima"]{color:#a78bfa;text-shadow:0 0 8px rgba(167,139,250,.45)}
.emp-panel .qd-sub-hdr[data-grupo="Otros"]{color:#38bdf8;text-shadow:0 0 8px rgba(56,189,248,.45)}
html[data-theme="dark"] .emp-panel .qd-sub-hdr[data-grupo]{filter:brightness(1.15)}
html[data-theme="dark"] .emp-panel .qd-sub-hdr[data-grupo="Personal"]{color:#a5b4fc}
html[data-theme="dark"] .emp-panel .qd-sub-hdr[data-grupo="Cores"]{color:#f9a8d4}
html[data-theme="dark"] .emp-panel .qd-sub-hdr[data-grupo="Cajas"]{color:#2ee6cc}
html[data-theme="dark"] .emp-panel .qd-sub-hdr[data-grupo="Bolsas"]{color:#fcd34d}
html[data-theme="dark"] .emp-panel .qd-sub-hdr[data-grupo="Peso y Cierre"]{color:#86efac}
html[data-theme="dark"] .emp-panel .qd-sub-hdr[data-grupo="Tarima"]{color:#c4b5fd}
html[data-theme="dark"] .emp-panel .qd-sub-hdr[data-grupo="Otros"]{color:#7dd3fc}
/* El botón de editar (lápiz) fuerza 38px de alto en .qd-edit-btn (ver arriba) — eso, sumado al
   margen propio de la fila, era lo que inflaba el espacio de más en Empaque, Impresión
   (Información General) y las tarjetas de estación de Diseño/Preprensa/Tintas. Se achica el
   botón al tamaño del ícono, y el margen superior/inferior de la fila se quita SOLO cuando la
   fila tiene ícono — las filas sin ícono (ej. Diámetro/Ancho de Core) mantienen su margen. */
.qd-row-1col .qd-edit-btn,.qd-row-2col .qd-edit-btn,.mes-sc-actions .qd-edit-btn,.qd-rebo-resumen-val .qd-edit-btn{min-height:0;min-width:0;padding:2px}
.qd-row-1col:has(.qd-edit-btn){padding-top:0;padding-bottom:0}
.qd-row-2col:has(.qd-edit-btn){padding-top:0;padding-bottom:0}
.qd-rebo-resumen-item:has(.qd-edit-btn){padding-top:0;padding-bottom:0}
.qd-edited-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--blue);cursor:pointer}
.qd-row-1col .qd-edit-btn{margin-left:14px}
.qd-2col-hdr span:first-child{flex:1}
.qd-2col-hdr span:not(:first-child){min-width:150px;text-align:right}
.qd-outputtype-row{padding:6px 0;border-bottom:1px solid var(--border)}
.qd-outputtype-row .qd-row{border-bottom:none;padding:0 0 6px}
.qd-outputtype-img{display:block;max-width:140px;max-height:100px;margin:0 auto}
.qd-rebo-core-img-wrap{display:flex;justify-content:center;margin-bottom:14px}
.qd-rebo-core-img{width:100%;max-width:600px;height:auto;border-radius:10px;display:block}
.qd-rebo-resumen-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-top:4px}
/* Sustrato a Utilizar (Información General de Impresión): qd-row-1col por defecto hace crecer
   la etiqueta para empujar el valor hasta el borde derecho — bien para una ficha larga de varios
   campos, mal para un solo campo donde el nombre del sustrato debe quedar pegado a su etiqueta,
   no separado por medio panel de aire. */
.qd-row-1col.qd-row-inline{gap:10px}
.qd-row-1col.qd-row-inline .qd-row-lbl{flex:none}
.qd-row-1col.qd-row-inline .qd-row-1col-val{min-width:0;text-align:left;justify-content:flex-start}
.qd-rebo-resumen-item{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--border)}
.qd-rebo-resumen-item-sentido{grid-column:2;grid-row:2 / span 2;justify-content:center;border-bottom:none}
.qd-rebo-resumen-lbl{font-family:var(--font-mono);font-size:12px;color:var(--text2)}
.qd-rebo-resumen-val{font-family:var(--font-mono);font-size:14px;color:var(--text);display:flex;align-items:center;gap:6px;cursor:pointer}
.qd-rebo-resumen-val.qd-rebo-resumen-readonly{cursor:default}
.qd-rebo-resumen-val-sentido{font-size:32px}
.qd-rebo-tiempos-row .qd-row-lbl,.qd-rebo-tiempos-row .qd-row-val{font-size:16px}
.qd-rebo-resumen-thumb{height:90px;width:auto;border-radius:4px;cursor:zoom-in}
.qd-empty{font-size:13px;color:var(--text3);text-align:center;padding:12px 0}
.qd-note{font-size:13px;margin-top:6px}
.qd-estado-pill{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700}
.qd-estado-pill.pendiente_enviar{background:rgba(183,121,31,.14);color:#b7791f;border:1px solid rgba(183,121,31,.35)}
.qd-estado-pill.pendiente_recibir{background:rgba(29,111,184,.14);color:#1D6FB8;border:1px solid rgba(29,111,184,.35)}
.qd-estado-pill.recibido{background:rgba(29,158,117,.14);color:#1D9E75;border:1px solid rgba(29,158,117,.35)}
html[data-theme="dark"] .qd-estado-pill.pendiente_enviar{color:#d29922}
html[data-theme="dark"] .qd-estado-pill.pendiente_recibir{color:#58a6ff}
html[data-theme="dark"] .qd-estado-pill.recibido{color:#3fb950}

/* ── Panel de Diseño (formato Especificación Técnica v3), dentro del modal ── */
.dzp{--dz-s:#111821;--dz-s2:#18212c;--dz-s3:#151e28;--dz-s4:#0d141c;
  --dz-b:#2d3a49;--dz-b2:#39485a;
  --dz-t:#edf4fb;--dz-t2:#aebdcb;--dz-t3:#e8eff5;--dz-t4:#f3f7fb;--dz-mut:#718da3;
  --dz-acc:#22a7e8;--dz-acc-bg:#102a39;--dz-acc-b:#237da5;--dz-acc2:#59ceff;
  --dz-grn:#38d889;--dz-grn-bg:#123a29;--dz-grn-b:#27865c;
  --dz-red:#ff8b92;--dz-red-b:#9e353d;
  --dz-sh:0 16px 40px -26px rgba(0,0,0,.9);
  font-family:var(--font-sans);color:var(--dz-t)}
html[data-theme="light"] .dzp{
  --dz-s:#ffffff;--dz-s2:#f2f6fa;--dz-s3:#eaf0f6;--dz-s4:#e2eaf1;
  --dz-b:#d6dfe8;--dz-b2:#bccbd9;
  --dz-t:#17212f;--dz-t2:#4c5c6d;--dz-t3:#16212e;--dz-t4:#0f1a24;--dz-mut:#6c7c8e;
  --dz-acc:#0b81b8;--dz-acc-bg:#e6f4fb;--dz-acc-b:#8fc8e2;--dz-acc2:#0e6f9c;
  --dz-grn:#16823b;--dz-grn-bg:#e7f7ec;--dz-grn-b:#83d39a;
  --dz-red:#c4322b;--dz-red-b:#ee8d88;
  --dz-sh:0 10px 26px -20px rgba(20,35,55,.3);
}
.dzp .dz-nav{display:flex;gap:6px;overflow:auto;margin-bottom:12px;padding-bottom:2px}
.dzp .dz-nav button{white-space:nowrap;border:1px solid var(--dz-b);background:var(--dz-s3);color:var(--dz-t2);border-radius:5px;padding:7px 12px;font-size:12px;cursor:pointer;transition:.15s}
.dzp .dz-nav button:hover{border-color:var(--dz-acc-b);color:var(--dz-acc2)}
.dzp .dz-nav button.on{background:var(--dz-acc);border-color:var(--dz-acc);color:#fff}
.dzp .dz-layout{display:grid;grid-template-columns:172px minmax(0,1fr);gap:14px}
@media(max-width:820px){.dzp .dz-layout{grid-template-columns:1fr}}
.dzp .dz-rail{background:var(--dz-s);border:1px solid var(--dz-b);border-radius:8px;padding:10px;align-self:start}
.dzp .dz-rail-t{font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--dz-mut);margin-bottom:8px}
.dzp .dz-motif{display:block;width:100%;text-align:left;border:1px solid var(--dz-b);background:var(--dz-s2);border-radius:5px;padding:8px 9px;margin-bottom:7px;color:var(--dz-t);cursor:pointer;transition:.15s}
.dzp .dz-motif:hover{border-color:var(--dz-acc-b);transform:translateY(-1px);box-shadow:0 8px 20px -13px rgba(34,167,232,.5)}
.dzp .dz-motif.on{border-color:var(--dz-acc);background:var(--dz-acc-bg);box-shadow:0 0 0 1px var(--dz-acc),0 10px 22px -16px rgba(34,167,232,.7)}
.dzp .dz-motif strong{display:block;font-size:12px}
.dzp .dz-motif span{display:block;color:var(--dz-mut);font-size:11px;margin-top:1px}
.dzp .dz-vlist{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.dzp .dz-vlist i{font-style:normal;font-family:var(--font-mono);font-size:10px;border:1px solid var(--dz-b);border-radius:4px;padding:2px 5px;color:var(--dz-t2);background:var(--dz-s)}
.dzp .dz-vlist i.on{color:var(--dz-acc2);border-color:var(--dz-acc-b);background:var(--dz-acc-bg)}
.dzp .dz-hero{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;background:var(--dz-s);border:1px solid var(--dz-b);border-radius:8px;padding:14px;box-shadow:var(--dz-sh);margin-bottom:12px}
@media(max-width:620px){.dzp .dz-hero{grid-template-columns:1fr}}
.dzp .dz-art{min-height:240px;border:1px solid var(--dz-b2);border-radius:8px;background:var(--dz-s4);display:flex;align-items:center;justify-content:center;padding:14px;
  background-image:linear-gradient(45deg,rgba(120,140,160,.07) 25%,transparent 25%,transparent 75%,rgba(120,140,160,.07) 75%),linear-gradient(45deg,rgba(120,140,160,.07) 25%,transparent 25%,transparent 75%,rgba(120,140,160,.07) 75%);background-position:0 0,9px 9px;background-size:18px 18px;text-align:center;color:var(--dz-mut);font-size:12px}
.dzp .dz-art img{max-width:100%;max-height:230px;object-fit:contain;display:block;cursor:zoom-in}
/* Info a la izquierda, imagen del arte angosta y vertical a la derecha */
.dzp .dz-arte-layout{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:14px;align-items:start}
@media(max-width:720px){.dzp .dz-arte-layout{grid-template-columns:1fr}}
.dzp .dz-arte-main{min-width:0}
.dzp .dz-arte-h2{font-size:17px;margin:2px 0}
.dzp .dz-arte-side{display:flex;flex-direction:column;gap:7px;position:sticky;top:0;padding-top:16px}
.dzp .dz-art.dz-art-tall{width:200px;aspect-ratio:3/4;min-height:0;padding:10px;margin:0}
.dzp .dz-art.dz-art-tall img{max-height:100%}
.dzp .dz-hi h2{font-size:18px;margin:2px 0 2px}
.dzp .dz-eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--dz-acc2);font-weight:600}
.dzp .dz-vname{color:var(--dz-mut);font-size:14px;margin-bottom:12px}
.dzp .dz-ig{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media(max-width:520px){.dzp .dz-ig{grid-template-columns:repeat(2,1fr)}}
.dzp .dz-i{border:1px solid var(--dz-b);border-radius:5px;background:var(--dz-s2);padding:8px}
.dzp .dz-i label{display:block;font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--dz-mut)}
.dzp .dz-i b{display:block;margin-top:2px;font-size:13px;color:var(--dz-t3)}
.dzp .dz-vtabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.dzp .dz-vt{border:1px solid var(--dz-b);background:var(--dz-s2);border-radius:5px;padding:6px 9px;color:var(--dz-t2);font-size:12px;cursor:pointer;transition:.15s}
.dzp .dz-vt:hover{transform:translateY(-1px);box-shadow:0 8px 18px -11px rgba(34,167,232,.5)}
.dzp .dz-vt.on{background:var(--dz-acc-bg);border-color:var(--dz-acc);color:var(--dz-acc2);font-weight:600}
.dzp .dz-sec{background:var(--dz-s);border:1px solid var(--dz-b);border-radius:8px;margin-bottom:12px;box-shadow:var(--dz-sh);overflow:hidden}
.dzp .dz-sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid var(--dz-b);background:var(--dz-s3);position:relative}
.dzp .dz-sec-h:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dz-acc)}
.dzp .dz-sec-k{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dz-mut)}
/* Título de cada bloque (Especificación del Arte, Tintas, etc.) con el mismo resplandor azul
   que los títulos de panel de Impresión — mismo criterio de "vivacidad" en toda Producción. */
.dzp .dz-sec-t{font-weight:700;color:var(--dz-acc2);text-shadow:0 0 7px rgba(34,167,232,.3);font-size:16px}
.dzp .dz-sec-b{padding:12px 13px}
.dzp .dz-chip{font-family:var(--font-mono);font-size:10px;border:1px solid var(--dz-b2);background:var(--dz-s2);color:var(--dz-t2);border-radius:4px;padding:3px 7px;white-space:nowrap}
.dzp .dz-specg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:760px){.dzp .dz-specg{grid-template-columns:repeat(2,1fr)}}
/* Información General de Diseño/Preprensa: columna izquierda = datos (sustrato, troquel,
   etiquetado, forma, acabados), columna derecha = Tipo de Salida, estirado para tomar todo el
   alto de la izquierda (no debe quedar un hueco vacío debajo de la caja). El Arte y la tabla de
   tintas van fuera de esta fila, de ancho completo — ver dz-infogen-arte-wrap más abajo. */
.dzp .dz-infogen-row{display:flex;gap:10px;align-items:stretch}
.dzp .dz-infogen-left{flex:1.4;display:flex;flex-direction:column;gap:8px;min-width:0}
.dzp .dz-infogen-right{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.dzp .dz-infogen-right .dz-infogen-imgbox{flex:1}
.dzp .dz-infogen-imgbox{border:1px solid var(--dz-b);border-radius:5px;background:var(--dz-s2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;min-height:96px}
/* Fila de ID del Troquel / Tipo de Etiquetado / Forma, 3 columnas iguales. */
.dzp .dz-infogen-triple{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:620px){.dzp .dz-infogen-triple{grid-template-columns:1fr}}
.dzp .dz-infogen-imgbox img{max-width:100%;max-height:110px;cursor:zoom-in}
/* Acabados (Laminado/Estampado) cuando aparecen, en fila horizontal debajo del ID del Troquel. */
.dzp .dz-acab-list-h{display:flex;flex-wrap:wrap;gap:8px}
.dzp .dz-acab-list-h .dz-acab-block{flex:1;min-width:160px}
/* Caja de Tipo de Salida: etiqueta + número grande a la izquierda, imagen a la derecha. El
   número nunca se sale de la caja (clamp entre 34px y 60px según el ancho disponible). */
.dzp .dz-infogen-salidabox{flex-direction:row;justify-content:flex-start;align-items:center;gap:20px;padding:10px}
.dzp .dz-infogen-salida-info{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0}
.dzp .dz-infogen-salida-info label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dz-mut)}
.dzp .dz-infogen-salida-num{font-size:clamp(34px,7vw,60px);line-height:1;font-weight:700;color:var(--dz-t);align-self:center;text-align:center;width:100%}
.dzp .dz-infogen-salida-imgwrap{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.dzp .dz-infogen-salida-imgwrap img{max-width:72px;max-height:72px;cursor:zoom-in}
@media(max-width:760px){.dzp .dz-infogen-row{flex-direction:column}}
/* Imagen del Arte: ahora vive debajo de la tabla de tintas, de ancho completo y con espacio
   amplio (antes compartía la columna derecha con Tipo de Salida y quedaba muy apretada). */
.dzp .dz-infogen-arte-wrap{display:flex;justify-content:center}
.dzp .dz-infogen-arte-wrap .dz-infogen-imgbox{width:100%;min-height:240px}
.dzp .dz-infogen-arte-wrap .dz-infogen-imgbox img{max-height:280px}
/* Colapsable de cada Arte: <details>/<summary> reutilizando el look de dz-sec-h, sin el
   triángulo nativo del navegador — solo el primer arte de la orden abre expandido. */
.dzp details.dz-infogen-motivo{padding:0}
.dzp .dz-infogen-motivo summary.dz-sec-h{cursor:pointer;list-style:none}
.dzp .dz-infogen-motivo summary.dz-sec-h::-webkit-details-marker{display:none}
.dzp .dz-infogen-motivo summary.dz-sec-h::after{content:'▾';margin-left:auto;color:var(--dz-mut);transition:transform .15s}
.dzp .dz-infogen-motivo:not([open]) summary.dz-sec-h::after{transform:rotate(-90deg)}
/* Especificación del Arte, ahora dentro de cada bloque de Arte: mismo tamaño de letra que las
   demás casillas de esta pestaña (antes se veía más chico) y la imagen pegada al campo, no
   estirada al borde derecho de la caja. */
.dzp .dz-infogen-motivo .dz-forma-block{display:flex;flex-wrap:wrap}
.dzp .dz-infogen-motivo .dz-forma-lbl{font-size:11px}
.dzp .dz-infogen-motivo .dz-forma-select{font-size:15px;max-width:220px}
.dzp .dz-infogen-motivo .dz-sub{font-size:13px}
/* Fuente de las casillas de Información General: más grande que el resto de dz-f (9/13px)
   porque a la par del título de 18px se veía desproporcionado. */
.dzp .dz-infogen-motivo .dz-f label{font-size:13px}
.dzp .dz-infogen-motivo .dz-f b{font-size:16px}
.dzp .dz-f{border:1px solid var(--dz-b);border-radius:5px;padding:8px 9px;background:var(--dz-s2);position:relative}
.dzp .dz-f label{display:block;font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--dz-mut)}
.dzp .dz-f b{display:block;font-size:15px;margin-top:3px;color:var(--dz-t3)}
.dzp .dz-f .u{color:var(--dz-mut);font-size:11px;font-weight:400}
.dzp .dz-f.ed{cursor:pointer}
.dzp .dz-f.ed:hover{border-color:var(--dz-acc-b);box-shadow:0 8px 20px -14px rgba(34,167,232,.5)}
.dzp .dz-f-actions{position:absolute;top:6px;right:6px;display:inline-flex;align-items:center;gap:4px;background:var(--dz-s2);padding-left:4px}
.dzp .dz-tt{width:100%;border-collapse:collapse;font-size:16px}
.dzp .dz-tt th{text-align:left;font-family:var(--font-mono);font-size:13px;text-transform:uppercase;color:var(--dz-mut);padding:8px 9px;border-bottom:1px solid var(--dz-b)}
.dzp .dz-tt td{padding:9px;border-bottom:1px solid var(--dz-b);color:var(--dz-t2)}
.dzp .dz-tt tr:last-child td{border-bottom:0}
.dzp .dz-tt tr:hover td{background:var(--dz-s3)}
.dzp .dz-sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid rgba(128,128,128,.45);vertical-align:middle;margin-right:8px}
.dzp .dz-tn{font-weight:600;color:var(--dz-t)}
.dzp .dz-sub{display:block;color:var(--dz-mut);font-size:12px;margin-top:2px}
.dzp .dz-cov{font-family:var(--font-mono);font-weight:600}
.dzp .dz-badge{font-family:var(--font-mono);font-size:10px;border-radius:4px;padding:3px 7px;border:1px solid var(--dz-b2);background:var(--dz-s2);color:var(--dz-t2)}
.dzp .dz-procg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:760px){.dzp .dz-procg{grid-template-columns:repeat(2,1fr)}}
.dzp .dz-proc{border:1px solid var(--dz-b);border-radius:5px;padding:9px;background:var(--dz-s2);display:flex;align-items:flex-start;gap:8px;font-size:12px}
.dzp .dz-proc.off{opacity:.55}
.dzp .dz-proc-tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.dzp .dz-proc-tx b{font-weight:600}
.dzp .dz-proc-det{font-size:10px;color:var(--dz-mut);word-break:break-word}
.dzp .dz-ck{width:18px;height:18px;border-radius:4px;background:var(--dz-grn-bg);border:1px solid var(--dz-grn-b);color:var(--dz-grn);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.dzp .dz-proc.off .dz-ck{background:var(--dz-s);color:var(--dz-mut);border-color:var(--dz-b)}
/* Bloque D — Acabados como lista vertical */
.dzp .dz-acab-list{display:flex;flex-direction:column;gap:10px}
.dzp .dz-acab-block{border:1px solid var(--dz-b);border-radius:6px;background:var(--dz-s2);overflow:hidden}
.dzp .dz-acab-hdr{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:14px;background:var(--dz-s)}
.dzp .dz-acab-hdr b{font-weight:600}
.dzp .dz-acab-det{font-size:12px;color:var(--dz-mut)}
.dzp .dz-acab-body{padding:4px 12px 10px}
.dzp .dz-acab-body .qd-row{padding:8px 0}
.dzp .dz-notes{width:100%;min-height:78px;border:1px solid var(--dz-b2);border-radius:5px;background:var(--dz-s2);color:var(--dz-t);padding:9px;resize:vertical;font-family:var(--font-sans);font-size:13px}
.dzp .dz-notes:focus{outline:0;border-color:var(--dz-acc);box-shadow:0 0 0 2px rgba(34,167,232,.12)}
.dzp .dz-btn{border:1px solid var(--dz-b2);background:var(--dz-s);color:var(--dz-t2);border-radius:5px;padding:6px 11px;font-size:12px;cursor:pointer;transition:.15s}
.dzp .dz-btn:hover{transform:translateY(-1px);box-shadow:0 9px 22px -12px rgba(34,167,232,.5);border-color:var(--dz-acc);color:var(--dz-t)}
.dzp .dz-soon{color:var(--dz-mut);font-size:12px;font-style:italic}
.dz-lightbox{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
.dz-lightbox img{max-width:100%;max-height:88vh;display:block;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.dz-lightbox .dz-lb-card{max-width:560px;width:100%;background:var(--dz-s,#111821);border:1px solid var(--dz-b,#2d3a49);border-radius:8px;padding:16px;cursor:auto;box-shadow:var(--dz-sh,0 16px 40px -26px rgba(0,0,0,.9))}
html[data-theme="light"] .dz-lightbox .dz-lb-card{--dz-s:#ffffff;--dz-b:#d6dfe8;--dz-sh:0 10px 26px -20px rgba(20,35,55,.3)}
.dz-lightbox .dz-lb-card h4{margin:0 0 10px;color:var(--dz-t4,#f0f5f9);font-size:14px}
.dz-lightbox .dz-lb-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--dz-b,#293745);font-size:12px;color:var(--dz-t2,#aebdcb)}
.dz-lightbox .dz-lb-row:last-child{border-bottom:0}
.dz-lightbox .dz-lb-row b{color:var(--dz-t3,#e8eff5);font-weight:600}
html[data-theme="light"] .dz-lightbox .dz-lb-row{--dz-b:#d6dfe8;--dz-t2:#4c5c6d}
html[data-theme="light"] .dz-lightbox .dz-lb-card h4,html[data-theme="light"] .dz-lightbox .dz-lb-row b{--dz-t4:#0f1a24;--dz-t3:#16212e}
/* statusbar + acciones + archivos + aprobación (paridad con Panel de Diseño v3) */
.dzp .dz-statusbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--dz-s3);border:1px solid var(--dz-b);border-radius:8px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--dz-sh)}
@media(max-width:820px){.dzp .dz-statusbar{grid-template-columns:1fr}}
.dzp .dz-status-main{display:flex;align-items:center;gap:12px;min-height:36px}
.dzp .dz-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-bg),0 0 14px var(--green-bg);flex-shrink:0}
.dzp .dz-dot.pend{background:var(--amber);box-shadow:0 0 0 4px var(--amber-bg),0 0 14px var(--amber-bg)}
.dzp .dz-status-title{font-weight:600;color:var(--dz-t4)}
.dzp .dz-status-meta{color:var(--dz-mut);font-size:12px;margin-top:1px}
.dzp .dz-chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
@media(max-width:820px){.dzp .dz-chips{justify-content:flex-start}}
.dzp .dz-chip2{border:1px solid var(--dz-b2);background:var(--dz-s2);border-radius:4px;padding:5px 8px;font-family:var(--font-mono);font-size:11px;color:var(--dz-t2);white-space:nowrap}
.dzp .dz-chip2.ok{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.dzp .dz-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:12px}
.dzp .dz-primary{background:var(--dz-acc);border-color:var(--dz-acc);color:#fff}
.dzp .dz-primary:hover{background:var(--dz-acc2);color:#fff}
.dzp .dz-fileg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(max-width:760px){.dzp .dz-fileg{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.dzp .dz-fileg{grid-template-columns:1fr}}
.dzp .dz-file{border:1px solid var(--dz-b);border-radius:5px;padding:10px;background:var(--dz-s2);transition:.15s}
.dzp .dz-file:hover{transform:translateY(-1px);border-color:var(--dz-acc-b);box-shadow:0 10px 22px -12px rgba(34,167,232,.5)}
.dzp .dz-file-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dzp .dz-file-name{font-weight:600;font-size:12px;color:var(--dz-t3);word-break:break-word}
.dzp .dz-file-type{font-family:var(--font-mono);font-size:9px;color:var(--dz-mut);flex-shrink:0}
.dzp .dz-file-meta{font-size:10px;color:var(--dz-mut);margin-top:5px}
.dzp .dz-file-badge{display:inline-block;margin-top:7px;font-size:10px;font-weight:600;border-radius:999px;padding:2px 8px;border:1px solid var(--dz-b);color:var(--dz-t2)}
.dzp .dz-file-badge.apr{border-color:var(--dz-grn-b);background:var(--dz-grn-bg);color:var(--dz-grn)}
.dzp .dz-file-acts{display:flex;gap:6px;margin-top:9px}
.dzp .dz-file-acts button{flex:0 0 auto;border:1px solid var(--dz-b2);background:var(--dz-s);color:var(--dz-t2);border-radius:5px;padding:4px 9px;font-size:11px;cursor:pointer;transition:.15s}
.dzp .dz-file-acts button:hover{border-color:var(--dz-acc);color:var(--dz-t)}
.dzp .dz-file-acts .del:hover{border-color:var(--dz-red-b);color:var(--dz-red)}
.dzp .dz-approval{display:grid;grid-template-columns:1fr auto;align-items:center;gap:15px;background:var(--dz-s3);border-radius:5px}
@media(max-width:620px){.dzp .dz-approval{grid-template-columns:1fr}}
.dzp .dz-appr-card{display:flex;gap:12px;align-items:center}
.dzp .dz-avatar{width:38px;height:38px;border-radius:6px;background:var(--dz-acc-bg);border:1px solid var(--dz-acc-b);display:flex;align-items:center;justify-content:center;color:var(--dz-acc2);font-weight:700;flex-shrink:0}
.dzp .dz-appr-meta b{display:block;color:var(--dz-t3)}
.dzp .dz-appr-meta span{display:block;color:var(--dz-mut);font-size:11px;margin-top:1px}
/* tabla de tintas real de la orden (paridad con la ficha) */
.dzp .dz-tt.dz-tt-full th,.dzp .dz-tt.dz-tt-full td{padding:12px 14px;font-size:15px;white-space:nowrap}
.dzp .dz-tt.dz-tt-full td.ta-r,.dzp .dz-tt.dz-tt-full th.ta-r{text-align:right}
.dzp .dz-tt .dz-tinta-dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:middle;border:1px solid rgba(128,128,128,.5);background:var(--dz-tinta-dot,transparent)}
.dzp .dz-tt .dz-tinta-dot.none{background:repeating-linear-gradient(45deg,var(--dz-b) 0,var(--dz-b) 3px,transparent 3px,transparent 6px)}
.dzp .dz-tt tr.inact td{opacity:.55}
.dzp .dz-tt tfoot td{border-top:1px solid var(--dz-b);font-weight:700;color:var(--dz-t3)}
.dzp .dz-cov-ed{cursor:pointer;border-bottom:1px dashed var(--dz-acc2)}
.dzp .dz-cov-ed:hover{color:var(--dz-acc2)}
.dzp .dz-cov-wrap{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.tinta-drag-handle{cursor:grab;color:var(--dz-t3,#8a97a8);padding:0 4px;user-select:none}
.tinta-drag-row{cursor:grab}
.tinta-drag-row:active{cursor:grabbing}
.tinta-drag-row.is-dragging{opacity:.4}
.tinta-drag-row.drag-over-top td{box-shadow:inset 0 2px 0 var(--dz-acc,#1D6FB8)}
.tinta-drag-row.drag-over-bottom td{box-shadow:inset 0 -2px 0 var(--dz-acc,#1D6FB8)}
/* ── Grupo de dos partes ── */
.dzp .dz-part-hd{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dz-acc2);margin:2px 0 8px;padding-left:3px;border-left:3px solid var(--dz-acc)}
/* ── Reloj LCD noventero + acciones — carátula clara y elegante de día; de noche mantiene
   la lectura tipo pantalla digital oscura de siempre (overrides html[data-theme="dark"] abajo) ── */
.dz-clock-wrap{background:#eef2f6;border:1px solid #d7e0e8;border-radius:9px;padding:14px 16px;margin:12px 0;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:stretch;box-shadow:0 1px 3px rgba(15,23,42,.08)}
@media(max-width:640px){.dz-clock-wrap{grid-template-columns:1fr}}
/* El reloj y la columna de botones deben tener el MISMO ALTO (no solo estar centrados) — con
   align-items:stretch en el grid, el reloj crece hasta el alto de la columna de botones y acá
   se centra su texto adentro, para que el borde de abajo de ambos quede parejo. */
.dz-clock{position:relative;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:40px;line-height:1;letter-spacing:.06em;color:#0f6b52;text-shadow:0 0 1px rgba(15,107,82,.25);padding:6px 12px;border-radius:6px;background:#f7f9fb;border:1px solid #ccd6e0}
.dz-clock::before{content:"88:88:88";position:absolute;left:12px;top:6px;color:rgba(15,23,42,.055);text-shadow:none;pointer-events:none}
.dz-clock.run{color:#8a5a06;text-shadow:0 0 4px rgba(138,90,6,.25);background:#fff8e8;border-color:#eed9a0;animation:dzColon 1s steps(1,end) infinite}
.dz-clock.run::before{color:rgba(138,90,6,.08)}
.dz-clock.dz-clock-mini{display:inline-block;font-size:22px;letter-spacing:.04em;padding:2px 7px;border-radius:4px;vertical-align:middle;white-space:nowrap}
.dz-clock.dz-clock-mini::before{left:7px;top:2px}
.dz-clock.paused{color:#5b6b7a;text-shadow:none;background:#eef1f4;border-color:#d7dee5}
.dz-clock.dz-clock-alerta{color:#c0392b;text-shadow:0 0 4px rgba(192,57,43,.3);background:#fdeceb;border-color:#f0bcb6;animation:dzColon 1s steps(1,end) infinite}
.dz-clock.dz-clock-alerta::before{color:rgba(192,57,43,.09)}
.dz-pause-box{border-color:var(--red-border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dz-pause-box .qd-panel-hdr{margin:0;flex:none;color:var(--red);text-shadow:none}
.dz-pause-box-row{flex:1;font-size:16px;color:var(--text);min-width:180px}
@keyframes dzColon{50%{opacity:.72}}
.dz-clock-side{display:flex;flex-direction:column;justify-content:center;gap:8px}
/* Texto de estado (En espera/En curso/En pausa/Completada) — subido de 11px a 16px y de gris
   apagado a un color con más contraste: los operarios son personas de 40-50 años con problemas
   de vista, este texto tiene que leerse sin esfuerzo. */
.dz-clock-state{font-family:var(--font-mono);font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:#33414d}
.dz-clock-state b{color:#0f1a24}
html[data-theme="dark"] .dz-clock-wrap{background:#0b1119;border-color:#2b3947;box-shadow:inset 0 0 24px rgba(0,0,0,.55)}
html[data-theme="dark"] .dz-clock{color:#37e0a0;text-shadow:0 0 8px rgba(55,224,160,.55),0 0 22px rgba(55,224,160,.25);background:#07100c;border-color:#163a2b}
html[data-theme="dark"] .dz-clock::before{color:rgba(55,224,160,.09)}
html[data-theme="dark"] .dz-clock.run{color:#ffd34f;text-shadow:0 0 8px rgba(255,211,79,.6),0 0 22px rgba(255,211,79,.3);background:#12100a;border-color:#4a3d14}
html[data-theme="dark"] .dz-clock.run::before{color:rgba(255,211,79,.10)}
html[data-theme="dark"] .dz-clock.paused{color:#8fa3b5;text-shadow:none;background:#0d141c;border-color:#2b3947}
html[data-theme="dark"] .dz-clock.dz-clock-alerta{color:#ff6b5e;text-shadow:0 0 8px rgba(255,107,94,.6),0 0 22px rgba(255,107,94,.3);background:#160908;border-color:#4a1512}
html[data-theme="dark"] .dz-clock.dz-clock-alerta::before{color:rgba(255,107,94,.10)}
html[data-theme="dark"] .dz-clock-state{color:#c3d1de}
html[data-theme="dark"] .dz-clock-state b{color:#edf4fb}
html[data-theme="dark"] .dz-pause-box-row{color:var(--text)}
html[data-theme="dark"] .dz-clock-state b{color:#e8eff5}
.dz-actrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dz-actrow-secondary{margin-top:6px}
.dz-act{font-family:var(--font-mono);font-size:15px;font-weight:600;padding:14px 26px;min-height:48px;border-radius:8px;border:1px solid;cursor:pointer;transition:transform .14s ease,box-shadow .16s ease,background .16s ease}
.dz-act:hover{transform:translateY(-2px)}
.dz-act-start{border-color:var(--green-border);background:var(--green-bg);color:var(--green);box-shadow:0 8px 22px -12px rgba(56,216,137,.7);animation:dzGlow 2.4s ease-in-out infinite}
.dz-act-start:hover{background:var(--green-border);color:#eafff5;box-shadow:0 12px 30px -10px rgba(56,216,137,.85)}
@keyframes dzGlow{0%,100%{box-shadow:0 8px 22px -12px rgba(56,216,137,.55)}50%{box-shadow:0 10px 30px -8px rgba(56,216,137,.95)}}
.dz-act-done{border-color:var(--blue-border);background:var(--blue-bg);color:var(--blue);box-shadow:0 8px 22px -12px rgba(34,167,232,.7);animation:dzPulse 1.5s ease-in-out infinite}
.dz-act-done:hover{background:var(--blue-border);color:#eaf9ff}
@keyframes dzPulse{0%,100%{transform:scale(1);box-shadow:0 8px 22px -12px rgba(34,167,232,.55)}50%{transform:scale(1.035);box-shadow:0 12px 32px -8px rgba(34,167,232,1)}}
.dz-act-pause{border-color:var(--amber-border);background:var(--amber-bg);color:var(--amber)}
.dz-act-pause:hover{background:var(--amber-border);color:#fff5d6}
.dz-act-icon{border:0;background:transparent;padding:6px;min-width:38px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-family:var(--font-mono);font-size:13px;color:var(--text2);border-radius:6px;transition:.15s}
.dz-act-icon:hover{background:var(--bg3);color:var(--text)}
.dz-act-icon-danger{color:var(--red)}
.dz-act-icon-danger:hover{background:var(--red-bg)}
/* Fuera del panel .dzp (Diseño/Tintas) no existen las variables --dz-*, así que este botón
   (usado también en el reloj de Impresión/Empaque/Rebobinado) usa los tokens de tema
   generales — si no, quedaba oscuro fijo sin importar el tema activo. */
.dz-act-ghost{border-color:var(--border2);background:var(--bg3);color:var(--text2)}
.dz-act-ghost:hover{border-color:var(--blue);color:var(--text)}
/* ── tabs (no botones) + tira de versiones + bloque Forma ── */
/* Mismo formato de pestaña que Impresión (.qd-tab-btn): píldora con borde, no subrayado. */
.dzp .dz-tabs{display:flex;gap:8px;border-bottom:0;margin:14px 0}
.dzp .dz-tabs button{border:1px solid var(--dz-b);background:transparent;color:var(--dz-t2);font-family:var(--font-sans);font-size:15px;font-weight:600;padding:10px 18px;border-radius:6px;cursor:pointer;transition:.15s}
.dzp .dz-tabs button:hover{background:var(--dz-s3)}
.dzp .dz-tabs button.on{background:var(--dz-acc-bg);border-color:var(--dz-acc-b);color:var(--dz-acc2);box-shadow:0 0 0 1px var(--dz-acc-b),0 4px 16px -8px var(--dz-acc)}
.dzp .dz-verstrip{display:flex;gap:7px;flex-wrap:wrap;padding:12px 0 4px}
.dzp .dz-verchip{display:flex;align-items:center;gap:9px;border:1px solid var(--dz-b);background:var(--dz-s2);border-radius:6px;padding:6px 11px 6px 7px;color:var(--dz-t2);cursor:pointer;text-align:left;transition:.15s;line-height:1.25}
.dzp .dz-verchip:hover{border-color:var(--dz-acc-b);transform:translateY(-1px)}
.dzp .dz-verchip.on{border-color:var(--dz-acc);background:var(--dz-acc-bg);box-shadow:0 0 0 1px var(--dz-acc)}
.dzp .dz-verchip-th{width:34px;height:34px;flex-shrink:0;border-radius:4px;border:1px solid var(--dz-b2);background:var(--dz-s4) center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.dzp .dz-verchip-th-empty{color:var(--dz-b2);font-size:15px}
.dzp .dz-verchip-tx{display:flex;flex-direction:column}
.dzp .dz-verchip-m{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dz-mut)}
.dzp .dz-verchip-v{font-size:12px;color:var(--dz-t3);font-weight:600}
.dzp .dz-tabbody{margin-top:8px}
/* bloque del motivo (paridad con la ficha) */
.dzp .dz-mblock{border:1px solid var(--dz-b);border-radius:6px;background:var(--dz-s3);overflow:hidden}
.dzp .dz-mblock-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 13px;border-bottom:1px solid var(--dz-b);background:var(--dz-s2)}
.dzp .dz-mtab{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--dz-acc2);border:1px solid var(--dz-acc-b);background:var(--dz-acc-bg);border-radius:4px;padding:4px 9px}
.dzp .dz-mstats{display:flex;gap:22px;flex-wrap:wrap;margin-left:auto}
.dzp .dz-mstat{display:flex;flex-direction:column;align-items:flex-end}
.dzp .dz-mstat span{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--dz-mut)}
.dzp .dz-mstat b{font-size:14px;color:var(--dz-t3)}
.dzp .dz-mstats.dz-mstats-solo{margin-left:0;gap:28px;padding:4px 2px 10px;border-bottom:1px solid var(--dz-b)}
.dzp .dz-mstats-solo .dz-mstat{align-items:flex-start}
.dzp .dz-mstats-solo .dz-mstat b{font-size:15px}
.dzp .dz-mpanels{display:grid;grid-template-columns:1fr;gap:12px;padding:12px 13px}
.dzp .dz-mpanel{border:1px solid var(--dz-b);border-radius:5px;background:var(--dz-s2);padding:10px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:rgba(11,129,184,.42) transparent}
.dzp .dz-mpanel::-webkit-scrollbar{width:8px;height:8px}
.dzp .dz-mpanel::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(11,129,184,.38)}
.dzp .dz-mpanel::-webkit-scrollbar-track{background:transparent}
.dzp .dz-mpanel-t{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--dz-mut);margin-bottom:8px}
.dzp .dz-mpanel .dz-tt th,.dzp .dz-mpanel .dz-tt td{padding:6px 7px;font-size:12px;white-space:nowrap}
.dzp .dz-mpanel .dz-tt td.ta-r,.dzp .dz-mpanel .dz-tt th.ta-r{text-align:right}
.dzp .dz-tt tr.dz-vsel td{background:var(--dz-acc-bg)}
.dzp .dz-art-empty{color:var(--dz-mut);font-size:12px;font-family:var(--font-mono)}
.dzp .dz-forma-block{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--dz-s3);border:1px solid var(--dz-b);border-radius:6px;padding:12px 14px}
@media(max-width:620px){.dzp .dz-forma-block{grid-template-columns:1fr}}
.dzp .dz-forma-lbl{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--dz-mut);margin-bottom:6px}
.dzp .dz-forma-select{width:100%;max-width:280px;background:var(--dz-s4);border:1px solid var(--dz-b2);color:var(--dz-t);border-radius:5px;padding:12px 14px;font-family:var(--font-sans);font-size:13px}
.dzp .dz-forma-select:focus{outline:0;border-color:var(--dz-acc)}
.dzp .dz-forma-diag{display:flex;flex-direction:column;align-items:center;gap:4px}
.dzp .dz-forma-atop{font-family:var(--font-mono);font-size:10px;color:var(--dz-t2)}
.dzp .dz-forma-mid{display:flex;align-items:center;gap:8px}
.dzp .dz-forma-mid svg *{fill:var(--dz-acc-bg);stroke:var(--dz-acc);stroke-width:2}
.dzp .dz-forma-aside{font-family:var(--font-mono);font-size:10px;color:var(--dz-t2);writing-mode:vertical-rl;text-orientation:mixed}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(2px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;width:440px;max-width:96vw;padding:22px;max-height:90vh;overflow-y:auto}
/* Título de cualquier modal del módulo — letra grande y con un resplandor azulado sutil (a
   pedido del dueño: los modales se veían "tristes", sin vida). Aplica a todos, del más chico
   (editar un valor) al más grande (Pausa/Estación). */
.modal h3{font-size:18px;font-weight:700;color:#0b6fb8;text-shadow:0 0 10px rgba(11,111,184,.28);margin-bottom:14px;letter-spacing:.01em}
html[data-theme="dark"] .modal h3{color:#6fc3ff;text-shadow:0 0 12px rgba(111,195,255,.5)}
/* Pausa / Estación — pantallas que usa el operario en planta, en tablet. Más anchas para que
   la letra grande y los botones no se apiñen, y con un borde degradado azul→púrpura debajo del
   título (el mismo resplandor "neón" que el resto, pero más vistoso al ser la pantalla que más
   usa el operario). */
.modal-pausa,.modal-estacion{width:600px}
.modal-pausa h3,.modal-estacion h3{padding-bottom:14px;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--blue),var(--purple)) 1}
@keyframes modal-pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-pop{animation:modal-pop .24s cubic-bezier(.22,.9,.32,1)}
/* Cierre suave estilo macOS: el modal se encoge y se desvanece antes de desaparecer, en vez de
   cortar de golpe (aplica a todos los modales del módulo, no solo al completar una orden). */
@keyframes modal-close{0%{transform:scale(1);opacity:1}100%{transform:scale(.94);opacity:0}}
.modal-closing{animation:modal-close .22s cubic-bezier(.4,0,.2,1) forwards}
@keyframes overlay-close{0%{opacity:1}100%{opacity:0}}
.overlay-closing{animation:overlay-close .22s ease forwards}
.modal.modal-order{width:720px;padding:0}
.modal.modal-order.mes-wide{width:1080px;max-width:96vw}
/* Impresión alterna Datos de Producción ↔ Detalle de Máquina en el mismo modal — sin esto el
   modal encogía/crecía de golpe al cambiar de panel; con min-height igual al max-height del
   modal, el tamaño se mantiene fijo (grande) sin importar cuál de los dos esté visible. */
.modal.modal-order.impresion-tall{min-height:90vh}
/* Diseño / Preprensa / Tintas — mismo criterio: alto fijo para que la ventana no cambie de
   tamaño al alternar pestañas ni al elegir una estación del Detalle de Máquina. */
.modal.modal-order.proceso-tall{min-height:90vh}
.modal-order-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:1}
.modal-order-id{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--blue)}
.modal-order-name{font-family:var(--font-mono);font-size:17px;color:var(--text);margin-top:2px}
.modal-order-customer{font-size:17px;color:var(--text3);margin-top:2px}
.modal-close-x{font-size:16px;line-height:1;background:transparent;border:0;color:var(--text3);cursor:pointer;padding:6px;border-radius:4px;transition:.12s}
.modal-close-x:hover{color:var(--text);background:var(--bg3)}
.modal-order-body{padding:20px 22px 22px}
.qd-tabs-bottom{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.qd-tabs-top{display:flex;gap:8px;margin:14px 0}
.qd-tab-btn{font-family:var(--font-sans);font-size:15px;font-weight:600;padding:10px 18px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:.15s}
/* Mismo celeste vivo que ya usan las pestañas de Diseño/Preprensa/Tintas (.dzp .dz-tabs
   button.on) — antes Impresión/Rebobinado/Empaque/Aprobaciones usaban el azul genérico del
   sistema, más apagado, y se veían distintas al resto. */
.qd-tab-btn.active{background:#e6f4fb;border-color:#8fc8e2;color:#0e6f9c;box-shadow:0 0 0 1px #8fc8e2,0 4px 16px -8px #0b81b8}
html[data-theme="dark"] .qd-tab-btn.active{background:#102a39;border-color:#237da5;color:#59ceff;box-shadow:0 0 0 1px #237da5,0 4px 16px -8px #22a7e8}
.qd-tab-btn:hover:not(.active){background:var(--bg2)}
.modal-sub{font-family:var(--font-mono);font-size:15px;color:var(--text3);margin-bottom:16px}
/* Etiquetas de sección — el mismo resplandor "neón" que los títulos, pero en púrpura para que
   se note la jerarquía (título=azul, subtítulo=púrpura) sin perder legibilidad. */
.section-lbl{font-family:var(--font-mono);font-size:15px;font-weight:600;color:#7c3aed;text-shadow:0 0 8px rgba(124,58,237,.22);letter-spacing:.04em;margin:18px 0 10px}
.section-lbl:first-of-type{margin-top:0}
html[data-theme="dark"] .section-lbl{color:#c9a8ff;text-shadow:0 0 10px rgba(201,168,255,.4)}
.reason-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.rbtn{font-size:15px;padding:13px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;text-align:left;line-height:1.4;transition:.15s}
.rbtn:hover{border-color:var(--border2);transform:translateY(-1px)}
.rbtn.sel-amber{border-color:var(--amber-border);background:var(--amber-bg);color:var(--amber);box-shadow:0 0 0 1px var(--amber-border),0 4px 14px -6px var(--amber)}
.rbtn.sel-red{border-color:var(--red-border);background:var(--red-bg);color:var(--red);box-shadow:0 0 0 1px var(--red-border),0 4px 14px -6px var(--red)}
.rbtn.sel-green{border-color:var(--green-border);background:var(--green-bg);color:var(--green);box-shadow:0 0 0 1px var(--green-border),0 4px 14px -6px var(--green)}
.rbtn.sel-blue{border-color:var(--blue-border);background:var(--blue-bg);color:var(--blue);box-shadow:0 0 0 1px var(--blue-border),0 4px 14px -6px var(--blue)}
.note-input{width:100%;font-size:15px;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);resize:vertical;min-height:60px;margin-bottom:16px;outline:none;font-family:var(--font-sans)}
.note-input:focus{border-color:var(--blue-border);box-shadow:0 0 0 3px rgba(11,129,184,.15)}
.modal-btns{display:flex;gap:14px;justify-content:flex-end;margin-top:18px}
.mbtn-cancel{font-family:var(--font-mono);font-size:15px;padding:13px 26px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;flex:1;text-align:center}
.mbtn-confirm{font-family:var(--font-mono);font-size:15px;padding:13px 26px;border-radius:8px;cursor:pointer;transition:.15s;flex:1;text-align:center}
.mbtn-amber{border:1px solid var(--amber-border);background:var(--amber-bg);color:var(--amber)}
.mbtn-blue{border:1px solid var(--blue-border);background:var(--blue-bg);color:var(--blue)}
.mbtn-green{border:1px solid var(--green-border);background:var(--green-bg);color:var(--green)}
.mbtn-red{border:1px solid var(--red-border);background:var(--red-bg);color:var(--red)}

/* ── MODAL ORDEN BLOQUEADA (Punto 3) ── */
.modal-blocked{width:520px;max-width:96vw;padding:0}
.modal-blocked-hdr{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--border)}
