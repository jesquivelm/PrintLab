.modal-blocked-icon{width:48px;height:48px;border-radius:12px;background:var(--amber-bg);border:1px solid var(--amber-border);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.modal-blocked-title{font-size:17px;font-weight:600;color:var(--text)}
.modal-blocked-body{padding:20px 24px}
.modal-blocked-msg{font-size:14px;color:var(--text2);margin-bottom:16px;line-height:1.5}
.modal-blocked-order{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:18px}
.modal-blocked-order-id{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--amber)}
.modal-blocked-order-name{font-size:14px;color:var(--text);margin-top:4px}
.modal-blocked-order-status{font-family:var(--font-mono);font-size:13px;color:var(--text2);margin-top:6px}
.modal-blocked-footer{display:flex;gap:8px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--border)}

/* ── MES panel ── */
.mes-panel{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:14px;margin-top:10px}
.mes-svg-wrap{overflow-x:auto;margin-bottom:14px;cursor:grab;user-select:none}
.mes-svg-wrap.mes-dragging,.mes-stations-row.mes-dragging{cursor:grabbing;user-select:none}
.st-active{stroke:#f59e0b!important;stroke-width:3px!important;filter:drop-shadow(0 0 8px rgba(245,158,11,0.5))}
.mes-form{background:var(--bg2);border-radius:4px;border:1px solid var(--border);padding:12px}
.mes-form-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.mes-nodo-tipo{font-family:var(--font-mono);font-size:13px;color:var(--amber);font-weight:700;letter-spacing:.08em}
.mes-nodo-titulo{font-size:13px;font-weight:600;color:var(--text)}
.mes-color-pick{display:flex;align-items:center;gap:6px;background:var(--bg3);padding:4px 10px;border-radius:3px;border:1px solid var(--border)}
.mes-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mes-field-group{background:var(--bg3);border-radius:4px;border:1px solid var(--border);padding:10px}
.mes-field-lbl{font-family:var(--font-mono);font-size:13px;color:var(--text3);letter-spacing:.08em;margin-bottom:6px;font-weight:700}
.mes-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:5px 8px;font-size:13px;color:var(--text2);margin-bottom:6px;font-family:var(--font-mono);outline:none}
.mes-input:focus{border-color:var(--blue-border);color:var(--text)}
.mes-select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:5px 8px;font-size:13px;color:var(--text2);font-family:var(--font-mono)}
.mes-save-btn{font-family:var(--font-mono);font-size:13px;padding:7px 18px;border-radius:3px;background:#d97706;border:none;color:#fff;cursor:pointer;font-weight:700;transition:.15s}
.mes-save-btn:hover{background:#f59e0b}

/* ── TABLA VOLTEADA DE TINTAS (Impresión, pestaña Máquina): estaciones en columna,
   datos en fila — mismo patrón de scroll "Scrollbar Azul" que el resto del sistema. */
.imp-piv-wrap{overflow-x:auto;scrollbar-width:thin;scrollbar-color:rgba(11,129,184,.42) transparent}
.imp-piv-wrap::-webkit-scrollbar{width:8px;height:8px}
.imp-piv-wrap::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(11,129,184,.38)}
.imp-piv-wrap::-webkit-scrollbar-track{background:transparent}
.imp-piv-table{border-collapse:collapse;width:100%;font-size:16px}
.imp-piv-table th,.imp-piv-table td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.imp-piv-table thead th{font-family:var(--font-mono);font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);text-align:center;border-bottom:1px solid var(--border2)}
.imp-piv-table .imp-piv-lbl{color:var(--text2);font-weight:600;text-align:left;position:sticky;left:0;background:var(--bg2)}
.imp-piv-table .ta-c{text-align:center;font-family:var(--font-mono);color:var(--text)}
.imp-piv-table td.qd-editado{color:var(--blue)}
.imp-piv-edit{margin-left:6px;font-size:10px;padding:1px 6px;vertical-align:middle}
.dz-tinta-dot-circle{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:middle;border:1px solid rgba(128,128,128,.5);background:var(--dz-tinta-dot,transparent)}

/* ── TARJETAS HORIZONTALES DE ESTACIÓN (tinta + anilox por estación, Impresión) ── */
.mes-stations-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;
  cursor:grab;
  scrollbar-width:thin;scrollbar-color:rgba(11,129,184,0.42) transparent}
.mes-stations-row::-webkit-scrollbar{width:8px;height:8px}
.mes-stations-row::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(11,129,184,0.38)}
.mes-stations-row::-webkit-scrollbar-track{background:transparent}
.mes-station-card{flex:0 0 190px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:10px;display:flex;flex-direction:column}
.mes-station-card.barniz{border-color:var(--varnish-border);background:var(--varnish-bg)}
.mes-station-card.barniz .mes-sc-title{color:var(--varnish)}
.mes-station-card.goma{border-color:#0891b2;background:#0b2027}
.mes-station-card.special{border-style:dashed}
.mes-station-card.laminado{border-color:#0ea5e9}
.mes-station-card.estampado{border-color:goldenrod}
.mes-sc-acabado-detalle{font-size:13px;color:var(--text2);background:var(--bg3);border-radius:3px;padding:4px 6px;margin:4px 0}
.mes-station-card.empty{opacity:.6;justify-content:flex-start}
.mes-sc-empty-note{margin-top:8px;font-size:13px;color:var(--text3);text-align:center}
.mes-station-card.selected{border-color:#f59e0b;box-shadow:0 0 0 1px #f59e0b,0 0 14px rgba(245,158,11,.45)}
.mes-sc-hdr{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.mes-sc-dot{width:10px;height:10px;border-radius:2px;background:var(--border2);flex-shrink:0;border:1px solid var(--border)}
.mes-sc-title{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--text2);letter-spacing:.05em}
.mes-sc-lbl{display:block;font-size:13px;color:var(--text3);margin:6px 0 3px}
.mes-sc-spectro-btn{width:100%;margin-top:8px;font-family:var(--font-mono);font-size:13px;padding:5px 8px;border-radius:3px;border:1px solid var(--blue-border);background:var(--blue-bg);color:var(--blue);cursor:pointer;transition:.15s}
.mes-sc-spectro-btn:hover{background:var(--blue-border);color:#fff}

/* ── Bloque A · Detalle de Máquina compartido ── */
.mes-panel-hdr{font-family:var(--font-mono);font-size:13px;color:var(--amber);letter-spacing:.1em;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.mes-guardar-btn{margin-top:4px;font-family:var(--font-mono);font-size:13px;padding:7px 14px;border-radius:4px;border:1px solid var(--green-border);background:var(--green-bg);color:var(--green);cursor:pointer;transition:.15s}
.mes-guardar-btn:hover{background:var(--green-border);color:#fff}
/* grip de arrastre + botones mover ◀▶ en el encabezado de la tarjeta */
.mes-sc-grip{cursor:grab;color:var(--text3);font-size:12px;letter-spacing:-2px;user-select:none}
.mes-sc-grip:active{cursor:grabbing}
.mes-sc-title,.mes-sc-dot{cursor:pointer}
.mes-sc-move{margin-left:auto;display:flex;gap:2px}
.mes-sc-move button{border:0;background:transparent;color:var(--text3);cursor:pointer;font-size:11px;padding:2px 3px;line-height:1;border-radius:3px}
.mes-sc-move button:hover:not(:disabled){color:var(--text);background:var(--bg3)}
.mes-sc-move button:disabled{opacity:.3;cursor:default}
.mes-station-card.is-dragging{opacity:.45}
.mes-station-card.drag-over{outline:2px dashed var(--blue-border);outline-offset:-2px}
/* fila editable cotizado ↔ real por estación */
.mes-sc-ed{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:5px 22px 5px 8px;margin-bottom:6px;cursor:pointer;transition:.12s}
.mes-sc-ed:hover{border-color:var(--blue-border)}
.mes-sc-ed-v{display:block;font-family:var(--font-mono);font-size:13px;color:var(--text)}
.mes-sc-ed-cot{display:block;font-size:11px;color:var(--text3);margin-top:1px}
.mes-sc-actions{display:flex;align-items:center;gap:6px;margin-top:4px}

/* ── BADGE DE APROBACIÓN DE ESTACIONES ── */
.mes-approval-badge{font-family:var(--font-mono);font-size:13px;padding:3px 9px;border-radius:3px;border:1px solid var(--border2);background:var(--bg3);color:var(--text3)}
.mes-approval-badge.on{border-color:var(--green-border);background:var(--green-bg);color:var(--green)}
.station-history-btn.approve-btn{border-color:var(--blue-border);background:var(--blue-bg);color:var(--blue)}
.station-history-btn.approve-btn:hover{background:var(--blue-border);color:#fff}

/* ── HISTORIAL ESPECTROFOTOMÉTRICO ── */
.spectro-history{margin-top:10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.spectro-history-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--bg3)}
.spectro-history-title{font-family:var(--font-mono);font-size:13px;color:var(--text3);letter-spacing:.08em}
.spectro-history-table{width:100%;font-size:13px;font-family:var(--font-mono);border-collapse:collapse}
.spectro-history-table th{padding:4px 6px;text-align:center;color:var(--text3);font-size:13px;border-bottom:1px solid var(--border);background:var(--bg3)}
.spectro-history-table td{padding:4px 6px;text-align:center;border-bottom:1px solid var(--border);color:var(--text2)}
.spectro-history-table tr:last-child td{border-bottom:none}
.spectro-history-table .ok-val{color:var(--green)}
.spectro-history-table .out-val{color:var(--red)}
.spectro-save-btn{font-family:var(--font-mono);font-size:13px;padding:4px 12px;border-radius:3px;border:1px solid var(--blue-border);background:var(--blue-bg);color:var(--blue);cursor:pointer;transition:.15s}
.spectro-save-btn:hover{background:var(--blue-border);color:#fff}

/* ── HISTORIAL DE CONFIGURACIÓN DE ESTACIONES ── */
.station-history-bar{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px;margin-bottom:10px}
.station-history-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.station-history-title{font-family:var(--font-mono);font-size:13px;color:var(--text3);letter-spacing:.1em;flex:1}
.station-history-btn{font-family:var(--font-mono);font-size:13px;padding:4px 10px;border-radius:3px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);cursor:pointer;transition:.15s;display:flex;align-items:center;gap:4px}
.station-history-btn:hover{border-color:#f59e0b;color:#f59e0b}
.station-history-btn.active{border-color:#f59e0b;background:#2a1f00;color:#f59e0b}
.station-history-btn.save-btn{border-color:var(--green-border);background:var(--green-bg);color:var(--green)}
.station-history-btn.save-btn:hover{background:var(--green-border);color:#fff}
.station-history-list{max-height:0;overflow:hidden;transition:max-height .3s ease}
.station-history-list.open{max-height:300px;overflow-y:auto}
.station-history-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--border);cursor:pointer;transition:.12s}
.station-history-item:hover{background:var(--bg2)}
.station-history-item:last-child{border-bottom:none}
.station-history-date{font-family:var(--font-mono);font-size:13px;color:var(--text3);min-width:90px}
.station-history-operator{font-size:13px;color:var(--text2);flex:1}
.station-history-stations{font-family:var(--font-mono);font-size:13px;color:var(--text3);display:flex;gap:3px}
.station-history-chip{width:12px;height:12px;border-radius:2px;border:1px solid var(--border)}

/* ── SOLICITUD MATERIA PRIMA ── */
.mp-panel{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:10px}
.mp-panel-hdr{font-family:var(--font-mono);font-size:13px;color:var(--cyan);letter-spacing:.08em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.mp-material-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.mp-material-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.mp-label{font-family:var(--font-mono);font-size:13px;color:var(--text3);letter-spacing:.06em;margin-bottom:4px}
.mp-mat-name{font-size:13px;color:var(--text);font-weight:500;margin-bottom:2px}
.mp-mat-unit{font-family:var(--font-mono);font-size:13px;color:var(--text3)}
.mp-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:5px 8px;font-size:13px;color:var(--text);font-family:var(--font-mono);outline:none;text-align:right}
.mp-input:focus{border-color:var(--cyan);color:var(--cyan)}
.mp-total-chip{font-family:var(--font-mono);font-size:13px;padding:3px 8px;border-radius:3px;background:var(--bg);border:1px solid var(--border);color:var(--text3);white-space:nowrap}
.mp-total-chip.has-val{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.mp-request-btn{font-family:var(--font-mono);font-size:13px;padding:5px 12px;border-radius:3px;border:1px solid var(--cyan-bg);border-color:#0e7490;background:var(--cyan-bg);color:var(--cyan);cursor:pointer;transition:.15s;white-space:nowrap}
.mp-request-btn:hover{background:#0e7490;color:#fff}
.mp-request-btn.sent{border-color:var(--green-border);background:var(--green-bg);color:var(--green);cursor:default}

/* ── SVG Machine animations ── */
@keyframes spin-cw{from{transform-origin:center;transform:rotate(0deg)}to{transform-origin:center;transform:rotate(360deg)}}
@keyframes dash-move{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
@keyframes dash-move-fast{from{stroke-dashoffset:20}to{stroke-dashoffset:0}}
.rot-cw{animation:spin-cw 3s linear infinite;transform-box:fill-box;transform-origin:center}
.rot-cw-slow{animation:spin-cw 5s linear infinite;transform-box:fill-box;transform-origin:center}
.rot-cw-fast{animation:spin-cw 1.5s linear infinite;transform-box:fill-box;transform-origin:center}
.paper-flow{animation:dash-move 0.6s linear infinite}
.paper-flow-fast{animation:dash-move-fast 0.4s linear infinite}

.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--green-border);border-radius:4px;padding:10px 16px;font-family:var(--font-mono);font-size:13px;color:var(--green);z-index:300;display:none;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.empty{text-align:center;padding:3rem;color:var(--text3);font-size:13px}
.empty-icon{font-size:28px;margin-bottom:10px}
*{scrollbar-width:thin;scrollbar-color:rgba(11,129,184,.42) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(11,129,184,.38);border-radius:999px}
</style>
</head>
<body>
<div class="shell">
<!-- TOP BAR -->
<div class="topbar">
  <div class="tb-left">
    <div class="dz-clock-wrap tb-clock-wrap">
      <div class="dz-clock" id="clockEl">--:--:--</div>
      <div class="dz-clock-side">
        <div class="date-lbl" id="dateEl">—</div>
        <span class="shift-badge sn" id="shiftBadge">—</span>
      </div>
    </div>
    <button class="fmt-toggle" id="fmtBtn" onclick="toggleFmt()" title="Cambiar formato de hora">24H / AM·PM</button>
  </div>
  <div class="tb-right">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" style="color:var(--text3)"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.314 2.686-6 6-6s6 2.686 6 6"/></svg>
    Operador: <span id="operatorName" class="operator-name">Usuario activo</span>
    <button type="button" class="theme-hdr-btn" id="cambiarOperarioBtn" onclick="openCambiarOperarioModal()" title="Cambiar de operario">
      <span id="cambiarOperarioIcon"></span>
    </button>
    <button type="button" class="theme-hdr-btn" id="cerrarSesionBtn" onclick="openCerrarSesionModal()" title="Cerrar sesión">
      <span id="cerrarSesionIcon"></span>
    </button>
    <button type="button" class="theme-hdr-btn" id="prodSearchToggleBtn" onclick="toggleProdSearchPanel()" title="Buscar orden">
      <span id="prodSearchToggleIcon"></span>
    </button>
    <div class="prod-search-wrap" id="prodSearchRow">
      <input id="prodSearchInput" class="prod-search" type="search" placeholder="Buscar por orden, cliente, vendedor, producto, sustrato, tintas, contacto, barniz o troquel...">
      <button type="button" class="prod-search-clear" id="prodSearchClear" title="Quitar búsqueda" style="display:none">✕</button>
    </div>

<script>
// ════════════════════════════════════════════
// DATA
// ════════════════════════════════════════════
const PROCS=[
  {id:'diseno',lbl:'Diseño',machines:null,cats:['Arte incompleto','Cliente no aprueba','Archivo corrupto','Cambio de especificación']},
  {id:'preprensa',lbl:'Preprensa',machines:null,cats:['Error de separación de color','Archivo de baja resolución','Cambio de tinta']},
  {id:'visto_bueno',lbl:'Aprobaciones',machines:null,cats:['Muestra fuera de especificación','Aprobación pendiente de cliente']},
  {id:'tintas',lbl:'Tintas',machines:null,cats:['Tono fuera de especificación','Viscosidad incorrecta','Falta de pigmento','Contaminación de tinta','Falta de solvente']},
  {id:'impresion',lbl:'Impresión',machines:[],cats:['Sello dañado','Color fuera de tono','Desregistro','Sustrato dañado','Mancha / repinte','Falla mecánica','Reimprimir sello','Cambio de tinta','Velocidad fuera de rango']},
  {id:'rebobinado',lbl:'Rebobinado',machines:[],cats:['Tensión incorrecta','Desalineación de bobina','Núcleo equivocado']},
  {id:'empaque',lbl:'Empaque',machines:null,cats:['Material insuficiente','Error de conteo','Caja equivocada']},
];
// Procesos que realmente utilizan máquinas (Punto 5)
const PROCESOS_CON_MAQUINA=['impresion','rebobinado'];

// Devoluciones de proceso: paso de atrás de cada proceso y configuración motivo→destino.
const PROCESO_ANTERIOR={impresion:'tintas',tintas:'preprensa',preprensa:'diseno'};
const PROC_LABEL_DEVOL={impresion:'Impresión',tintas:'Tintas',preprensa:'Preprensa',diseno:'Diseño'};
let DEVOL_CONFIG=[];
async function loadDevolConfig(){
  try{
    const r=await fetch('/api/produccion/devoluciones-config',{headers:sessionHeader()});
    const p=await r.json().catch(()=>({}));
    if(r.ok&&Array.isArray(p.items))DEVOL_CONFIG=p.items;
  }catch(e){/* sin config: se usa el paso de atrás por defecto */}
}
// Devuelve la clave del paso de atrás para un motivo, o null si es pausa normal.
function destinoDeMotivo(procId,motivo){
  const cfg=DEVOL_CONFIG.find(c=>c.procesoOrigen===procId&&c.motivo===motivo&&c.activo);
  if(cfg){if(cfg.esDevolucion===false)return null;return cfg.destino||PROCESO_ANTERIOR[procId]||null;}
  return null;
}

const PERSONAL=[
  {id:'lunch',lbl:'🍽 Almuerzo',dur:30},{id:'coffee',lbl:'☕ Café / merienda',dur:15},
  {id:'dinner',lbl:'🌙 Cena',dur:30},{id:'breakfast',lbl:'🌅 Desayuno',dur:20},
  {id:'wc',lbl:'🚻 Baño',dur:10},{id:'personal',lbl:'🧍 Tiempo personal',dur:0},
];
const MAINT=[
  {id:'prev',lbl:'🔧 Mantenimiento preventivo'},{id:'corr',lbl:'🔩 Mantenimiento correctivo'},
  {id:'clean',lbl:'🧹 Limpieza de máquina'},{id:'safety',lbl:'⚠️ Seguridad / incidente'},
];

// Materiales por tipo con unidades
const MP_MATERIALS=[
  {id:'mp-tinta',name:'Tintas',unit:'kg',unitLabel:'Kilogramos (kg)',icon:'🎨',color:'var(--purple)'},
  {id:'mp-barniz',name:'Barniz',unit:'kg',unitLabel:'Kilogramos (kg)',icon:'✨',color:'var(--amber)'},
  {id:'mp-laminado',name:'Laminado',unit:'ft',unitLabel:'Pies lineales (ft)',icon:'📄',color:'var(--cyan)'},
  {id:'mp-foil',name:'Foil (Estampado)',unit:'ft',unitLabel:'Pies lineales (ft)',icon:'🌟',color:'var(--amber)'},
  {id:'mp-sellos',name:'Sellos',unit:'ft²',unitLabel:'Pies cuadrados (ft²)',icon:'🖼',color:'var(--green)'},
];

let COUNTS={};
let productionRoutes=[];
let productionProcesses=[];
let productionUser='';

function nowSim(){return new Date();}

// ════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════
let activeProc=null,activeMach=null;
let openCards=new Set();
let orderStates={};
let orderStartTime={};
let pauseStarts={};
let pauseTimerIvs={};
let openLogs=new Set();
let eventLogs={};
let mesOpenFor=null;
let mpOpenFor=null; // panel materia prima
let sentMats=new Set();
let use24=false;
// Historial espectrofotométrico: {oid_colorInst: [{ts, L, a, b, lMin,lStd,lMax,aMin,aStd,aMax,bMin,bStd,bMax, ok}]}
let spectroHistory={};
// Solicitudes materia prima: {oid: {mp-tinta: {qty, history:[{qty,ts}]}, ...}}
let mpData={};

// active: null | 'laminado' | 'troquelado' | 'spectro' — qué sub-panel de detalle se muestra
// debajo de la tira de tarjetas de estación (tinta/anilox ya se editan directo en la tarjeta).
const mesState={active:null,inst:1};

// La misma orden puede tener una ruta en varios procesos a la vez (impresión, tintas, rebobinado...);
// el estado (en curso, pausada, hora de inicio, log, etc.) debe guardarse por RUTA, no por orden,
// para que iniciar/pausar en un proceso no se refleje incorrectamente en los demás.
function orderKey(x){
  if(x&&typeof x==='object')return x.routeId||x.id;
  return findOrderRouteId(x)||x;
}

const SESSION_STORAGE_KEY='erp-user-session';
function readUserSession(){
  try{return JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY)||sessionStorage.getItem(SESSION_STORAGE_KEY)||'null');}catch(e){return null;}
}
function currentUserName(){
  const s=readUserSession();
  return (s&&(s.name||s.fullName||s.user||s.username))||productionUser||'Usuario activo';
}
function currentMachineName(){
  if(mesOpenFor){
    const route=productionRoutes.find(r=>r.routeId===mesOpenFor);
    if(route)return route.machineName||'';
  }
  return '';
}
function sessionHeader(){
  const s=readUserSession();
  if(!s)return{};
  return {'x-erp-session':JSON.stringify({
    id:s.id||s.userId||s.sessionId||'',
    userId:s.userId||s.id||'',
    username:s.username||s.user||'',
    user:s.user||s.username||'',
    name:s.name||s.fullName||s.user||s.username||'',
    fullName:s.fullName||s.name||'',
    permissionName:s.permissionName||'',
    modules:s.modules||{}
  })};
}
function syncOperatorName(){
  const node=document.getElementById('operatorName');
  if(node)node.textContent=currentUserName();
}

// ════════════════════════════════════════════
// CAMBIO DE OPERARIO (reloj + PIN) — para que, cuando dos o más personas se turnan
// en el mismo proceso, quede marcado en qué momento entró cada quien. Si hay una
// orden activa en la pestaña actual, ese cambio también se manda como evento
// 'operario_cambio' para que la sumatoria de fases reparta el tiempo entre las
// personas correctas.
function writeUserSession(user){
  const yaEnLocal=localStorage.getItem(SESSION_STORAGE_KEY);
  if(yaEnLocal)localStorage.setItem(SESSION_STORAGE_KEY,JSON.stringify(user));
  else sessionStorage.setItem(SESSION_STORAGE_KEY,JSON.stringify(user));
}
function openCambiarOperarioModal(){
  showModal2(`<h3>🕓 Cambiar de operario</h3>
    <div class="modal-sub">Quien va a tomar esta estación, que escriba su PIN.</div>
    <div class="section-lbl" style="margin-top:20px">PIN</div>
    <input class="note-input" id="cambioOpPinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••" style="min-height:auto;padding:12px 14px;font-family:var(--font-mono);text-align:center;letter-spacing:6px;font-size:18px" autofocus>
    <p id="cambioOpStatus" style="min-height:18px;font-size:13px;color:#b94848;margin:8px 0 0"></p>
    <div class="modal-btns">
      <button class="mbtn-cancel" onclick="closeModal2()">Cancelar</button>
      <button class="mbtn-confirm mbtn-blue" onclick="_confirmCambioOp()">Entrar</button>
    </div>`);
  setTimeout(()=>{
    const inp=document.getElementById('cambioOpPinInput');
    if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter')_confirmCambioOp();});}
  },0);
}
window._confirmCambioOp=async function(){
  const inp=document.getElementById('cambioOpPinInput');
  const statusEl=document.getElementById('cambioOpStatus');
  const pin=(inp&&inp.value||'').trim();
  if(!/^\d{4}$/.test(pin)){if(statusEl)statusEl.textContent='El PIN debe tener 4 dígitos.';return;}
  try{
    const r=await fetch('/api/auth/login-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok){if(statusEl)statusEl.textContent=d.error||'PIN incorrecto.';return;}
    writeUserSession(d.user);
    syncOperatorName();
    closeModal2();
    showToast(`🕓 Ahora trabaja ${d.user.name}`);
    const activo=findActiveOrderInProcess(null);
    if(activo){
      try{await postMesEvent(activo.id,'operario_cambio','Cambio de operario');}catch(e){/* el cambio de sesión ya quedó, el evento es un extra */}
    }
  }catch(e){if(statusEl)statusEl.textContent='No fue posible conectar. Intenta de nuevo.';}
}
// Sin esto, el operario no tenía forma de salir: el trabajo del siguiente turno quedaba
// registrado a nombre de quien entró primero, hasta que alguien más tocara "Cambiar de
// operario". Este botón cierra la sesión de una vez y manda al login para el que sigue.
function openCerrarSesionModal(){
  showModal2(`<h3>🚪 Cerrar sesión</h3>
    <div class="modal-sub">¿Deseas cerrar tu sesión? El siguiente operario deberá ingresar su PIN para continuar.</div>
    <div class="modal-btns">
      <button class="mbtn-cancel" onclick="closeModal2()">Cancelar</button>
      <button class="mbtn-confirm mbtn-red" onclick="_confirmCerrarSesion()">🚪 Cerrar sesión</button>
    </div>`);
}
window._confirmCerrarSesion=function(){
  const session=window.ErpAccess?.readSession?.();
  try{window.ErpAccess?.notifyLogout?.(session,'manual');}catch(e){}
  try{window.ErpAccess?.clearSessionStorage?.();}catch(e){
    localStorage.removeItem(SESSION_STORAGE_KEY);
    sessionStorage.removeItem(SESSION_STORAGE_KEY);
  }
  (window.top||window).location.href='/login';
}
// 'cargando' hasta la primera respuesta buena del servidor; 'sin-respuesta' si esa primera
// carga falló. Después de la primera carga buena queda 'listo' y un refresco fallido no
// borra lo que ya se ve en pantalla.
let estadoFlujoProduccion='cargando';
async function loadProductionFlow(){
  let res,payload;
  try{
    res=await fetch('/api/produccion/flujo',{headers:sessionHeader()});
    payload=await res.json().catch(()=>({}));
  }catch(e){
    if(estadoFlujoProduccion!=='listo')estadoFlujoProduccion='sin-respuesta';
    throw new Error('La conexión está lenta. Seguimos intentando traer las órdenes.');
  }
  if(!res.ok){
    if(estadoFlujoProduccion!=='listo')estadoFlujoProduccion='sin-respuesta';
    throw new Error(payload.error||'La conexión está lenta. Seguimos intentando traer las órdenes.');
  }
  estadoFlujoProduccion='listo';
  productionUser=payload.user||productionUser;
  productionProcesses=Array.isArray(payload.processes)?payload.processes:[];
  productionRoutes=Array.isArray(payload.routes)?payload.routes:[];
  // Hidratar el reloj de la pausa desde el servidor: si la orden ya venía en pausa
  // (otra sesión, o el operario recargó), retomamos el mismo cronómetro en vez de
  // reiniciarlo a 0. No se pisa una pausa recién hecha en esta misma sesión.
  productionRoutes.forEach(r=>{
    if(r.pausedSince&&!pauseStarts[r.routeId]){
      const ts=new Date(r.pausedSince).getTime();
      if(!Number.isNaN(ts)){
        pauseStarts[r.routeId]={startTs:ts,reason:(r.pauseLabel||'').split('—')[0].split('(')[0].trim()||'Pausa',note:'',fromServer:true};
        orderStates[r.routeId]='paused';
      }
    }
    hidratarEventLogsDesdeServidor(r);
  });
  COUNTS={};
  productionProcesses.forEach(p=>{
    COUNTS[p.key]=Number(p.activeCount||0);
    const proc=PROCS.find(item=>item.id===p.key);
    if(proc){
      // Punto 5: solo mostrar máquinas en procesos que realmente las utilizan
      if(PROCESOS_CON_MAQUINA.includes(p.key)){
        proc.machines=Array.isArray(p.machines)&&p.machines.length?p.machines:null;
      }else{
        proc.machines=null;
      }
    }
  });
  syncOperatorName();
}
function routeStatusToCardStatus(status){
  const value=String(status||'').toUpperCase();
  if(value==='RUN'||value==='SETUP')return'inprog';
  if(value==='PARO')return'paused';
  if(value==='COMPLETADO')return'done';
  return'pending';
}
// Cliente + vendedor en una sola línea (ej. "Comercial Alimentos Monte Azul - Ana Solano"),
// mismo separador " - " que ya usa la búsqueda por lupa (renderProdSearchResults).
function dzClienteVendedorHtml(o,cls){
  const txt=[o&&o.customerName,o&&o.salespersonName].filter(Boolean).join(' - ');
  return txt?`<div class="${cls}">${dzEsc(txt)}</div>`:'';
}
function orderFromRoute(route){
  const start=route.plannedStartAt?new Date(route.plannedStartAt):new Date(route.createdAt||Date.now());
  if(Number.isNaN(start.getTime()))start.setTime(Date.now());
  const dur=Math.max(15,Math.round(Number(route.durationHours||0.5)*60));
  const end=new Date(start.getTime()+dur*60000);
  return {
    id:route.orderCode,
    routeId:route.routeId,
    name:route.productName||route.orderCode,
    customerName:route.customerName||'',
    salespersonName:route.salespersonName||'',
    h:start.getHours(),
    m:start.getMinutes(),
    dur,
    status:routeStatusToCardStatus(route.routeStatus),
    mats:[route.materialCode?{id:route.materialCode,name:route.materialCode,qty:route.plannedFeet?`${route.plannedFeet.toLocaleString('es-CR')} ft`:''}:null].filter(Boolean),
    startDt:start,
    endDt:end,
    actualStartDt:route.actualStartAt?new Date(route.actualStartAt):null,
    machineName:route.machineName||'',
    machineProfileId:route.machineProfileId||null,
    machineSpecs:route.machineSpecs||[],
    quantity:route.quantity!=null?Number(route.quantity):null,
    prioridad:route.prioridad||'normal',
    devolucion:route.devolucion||null,
    pausedSince:route.pausedSince||null,
    pauseLabel:route.pauseLabel||'',
    pauseOperator:route.pauseOperator||'',
    suspendidaProduccion:!!route.suspendidaProduccion,
    suspendidaMotivo:route.suspendidaMotivo||''
  };
}

// ════════════════════════════════════════════
// TIME UTILS
// ════════════════════════════════════════════
function pad2(n){return String(n).padStart(2,'0')}
function fmtH(d){
  if(use24)return`${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  let h=d.getHours(),ap=h>=12?'PM':'AM';h=h%12||12;
  return`${h}:${pad2(d.getMinutes())} ${ap}`;
}
function fmtDate(d){return`${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}`;}
function fmtTs(d){return`${fmtDate(d)} ${fmtH(d)}`;}
function fmtDuration(mins){
  const m=Math.round(Math.abs(mins||0));
  if(m<60)return`${m} min`;
  const h=Math.round(m/60);
  if(h<24)return`${h} h`;
  const d=Math.round(m/1440);
  if(d<30)return`${d} d`;
  const mo=Math.round(m/43200);
  if(mo<12)return`${mo} ${mo===1?'mes':'meses'}`;
  const y=Math.round(m/525600);
  return`${y} ${y===1?'año':'años'}`;
}
function fmtElapsedLong(mins){
  const m=Math.round(Math.abs(mins||0));
  if(m<60)return`${m} min`;
  const h=Math.floor(m/60),rem=m%60;
  if(h<24)return rem?`${h}h ${rem}min`:`${h}h`;
  return fmtDuration(m);
}
function makeDate(h,m){const n=nowSim(),d=new Date(n);d.setHours(h,m,0,0);if(h<SIM_START_H||(h===SIM_START_H&&m<SIM_START_M))d.setDate(d.getDate()+1);return d;}

function renderClock(){
  const n=nowSim();
  document.getElementById('clockEl').textContent=use24?`${pad2(n.getHours())}:${pad2(n.getMinutes())}:${pad2(n.getSeconds())}`:(()=>{let h=n.getHours(),ap=h>=12?'PM':'AM';h=h%12||12;return`${h}:${pad2(n.getMinutes())}:${pad2(n.getSeconds())} ${ap}`;})();
  document.getElementById('dateEl').textContent=n.toLocaleDateString('es-CR',{weekday:'long',day:'numeric',month:'long'});
  const hr=n.getHours();
  const badge=document.getElementById('shiftBadge');
  if(hr>=6&&hr<14){badge.className='shift-badge sd';badge.textContent='Turno Día';}
  else if(hr>=14&&hr<22){badge.className='shift-badge se';badge.textContent='Turno Tarde';}
  else{badge.className='shift-badge sn';badge.textContent='Turno Noche';}
}
function toggleFmt(){use24=!use24;renderClock();}

function makeOrders(pid,mid){
  const live=productionRoutes
    .filter(r=>r.processKey===pid)
    .filter(r=>!mid||r.machineName===mid)
    .map(orderFromRoute);
  if(live.length)return live;
  return [];
}

// ════════════════════════════════════════════
// STATUS / DELAY HELPERS
// ════════════════════════════════════════════
function stOf(o){return orderStates[orderKey(o)]||o.status}
function delayMin(o){
  const n=nowSim(),st=stOf(o);
  if(st==='done')return null;
  if(st==='pending'){const d=(n-o.startDt)/60000;return d>0?Math.round(d):null;}
  if(st==='inprog'){
    const elapsed=(n-(orderStartTime[orderKey(o)]||o.actualStartDt||o.startDt))/60000;
    return elapsed>o.dur?Math.round(elapsed-o.dur):null;
  }
  return null;
}
function tlProgress(o){
  const n=nowSim(),st=stOf(o);
  const total=o.dur*60000;
  if(st==='pending')return{plan:0,real:0,planAbsolute:0};
  if(st==='done')return{plan:100,real:100,done:true,planAbsolute:100};
  const startT=orderStartTime[orderKey(o)]||o.actualStartDt||o.startDt;
  const elapsed=Math.min(n-startT,total*2);
  const real=Math.min(100,(elapsed/total)*100);
  const plan=Math.min(100,((n-o.startDt)/total)*100);
  return{plan:Math.max(0,plan),real:Math.max(0,real),late:real>plan+5,planAbsolute:Math.max(0,plan)};
}
function cardBorder(o){
  const st=stOf(o);
  if(o.prioridad==='urgente')return'bl-red';
  if(st==='done')return'bl-gray';
  if(st==='paused')return o.suspendidaProduccion?'bl-red':'bl-amber';
  if(st==='inprog'){const d=delayMin(o);return d?'bl-red':'bl-blue';}
  const diff=(o.startDt-nowSim())/60000;
  if(diff<0)return'bl-red';
  if(diff<60)return'bl-amber';
  return'bl-green';
}
function chipInfo(o){
  const st=stOf(o);
  if(st==='done')return{cls:'done',lbl:'✓ Completado'};
  if(st==='paused')return o.suspendidaProduccion?{cls:'suspendida',lbl:'⛔ Suspendida'}:{cls:'paused',lbl:'⏸ Pausado'};
  if(st==='inprog'){const d=delayMin(o);return d?{cls:'late',lbl:`▶ +${fmtDuration(d)} atraso`}:{cls:'inprog',lbl:'▶ En curso'};}
  const diff=(o.startDt-nowSim())/60000;
  if(diff<0)return{cls:'late',lbl:`⚡ ${fmtDuration(-diff)} pendiente`};
  if(diff<60)return{cls:'ok',lbl:'Próximo'};
  return{cls:'pending',lbl:'Programado'};
}
const DIAS_SEMANA=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function dayLabel(dt){
  const n=nowSim(),nd=new Date(n);nd.setHours(0,0,0,0);
  const dd=new Date(dt);dd.setHours(0,0,0,0);
  const diff=Math.round((dd-nd)/86400000);
  if(diff===0)return`Hoy — ${fmtDate(dt)}`;
  if(diff===1)return`Mañana — ${fmtDate(dt)}`;
  return`${DIAS_SEMANA[dd.getDay()]} — ${fmtDate(dt)}`;
}

// ════════════════════════════════════════════
// LOG
// ════════════════════════════════════════════
// Cada evento se guarda con un "tipo" (no el emoji directo) para que su ícono salga del
// Catálogo de Íconos (Configuración → Diseño → Íconos → Seguimiento y Producción → Eventos)
// y se vea igual en escritorio y en tablet.
const EVENT_ICON_MAP={
  inicio:{key:'produccionEventoInicio',fallback:'▶'},
  completado:{key:'produccionEventoCompletado',fallback:'✓'},
  pausa:{key:'produccionEventoPausa',fallback:'⏸'},
  fase:{key:'produccionEventoFase',fallback:'⏱'},
  material:{key:'produccionEventoMaterial',fallback:'📦'},
  color:{key:'produccionEventoColor',fallback:'🔬'},
  suspendido:{key:'produccionEventoSuspendido',fallback:'⛔'}
};
function addLog(oid,tipo,msg){
  const key=orderKey(oid);
  if(!eventLogs[key])eventLogs[key]=[];
  eventLogs[key].unshift({time:fmtH(nowSim()),tipo,msg});
}
// Traduce el tipo de evento guardado en la base de datos al mismo "tipo" que usa
// EVENT_ICON_MAP, para que el historial reconstruido use el mismo ícono que uno
// recién creado en esta sesión.
const EVENT_TYPE_SERVIDOR_A_TIPO={
  run:'inicio',completado:'completado',paro:'pausa',suspender:'suspendido',
  montaje_inicio:'fase',montaje_fin:'fase',tiraje_inicio:'fase',tiraje_fin:'fase',
  corrida_inicio:'fase',corrida_fin:'fase',limpieza_inicio:'fase',limpieza_fin:'fase',
  setup_inicio:'fase',setup_fin:'fase'
};
// El historial de eventos vivía solo en memoria del navegador y se perdía al cerrar y
// volver a abrir la orden. Aquí se reconstruye una sola vez por orden, con los eventos
// reales guardados en la base de datos (route.events, servidos por /api/produccion/flujo).
function hidratarEventLogsDesdeServidor(route){
  const key=route.routeId;
  if(eventLogs[key]||!Array.isArray(route.events)||!route.events.length)return;
  eventLogs[key]=route.events.map(ev=>({
    time:fmtH(new Date(ev.createdAt)),
    tipo:EVENT_TYPE_SERVIDOR_A_TIPO[ev.eventType]||'',
    msg:ev.notes||ev.eventType||''
  }));
}

// ════════════════════════════════════════════
// COUNTDOWN RING
// ════════════════════════════════════════════
function buildCountdownRing(o){
  const st=stOf(o);
  if(st==='pending'||st==='done') return '';
  const n=nowSim();
  const startT=orderStartTime[orderKey(o)]||o.actualStartDt||o.startDt;
  const totalMs=o.dur*60000;
  const elapsed=n-startT;
  const remaining=Math.max(0,totalMs-elapsed);
  const pct=Math.min(100,Math.max(0,(elapsed/totalMs)*100));
  const remMin=Math.floor(remaining/60000);
  const remSec=Math.floor((remaining%60000)/1000);
  const delay=delayMin(o);
  const isLate=pct>=100&&delay;
  const overMin=isLate?delay:0;

  // ring params
  const R=33,C=2*Math.PI*R;
  const filled=C*(pct/100);
  const stroke=isLate?'var(--red)':pct>75?'var(--amber)':'var(--blue)';

  let subText='',subCls='amber';
  if(isLate){subCls='red';}
  else if(remaining>0){
    const ahead=Math.round(((totalMs-elapsed)-(totalMs*(1-pct/100)))/60000);
    subText=`${Math.round(100-pct)}% restante`;subCls='green';
  }

  return`<div class="countdown-wrap" id="cdwrap_${o.id}">
    <svg class="countdown-ring-svg" width="84" height="84" viewBox="0 0 84 84">
      <circle class="countdown-ring-track" cx="42" cy="42" r="${R}"/>
      <circle class="countdown-ring-fill" cx="42" cy="42" r="${R}"
        stroke="${stroke}"
        stroke-dasharray="${filled} ${C}"
        stroke-dashoffset="0"
        style="transform:rotate(-90deg);transform-origin:42px 42px"/>
      <text x="42" y="47" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="16" font-weight="700" fill="${stroke}">${Math.round(100-pct)}%</text>
    </svg>
    <div class="countdown-elapsed">
      <div class="countdown-elapsed-label">Tiempo en Proceso</div>
      <div class="countdown-elapsed-value">${fmtElapsedLong(Math.max(0,elapsed/60000))}</div>
      <div class="countdown-elapsed-est">Estimado: ${fmtElapsedLong(o.dur)}</div>
    </div>
    <div class="countdown-info">
      <div class="countdown-label">${isLate?'⚠ Tiempo Excedido':'⏱ Tiempo Restante'}</div>
      <div class="countdown-time-display" style="color:${stroke}">${isLate?`+${fmtDuration(overMin)}`:remMin<60?`${pad2(remMin)}:${pad2(remSec)}`:fmtDuration(remMin)}</div>
      ${subText?`<div class="countdown-sub ${subCls}">${subText}</div>`:''}
    </div>
  </div>`;
}

function getSpectroKey(oid){return `${oid}_${mesState.inst}`;}
async function loadSpectroHistory(oid){
  const key=getSpectroKey(oid);

  try{

      spectroHistory[key]=payload.data.map(row=>({

        a_min:Number(row.a_minimo),a_std:Number(row.a_valor),a_max:Number(row.a_maximo),
        b_min:Number(row.b_minimo),b_std:Number(row.b_valor),b_max:Number(row.b_maximo),

        ok:row.dentro_tolerancia,colorName:row.nombre_color

async function saveSpectroReading(oid){
  const fields=['L_min','L_std','L_max','a_min','a_std','a_max','b_min','b_std','b_max'];

      headers:{'Content-Type':'application/json',...sessionHeader()},
      body:JSON.stringify({
        orderCode:oid, slotNumber, colorName,
        l:{min:vals.L_min,std:vals.L_std,max:vals.L_max},
        a:{min:vals.a_min,std:vals.a_std,max:vals.a_max},
        b:{min:vals.b_min,std:vals.b_std,max:vals.b_max},
        operatorName:currentUserName()

    addLog(oid,'color',`Espectro Col.${slotNumber} — L*:${vals.L_std} a*:${vals.a_std} b*:${vals.b_std} ${payload.dentroTolerancia?'✓ OK':'⚠ Fuera'}`);

// Espera en formato "1d 4h 12m" / "4h 12m" / "12m" desde un timestamp ISO.
function fmtEspera(desdeMs){
  const s=Math.max(0,Math.floor((Date.now()-desdeMs)/1000));
  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60),ss=s%60;
  if(d>0)return `${d}d ${h}h ${m}m`;
  if(h>0)return `${h}h ${m}m ${pad2(ss)}s`;
  return `${m}m ${pad2(ss)}s`;
}
// Nivel de urgencia por horas de espera: 24h → ámbar, 48h → rojo.
function nivelEspera(desdeMs){
  const h=(Date.now()-desdeMs)/3600000;
  return h>=48?'alarm':(h>=24?'warn':'ok');
}

function renderQueue(){

  if(prodSearchActive){renderProdSearchResults();return;}

  if(estadoFlujoProduccion==='sin-respuesta'){qa.innerHTML='<div class="empty"><div class="empty-icon">⏳</div>Seguimos esperando al servidor. La conexión está lenta; lo volvemos a intentar solo en unos segundos.</div>';return;}

  orders.forEach(o=>{

    if(o.prioridad==='urgente')return;
    const k=fmtDate(o.startDt);
    if(!groups[k]){
      const nd=new Date(nowSim());nd.setHours(0,0,0,0);
      const dd=new Date(o.startDt);dd.setHours(0,0,0,0);
      groups[k]={lbl:dayLabel(o.startDt),today:dd.getTime()===nd.getTime(),list:[]};
    }
    groups[k].list.push(o);
  });
  let html='';
  if(activeOrder){
    html+=`<div class="pinned-active-sec"><div class="pinned-active-hdr"><span class="live-dot"></span>En curso</div>${renderCard(activeOrder,true)}</div>`;
  }

  }
  Object.values(groups).forEach(g=>{
    const daySepIconSz=shellIconSizeFor('produccionSeparadorFecha',18);
    const daySepTxtSz=Math.max(11,Math.round(daySepIconSz*0.72));

    html+=`<div class="day-sep"><span class="day-sep-tag${g.today?' today':''}" style="font-size:${daySepTxtSz}px">${daySepIcon}${g.lbl}</span></div>`;

  const scrollY=qa.scrollTop;
  qa.innerHTML='<div id="devolBand"></div>'+html;
  qa.scrollTop=scrollY;
  Object.keys(pauseStarts).forEach(oid=>{updatePauseDisp(oid)});
  loadDevolucionesUrgentes(activeProc);
}

function buildOrderDetailContent(o){
  const st=stOf(o);
  const key=orderKey(o);
  const otherActive=(st==='pending')?findActiveOrderInProcess(o.id):null;
  const warningHtml=otherActive?`<div class="active-warning-banner">
    <span>⚠ Ya hay una orden en curso en este proceso: <strong>${otherActive.id}</strong> — ${otherActive.name}</span>
    <button class="active-warning-link" onclick="openOrderModal('${otherActive.id}',null)">Ver →</button>
  </div>`:'';
  const showLog=openLogs.has(key);
  const logs=eventLogs[key]||[];
  const showMES=(mesOpenFor===key && (activeProc==='impresion'||activeProc==='rebobinado'||activeProc==='visto_bueno'||activeProc==='empaque'));
  const showMP=(mpOpenFor===key);
  const tl=tlProgress(o);

  // TIMELINE
  const tlHtml=`<div class="timeline-wrap">
    <div class="tl-label">
      <span>Línea de Tiempo</span>
      <span>${fmtH(o.startDt)} → ${fmtH(o.endDt)} (${o.dur}min)</span>
    </div>
    <div class="tl-bar">
      <div class="tl-planned" style="width:${tl.plan}%"></div>
      <div class="tl-real${tl.late?' late':''}${tl.done?' done':''}" style="width:${tl.real}%"></div>
      ${tl.planAbsolute>0&&!tl.done?`<div class="tl-now-marker" style="left:${Math.min(98,tl.planAbsolute)}%"></div>`:''}
    </div>
    <div class="tl-legend">
      <span><span class="dot-plan"></span>Programado</span>
      <span><span class="dot-real${tl.late?' dot-late':''}"></span>Real${tl.late?' (atrasado)':''}</span>
      ${tl.planAbsolute>0&&!tl.done?`<span><span style="width:8px;height:8px;border-radius:2px;background:var(--amber);display:inline-block"></span>Ahora</span>`:''}
    </div>
  </div>`;

  // COUNTDOWN RING
  const cdHtml=buildCountdownRing(o);
  // Inicio/fin/duración ya se muestran en la línea de tiempo de arriba — no se repiten aquí (evita la reiteración innecesaria)
  const dgrid='';

  // materials
  let matHtml='';
  if(o.mats&&o.mats.length){
    matHtml=`<div class="mat-sec" style="display:none">
      <div class="mat-hdr">📦 Materiales — Descargo SAP</div>
      ${o.mats.map(m=>{
        const matKey=key+'_'+m.id;
        const sent=sentMats.has(matKey);
        return`<div class="mat-row">
          <span class="mat-id">${m.id}</span>
          <span class="mat-name">${m.name}</span>
          <span class="mat-qty">${m.qty}</span>
          <button class="sap-btn${sent?' sent':''}" onclick="sendSAP('${o.id}','${m.id}','${m.name}',this)" ${sent?'disabled':''}>${sent?'✓ Enviado a SAP':'↗ Solicitar SAP'}</button>
        </div>`;
      }).join('')}
    </div>`;
  }

  // action row
  // Empaque, Impresión y Rebobinado usan su propio reloj grande (dz-clock-wrap) en vez de esta fila genérica.
  const isEmpaque=(activeProc==='empaque');
  const isImpresion=(activeProc==='impresion');
  const isRebobinado=(activeProc==='rebobinado');
  const isVistoBueno=(activeProc==='visto_bueno');
  const usaRelojGenerico=isEmpaque||isImpresion||isRebobinado||isVistoBueno;
  const ptEl=(!usaRelojGenerico&&pauseStarts[key])?`<span class="pause-timer" id="pt_${key}">⏱ 0:00</span>`:'';
  let actBtns='';
  if(!usaRelojGenerico){
    if(st==='pending') actBtns+=`<button class="btn-ini" onclick="doStart('${o.id}','${o.name}',this)">▶ Iniciar</button>`;
    if(st==='inprog'){
      actBtns+=`<button class="btn-done" onclick="doComplete('${o.id}','${o.name}')">■ Finalizar proceso</button>`;
      actBtns+=`<button class="btn-pau" onclick="openPauseModal('${o.id}','${o.name}','${activeProc}')">⏸ Pausar</button>`;
    }
    if(st==='paused') actBtns+=`<button class="btn-ini" onclick="doResume('${o.id}',this)">▶ Reanudar</button>`;
  }
  // Botón solicitud MP — oculto de momento (en discusión si se queda)
  actBtns+=`<button class="btn-mp" style="display:none" onclick="toggleMP('${o.id}')">📦 ${showMP?'Cerrar MP':'Solicitar MP'}</button>`;
  if(!usaRelojGenerico){
    actBtns+=`<button class="btn-log" onclick="toggleLog('${o.id}')">${logs.length?`📋 Eventos (${logs.length})`:'📋 Sin eventos'}</button>`;
    if(ptEl) actBtns+=ptEl;
  }

  // Reloj de Impresión — mismo mecanismo que Diseño/Tintas/Empaque (orderStartTime/pauseStarts + postMesEvent),
  // reemplaza la Línea de Tiempo + botón Iniciar genéricos solo para este proceso.
  let clockHtmlImpresion='';
  if(isImpresion){
    const st2=st,cStart=(orderStartTime[key]||o.actualStartDt||o.startDt);
    const cStartMs=cStart?new Date(cStart).getTime():0;
    let cCls='',cTxt='00:00:00',cState='<b>En espera</b> · sin iniciar';
    if(st2==='inprog'){cCls='run';cTxt=dzHMS(Date.now()-cStartMs);cState='<b>En curso</b> · corriendo';}
    else if(st2==='paused'){
    if(o.suspendidaProduccion){cCls='paused';const ps=pauseStarts[key];cTxt=dzHMS((ps?ps.startTs:Date.now())-cStartMs);cState='<b>⛔ Suspendida</b> · esperando a Planificación';}
    else{cCls='run';cTxt=dzHMS(Date.now()-cStartMs);cState='<b>En pausa</b> · el reloj sigue corriendo';}
  }
    else if(st2==='done'){cTxt=dzHMS((o.actualEndDt?new Date(o.actualEndDt).getTime():Date.now())-cStartMs);cState='<b>Completada</b> · tiempo final';}
  const pauseBoxHtml=(st2==='paused'&&!o.suspendidaProduccion)?(()=>{
    const psStart=o.pausedSince?new Date(o.pausedSince).getTime():((pauseStarts[key]&&pauseStarts[key].startTs)||Date.now());
    const quien=o.pauseOperator||(pauseStarts[key]&&pauseStarts[key].operator)||'';
    const motivo=o.pauseLabel||(pauseStarts[key]&&(pauseStarts[key].reason||pauseStarts[key].note))||'';
    return `<div class="qd-panel dz-pause-box">
      <div class="qd-panel-hdr">⏸ En Pausa</div>
      <div class="dz-pause-box-row">${quien?`<b>${dzEsc(quien)}</b> pausó esta orden`:'Esta orden está pausada'}${motivo?` por: <b>${dzEsc(motivo)}</b>`:''}</div>
      <div class="dz-clock dz-clock-mini dz-clock-alerta live-seconds" data-start="${psStart}">${dzHMS(Date.now()-psStart)}</div>
    </div>`;
  })():'';
    // Impresión se comporta como Rebobinado: un botón principal que va cambiando de estado
    // (Iniciar Montaje → Finalizar Montaje [pide metros] → Iniciar Tiraje → Finalizar Tiraje
    // [pide metros] → cierra el proceso). Sin botón "Completar" (evita cerrar sin reportar).
    if(impresionTiemposCache[o.id]===undefined)loadImpresionTiempos(o.id).then(()=>refreshOrderModal(o.id));
    let cActs='';
    if(st2==='pending'){
      cActs+=`<button class="dz-act dz-act-start" onclick="doStartImpresionMontaje('${o.id}','${o.name}',this)">▶ Iniciar Montaje</button>`;
    } else if(st2==='inprog'){
      const tImp=impresionTiemposCache[o.id]||{};
      const mSt=faseSt(o.id,'montaje')!=='todo'?faseSt(o.id,'montaje'):(tImp.montaje_min!=null?'done':'run');
      const tSt=faseSt(o.id,'corrida')!=='todo'?faseSt(o.id,'corrida'):(tImp.tiraje_min!=null?'done':'todo');
      if(mSt==='run'){
        cActs+=`<button class="dz-act dz-act-start" onclick="finalizarFaseRebobinado('${o.id}','montaje','impresion')">⏹ Finalizar Montaje</button>`;
      } else if(mSt==='done'&&tSt==='run'){
        cActs+=`<button class="dz-act dz-act-start" onclick="finalizarFaseRebobinado('${o.id}','corrida','impresion')">⏹ Finalizar Tiraje</button>`;
      } else if(mSt==='done'&&tSt!=='done'){
        cActs+=`<button class="dz-act dz-act-start" onclick="marcarFase('${o.id}','corrida',this)">▶ Iniciar Tiraje</button>`;
      }
      cActs+=`<button class="dz-act dz-act-pause" onclick="openPauseModal('${o.id}','${o.name}','impresion')">⏸ Pausar</button>`;
    } else if(st2==='done'){
      cActs+=`<button class="dz-act dz-act-start" onclick="abrirNuevoCiclo('${o.id}','${dzEsc(o.name)}','impresion')">▶ Iniciar</button>`;
    }
    if(st2==='paused')cActs+=`<button class="dz-act dz-act-start" onclick="doResume('${o.id}',this)">▶ Reanudar</button>`;
    // Suspender y Eventos ya no van en esta fila para Impresión: Suspender se movió al
    // encabezado de la pestaña Eventos (junto a "Historial de Eventos") y Eventos ya es su
    // propia pestaña — ver buildImpresionEventosTab.
    clockHtmlImpresion=`<div class="dz-clock-wrap">
      <div class="dz-clock ${cCls}" ${(st2==='inprog'||(st2==='paused'&&!o.suspendidaProduccion))?`data-start="${cStartMs}"`:''}>${cTxt}</div>
      <div class="dz-clock-side">
        <div class="dz-clock-state">${cState}</div>
        <div class="dz-actrow">${cActs}</div>
      </div>
    </div>${pauseBoxHtml}`;
  }

  // Reloj de Rebobinado — mismo mecanismo que el de Impresión, va antes de las pestañas
  // Información General / Eventos (ver isRebobinado más abajo).
  let clockHtmlRebobinado='';
  if(isRebobinado){
    const st2=st,cStart=(orderStartTime[key]||o.actualStartDt||o.startDt);
    const cStartMs=cStart?new Date(cStart).getTime():0;
    let cCls='',cTxt='00:00:00',cState='<b>En espera</b> · sin iniciar';
    if(st2==='inprog'){cCls='run';cTxt=dzHMS(Date.now()-cStartMs);cState='<b>En curso</b> · corriendo';}
    else if(st2==='paused'){
    if(o.suspendidaProduccion){cCls='paused';const ps=pauseStarts[key];cTxt=dzHMS((ps?ps.startTs:Date.now())-cStartMs);cState='<b>⛔ Suspendida</b> · esperando a Planificación';}
    else{cCls='run';cTxt=dzHMS(Date.now()-cStartMs);cState='<b>En pausa</b> · el reloj sigue corriendo';}
  }
    else if(st2==='done'){cTxt=dzHMS((o.actualEndDt?new Date(o.actualEndDt).getTime():Date.now())-cStartMs);cState='<b>Completada</b> · tiempo final';}
  const pauseBoxHtml=(st2==='paused'&&!o.suspendidaProduccion)?(()=>{
    const psStart=o.pausedSince?new Date(o.pausedSince).getTime():((pauseStarts[key]&&pauseStarts[key].startTs)||Date.now());
    const quien=o.pauseOperator||(pauseStarts[key]&&pauseStarts[key].operator)||'';
    const motivo=o.pauseLabel||(pauseStarts[key]&&(pauseStarts[key].reason||pauseStarts[key].note))||'';
    return `<div class="qd-panel dz-pause-box">
      <div class="qd-panel-hdr">⏸ En Pausa</div>
      <div class="dz-pause-box-row">${quien?`<b>${dzEsc(quien)}</b> pausó esta orden`:'Esta orden está pausada'}${motivo?` por: <b>${dzEsc(motivo)}</b>`:''}</div>
      <div class="dz-clock dz-clock-mini dz-clock-alerta live-seconds" data-start="${psStart}">${dzHMS(Date.now()-psStart)}</div>
    </div>`;
  })():'';
    if(rebobinadoTiemposCache[o.id]===undefined)loadRebobinadoTiempos(o.id).then(()=>refreshOrderModal(o.id));
    let cActs='';
    if(st2==='pending'){
      cActs+=`<button class="dz-act dz-act-start" onclick="doStartRebobinadoMontaje('${o.id}','${o.name}',this)">▶ Iniciar Montaje</button>`;
    } else if(st2==='inprog'){
      const tiempos=rebobinadoTiemposCache[o.id]||{};
      const mSt=faseSt(o.id,'montaje')!=='todo'?faseSt(o.id,'montaje'):(tiempos.montaje_fin?'done':(tiempos.montaje_inicio?'run':'todo'));
      const tSt=faseSt(o.id,'tiraje')!=='todo'?faseSt(o.id,'tiraje'):(tiempos.tiraje_fin?'done':(tiempos.tiraje_inicio?'run':'todo'));
      if(mSt==='run'||(!tiempos.montaje_fin&&tSt==='todo'&&mSt!=='done')){
        cActs+=`<button class="dz-act dz-act-start" onclick="finalizarFaseRebobinado('${o.id}','montaje')">⏹ Finalizar Montaje</button>`;
      } else if(mSt==='done'&&tSt==='todo'){
        cActs+=`<button class="dz-act dz-act-start" onclick="marcarFase('${o.id}','tiraje',this)">▶ Iniciar Tiraje</button>`;
      } else {
        cActs+=`<button class="dz-act dz-act-start" onclick="finalizarFaseRebobinado('${o.id}','tiraje')">⏹ Finalizar Tiraje</button>`;
      }
      // Sin botón "Completar": el proceso se cierra al finalizar el Tiraje (finalizarFaseRebobinado).
      cActs+=`<button class="dz-act dz-act-pause" onclick="openPauseModal('${o.id}','${o.name}','rebobinado')">⏸ Pausar</button>`;
    } else if(st2==='done'){
      cActs+=`<button class="dz-act dz-act-start" onclick="abrirNuevoCiclo('${o.id}','${dzEsc(o.name)}','rebobinado')">▶ Iniciar</button>`;
    }
    if(st2==='paused')cActs+=`<button class="dz-act dz-act-start" onclick="doResume('${o.id}',this)">▶ Reanudar</button>`;
    // Suspender y Eventos ya no van en esta fila: Suspender se movió a la pestaña Eventos
    // (encima de la tabla de Tiempos) y Eventos ya es su propia pestaña — ver buildRebobinadoEventosTab.
    clockHtmlRebobinado=`<div class="dz-clock-wrap">
      <div class="dz-clock ${cCls}" ${(st2==='inprog'||(st2==='paused'&&!o.suspendidaProduccion))?`data-start="${cStartMs}"`:''}>${cTxt}</div>
      <div class="dz-clock-side">
        <div class="dz-clock-state">${cState}</div>
        <div class="dz-actrow">${cActs}</div>
      </div>
    </div>${pauseBoxHtml}`;
  }

  // Reloj de Empaque — mismo mecanismo que Diseño/Tintas (orderStartTime/pauseStarts). Sin
  // Suspender ni botón de Eventos acá: Suspender se movió a la pestaña Eventos (ver
  // buildEmpaqueEventosTab) y Eventos ya es su propia pestaña (Información General / Eventos).
  let clockHtmlEmpaque='';
  if(isEmpaque){
    const st2=st,cStart=(orderStartTime[key]||o.actualStartDt||o.startDt);
    const cStartMs=cStart?new Date(cStart).getTime():0;
    let cCls='',cTxt='00:00:00',cState='<b>En espera</b> · sin iniciar';
    if(st2==='inprog'){cCls='run';cTxt=dzHMS(Date.now()-cStartMs);cState='<b>En curso</b> · corriendo';}
    else if(st2==='paused'){
      if(o.suspendidaProduccion){cCls='paused';const ps=pauseStarts[key];cTxt=dzHMS((ps?ps.startTs:Date.now())-cStartMs);cState='<b>⛔ Suspendida</b> · esperando a Planificación';}
      else{cCls='run';cTxt=dzHMS(Date.now()-cStartMs);cState='<b>En pausa</b> · el reloj sigue corriendo';}
    }
    else if(st2==='done'){cTxt=dzHMS((o.actualEndDt?new Date(o.actualEndDt).getTime():Date.now())-cStartMs);cState='<b>Completada</b> · tiempo final';}
    const pauseBoxHtml=(st2==='paused'&&!o.suspendidaProduccion)?(()=>{
      const psStart=o.pausedSince?new Date(o.pausedSince).getTime():((pauseStarts[key]&&pauseStarts[key].startTs)||Date.now());
      const quien=o.pauseOperator||(pauseStarts[key]&&pauseStarts[key].operator)||'';
      const motivo=o.pauseLabel||(pauseStarts[key]&&(pauseStarts[key].reason||pauseStarts[key].note))||'';
      return `<div class="qd-panel dz-pause-box">
        <div class="qd-panel-hdr">⏸ En Pausa</div>
        <div class="dz-pause-box-row">${quien?`<b>${dzEsc(quien)}</b> pausó esta orden`:'Esta orden está pausada'}${motivo?` por: <b>${dzEsc(motivo)}</b>`:''}</div>
        <div class="dz-clock dz-clock-mini dz-clock-alerta live-seconds" data-start="${psStart}">${dzHMS(Date.now()-psStart)}</div>
      </div>`;
    })():'';
    let cActs='';
    if(st2==='pending')cActs+=`<button class="dz-act dz-act-start" onclick="doStart('${o.id}','${o.name}',this)">▶ Iniciar proceso</button>`;
    if(st2==='inprog'){cActs+=`<button class="dz-act dz-act-done" onclick="doComplete('${o.id}','${o.name}')">■ Finalizar proceso</button>`;
      cActs+=`<button class="dz-act dz-act-pause" onclick="openPauseModal('${o.id}','${o.name}','empaque')">⏸ Pausar</button>`;}
    if(st2==='paused')cActs+=`<button class="dz-act dz-act-start" onclick="doResume('${o.id}',this)">▶ Reanudar</button>`;
    if(st2==='done')cActs+=`<button class="dz-act dz-act-start" onclick="abrirNuevoCiclo('${o.id}','${dzEsc(o.name)}','empaque')">▶ Iniciar</button>`;
    clockHtmlEmpaque=`<div class="dz-clock-wrap">
      <div class="dz-clock ${cCls}" ${(st2==='inprog'||(st2==='paused'&&!o.suspendidaProduccion))?`data-start="${cStartMs}"`:''}>${cTxt}</div>
      <div class="dz-clock-side">
        <div class="dz-clock-state">${cState}</div>
        <div class="dz-actrow">${cActs}</div>
      </div>
    </div>${pauseBoxHtml}`;
  }

  // Reloj de Aprobaciones — un solo reloj (antes había dos que no se hablaban entre sí: éste y
  // el de "Proceso de Visto Bueno" más abajo). Se arma en buildAprobacionClockHtml() usando el
  // cronómetro de vb_proceso como única fuente de verdad, con Completar/Enviar según el Tipo de
  // Envío de la orden — ver esa función más abajo.

  // event log
  let logHtml='';
  if(showLog){
    logHtml=`<div class="evlog" id="log_${o.id}">
      <div class="evlog-hdr">Historial de Eventos</div>
      ${logs.length?logs.map(ev=>{const ic=EVENT_ICON_MAP[ev.tipo];return`<div class="ev-row"><span class="ev-time">${ev.time}</span><span class="ev-icon">${ic?shellIconSpanHtml(ic.key,ic.fallback,'Evento'):(ev.tipo||'')}</span><span class="ev-msg">${ev.msg}</span></div>`;}).join('')
      :'<div style="color:var(--text3);font-size:13px;text-align:center;padding:6px">Sin eventos registrados</div>'}
    </div>`;
  }

  // MP panel
  let mpHtml='';
  if(showMP) mpHtml=buildMPPanel(o);

  // MES panel — en Impresión ahora es parte de la pestaña "Información General" (fusionada con
  // Máquina), así que se arma siempre para ese proceso, sin importar qué pestaña esté activa
  // (showMES pasó a significar "está viendo la pestaña Eventos" para Impresión y Rebobinado).
  let mesHtml='';
  if(activeProc==='impresion') mesHtml=buildMESPanel(o);

  _qdRowRegistry=[];
  const qdHtml=buildProcessDataPanel(o);
  // Diseño, Preprensa y Tintas: el panel (buildDisenoPanel/buildPreprensaPanel/buildTintasPanel)
  // ya trae su propia pestaña Eventos con Sumatoria de Fases + Merma + Historial — no repetirlos
  // acá afuera.
  if(activeProc==='diseno'||activeProc==='preprensa'||activeProc==='tintas'){
    return`${warningHtml}${qdHtml}`;
  }
  const mermaHtml=(isEmpaque||isRebobinado)?'':buildMermaPanel(o);
  const acabadosHtml=isEmpaque?'':buildAcabadosPanel(o);
  // Impresión y Rebobinado: las fases Montaje/Tiraje viven dentro del botón principal del reloj
  // (Iniciar Montaje → Finalizar Montaje → Iniciar Tiraje → Finalizar Tiraje), no como fila aparte.
  const faseHtml='';
  // Empaque: el reloj (clockHtmlEmpaque, arriba del todo) reemplaza la Línea de Tiempo y el
  // anillo de Tiempo Restante. Merma vs. Cotizado y Especificación de Acabados no aplican a
  // Empaque (son de Impresión/Preprensa) — se omiten. Pestañas Información General / Eventos
  // igual que Impresión y Rebobinado — ver buildEmpaqueEventosTab.
  if(isEmpaque){
    const empaqueTabsHtml=`<div class="qd-tabs-top">
      <button class="qd-tab-btn${!showMES?' active':''}" onclick="toggleMES('${o.id}')">Información General</button>
      <button class="qd-tab-btn${showMES?' active':''}" onclick="toggleMES('${o.id}')">Eventos</button>
    </div>`;
    const empaqueBodyHtml=showMES?buildEmpaqueEventosTab(o):qdHtml;
    return`${warningHtml}${clockHtmlEmpaque}${empaqueTabsHtml}${empaqueBodyHtml}${matHtml}
    <div class="act-row">${actBtns}</div>
    ${mpHtml}`;
  }
  // Rebobinado: el reloj va primero (igual que Impresión), luego pestañas Información General
  // (rollo: productos por rollo, distancia, velocidad, sentido de bobinado) y Eventos (tiempos,
  // Suspender Producción, historial de eventos — ver buildRebobinadoEventosTab). Se quitaron de
  // aquí "Merma vs. Cotizado", "Merma por Causa de Paro" y "Tiempos y Merma por Fase" — ya no se
  // muestran en este modal.
  if(isRebobinado){
    const rebobinadoTabsHtml=`<div class="qd-tabs-top">
      <button class="qd-tab-btn${!showMES?' active':''}" onclick="toggleMES('${o.id}')">Información General</button>
      <button class="qd-tab-btn${showMES?' active':''}" onclick="toggleMES('${o.id}')">Eventos</button>
    </div>`;
    const rebobinadoBodyHtml=showMES?buildRebobinadoEventosTab(o):`${acabadosHtml}${qdHtml}`;
    return`${warningHtml}${clockHtmlRebobinado}${rebobinadoTabsHtml}${rebobinadoBodyHtml}${matHtml}
    <div class="act-row">${actBtns}</div>
    ${mpHtml}`;
  }
  // Impresión: el reloj va primero (a pedido del operador); debajo, un solo panel a la vez
  // (Información General o Máquina) que las pestañas de abajo alternan — reusan el mismo
  // interruptor mesOpenFor/toggleMES de siempre, solo que ahora se ven como pestañas y no
  // como un botón arriba, para no seguir acumulando botones junto al reloj.
  if(isImpresion){
    // Pestañas arriba, pegadas al reloj: "Información General" (fusiona lo que antes era
    // Información General + Máquina) y "Eventos" (tiempos, merma, historial — ver
    // buildImpresionEventosTab). showMES ahora indica "está viendo Eventos" para este proceso.
    const impresionTabsHtml=`<div class="qd-tabs-top">
      <button class="qd-tab-btn${!showMES?' active':''}" onclick="toggleMES('${o.id}')">Información General</button>
      <button class="qd-tab-btn${showMES?' active':''}" onclick="toggleMES('${o.id}')">Eventos</button>
    </div>`;
    const impresionBodyHtml=showMES?buildImpresionEventosTab(o):`${acabadosHtml}${qdHtml}${mesHtml}`;
    return`${warningHtml}${clockHtmlImpresion}${impresionTabsHtml}${impresionBodyHtml}${faseHtml}${matHtml}
    <div class="act-row">${actBtns}</div>
    ${mpHtml}`;
  }
  // Aprobaciones: mismo patrón de pestañas que Impresión/Rebobinado. El reloj (único, ver
  // buildAprobacionClockHtml) va primero; "Información General" trae los datos de siempre y
  // "Eventos" trae Estado de Aprobación, Contacto de Entrega, Suspender Producción e Historial
  // — ver buildAprobacionesEventosTab.
  if(isVistoBueno){
    const aprobClockHtml=buildAprobacionClockHtml(o);
    const aprobTabsHtml=`<div class="qd-tabs-top">
      <button class="qd-tab-btn${!showMES?' active':''}" onclick="toggleMES('${o.id}')">Información General</button>
      <button class="qd-tab-btn${showMES?' active':''}" onclick="toggleMES('${o.id}')">Eventos</button>
    </div>`;
    const aprobBodyHtml=showMES?buildAprobacionesEventosTab(o):`${buildAprobacionContactoHtml(o)}${mermaHtml}${acabadosHtml}${qdHtml}`;
    return`${warningHtml}${aprobClockHtml}${aprobTabsHtml}${aprobBodyHtml}${matHtml}
    <div class="act-row">${actBtns}</div>
    ${mpHtml}`;
  }
  return`${warningHtml}${mermaHtml}${acabadosHtml}${qdHtml}${tlHtml}${cdHtml}${dgrid}${matHtml}${faseHtml}
    <div class="act-row">${actBtns}</div>
    ${mpHtml}${logHtml}${mesHtml}`;
}

function openOrderModal(oid,evt,animate){
  if(animate===undefined)animate=true;
  let o=makeOrders(activeProc,activeMach).find(x=>x.id===oid);
  if(!o){
    // puede estar en otra máquina del mismo proceso (ej. al saltar desde el aviso de "ya hay una orden en curso")
    o=makeOrders(activeProc,null).find(x=>x.id===oid);
    if(o&&o.machineName&&o.machineName!==activeMach){
      activeMach=o.machineName;
      document.querySelectorAll('.mb').forEach(b=>b.classList.toggle('act',b.textContent.trim()===o.machineName));
      renderQueue();
    }
  }
  if(!o)return;
  const box=document.getElementById('modalBox');
  box.classList.add('modal-order');
  box.classList.remove('modal-blocked');
  box.classList.toggle('mes-wide',activeProc==='impresion'||activeProc==='diseno'||activeProc==='tintas'||activeProc==='preprensa'||activeProc==='empaque'||activeProc==='rebobinado');
  box.classList.toggle('impresion-tall',activeProc==='impresion');
  // Diseño / Preprensa / Tintas / Rebobinado / Empaque / Aprobaciones: alto fijo (igual que
  // Impresión) para que la ventana no cambie de tamaño al moverse entre pestañas — antes solo
  // estos tres primeros lo tenían, y el resto (con el mismo patrón de pestañas Información
  // General/Eventos) se achicaba de golpe al pasar a Eventos, que casi siempre trae menos
  // contenido. A pedido del dueño: si el modal ya tiene un tamaño, que lo mantenga.
  box.classList.toggle('proceso-tall',activeProc==='diseno'||activeProc==='tintas'||activeProc==='preprensa'||activeProc==='rebobinado'||activeProc==='empaque'||activeProc==='visto_bueno');
  box.innerHTML=`<div class="modal-order-hdr">
      <div>
        <div class="modal-order-id">${o.id}</div>
        <div class="modal-order-name">${o.name}</div>
        ${dzClienteVendedorHtml(o,'modal-order-customer')}
      </div>
      <button class="modal-close-x" onclick="closeModal()" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-order-body">${buildOrderDetailContent(o)}</div>`;
  document.getElementById('overlay').style.display='flex';
  if(animate){
    const rowEl=evt&&evt.currentTarget?evt.currentTarget.closest('.ocard'):null;
    if(rowEl){
      const r=rowEl.getBoundingClientRect();
      const originX=((r.left+r.width/2)/window.innerWidth*100).toFixed(1)+'%';
      const originY=((r.top+r.height/2)/window.innerHeight*100).toFixed(1)+'%';
      box.style.transformOrigin=`${originX} ${originY}`;
    }else{
      box.style.transformOrigin='center';
    }
    box.classList.remove('modal-pop');
    void box.offsetWidth;
    box.classList.add('modal-pop');
  }
  if(pauseStarts[orderKey(oid)])updatePauseDisp(oid);
}
function refreshOrderModal(oid){
  const box=document.getElementById('modalBox');
  if(!box.classList.contains('modal-order'))return;
  if(box.querySelector('.modal-order-id')?.textContent.trim()!==oid)return;
  // openOrderModal reconstruye todo el innerHTML — sin esto, cada refresco (autorefresh, cambiar
  // una tinta, seleccionar estación, etc.) te regresaba al inicio del modal y del diagrama.
  const scrollTop=box.scrollTop;
  const svgWrap=box.querySelector('.mes-svg-wrap');
  const svgScrollLeft=svgWrap?svgWrap.scrollLeft:null;
  openOrderModal(oid,null,false);
  box.scrollTop=scrollTop;
  if(svgScrollLeft!==null){
    const newSvgWrap=box.querySelector('.mes-svg-wrap');
    if(newSvgWrap)newSvgWrap.scrollLeft=svgScrollLeft;
  }
}
function toggleLog(id){
  const key=orderKey(id);
  if(openLogs.has(key))openLogs.delete(key);else openLogs.add(key);
  refreshOrderModal(id);
}
function toggleMES(id){
  const key=orderKey(id);
  mesOpenFor=(mesOpenFor===key)?null:key;
  refreshOrderModal(id);
}
function toggleMP(id){
  const key=orderKey(id);
  mpOpenFor=(mpOpenFor===key)?null:key;
  refreshOrderModal(id);
}

function hasBarnizSlot(){return Object.values(mesState.slots).includes('barniz');}

// Receta real de tintas de la orden (motivo 0 — todos los motivos de un montaje comparten
// físicamente las mismas estaciones) y catálogo real de Inventario de Anilox, para poblar los
// desplegables de las tarjetas de estación en vez de listas fijas inventadas.
let mesOrderInk={};
let mesAniloxCatalog=null,mesAniloxLoading=false;
let mesApproval={};
async function loadMesOrderInk(oid){
  if(mesOrderInk[oid]&&(mesOrderInk[oid].loaded||mesOrderInk[oid].loading))return;
  mesOrderInk[oid]={loading:true};
  try{
    const r=await fetch('/api/produccion-diseno?orden='+encodeURIComponent(oid),{headers:sessionHeader()});
    const p=await r.json();
    if(!r.ok||!p.ok)throw new Error(p.error||'No se pudo cargar la receta de tintas de la orden.');
    const m0=(p.data.motivos&&p.data.motivos[0])||null;
    mesOrderInk[oid]={loaded:true,tintas:(m0&&m0.tintas)||[],acabados:p.data.acabados||[]};
  }catch(e){
    mesOrderInk[oid]={loaded:true,tintas:[],acabados:[],error:e.message};
  }
  refreshOrderModal(oid);
}
async function loadMesAniloxCatalog(){
  if(mesAniloxCatalog||mesAniloxLoading)return;
  mesAniloxLoading=true;
  try{
    const r=await fetch('/api/inventario/anilox?limit=500',{headers:sessionHeader()});
    const p=await r.json();
    mesAniloxCatalog=Array.isArray(p.items)?p.items:[];
  }catch(e){mesAniloxCatalog=[];}
  mesAniloxLoading=false;
}
let mesCilindroCatalog=null,mesCilindroLoading=false;
async function loadMesCilindroCatalog(){
  if(mesCilindroCatalog||mesCilindroLoading)return;
  mesCilindroLoading=true;
  try{
    const r=await fetch('/api/inventario/cilindros?limit=500',{headers:sessionHeader()});
    const p=await r.json();
    mesCilindroCatalog=Array.isArray(p.items)?p.items:[];
  }catch(e){mesCilindroCatalog=[];}
  mesCilindroLoading=false;
}
async function loadMesApproval(oid){
  try{
    const r=await fetch(`/api/mes/config-estaciones?orderCode=${encodeURIComponent(oid)}`,{headers:sessionHeader()});
    const p=await r.json();
    if(p.ok){mesApproval[oid]=p.aprobacion||{aprobadoPor:'',aprobadoEn:null};refreshOrderModal(oid);}
  }catch(e){/* sin badge si falla, no bloquea el panel */}
}
// Precarga las 8 estaciones con la receta real de la orden — una sola vez por orden, así el
// operario puede reasignar tinta/anilox libremente sin que un refresh se lo pise encima.
function mesEnsureSlotsInit(oid){
  const ink=mesOrderInk[oid];
  if(!ink||!ink.loaded)return false;
  if(mesState.slotsInitFor===oid)return true;
  mesState.slots={};mesState.slotData={};
  MES_STATION_RANGE.forEach(i=>{
    const t=ink.tintas[i-1]||null;
    mesState.slots[i]=t?(t.tipo==='barniz'?'barniz':t.tipo==='goma'?'goma':'tinta'):'empty';
    mesState.slotData[i]={
      tintaIdx:t?String(i-1):'',
      etiqueta:t?(t.etiqueta||''):'',
      color:t?(t.color||''):'',
      tipo:t?t.tipo:'',
      visc:(t&&t.tipo==='barniz')?'18':'22',
      temp:'23.5',
      anilox:'',
      cilindro:'',
      pantoneRef:(t&&t.tipo==='directo')?(t.etiqueta||''):'',
      barnizTipo:'Brillante UV',
      barnizZonif:'Total',
      barnizZona:'',
      // Goma enciende la lámpara sola (no requiere toggle manual); tinta/barniz arrancan apagadas.
      lampOn:t&&t.tipo==='goma'
    };
  });
  mesState.slotsInitFor=oid;
  mesState.active=null;mesState.inst=1;
  return true;
}

// ════════════════════════════════════════════════════════════════════
// Bloque A — Pieza compartida "Detalle de Máquina": el dibujo GALLUS + las
// tarjetas de estación con el detalle completo (cotizado + real editable, sin
// costos). La usan Impresión (buildMESPanel, que le agrega el historial de
// configuración y el módulo de espectro), Diseño, Preprensa y Tintas.
//   opts.showGuardar  — muestra el botón "Guardar configuración de máquina"
//                       (Impresión NO lo usa: su barra de historial ya guarda).
//   opts.headerExtra   — HTML extra a la derecha del título (ej. badge de aprobación).
// ════════════════════════════════════════════════════════════════════
function mesEnsureMaquinaData(oid){
  if(!mesOrderInk[oid])loadMesOrderInk(oid);
  if(!mesAniloxCatalog&&!mesAniloxLoading)loadMesAniloxCatalog();
  if(!mesCilindroCatalog&&!mesCilindroLoading)loadMesCilindroCatalog();
  if(!mesApproval[oid])loadMesApproval(oid);
  // Valores reales por estación (cobertura/densidad/BCM/factor) del proceso activo — para las
  // filas editables de las tarjetas. Diseño/Preprensa ya lo cargan aparte; Impresión/Tintas no.
  const proc=activeProc||'impresion';
  if(!producedValuesCache[oid+'|'+proc])loadProducedValuesFor(oid,proc).then(()=>refreshOrderModal(oid));
  if(mesEnsureSlotsInit(oid))mesHydrateSavedStations(oid);
}
function buildMaquinaEstacionesPanel(o,opts){
  opts=opts||{};
  mesEnsureMaquinaData(o.id);
  const totalW=GALLUS_W;
  const stationsSVG=MES_STATION_RANGE.map(i=>{
    const d=mesState.slotData[i]||{};
    const fill=d.color||'#3a4358';
    const hasInk=mesState.slots[i]!=='empty';
    return gallusStationSVG(i,fill,hasInk,hasInk,mesState.selectedStation===i,o.id);
  }).join('');
  const acabados=(mesOrderInk[o.id]&&mesOrderInk[o.id].acabados)||[];
  const acabLam=acabados.find(a=>a.nombre==='Laminado');
  const acabEst=acabados.find(a=>a.nombre==='Estampado');
  const laminadoInfo={activo:!!(acabLam&&acabLam.activo),detalle:(acabLam&&acabLam.detalle)||''};
  const estampadoInfo={activo:!!(acabEst&&acabEst.activo),detalle:(acabEst&&acabEst.detalle)||''};
  const guardarBtn=opts.showGuardar
    ?`<button class="mes-guardar-btn" onclick="guardarConfigMaquina('${o.id}')">✓ Guardar configuración de máquina</button>`:'';
  const headerBlock=opts.hideHeader?'':`<div class="mes-panel-hdr">
      <span>📐 Detalle de Máquina — ${dzEsc(o.machineName||'Máquina')}</span>
      <span class="mes-panel-hdr-x">${opts.headerExtra||''}</span>
    </div>
    ${opts.topExtra||''}
    <div class="mes-svg-wrap">
      <svg viewBox="0 0 ${totalW} ${GALLUS_H}" xmlns="http://www.w3.org/2000/svg" style="min-width:2200px;max-width:100%;height:auto">
        <defs>${GALLUS_DEFS}</defs>
        ${GALLUS_HEAD}
        <g>
          ${stationsSVG}
          ${gallusTail(o.id,laminadoInfo,estampadoInfo)}
        </g>
      </svg>
    </div>`;
  return`<div class="mes-panel" id="mesPanel_${o.id}">
    ${headerBlock}
    ${opts.pivotTable?buildImpresionTintasPivotTable(o):buildStationCardsRow(o)}
    ${guardarBtn}
    ${opts.extraInside||''}
  </div>`;
}

function buildStationCardsRow(o){
  const oid=o.id;
  const ink=mesOrderInk[oid];
  if(!ink||ink.loading||!ink.loaded){
    return `<div class="mes-stations-row"><div class="qd-empty" style="flex:1">Cargando tintas de la orden…</div></div>`;
  }
  const tintas=ink.tintas||[];
  const acabados=ink.acabados||[];
  const acabLam=acabados.find(a=>a.nombre==='Laminado');
  const acabEst=acabados.find(a=>a.nombre==='Estampado');
  const lamActivo=!!(acabLam&&acabLam.activo);
  const estActivo=!!(acabEst&&acabEst.activo);
  const cards=[buildDesbobinadoCard(oid)]
    .concat(MES_STATION_RANGE.map(i=>buildStationCard(oid,i,tintas)))
    .concat(lamActivo?[buildLaminadoCard(oid,acabLam.detalle)]:[])
    .concat(estActivo?[buildEstampadoCard(oid,acabEst.detalle)]:[])
    .concat([buildTroqueladoCard(oid)]);
  return `<div class="mes-stations-row">${cards.join('')}</div>`;
}
