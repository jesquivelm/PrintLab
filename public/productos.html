<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme.js"></script>
    <script src="/desplegable.js?v=20260924-desplegable-v5"></script>
    <title>SKU</title>
    <link rel="stylesheet" href="/styles.css?v=20260923-mensajes-carga">
</head>
<body>
    <main class="workspace workspace-quote quote-browser-main">
        <section class="quote-card quote-card-clean quote-browser-card quote-browser-card-orders">
            <div class="quote-browser-search-row">
                <div class="quote-browser-search-wrap">
                    <input id="productsSearchInput" class="copy-popover-search quote-browser-search" type="search" placeholder="Buscar por producto, cotizacion o cliente">
                </div>
            </div>
            <div class="copy-popover-table-wrap quote-browser-table-wrap">
                <table class="copy-popover-table quote-browser-table product-catalog-table">
                    <thead>
                        <tr>
                            <th data-sort-key="finished_product_sku">SKU<span class="sort-indicator"></span></th>
                            <th data-sort-key="quote_code">Cotización<span class="sort-indicator"></span></th>
                            <th data-sort-key="line_code">Línea<span class="sort-indicator"></span></th>
                            <th data-sort-key="client_name">Cliente<span class="sort-indicator"></span></th>
                            <th data-sort-key="product_name">Trabajo<span class="sort-indicator"></span></th>
                            <th data-sort-key="created_at">Fecha de Creación<span class="sort-indicator"></span></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody"><tr><td colspan="7">Cargando los SKU desde el servidor, un momento por favor…</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="/access-control.js?v=20260923-mensajes-carga"></script>
    <script src="/productos.js?v=20260923-mensajes-carga"></script>
</body>
</html>
