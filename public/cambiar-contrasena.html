<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme.js"></script>
    <title>Cambiar Contraseña | PrintLab</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef5f9 0%, #ffffff 58%, #f5efe8 100%);
            color: #223140;
        }
        .change-password-card {
            max-width: 440px;
            width: 100%;
            padding: 36px 32px;
            background: rgba(255,255,255,0.96);
            border: 1px solid rgba(193, 214, 228, 0.9);
            border-radius: 24px;
            box-shadow: 0 28px 60px rgba(17, 41, 59, 0.14);
        }
        .change-password-card h1 {
            font-size: 22px;
            margin: 0 0 6px;
            font-weight: 700;
            color: #152b38;
        }
        .change-password-card .subtitle {
            font-size: 14px;
            margin: 0 0 24px;
            color: #6b7986;
            line-height: 1.5;
        }
        .change-password-card label {
            display: block;
            margin-bottom: 18px;
        }
        .change-password-card label .field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #223140;
        }
        .change-password-card input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #c1d6e4;
            border-radius: 10px;
            font-size: 14px;
            background: #fff;
            color: #223140;
            outline: none;
            transition: border-color 0.2s;
        }
        .change-password-card input:focus {
            border-color: #118fc6;
            box-shadow: 0 0 0 3px rgba(17,143,198,0.15);
        }
        .change-password-card button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #0b81b8, #118fc6);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 4px;
        }
        .change-password-card button:hover { opacity: 0.9; }
        .change-password-card button:disabled { opacity: 0.5; cursor: not-allowed; }
        .password-rules {
            font-size: 12px;
            color: #6b7986;
            margin: 6px 0 0;
            padding: 0;
            list-style: none;
        }
        .password-rules li { margin: 3px 0; }
        .password-rules li.valid { color: #2a9d2a; }
        .password-rules li.invalid { color: #b83a3a; }
        .status-msg {
            font-size: 13px;
            margin: 14px 0 0;
            min-height: 20px;
            text-align: center;
        }
        .status-msg.error { color: #b83a3a; }
        .status-msg.success { color: #2a9d2a; }
        .lock-icon {
            display: block;
            margin: 0 auto 20px;
            width: 56px;
            height: 56px;
        }
    </style>
</head>
<body>
    <div class="change-password-card">
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="#118fc6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <h1>Cambiar Contraseña</h1>
        <p class="subtitle">Debes cambiar tu contraseña antes de continuar. Elige una contraseña segura que cumpla con todos los requisitos.</p>
        <form id="changePasswordForm">
            <label>
                <span class="field-label">Nueva contraseña</span>
                <input id="newPassword" type="password" autocomplete="new-password" placeholder="Nueva contraseña">
                <ul class="password-rules" id="passwordRules">
                    <li id="ruleLength" class="invalid">✗ Al menos 10 caracteres</li>
                    <li id="ruleUpper" class="invalid">✗ Al menos una mayúscula</li>
                    <li id="ruleLower" class="invalid">✗ Al menos una minúscula</li>
                    <li id="ruleDigit" class="invalid">✗ Al menos un número</li>
                    <li id="ruleSpecial" class="invalid">✗ Al menos un carácter especial</li>
                </ul>
            </label>
            <label>
                <span class="field-label">Confirmar contraseña</span>
                <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirmar contraseña">
            </label>
            <button type="submit" id="submitBtn" disabled>Cambiar Contraseña</button>
            <p id="statusMessage" class="status-msg"></p>
        </form>
    </div>
    <script>
        (function() {
            const SESSION_STORAGE_KEY = 'erp-user-session';
            const CHANGE_PASSWORD_ENDPOINT = '/api/auth/cambiar-contrasena';

            function getStoredSession() {
                try { return JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY) || sessionStorage.getItem(SESSION_STORAGE_KEY) || 'null'); }
                catch (e) { return null; }
            }

            function getSessionHeaders() {
                const session = getStoredSession();
                if (!session) return {};
                return { 'x-erp-session': JSON.stringify({ username: session.username, name: session.name, permissionName: session.permissionName }) };
            }

            var session = getStoredSession();
            if (!session || !session.username) {
                window.location.replace('/login');
            }

            var PIN = null;
            var urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('pin')) {
                PIN = urlParams.get('pin');
                history.replaceState(null, '', '/cambiar-contrasena');
            }

            function validatePassword(password) {
                var rules = [];
                rules.push({ key: 'Length', pass: password.length >= 10 });
                rules.push({ key: 'Upper', pass: /[A-Z]/.test(password) });
                rules.push({ key: 'Lower', pass: /[a-z]/.test(password) });
                rules.push({ key: 'Digit', pass: /[0-9]/.test(password) });
                rules.push({ key: 'Special', pass: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password) });
                return rules;
            }

            function updateRules(password) {
                var rules = validatePassword(password);
                var allValid = true;
                rules.forEach(function(r) {
                    var el = document.getElementById('rule' + r.key);
                    if (el) {
                        el.className = r.pass ? 'valid' : 'invalid';
                        var baseText = el.getAttribute('data-text');
                        if (!baseText) {
                            baseText = el.textContent.replace(/^[✓✗]\s*/, '').trim();
                            el.setAttribute('data-text', baseText);
                        }
                        el.textContent = (r.pass ? '\u2713 ' : '\u2717 ') + baseText;
                        if (!r.pass) allValid = false;
                    }
                });
                return allValid;
            }

            var newPasswordInput = document.getElementById('newPassword');
            var confirmPasswordInput = document.getElementById('confirmPassword');
            var submitBtn = document.getElementById('submitBtn');
            var statusMsg = document.getElementById('statusMessage');
            var form = document.getElementById('changePasswordForm');

            function checkForm() {
                var pwd = newPasswordInput.value;
                var rulesValid = updateRules(pwd);
                var match = pwd === confirmPasswordInput.value && pwd.length > 0;
                submitBtn.disabled = !(rulesValid && match);
            }

            newPasswordInput.addEventListener('input', checkForm);
            confirmPasswordInput.addEventListener('input', checkForm);

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                var newPassword = newPasswordInput.value;
                var confirmPassword = confirmPasswordInput.value;

                if (!newPassword || !confirmPassword) {
                    statusMsg.className = 'status-msg error';
                    statusMsg.textContent = 'Todos los campos son obligatorios.';
                    return;
                }

                if (newPassword !== confirmPassword) {
                    statusMsg.className = 'status-msg error';
                    statusMsg.textContent = 'Las contraseñas no coinciden.';
                    return;
                }

                if (updateRules(newPassword) === false) {
                    statusMsg.className = 'status-msg error';
                    statusMsg.textContent = 'La contraseña no cumple con los requisitos.';
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Cambiando...';
                statusMsg.className = 'status-msg';
                statusMsg.textContent = '';

try {
                        var body = { newPassword: newPassword };
                        if (PIN) body.pin = PIN;

                        var response = await fetch(CHANGE_PASSWORD_ENDPOINT, {
                            method: 'POST',
                            headers: Object.assign({ 'Content-Type': 'application/json' }, getSessionHeaders()),
                            body: JSON.stringify(body)
                        });
                        var data = await response.text();
                        try { data = JSON.parse(data); } catch(e) {}
                        if (!response.ok) {
                            throw new Error(data.error || 'No fue posible cambiar la contrase\u00f1a.');
                        }
                        // Actualizar sesión local para que mustChangePassword = false
                        var session = getStoredSession();
                        if (session) {
                            session.mustChangePassword = false;
                            var payload = JSON.stringify(session);
                            localStorage.setItem(SESSION_STORAGE_KEY, payload);
                            sessionStorage.setItem(SESSION_STORAGE_KEY, payload);
                        }
                        statusMsg.className = 'status-msg success';
                        statusMsg.textContent = 'Contrase\u00f1a actualizada. Redirigiendo...';
                        if (data.redirect) {
                            setTimeout(function() { window.location.href = data.redirect; }, 1200);
                        } else {
                            setTimeout(function() { window.location.href = '/dashboard'; }, 1200);
                        }
                    } catch (error) {
                    statusMsg.className = 'status-msg error';
                    statusMsg.textContent = error.message || 'No fue posible cambiar la contrase\u00f1a.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Cambiar Contrase\u00f1a';
                }
            });

            checkForm();
            newPasswordInput.focus();

            window.addEventListener('beforeunload', function(e) {
                e.preventDefault();
                e.returnValue = '';
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                }
            });
        })();
    </script>
</body>
</html>
