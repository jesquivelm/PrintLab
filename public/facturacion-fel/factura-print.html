<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura — Impresión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1b2430;
            --navy: #1f314b;
            --gold: #b59055;
            --line: #d7e2ea;
            --muted: #647384;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            color: var(--ink);
            background: #e8edf2;
        }

        /* ── Toolbar (screen only) ─────────────────── */
        #fToolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 24px;
            background: var(--navy);
            color: #fff;
        }
        #fToolbar h1 { font-size: 15px; font-weight: 600; flex: 1; }
        #fToolbar button {
            height: 34px;
            padding: 0 18px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,.25);
            background: rgba(255,255,255,.15);
            color: #fff;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }
        #fToolbar button:hover { background: rgba(255,255,255,.28); }
        #fToolbar button.primary { background: #1a8fc8; border-color: transparent; }
        #fToolbar button.primary:hover { background: #1580b5; }

        /* ── Page wrapper (screen) ─────────────────── */
        #fPageWrap {
            padding: 24px 24px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .f-page {
            width: 215.9mm;
            min-height: 279.4mm;
            background: #fff;
            box-shadow: 0 8px 32px rgba(0,0,0,.18);
            display: flex;
            flex-direction: column;
        }

        /* ── Header ────────────────────────────────── */
        .f-header {
            padding: 16px 26px 14px;
            background: var(--navy);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .f-brand { display: flex; align-items: center; gap: 14px; flex: 1; }
        .f-logo { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .f-logo img { object-fit: contain; display: block; max-width: 130px; max-height: 60px; }
        .f-brand-copy { display: flex; flex-direction: column; gap: 3px; }
        .f-company-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            letter-spacing: .04em;
            line-height: 1.15;
        }
        .f-company-meta { font-size: 10.5px; opacity: .82; line-height: 1.5; }
        .f-doc-title { text-align: right; flex-shrink: 0; }
        .f-doc-title h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 30px;
            font-style: italic;
            font-weight: 400;
            line-height: 1;
        }
        .f-doc-title .f-doc-numero {
            font-size: 16px;
            font-weight: 700;
            margin-top: 4px;
            letter-spacing: 0.02em;
        }
        .f-doc-title .f-doc-fecha { font-size: 11.5px; opacity: .85; margin-top: 3px; }

        /* ── Estado / certificación banner ───────────── */
        .f-cert-banner {
            padding: 8px 26px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .f-cert-banner.pendiente { background: #fbf1de; color: #8a6416; }
        .f-cert-banner.certificada { background: #eaf7ee; color: #1f7a3d; }

        /* ── Body ───────────────────────────────────── */
        .f-body { padding: 16px 26px 14px; display: flex; flex-direction: column; gap: 12px; flex: 1; }

        .f-meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .f-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fcfeff; }
        .f-card h3 {
            font-size: 10px; color: var(--gold); letter-spacing: .04em; margin-bottom: 5px; text-transform: uppercase;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }
        .f-card-name { display: block; font-size: 14px; font-weight: 700; color: var(--navy); }
        .f-card-item { display: block; font-size: 11.5px; color: #4d5a68; line-height: 1.6; }
        .f-card-item strong { font-weight: 600; color: var(--navy); }

        /* Products table */
        .f-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
        .f-table thead { background: var(--navy); color: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .f-table th { padding: 8px 10px; font-size: 10px; font-weight: 500; text-align: left; white-space: nowrap; }
        .f-table th:not(:first-child), .f-table td:not(:first-child) { text-align: right; }
        .f-table td { padding: 8px 10px; border-bottom: 1px solid #e3ebf0; color: #4a5967; vertical-align: top; }
        .f-table tr:nth-child(even) td { background: #fbfdff; }
        .f-product-name { font-weight: 600; color: var(--navy); }

        /* Totals */
        .f-totals { margin-left: auto; width: 300px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .f-totals table { width: 100%; border-collapse: collapse; }
        .f-totals td { padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: #485766; }
        .f-totals tr:last-child td {
            border-bottom: none; background: var(--navy); color: #fff; font-weight: 700; font-size: 13.5px;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }
        .f-totals td:last-child { text-align: right; }

        .f-notas { border-left: 3px solid var(--gold); background: #fbf7f0; padding: 10px 14px; border-radius: 0 10px 10px 0; font-size: 12px; color: #2f3c46; line-height: 1.5; }
        .f-notas h3 { font-size: 10px; color: var(--gold); letter-spacing: .04em; margin-bottom: 4px; text-transform: uppercase; }

        /* ── Footer: FEL data + QR + frases ──────────── */
        .f-doc-footer { margin-top: auto; padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
        .f-fel-row { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
        .f-fel-data { display: flex; flex-direction: column; gap: 3px; }
        .f-fel-data span { font-size: 10.5px; color: var(--muted); }
        .f-fel-data span strong { color: var(--navy); font-weight: 600; }
        .f-qr-box {
            width: 84px; height: 84px; border: 1px dashed var(--line); border-radius: 8px;
            display: flex; align-items: center; justify-content: center; text-align: center;
            font-size: 9px; color: var(--muted); padding: 6px; flex-shrink: 0;
        }
        .f-frases { font-size: 9.5px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 8px; }

        /* Loading / error */
        #fLoading {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: #e8edf2; font-family: 'Outfit', sans-serif; font-size: 15px; color: #647384;
            flex-direction: column; gap: 12px;
        }
        #fLoading .spinner {
            width: 36px; height: 36px; border: 3px solid #d7e2ea; border-top-color: #1f314b;
            border-radius: 50%; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── PRINT ──────────────────────────────────── */
        @page { size: Letter portrait; margin: 0; }
        @media print {
            html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            #fToolbar { display: none !important; }
            #fPageWrap { padding: 0 !important; background: #fff !important; display: block !important; }
            .f-page { width: 100% !important; min-height: 279.4mm !important; box-shadow: none !important; }
        }
    </style>
</head>
<body>
    <div id="fLoading">
        <div class="spinner"></div>
        <span>Cargando factura…</span>
    </div>

    <div id="fToolbar" hidden>
        <h1 id="fToolbarTitle">Factura</h1>
        <button onclick="window.close()">&#x2715; Cerrar</button>
        <button class="primary" onclick="window.print()">&#x1F5A8; Imprimir / Guardar PDF</button>
    </div>

    <div id="fPageWrap"></div>

    <script>
    (function () {
        'use strict';

        function escHtml(v) {
            const d = document.createElement('div');
            d.textContent = v == null ? '' : String(v);
            return d.innerHTML;
        }
        function fmtDate(v) {
            if (!v) return '';
            const d = new Date(v);
            if (isNaN(d)) return '';
            return d.toLocaleDateString('es-GT', { year: 'numeric', month: '2-digit', day: '2-digit' }) +
                ' ' + d.toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit' });
        }
        function fmtCur(amount, moneda) {
            const code = moneda || 'GTQ';
            try {
                return new Intl.NumberFormat('es-GT', { style: 'currency', currency: code, maximumFractionDigits: 2 }).format(Number(amount || 0));
            } catch (e) {
                return `${code} ${Number(amount || 0).toFixed(2)}`;
            }
        }

        function buildPage({ factura, emisor, branding }) {
            const detalle = factura.detalle || [];
            const hayDescuento = detalle.some(l => Number(l.monto_descuento || 0) > 0.004);
            const totalDescuento = detalle.reduce((acc, l) => acc + Number(l.monto_descuento || 0), 0);
            const certificada = factura.estado === 'CERTIFICADA' && factura.uuid_autorizacion;

            const rows = detalle.map(l => `
                <tr>
                    <td><span class="f-product-name">${escHtml(l.descripcion)}</span></td>
                    <td>${Number(l.cantidad).toLocaleString('es-GT', { maximumFractionDigits: 2 })}</td>
                    <td>${escHtml(fmtCur(l.precio_unitario, factura.moneda))}</td>
                    ${hayDescuento ? `<td>${escHtml(fmtCur(l.monto_descuento, factura.moneda))}</td>` : ''}
                    <td>${escHtml(fmtCur(l.monto_linea, factura.moneda))}</td>
                </tr>`).join('');

            const emisorNombre = emisor.nombre_comercial || emisor.nombre_emisor || branding.companyName || 'Empresa';
            const emisorDireccion = [emisor.direccion, emisor.municipio, emisor.departamento].filter(Boolean).join(', ');

            return `
<div class="f-page">
    <header class="f-header">
        <div class="f-brand">
            <div class="f-logo">
                ${branding.logoUrl ? `<img src="${escHtml(branding.logoUrl)}" alt="${escHtml(emisorNombre)}">` : ''}
            </div>
            <div class="f-brand-copy">
                <span class="f-company-name">${escHtml(emisorNombre)}</span>
                <span class="f-company-meta">
                    ${emisor.nit_emisor ? `NIT: ${escHtml(emisor.nit_emisor)}<br>` : ''}
                    ${emisorDireccion ? escHtml(emisorDireccion) : ''}
                </span>
            </div>
        </div>
        <div class="f-doc-title">
            <h2>Factura</h2>
            <div class="f-doc-numero">${escHtml(factura.numero_interno)}</div>
            <div class="f-doc-fecha">${escHtml(fmtDate(factura.fecha_emision))}</div>
        </div>
    </header>

    <div class="f-cert-banner ${certificada ? 'certificada' : 'pendiente'}">
        <span>${certificada ? 'Documento Tributario Electrónico certificado por la SAT' : 'Pendiente de certificación ante la SAT — documento no válido fiscalmente todavía'}</span>
        <span>${escHtml(factura.moneda)}</span>
    </div>

    <div class="f-body">
        <div class="f-meta-row">
            <div class="f-card">
                <h3>Cliente</h3>
                <span class="f-card-name">${escHtml(factura.cliente_nombre || '')}</span>
                ${factura.contacto_nombre ? `<span class="f-card-item">Atención: ${escHtml(factura.contacto_nombre)}</span>` : ''}
            </div>
            <div class="f-card">
                <h3>Datos del Documento</h3>
                <span class="f-card-item"><strong>Despacho:</strong> ${escHtml(factura.numero_despacho || '')}</span>
                <span class="f-card-item"><strong>Estado:</strong> ${escHtml(factura.estado)}</span>
            </div>
        </div>

        <table class="f-table">
            <thead>
                <tr>
                    <th>Descripción</th>
                    <th style="width:70px">Cantidad</th>
                    <th style="width:90px">Precio Unitario</th>
                    ${hayDescuento ? '<th style="width:90px">Descuento</th>' : ''}
                    <th style="width:90px">Total</th>
                </tr>
            </thead>
            <tbody>${rows || `<tr><td colspan="${hayDescuento ? 5 : 4}" style="text-align:center;color:#999;padding:16px">Sin líneas</td></tr>`}</tbody>
        </table>

        <div class="f-totals">
            <table>
                ${hayDescuento ? `<tr><td>Descuento</td><td>${escHtml(fmtCur(totalDescuento, factura.moneda))}</td></tr>` : ''}
                <tr><td>Subtotal Gravable</td><td>${escHtml(fmtCur(factura.subtotal_gravable, factura.moneda))}</td></tr>
                <tr><td>IVA</td><td>${escHtml(fmtCur(factura.total_iva, factura.moneda))}</td></tr>
                <tr><td>Total General</td><td>${escHtml(fmtCur(factura.gran_total, factura.moneda))}</td></tr>
            </table>
        </div>

        ${factura.notas ? `<div class="f-notas"><h3>Notas</h3>${escHtml(factura.notas)}</div>` : ''}

        <div class="f-doc-footer">
            <div class="f-fel-row">
                <div class="f-fel-data">
                    <span><strong>UUID de Autorización:</strong> ${escHtml(factura.uuid_autorizacion || 'Pendiente de certificar')}</span>
                    <span><strong>Serie:</strong> ${escHtml(factura.serie_dte || '—')} &nbsp; <strong>Número:</strong> ${escHtml(factura.numero_dte || '—')}</span>
                    <span><strong>Fecha de Certificación:</strong> ${factura.fecha_certificacion ? escHtml(fmtDate(factura.fecha_certificacion)) : 'Pendiente'}</span>
                </div>
                <div class="f-qr-box">${certificada ? 'Código QR' : 'QR disponible tras certificación'}</div>
            </div>
            <div class="f-frases">Certificado tributario electrónico sujeto a validación en el portal de la SAT (fel.sat.gob.gt) mediante el UUID de autorización.</div>
        </div>
    </div>
</div>`;
        }

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) {
                document.getElementById('fLoading').innerHTML = '<p style="color:#c0392b">No se indicó ninguna factura.</p>';
                return;
            }
            try {
                const [facturaRes, emisorRes, configRes] = await Promise.all([
                    fetch(`/api/facturacion-fel/${encodeURIComponent(id)}`),
                    fetch('/api/facturacion-fel/emisor'),
                    fetch('/api/config/shell')
                ]);
                const factura = await facturaRes.json();
                if (!facturaRes.ok) throw new Error(factura?.error || 'Error al cargar la factura.');
                const emisor = await emisorRes.json().catch(() => ({}));
                const config = await configRes.json().catch(() => ({}));
                const branding = { logoUrl: config?.branding?.logoUrl || '', companyName: config?.branding?.companyName || '' };

                document.getElementById('fPageWrap').innerHTML = buildPage({ factura, emisor, branding });
                document.title = `Factura ${factura.numero_interno || ''}`;
                document.getElementById('fToolbarTitle').textContent = `Factura ${factura.numero_interno || ''}`;
                document.getElementById('fToolbar').hidden = false;
                document.getElementById('fLoading').style.display = 'none';

                if (params.get('print') === '1') {
                    setTimeout(() => window.print(), 600);
                }
            } catch (err) {
                document.getElementById('fLoading').innerHTML = `<p style="color:#c0392b;font-family:sans-serif;padding:24px">Error: ${escHtml(err.message)}</p>`;
            }
        }

        init();
    })();
    </script>
</body>
</html>
